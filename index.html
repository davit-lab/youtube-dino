  ctx.restore();
}

function drawSteamVent(sv){
  const sx = sv.x - camX;
  if(sx + (sv.w||40) < -50 || sx > W + 50) return;
  const cycle = (state.time + (sv.offset || 0)) % (sv.period || 2200);
  const isActive = cycle < 1100;

  ctx.save();
  ctx.fillStyle = '#475569';
  ctx.fillRect(sx, sv.y - 12, sv.w || 40, 12);
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(sx + 4, sv.y - 10, (sv.w || 40) - 8, 3);

  if(isActive){
    const steamH = sv.h || 120;
    const g = ctx.createLinearGradient(0, sv.y - steamH, 0, sv.y);
    g.addColorStop(0, 'rgba(255, 255, 255, 0)');
    g.addColorStop(0.4, 'rgba(226, 232, 240, 0.75)');
    g.addColorStop(1, 'rgba(203, 213, 225, 0.9)');
    ctx.fillStyle = g;
    ctx.fillRect(sx - 8, sv.y - steamH, (sv.w || 40) + 16, steamH);

    for(let i = 0; i < 3; i++){
      const bx = sx + (sv.w || 40) / 2 + (Math.random() - 0.5) * 16;
      const by = sv.y - Math.random() * steamH;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.beginPath();
      ctx.arc(bx, by, 6 + Math.random() * 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawSwingPoint(sp){
  const sx = sp.x - camX;
  if(sx < -200 || sx > W + 200) return;

  ctx.save();
  ctx.fillStyle = '#64748b';
  ctx.fillRect(sx - 24, sp.y - 16, 48, 16);
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(sx - 20, sp.y - 12, 40, 4);

  const playerInSwing = player.isSwinging === sp;
  const targetX = playerInSwing ? (player.x + player.w/2 - camX) : sx + Math.sin(state.time * 0.002) * 20;
  const targetY = playerInSwing ? (player.y + player.h/2) : sp.y + (sp.len || 150);

  ctx.strokeStyle = playerInSwing ? '#00f0ff' : '#ffd23f';
  ctx.lineWidth = playerInSwing ? 3.5 : 2.5;
  ctx.beginPath();
  ctx.moveTo(sx, sp.y);
  ctx.lineTo(targetX, targetY);
  ctx.stroke();

  ctx.fillStyle = playerInSwing ? '#00f0ff' : '#ffd23f';
  ctx.beginPath(); ctx.arc(sx, sp.y, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(sx, sp.y, 4, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = '#38c6ff';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(targetX, targetY, 10, 0, Math.PI*2); ctx.stroke();

  if(!playerInSwing && Math.hypot((player.x + player.w/2 - camX) - sx, player.y + player.h/2 - sp.y) < (sp.radius || 200)){
    ctx.fillStyle = '#38c6ff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText("🎯 CATCH & SWING (SPACE)", sx, sp.y - 24);
  }
  ctx.restore();
}

function drawRisingHorde(){
  if(!level || level.risingHordeY === undefined) return;

  const ry = level.risingHordeY;
  const screenY = ry - camY;
  if(screenY > H + 200) return;

  ctx.save();
  const g = ctx.createLinearGradient(0, ry, 0, ry + 400);
  g.addColorStop(0, 'rgba(239, 68, 68, 0.85)');
  g.addColorStop(0.15, 'rgba(185, 28, 28, 0.9)');
  g.addColorStop(0.4, 'rgba(120, 11, 11, 0.95)');
  g.addColorStop(1, '#110202');
  ctx.fillStyle = g;
  ctx.fillRect(0, ry, W, 800);

  ctx.fillStyle = '#fca5a5';
  for(let x = 0; x < W; x += 40){
    const waveY = ry + Math.sin(state.time * 0.005 + x * 0.02) * 8;
    ctx.beginPath();
    ctx.arc(x + 20, waveY, 12, 0, Math.PI, true);
    ctx.fill();
  }

  ctx.fillStyle = '#450a0a';
  for(let x = 30; x < W; x += 65){
    const armH = 35 + Math.sin(state.time * 0.007 + x) * 15;
    ctx.fillRect(x, ry - armH, 8, armH);
    ctx.beginPath();
    ctx.arc(x + 4, ry - armH, 7, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, ry);
  ctx.lineTo(W, ry);
  ctx.stroke();

  ctx.restore();
}

function drawHeliPad(hp){
  if(!hp) return;
  const sx = hp.x - camX;
  if(sx + hp.w < -100 || sx > W + 100) return;

  ctx.save();
  const g = ctx.createLinearGradient(0, hp.y, 0, hp.y + hp.h);
  g.addColorStop(0, '#475569');
  g.addColorStop(0.4, '#334155');
  g.addColorStop(1, '#1e293b');
  ctx.fillStyle = g;
  ctx.fillRect(sx, hp.y, hp.w, hp.h);

  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 4;
  ctx.strokeRect(sx + 4, hp.y + 4, hp.w - 8, hp.h - 8);

  const cx = sx + hp.w / 2;
  const cy = hp.y + 20;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText("H", cx, cy);

  const heliX = cx + 40;
  const heliY = hp.y - 55;

  ctx.fillStyle = '#1e293b';
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(heliX - 60, heliY - 20, 120, 40, 16); else ctx.fillRect(heliX - 60, heliY - 20, 120, 40); ctx.fill();
  ctx.strokeStyle = '#38c6ff'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = 'rgba(56, 198, 255, 0.6)';
  ctx.beginPath(); ctx.arc(heliX + 35, heliY - 2, 16, -Math.PI*0.5, Math.PI*0.5); ctx.fill();

  ctx.fillStyle = '#334155';
  ctx.fillRect(heliX - 110, heliY - 6, 60, 12);

  const tailAngle = state.time * 0.03;
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(heliX - 110, heliY - Math.sin(tailAngle)*18);
  ctx.lineTo(heliX - 110, heliY + Math.sin(tailAngle)*18);
  ctx.stroke();

  const mainRotorWidth = 180;
  const bladeFlicker = Math.sin(state.time * 0.05) * mainRotorWidth;
  ctx.strokeStyle = 'rgba(203, 213, 225, 0.85)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(heliX - bladeFlicker/2, heliY - 32);
  ctx.lineTo(heliX + bladeFlicker/2, heliY - 32);
  ctx.stroke();

  ctx.fillStyle = '#94a3b8';
  ctx.fillRect(heliX - 4, heliY - 32, 8, 12);

  const searchAngle = Math.sin(state.time * 0.002) * 0.4;
  const beamGrad = ctx.createRadialGradient(heliX + 30, heliY + 10, 10, heliX + Math.sin(searchAngle)*120, heliY + 180, 120);
  beamGrad.addColorStop(0, 'rgba(56, 198, 255, 0.4)');
  beamGrad.addColorStop(1, 'rgba(56, 198, 255, 0)');
  ctx.fillStyle = beamGrad;
  ctx.beginPath();
  ctx.moveTo(heliX + 30, heliY + 10);
  ctx.lineTo(heliX + Math.sin(searchAngle)*120 - 60, heliY + 180);
  ctx.lineTo(heliX + Math.sin(searchAngle)*120 + 60, heliY + 180);
  ctx.fill();

  if(Math.floor(state.time / 200) % 2 === 0){
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(heliX - 55, heliY - 22, 6, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

function drawZombie(z){
  const sx = z.x - camX;
  if(sx+z.w < -60 || sx > W + 60) return;
  
  ctx.save();
  ctx.translate(sx + z.w/2, z.y + z.h/2);
  ctx.scale(z.facing * z.size, z.size);
  
  const anim = (z.animT || 0) * 0.05;
  const wobble = Math.sin(anim) * 3;
  const legCycle = Math.sin(anim * 1.5) * 8;
  const isBoss = z.isBoss;
  const isMutant = z.isMutant;
  const isRunner = z.speed > 2.0;

  // 1. Aura & Motion Trail for Special Zombies
  if(isMutant) {
    ctx.save();
    ctx.shadowColor = '#dc2626';
    ctx.shadowBlur = 22;
    ctx.fillStyle = 'rgba(220, 38, 38, 0.28)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 34, 44, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  } else if(isBoss) {
    ctx.save();
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 18;
    ctx.fillStyle = 'rgba(255, 0, 85, 0.2)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 28, 36, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  } else if(z.isElite) {
    ctx.save();
    ctx.shadowColor = '#ff9f1c';
    ctx.shadowBlur = 14;
    ctx.fillStyle = 'rgba(255, 159, 28, 0.25)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 20, 28, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  } else if(isRunner) {
    ctx.fillStyle = 'rgba(0, 240, 255, 0.35)';
    ctx.beginPath();
    ctx.ellipse(-z.facing * 12, wobble, 16, 22, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // Zombie Skin & Rags Colors
  const fleshColor = isMutant ? '#991b1b' : (isBoss ? '#1e4d2b' : (isRunner ? '#2f7a43' : '#326b38'));
  const ragColor   = isMutant ? '#450a0a' : (isBoss ? '#3b1c1c' : (isRunner ? '#1e293b' : '#292524'));
  const pantColor  = isMutant ? '#18181b' : (isBoss ? '#18181b' : (isRunner ? '#0f172a' : '#1c1917'));

  // 2. Tattered Legs (with walking swing & exposed bone/knee patch)
  ctx.fillStyle = pantColor;
  // Left Leg
  ctx.save();
  ctx.translate(-8, 12 + wobble);
  ctx.rotate(legCycle * 0.04);
  ctx.fillRect(-5, 0, 10, 22);
  // Torn knee hole showing rotten flesh/bone
  ctx.fillStyle = fleshColor;
  ctx.fillRect(-3, 10, 6, 4);
  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(-1, 11, 2, 2);
  ctx.restore();

  // Right Leg
  ctx.save();
  ctx.translate(6, 12 + wobble);
  ctx.rotate(-legCycle * 0.04);
  ctx.fillStyle = pantColor;
  ctx.fillRect(-5, 0, 10, 22);
  ctx.restore();

  // 3. Torso / Tattered Ripped Clothes
  ctx.fillStyle = ragColor;
  ctx.beginPath();
  ctx.moveTo(-16, -14 + wobble);
  ctx.lineTo(16, -14 + wobble);
  ctx.lineTo(14, 14 + wobble);
  // Ripped torn hem bottom
  ctx.lineTo(8, 18 + wobble);
  ctx.lineTo(2, 12 + wobble);
  ctx.lineTo(-4, 17 + wobble);
  ctx.lineTo(-10, 13 + wobble);
  ctx.lineTo(-14, 14 + wobble);
  ctx.closePath();
  ctx.fill();

  // Exposed Ribcage / Blood stain on chest
  ctx.fillStyle = '#ff0033';
  ctx.beginPath(); ctx.ellipse(2, -2 + wobble, 5, 7, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#cbd5e1';
  ctx.fillRect(-1, -6 + wobble, 5, 2);
  ctx.fillRect(0, -3 + wobble, 4, 2);

  // Toxic Mutated Veins for Titan
  if(isMutant){
    ctx.strokeStyle = '#a855f7';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-8, -10 + wobble); ctx.lineTo(-2, 0 + wobble); ctx.lineTo(-10, 8 + wobble);
    ctx.moveTo(8, -10 + wobble); ctx.lineTo(2, 2 + wobble); ctx.lineTo(8, 10 + wobble);
    ctx.stroke();
  }

  // 4. Boss Armor Accessories (Spiked Metal Shoulder Pads)
  if(isBoss || isMutant) {
    ctx.fillStyle = '#334155';
    ctx.beginPath();
    ctx.moveTo(-18, -14 + wobble);
    ctx.lineTo(-26, -24 + wobble);
    ctx.lineTo(-12, -18 + wobble);
    ctx.fill();
    ctx.strokeStyle = isMutant ? '#dc2626' : '#ff0055';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(18, -14 + wobble);
    ctx.lineTo(26, -24 + wobble);
    ctx.lineTo(12, -18 + wobble);
    ctx.fill();
    ctx.stroke();
  }

  // 5. Outstretched Clawing Arms with Sharp Claws
  ctx.fillStyle = fleshColor;
  // Back Arm
  ctx.save();
  ctx.translate(-14, -8 + wobble);
  ctx.rotate(-0.4 + Math.sin(anim)*0.2);
  ctx.fillRect(0, -4, 18, 7);
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(18, -4, 4, 2);
  ctx.fillRect(18, -1, 4, 2);
  ctx.restore();

  // Front Arm (Reaching forward menacingly)
  ctx.save();
  ctx.translate(8, -8 + wobble);
  ctx.rotate(-0.2 + Math.cos(anim)*0.3);
  ctx.fillStyle = fleshColor;
  ctx.fillRect(0, -4, 22, 8);
  ctx.fillStyle = '#111827';
  ctx.beginPath();
  ctx.moveTo(22, -4); ctx.lineTo(27, -6); ctx.lineTo(22, -2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(22, -1); ctx.lineTo(28, -1); ctx.lineTo(22, 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(22, 2); ctx.lineTo(26, 4); ctx.lineTo(22, 4); ctx.fill();
  ctx.restore();

  // 6. Detailed Head & Skull
  ctx.fillStyle = fleshColor;
  ctx.beginPath();
  ctx.ellipse(0, -22 + wobble, 16, 17, 0, 0, Math.PI*2);
  ctx.fill();

  // Rotten Brain / Skull Patch on top right
  ctx.fillStyle = '#dc2626';
  ctx.beginPath();
  ctx.arc(6, -30 + wobble, 6, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#f87171';
  ctx.beginPath(); ctx.arc(5, -31 + wobble, 3, 0, Math.PI*2); ctx.fill();

  // Boss Spiked Horns
  if(isBoss || isMutant) {
    ctx.fillStyle = isMutant ? '#ef4444' : '#f59e0b';
    ctx.beginPath();
    ctx.moveTo(-8, -34 + wobble); ctx.lineTo(-14, -48 + wobble); ctx.lineTo(-2, -36 + wobble);
    ctx.moveTo(2, -34 + wobble); ctx.lineTo(8, -48 + wobble); ctx.lineTo(12, -34 + wobble);
    ctx.fill();
  }

  // 7. Glowing Evil Eyes with Laser Beam Flare
  ctx.save();
  ctx.shadowColor = isMutant ? '#dc2626' : (isBoss ? '#ff0000' : (isRunner ? '#00ffcc' : '#ff0033'));
  ctx.shadowBlur = 14;
  ctx.fillStyle = isMutant ? '#ff0033' : (isBoss ? '#ff0000' : (isRunner ? '#00ffcc' : '#ff1100'));
  
  ctx.beginPath(); ctx.arc(-6, -24 + wobble, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -24 + wobble, 4.5, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#ffff00';
  ctx.beginPath(); ctx.arc(-5, -24 + wobble, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, -24 + wobble, 2, 0, Math.PI*2); ctx.fill();

  // Laser Eye Beam Cone
  ctx.fillStyle = isRunner ? 'rgba(0, 255, 204, 0.15)' : 'rgba(255, 0, 60, 0.18)';
  ctx.beginPath();
  ctx.moveTo(6, -24 + wobble);
  ctx.lineTo(28, -28 + wobble);
  ctx.lineTo(28, -20 + wobble);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 8. Open Mouth with Jagged Fangs & Dripping Slime
  ctx.fillStyle = '#09090b';
  ctx.beginPath();
  ctx.ellipse(2, -12 + wobble, 8, 6, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#fef08a';
  ctx.beginPath(); ctx.moveTo(-3, -17 + wobble); ctx.lineTo(-1, -12 + wobble); ctx.lineTo(1, -17 + wobble); ctx.fill();
  ctx.beginPath(); ctx.moveTo(3, -17 + wobble); ctx.lineTo(5, -12 + wobble); ctx.lineTo(7, -17 + wobble); ctx.fill();

  ctx.fillStyle = isBoss ? '#ff0033' : '#22c55e';
  ctx.beginPath();
  ctx.arc(3, -6 + wobble + Math.sin(anim*3)*2, 2, 0, Math.PI*2);
  ctx.fill();

  // 9. Sleek Glass Health Bar Above Head
  const hpRatio = Math.max(0, Math.min(1, z.health / (z.maxHealth || z.health)));
  const barW = isMutant ? 60 : (isBoss ? 52 : 36);
  const barH = isBoss ? 8 : 6;
  const barX = -barW / 2;
  const barY = -48 + wobble;

  ctx.fillStyle = 'rgba(10, 15, 26, 0.82)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(barX, barY, barW, barH, 3);
  else ctx.fillRect(barX, barY, barW, barH);
  ctx.fill();

  const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
  grad.addColorStop(0, '#ef4444');
  grad.addColorStop(1, isMutant ? '#dc2626' : (isBoss ? '#a855f7' : '#f59e0b'));

  ctx.fillStyle = grad;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(barX, barY, barW * hpRatio, barH, 3);
  else ctx.fillRect(barX, barY, barW * hpRatio, barH);
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barW, barH);

  if(isBoss) {
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff3d6e';
    ctx.fillText('👑 BOSS', 0, barY - 4);
  }

  ctx.restore();
}

function drawBullet(b){
  const sx = b.x - camX;
  if(sx < -20 || sx > W + 20) return;
  if(b.isGuitarLaser){
    ctx.save();
    ctx.shadowColor = b.color || '#ef4444';
    ctx.shadowBlur = 14;
    ctx.fillStyle = b.color || '#ef4444';
    ctx.beginPath();
    ctx.ellipse(sx, b.y, (b.size || 8) * 1.8, (b.size || 8) * 0.65, 0, 0, 2*Math.PI);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(sx, b.y, (b.size || 8) * 0.9, (b.size || 8) * 0.35, 0, 0, 2*Math.PI);
    ctx.fill();
    ctx.restore();
    return;
  }
  ctx.fillStyle = b.color || '#ffd23f';
  ctx.beginPath();
  ctx.arc(sx, b.y, b.size || 6, 0, 2*Math.PI);
  ctx.fill();
}

function drawParticles(){
  for(const p of particles){
    const sx = p.x - camX;
    if(sx < -50 || sx > W + 50) continue;
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(sx, p.y, Math.max(0, p.size || 0), 0, 2*Math.PI);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for(const sc of shellCasings){
    const sx = sc.x - camX;
    ctx.save();
    ctx.translate(sx, sc.y);
    ctx.rotate(sc.rot);
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(-2, -1, 5, 2);
    ctx.restore();
  }

  for(const ft of floatingTexts){
    const sx = ft.x - camX;
    ctx.save();
    ctx.font = 'bold 18px sans-serif';
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = ft.life / 60;
    ctx.fillText(ft.text, sx, ft.y);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ---------- Detailed Gun Renderer ----------
function drawDetailedGun(ctx, mode = 'pistol', opts = {}) {
  const scale = opts.scale || 1;
  const recoil = opts.recoil || 0;
  const time = opts.time || (state ? state.time : 0);
  const showLaser = opts.showLaser !== false;
  const isFiring = opts.isFiring || false;

  ctx.save();
  ctx.scale(scale, scale);
  ctx.translate(-recoil, 0);

  if (mode === 'pistol') {
    // 🔫 Plasma Pistol (Ultra-Detailed Tactical Pistol)
    // Textured Carbon Fiber Pistol Grip
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.moveTo(-4, 2); ctx.lineTo(-12, 18); ctx.lineTo(-3, 20); ctx.lineTo(5, 5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#38c6ff'; ctx.lineWidth = 1; ctx.stroke();
    // Grip Ribs
    ctx.fillStyle = '#334155';
    for(let gy = 6; gy <= 16; gy += 4) {
      ctx.fillRect(-9 + gy*0.2, gy, 6, 2);
    }

    // Lower Frame & Trigger Guard
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(-6, -2, 28, 8);
    ctx.strokeStyle = '#475569'; ctx.lineWidth = 1; ctx.strokeRect(-6, -2, 28, 8);
    // Trigger
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(2, 6, 4, 0, Math.PI); ctx.stroke();

    // Upper Slide (Dual-Tone Metallic)
    const slideGrad = ctx.createLinearGradient(0, -8, 0, 0);
    slideGrad.addColorStop(0, '#64748b'); slideGrad.addColorStop(0.4, '#334155'); slideGrad.addColorStop(1, '#0f172a');
    ctx.fillStyle = slideGrad;
    ctx.fillRect(-8, -8, 34, 8);
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.strokeRect(-8, -8, 34, 8);

    // Serrations on back slide
    ctx.fillStyle = '#0f172a';
    for(let sx = -6; sx <= 0; sx += 2) { ctx.fillRect(sx, -7, 1, 6); }

    // Ejection Port with Brass Cartridge detail
    ctx.fillStyle = '#1e293b'; ctx.fillRect(6, -7, 8, 4);
    ctx.fillStyle = '#eab308'; ctx.fillRect(8, -6, 4, 2);

    // Plasma Core Conduit Tube
    ctx.fillStyle = '#0284c7'; ctx.fillRect(14, -5, 12, 3);
    ctx.fillStyle = '#38c6ff'; ctx.fillRect(16, -4, 8, 1);

    // Tactical Under-Barrel Laser Module
    ctx.fillStyle = '#090d16'; ctx.fillRect(10, 0, 12, 5);
    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(22, 2.5, 1.5, 0, Math.PI*2); ctx.fill();

    // Holo-Sight Optic on Top Rail

// ---------- Dino Character Drawing ----------
function drawPlayer(){
  const sx = player.x - camX;
  const sy = player.y;

  // Render War Tank if in tank mode
  if(player.weaponMode === 'tank'){
    ctx.save();
    ctx.translate(sx + player.w/2, sy + player.h/2 + 4);
    ctx.scale(player.facing, 1);

    if(player.invuln>0 && Math.floor(player.invuln/4)%2===0){
      ctx.globalAlpha = 0.5;
    }

    const runCycle = Math.abs(player.vx) > 0.5 ? Math.sin(player.animT * 0.08) * 3 : 0;

    // Dark Tread Wheels & Caterpillar Tracks
    ctx.fillStyle = '#1c2421';
    ctx.fillRect(-42, 10, 84, 20);

    // Moving Wheels inside track
    ctx.fillStyle = '#3a4742';
    for(let wx = -32; wx <= 32; wx += 16){
      ctx.beginPath();
      ctx.arc(wx + runCycle, 20, 7, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#111';
      ctx.stroke();
    }

    // Steel Armored Body (Camo Green)
    ctx.fillStyle = '#2d4536';
    ctx.fillRect(-38, -10, 76, 22);

      // Scan line across visor
      const scanY = -28 + ((state.time * 0.04) % 12);
      ctx.fillStyle = 'rgba(0,255,136,0.4)'; ctx.fillRect(-14, scanY, 28, 2);
      ctx.restore();
    }

    // Ghost: no eyes, just hollow dark sockets
    if(skin === 'ghost'){
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = '#000000';
      ctx.beginPath(); ctx.ellipse(-5,-22,5,4,0,0,2*Math.PI); ctx.fill();
      ctx.beginPath(); ctx.ellipse(5,-22,5,4,0,0,2*Math.PI); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // Viking: horned helmet
    if(skin === 'viking'){
      ctx.save();
      ctx.fillStyle = '#78350f';
      // Helmet cap
      ctx.fillRect(-14, -34, 28, 7);
      // Left horn
      ctx.fillStyle = '#d97706';
      ctx.beginPath(); ctx.moveTo(-12,-34); ctx.lineTo(-22,-50); ctx.lineTo(-6,-34); ctx.closePath(); ctx.fill();
      // Right horn
      ctx.beginPath(); ctx.moveTo(12,-34); ctx.lineTo(22,-50); ctx.lineTo(6,-34); ctx.closePath(); ctx.fill();
      // Nose guard
      ctx.fillStyle = '#92400e'; ctx.fillRect(-2,-25,4,8);
      // Battle scars
      ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-8,-20); ctx.lineTo(-3,-14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8,-22); ctx.lineTo(5,-16); ctx.stroke();
      ctx.restore();
    }

    // Eyes
    ctx.fillStyle = eyeColor;
    ctx.beginPath(); ctx.ellipse(-5,-22,3.8,3,0,0,2*Math.PI); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5,-22,3.8,3,0,0,2*Math.PI); ctx.fill();
    ctx.fillStyle='#0b0e14';
    ctx.beginPath(); ctx.arc(-4,-22,1.8,0,2*Math.PI); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-22,1.8,0,2*Math.PI); ctx.fill();

    // Mouth
    ctx.fillStyle='#0b0e14';
    ctx.beginPath(); ctx.ellipse(0,-14,5,4,0,0,2*Math.PI); ctx.fill();
  }

  ctx.restore();

  // Floating Speech Bubble for "ადიოს მუჩაჩოოსსსს"
  if(player.isFalling){
    ctx.save();
    const bw = 200, bh = 42;
    const bx = sx + player.w/2 - bw/2;
    const by = sy - 65;

    ctx.shadowColor = '#ff3d6e';
    ctx.shadowBlur = 12;

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 10);
    else ctx.fillRect(bx, by, bw, bh);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ff3d6e';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(sx + player.w/2 - 10, by + bh);
    ctx.lineTo(sx + player.w/2, by + bh + 12);
    ctx.lineTo(sx + player.w/2 + 10, by + bh);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#ff3d6e';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#ff3d6e';
    ctx.font = 'bold 17px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ადიოს მუჩაჩოოსსსს! 🗣️', bx + bw/2, by + 27);
    ctx.restore();
  }
}

function drawCityBuildings(){
  if(!level.isGodzillaLevel) return;
  for(const b of cityBuildings){
    const sx = b.x - camX;
    if(sx + b.w < -100 || sx > W + 100) continue;

    if(b.destroyed){
      // Crumbling rubble & burning embers
      ctx.fillStyle = '#1a121c';
      ctx.fillRect(sx, b.y + b.h - 40, b.w, 40);
      ctx.fillStyle = '#2b1d2c';
      ctx.fillRect(sx + 20, b.y + b.h - 60, b.w - 40, 20);

      // Fire & smoke
      const fTime = state.time * 0.01;
      ctx.fillStyle = Math.sin(fTime + b.x) > 0 ? '#ff4400' : '#ffaa00';

      ctx.arc(sx + b.w/2, b.y + b.h - 50, 22, 0, Math.PI*2);
      ctx.fill();

      // Intact skyscraper
      ctx.fillStyle = '#0e1626';
      ctx.fillRect(sx, b.y, b.w, b.h);
      ctx.strokeStyle = '#38c6ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(sx, b.y, b.w, b.h);

      for(let wx = sx + 15; wx < sx + b.w - 15; wx += 25){

          if((Math.floor(wx + wy) % 3) !== 0){

          }
        }
      }
    }
  }
}

function drawGodzilla(){
  if(!godzillaBoss.active) return;
  const g = godzillaBoss;
  const sx = g.x - camX;
  if(sx + g.w < -150 || sx > W + 150) return;

  ctx.save();
  ctx.translate(sx + g.w/2, g.y + g.h/2);
  ctx.scale(g.facing, 1);

  const wobble = Math.sin(g.animT * 0.008) * 6;

  // Godzilla Body (Dark Slate Green Kaiju)
  ctx.fillStyle = '#1e382b';
  ctx.beginPath();
  ctx.ellipse(0, 10 + wobble, 75, 95, 0, 0, Math.PI*2);
  ctx.fill();

  // Spikes on spine (Glowing Neon Blue)
  ctx.fillStyle = g.isBeaming ? '#00e5ff' : '#0088cc';
  for(let i = -4; i <= 4; i++){
    ctx.beginPath();
    ctx.moveTo(-75, i * 20 + wobble);
    ctx.lineTo(-105, i * 20 - 15 + wobble);
    ctx.lineTo(-65, i * 20 + 15 + wobble);
    ctx.fill();
  }

  // Godzilla Head
  ctx.fillStyle = '#1e382b';
  ctx.beginPath();
  ctx.ellipse(25, -80 + wobble, 45, 38, 0, 0, Math.PI*2);
  ctx.fill();

  // Snout & Jaw
  ctx.fillRect(35, -95 + wobble, 40, 30);

  // Fiery Eyes
  ctx.fillStyle = '#ff1100';
  ctx.beginPath(); ctx.arc(45, -92 + wobble, 7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffff00';
  ctx.beginPath(); ctx.arc(47, -92 + wobble, 3, 0, Math.PI*2); ctx.fill();

  // Mouth & Atomic Breath Glow
  if(g.isBeaming){
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath(); ctx.ellipse(55, -75 + wobble, 18, 12, 0, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(55, -75 + wobble, 12, 8, 0, 0, Math.PI*2); ctx.fill();
    // Sharp teeth
    ctx.fillStyle = '#fff';
    ctx.fillRect(50, -82 + wobble, 3, 5);
    ctx.fillRect(58, -82 + wobble, 3, 5);
  }

  // Arms & Legs
  ctx.fillStyle = '#182e23';
  ctx.fillRect(15, -20 + wobble, 35, 18);
  ctx.fillRect(-35, 65 + wobble, 45, 45);
  ctx.fillRect(10, 65 + wobble, 45, 45);

  ctx.restore();

  // Atomic Beam Effect
  if(g.isBeaming){
    const beamStartX = g.facing === -1 ? sx - 10 : sx + g.w + 10;
    const beamY = g.y + 45;

    ctx.save();
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 25;
    ctx.fillRect(beamStartX - (g.facing === -1 ? 1200 : 0), beamY - 20, 1200, 40);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(beamStartX - (g.facing === -1 ? 1200 : 0), beamY - 8, 1200, 16);
    ctx.restore();
  }

  // Godzilla Boss Health Bar Header
  const barW = 420, barH = 18;
  const bx = W/2 - barW/2, by = 48;
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(bx - 12, by - 26, barW + 24, barH + 36);
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx - 12, by - 26, barW + 24, barH + 36);

  ctx.fillStyle = '#ff3d6e';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🦖 GODZILLA - CITY DESTROYER 🦖', W/2, by - 8);

  ctx.fillStyle = '#222';
  ctx.fillRect(bx, by, barW, barH);
  ctx.fillStyle = '#00f0ff';
  ctx.fillRect(bx, by, barW * Math.max(0, g.hp / g.maxHp), barH);
  ctx.strokeStyle = '#fff';
  ctx.strokeRect(bx, by, barW, barH);
}

function triggerNukeSequence(){
  if(nukeSeq.active) return;
  nukeSeq.active = true;
  nukeSeq.timer = 0;
  nukeSeq.missileY = H + 120;
  nukeSeq.missileX = W / 2;
  nukeSeq.exploded = false;
  nukeSeq.flash = 0;
  sfxDemonic();
  shake(40);
  triggerFlash('255, 100, 0', 0.9);
  toast("☢️ 🚨 ატომური რაკეტის გაშვება დეტექტირებულია! 🚨 ☢️", 3000);
}

function updateNukeSequence(dt){
  if(!nukeSeq.active) return;
  nukeSeq.timer += dt;

  if(!nukeSeq.exploded){
    nukeSeq.missileY -= 14;
    shake(16);
    spawnParticles(nukeSeq.missileX, nukeSeq.missileY + 65, '#ff4400', 8, 2.5);
    spawnParticles(nukeSeq.missileX, nukeSeq.missileY + 80, '#444444', 10, 2);

    if(nukeSeq.missileY < H * 0.22){
      nukeSeq.exploded = true;
      shake(55);
      sfxDemonic();
      triggerFlash('255, 255, 255', 1.0);
      toast("💥 ☢️ ატომური ბომბის აფეთქება! ქალაქი განადგურდა! ☢️ 💥", 3000);

      // Crumble all city buildings instantly
      for(const b of cityBuildings) b.destroyed = true;

      for(let i = 0; i < 90; i++){
        spawnParticles(nukeSeq.missileX, nukeSeq.missileY, i%2===0 ? '#ff3d6e' : '#ffd23f', 90, 4.5);
      }
    }
  } else {
    shake(22);
  }

  if(nukeSeq.timer > 3400){
    state.mode = 'gameover';
  }
}

function drawNukeSequence(){
  if(!nukeSeq.active) return;

  if(!nukeSeq.exploded){
    const mx = nukeSeq.missileX;
    const my = nukeSeq.missileY;

    ctx.save();
    // Missile body
    ctx.fillStyle = '#a0aab2';
    ctx.fillRect(mx - 15, my - 50, 30, 80);
    // Warhead nose cone
    ctx.fillStyle = '#ff2200';
    ctx.beginPath();
    ctx.moveTo(mx - 15, my - 50);
    ctx.lineTo(mx, my - 85);
    ctx.lineTo(mx + 15, my - 50);
    ctx.fill();

    // Nuclear symbol on body ☢️
    ctx.fillStyle = '#111';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('☢️', mx, my - 10);

    // Rocket fins
    ctx.fillStyle = '#ff2200';
    ctx.beginPath(); ctx.moveTo(mx - 15, my + 10); ctx.lineTo(mx - 28, my + 35); ctx.lineTo(mx - 15, my + 30); ctx.fill();
    ctx.beginPath(); ctx.moveTo(mx + 15, my + 10); ctx.lineTo(mx + 28, my + 35); ctx.lineTo(mx + 15, my + 30); ctx.fill();

    // Fire plume thrust
    ctx.fillStyle = '#ff6600';
    ctx.beginPath();
    ctx.moveTo(mx - 12, my + 30);
    ctx.lineTo(mx, my + 95 + Math.random()*20);
    ctx.lineTo(mx + 12, my + 30);
    ctx.fill();
    ctx.restore();
  } else {
    // Nuclear Mushroom Cloud
    const mx = nukeSeq.missileX;
    const my = H * 0.22;

    ctx.save();
    // Mushroom Stem
    ctx.fillStyle = 'rgba(255, 100, 0, 0.85)';
    ctx.beginPath();
    ctx.moveTo(mx - 30, H);
    ctx.lineTo(mx - 15, my);
    ctx.lineTo(mx + 15, my);
    ctx.lineTo(mx + 30, H);
    ctx.fill();

    // Massive Glowing Cap
    const capRad = 180 + Math.sin(state.time * 0.01) * 20;
    const grad = ctx.createRadialGradient(mx, my, 20, mx, my, capRad);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.3, '#ffcc00');
    grad.addColorStop(0.7, '#ff3300');
    grad.addColorStop(1, 'rgba(100, 0, 0, 0.9)');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(mx, my, capRad, 0, Math.PI*2);
    ctx.fill();

    // Shockwave Ring
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.ellipse(mx, my + 40, capRad * 1.5, capRad * 0.4, 0, 0, Math.PI*2);
    ctx.stroke();

    ctx.restore();
  }
}

function drawHUD(){
  ctx.save();
  ctx.textAlign='left';

  // 1. Level Progress Bar (Center Top)
  const barW = 260;
  const barH = 8;
  const barX = (W - barW) / 2;
  const barY = 10;
  const levelWidth = (level && level.width) ? level.width : 10000;
  const totalVert = (GROUND_Y - 60) - (level && level.flag ? level.flag.y : -3000);
  const curVert = (GROUND_Y - 60) - player.y;
  const vertProgress = Math.min(1, Math.max(0, curVert / Math.max(1, totalVert)));
  const progress = (level && level.isVerticalLevel) ? vertProgress : Math.min(1, Math.max(0, player.x / levelWidth));

  // Bar Background
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  if(ctx.roundRect) {
    ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, 4); ctx.fill();
  } else {
    ctx.fillRect(barX, barY, barW, barH);
  }

  // Bar Fill
  if(progress > 0){
    const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    grad.addColorStop(0, '#4ade80');
    grad.addColorStop(1, '#22c55e');
    ctx.fillStyle = grad;
    if(ctx.roundRect) {
      ctx.beginPath(); ctx.roundRect(barX, barY, barW * progress, barH, 4); ctx.fill();
    } else {
      ctx.fillRect(barX, barY, barW * progress, barH);
    }
  }

  // Border
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.lineWidth = 1;
  if(ctx.roundRect) {
    ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, 4); ctx.stroke();
  } else {
    ctx.strokeRect(barX, barY, barW, barH);
  }

  // Progress Text
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  if(level && level.isVerticalLevel){
    const currentFloor = Math.min(25, Math.max(1, Math.floor(progress * 25) + 1));
    ctx.fillText(`VERTICAL ESCAPE: ${Math.floor(progress * 100)}% (FLOOR ${currentFloor} / 25)`, W/2, barY + barH + 12);
  } else {
    ctx.fillText(`PROGRESS: ${Math.floor(progress * 100)}%`, W/2, barY + barH + 12);
  }

  // NO GUNS Banner
  if(level && level.noGuns){
    ctx.save();
    ctx.fillStyle = 'rgba(239, 68, 68, 0.85)';
    ctx.strokeStyle = '#fca5a5';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(W/2 - 130, 32, 260, 22, 6); else ctx.fillRect(W/2 - 130, 32, 260, 22); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText("🚫 NO GUNS — SPEED & PARKOUR!", W/2, 47);
    ctx.restore();
  }

  // RISING HORDE Distance Meter
  if(level && level.risingHordeY !== undefined){
    const distM = Math.round((level.risingHordeY - (player.y + player.h)) / 10);
    ctx.save();
    ctx.fillStyle = distM < 25 ? 'rgba(239, 68, 68, 0.9)' : 'rgba(245, 158, 11, 0.85)';
    ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(14, 115, 210, 24, 6); else ctx.fillRect(14, 115, 210, 24); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`🔥 HORDE: ${distM > 0 ? distM + 'm BELOW' : '⚠️ OVERTAKING!'}`, 22, 131);
    ctx.restore();
  }

  // GOLDEN WINGS Active Flight Banner
  if(player.wingsTimer > 0){
    const secLeft = (player.wingsTimer / 1000).toFixed(1);
    ctx.save();
    ctx.fillStyle = 'rgba(245, 158, 11, 0.9)';
    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 1.8;
    ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(14, 144, 210, 24, 6); else ctx.fillRect(14, 144, 210, 24); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`🪽 WINGS FLIGHT: ${secLeft}s (SPACE TO FLY)`, 22, 160);
    ctx.restore();
  }

  // 2. Left Side (Score & Health)
  ctx.textAlign='left';
  // Mini Blue Character Face Coin for HUD Score
  const coinX = 28, coinY = 25, coinR = 10;
  ctx.save();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(coinX, coinY, coinR + 2, 0, 2*Math.PI); ctx.fill();
  ctx.fillStyle = '#3fc7ea';
  ctx.beginPath(); ctx.arc(coinX, coinY, coinR, 0, 2*Math.PI); ctx.fill();
  ctx.fillStyle = '#1a1d24';
  ctx.beginPath(); ctx.roundRect(coinX - coinR*0.7, coinY - coinR*0.4, coinR*1.4, coinR*0.55, 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(coinX - coinR*0.35, coinY - coinR*0.1, coinR*0.22, 0, 2*Math.PI);
  ctx.arc(coinX + coinR*0.35, coinY - coinR*0.1, coinR*0.22, 0, 2*Math.PI);
  ctx.fill();
  ctx.fillStyle = '#38c6ff';
  ctx.beginPath();
  ctx.arc(coinX - coinR*0.35, coinY - coinR*0.1, coinR*0.14, 0, 2*Math.PI);
  ctx.arc(coinX + coinR*0.35, coinY - coinR*0.1, coinR*0.14, 0, 2*Math.PI);
  ctx.fill();
  ctx.restore();

  ctx.font='bold 22px sans-serif';
  ctx.fillStyle='#fff';
  ctx.fillText(' ' + state.score, 45, 32);

  // Health
  const maxLives = state.upgrades.maxHp ? 10 : 8;
  let heartsStr = '';
  for(let i=0; i<maxLives; i++) heartsStr += i < state.lives ? '❤️ ' : '🖤 ';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText(heartsStr + ` (${state.lives}/${maxLives})`, 18, 58);

  // Weapon
  const weaponNames = {
    pistol: '🔫 პისტოლეტი',
    guitar: '🎸 წითელ-თეთრი ელექტრო გიტარა',
    triple: '🔥 სამმაგი ლაზერი',
    shotgun: '💥 შოტგანი',
    minigun: '⚡ მინიგანი',
    plasma: '⚛ პლაზმური ზარბაზანი',
    flamethrower: '🔥 ფლამეინგ-ცეცხლმფრქვევი',
    tank: '🚀 ომის გიგანტური ტანკი',
    bike: '🏍️ KAWASAKI Z750 (2007)'
  };
  ctx.font='bold 13px sans-serif';
  ctx.fillStyle='#ffd23f';
  ctx.fillText('იარაღი: ' + (weaponNames[player.weaponMode] || '🔫 პისტოლეტი'), 18, 82);

  // 3. Right Side (Combo & Rage)
  ctx.textAlign = 'right';
  let currentY = 30;

  // Combo Meter
  if(state.comboCount > 1) {
    ctx.fillStyle = '#ff3d6e';
    ctx.font = '900 24px sans-serif';
    ctx.shadowColor = 'rgba(255, 61, 110, 0.5)';
    ctx.shadowBlur = 8;
    ctx.fillText(`${state.comboCount}X COMBO!`, W - 20, currentY);
    ctx.shadowBlur = 0;
    
    // Combo Timer Bar
    const timerW = 100;
    const fillW = (state.comboTimer / 2000) * timerW;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(W - 120, currentY + 10, timerW, 4);
    ctx.fillStyle = '#ff3d6e';
    ctx.fillRect(W - 120, currentY + 10, fillW, 4);
    currentY += 50;
  } else {
    currentY = 40; // Default start for Rage if no combo
  }

  // Rage Meter
  const rageBarW = 140;
  const rageBarH = 10;
  const rageBarX = W - rageBarW - 20;
  const rageBarY = currentY;
  
  ctx.font = 'bold 11px sans-serif';
  ctx.fillStyle = state.isRageActive ? '#ff9f1c' : '#cbd5e1';
  ctx.fillText(state.isRageActive ? '🔥 RAGE ACTIVE! 🔥' : 'RAGE ENERGY', W - 20, rageBarY - 6);

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  if(ctx.roundRect) {
    ctx.beginPath(); ctx.roundRect(rageBarX, rageBarY, rageBarW, rageBarH, 5); ctx.fill();
  } else {
    ctx.fillRect(rageBarX, rageBarY, rageBarW, rageBarH);
  }

  if(state.rageEnergy > 0) {
    const grad = ctx.createLinearGradient(rageBarX, 0, rageBarX + rageBarW, 0);
    if(state.isRageActive) {
      grad.addColorStop(0, '#ff4d00');
      grad.addColorStop(0.5, '#ff9f1c');
      grad.addColorStop(1, '#ff4d00');
    } else {
      grad.addColorStop(0, '#7c3aed');
      grad.addColorStop(1, '#a78bfa');
    }
    ctx.fillStyle = grad;
    const fillWidth = (state.rageEnergy / 100) * rageBarW;
    if(ctx.roundRect) {
      ctx.beginPath(); ctx.roundRect(rageBarX, rageBarY, fillWidth, rageBarH, 5); ctx.fill();
    } else {
      ctx.fillRect(rageBarX, rageBarY, fillWidth, rageBarH);
    }
  }

  ctx.restore();

  // Active Upgrades & Abilities Badges
  let hudY = 135;
  const isHardcore = state.settings && state.settings.difficulty === 'hardcore';
  if(isHardcore){
    ctx.fillStyle='#ff3d6e';
    ctx.font='bold 16px sans-serif';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 8;
    ctx.fillText('💀 HARDCORE MODE ACTIVE', 18, hudY);
    ctx.shadowBlur = 0;
    hudY += 24;
    ctx.font='bold 14px sans-serif';
  }
  if(player.hasShield){
    ctx.fillStyle='#38c6ff';
    ctx.fillText('🛡️ NANOTECH SHIELD: ACTIVE', 18, hudY);
    hudY += 20;
  }
  if(player.fastenerTimer > 0){
    ctx.fillStyle='#38c6ff';
    ctx.fillText('⚡ FASTENER: ' + (player.fastenerTimer/1000).toFixed(1) + 's', 18, hudY);
    hudY += 20;
  }
  if(player.reverseControlsTimer > 0){
    ctx.fillStyle='#ff3d6e';
    ctx.fillText('🌀 კონტროლი არეულია: ' + (player.reverseControlsTimer/1000).toFixed(1) + 's', 18, hudY);
    hudY += 20;
  }

  // Combo Multiplier Counter (Removed redundant)

  // Subscribe Meter Removed
  
  ctx.textAlign='left';
  ctx.font='bold 15px sans-serif';
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.fillText(level.name, 18, H-18);

  // In-Game HUD Buttons (Top-Right: Pause & Mute)
  ctx.save();
  const hudBtnH = 28;
  const pBtnW = 38;
  const pBtnX = W - pBtnW - 12, pBtnY = 10;
  const mBtnW = 40;
  const mBtnX = pBtnX - mBtnW - 8, mBtnY = 10;

  // Draw Pause Button
  ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(pBtnX, pBtnY, pBtnW, hudBtnH, 6);
  else ctx.fillRect(pBtnX, pBtnY, pBtnW, hudBtnH);
  ctx.fill();
  ctx.strokeStyle = '#ffd23f';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.font = 'bold 12px sans-serif';
  ctx.fillStyle = '#ffd23f';
  ctx.textAlign = 'center';
  ctx.fillText('⏸️', pBtnX + pBtnW/2, pBtnY + 19);

  // Draw Music Mute Button
  ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(mBtnX, mBtnY, mBtnW, hudBtnH, 6);
  else ctx.fillRect(mBtnX, mBtnY, mBtnW, hudBtnH);
  ctx.fill();
  ctx.strokeStyle = bgmMuted ? '#ef4444' : '#38c6ff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.font = 'bold 12px sans-serif';
  ctx.fillStyle = bgmMuted ? '#ef4444' : '#38c6ff';
  ctx.fillText(bgmMuted ? '🔇' : '🎵', mBtnX + mBtnW/2, mBtnY + 19);
  ctx.restore();

  if(state.toastTimer>0){
    ctx.save();
    ctx.font='bold 15px sans-serif';
    const tm = ctx.measureText(state.toastText);
    const tw = Math.min(W - 40, tm.width + 36);
    const th = 38;
    const tx = W/2 - tw/2;
    const ty = H - 120; // Repositioned to center-bottom area
    const alpha = Math.min(1, state.toastTimer/300);
    ctx.globalAlpha = alpha;

    ctx.fillStyle = 'rgba(10, 15, 26, 0.95)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(tx, ty, tw, th, 19);
    else ctx.fillRect(tx, ty, tw, th);
    ctx.fill();

    ctx.strokeStyle = '#ffd23f';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.textAlign='center';
    ctx.fillStyle='#ffd23f';
    ctx.fillText(state.toastText, W/2, ty + 24);
    ctx.restore();
    state.toastTimer -= 16;
  }

  drawBiteStruggleUI();
  drawWeatherHUD();
  drawAchievementBanner();
}

function drawAchievementBanner(){
  if(!state.achievementNotification || state.achievementNotification.timer <= 0) return;

  const notif = state.achievementNotification;
  const slideIn = Math.min(1, (3600 - notif.timer) / 250);
  const yPos = -65 + slideIn * 85; 

  ctx.save();
  ctx.globalAlpha = Math.min(1, notif.timer / 300);

  const bw = 460, bh = 62;
  const bx = W/2 - bw/2, by = yPos;

  // Outer Glowing Border Card
  ctx.shadowColor = '#ffd23f';
  ctx.shadowBlur = 20;
  ctx.fillStyle = 'rgba(10, 14, 26, 0.94)';
  ctx.beginPath();
  ctx.roundRect(bx, by, bw, bh, 10);
  ctx.fill();

  ctx.strokeStyle = '#ffd23f';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.shadowBlur = 0;

  // Left Badge Gold Box
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.roundRect(bx + 12, by + 10, 42, 42, 8);
  ctx.fill();

  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#000';
  ctx.fillText('🏆', bx + 33, by + 39);

  // Header Title Text
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillStyle = '#ffd23f';
  ctx.fillText('⚡ მიღწევა განბლოკილია! (ACHIEVEMENT UNLOCKED)', bx + 66, by + 24);

  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(notif.title, bx + 66, by + 46);

  ctx.restore();

  notif.timer -= 16;
}

function drawLoading(){
  // Atmospheric Gradient Background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#0a0e1a');
  bgGrad.addColorStop(0.6, '#060810');
  bgGrad.addColorStop(1, '#030408');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Animated background dust particles
  ctx.save();
  for(let i = 0; i < 35; i++){
    const px = (i * 97 + state.time * 0.15) % W;
    const py = (i * 131 + Math.sin(state.time * 0.002 + i) * 30) % H;
    const sz = 1.5 + (i % 3);
    ctx.fillStyle = i % 2 === 0 ? 'rgba(56, 198, 255, 0.35)' : 'rgba(255, 61, 110, 0.35)';
    ctx.beginPath();
    ctx.arc(px, py, sz, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Grid scanline overlay
  ctx.save();
  ctx.strokeStyle = 'rgba(56, 198, 255, 0.04)';
  ctx.lineWidth = 1;
  for(let y = 0; y < H; y += 12){
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.restore();

  ctx.textAlign = 'center';

  // Top Header Badge
  ctx.save();
  ctx.fillStyle = 'rgba(255, 210, 63, 0.15)';
  ctx.fillRect(W/2 - 120, H/2 - 195, 240, 30);
  ctx.strokeStyle = '#ffd23f';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(W/2 - 120, H/2 - 195, 240, 30);
  ctx.font = 'bold 13px sans-serif';
  ctx.fillStyle = '#ffd23f';
  ctx.fillText('⚡ CODEZERO PRESENTS ⚡', W/2, H/2 - 175);
  ctx.restore();

  // Main Title: DINO
  ctx.save();
  ctx.font = '900 72px sans-serif';
  ctx.shadowColor = '#38c6ff';
  ctx.shadowBlur = 25;
  ctx.fillStyle = '#38c6ff';
  ctx.fillText('DINO', W/2, H/2 - 105);
  ctx.restore();

  // Subtitle
  ctx.font = 'bold 22px sans-serif';
  ctx.fillStyle = '#ff3d6e';
  ctx.fillText('ხულიგნური პარკური & ჰორორ თავგადასავალი', W/2, H/2 - 68);

  // Animated GeoDino Hero Preview Badge
  ctx.save();
  const auraRad = 38 + Math.sin(state.time * 0.008) * 6;
  const cx = W/2, cy = H/2 - 12;
  const auraGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, auraRad + 15);
  auraGrad.addColorStop(0, 'rgba(56, 198, 255, 0.4)');
  auraGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = auraGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, auraRad + 15, 0, Math.PI * 2);
  ctx.fill();

  const savedX = player.x, savedY = player.y;
  player.x = W/2 - player.w/2;
  player.y = H/2 - 38;
  drawPlayer();
  player.x = savedX;
  player.y = savedY;
  ctx.restore();

  // High-Tech Progress Bar
  const barW = 480, barH = 26;
  const bx = W/2 - barW/2, by = H/2 + 55;

  ctx.save();
  // Frame
  ctx.fillStyle = '#0a0d16';
  ctx.fillRect(bx - 4, by - 4, barW + 8, barH + 8);
  ctx.strokeStyle = 'rgba(56, 198, 255, 0.6)';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx - 4, by - 4, barW + 8, barH + 8);

  // Fill Progress
  const pct = Math.min(1, Math.max(0, state.loadProgress / 100));
  const fillGrad = ctx.createLinearGradient(bx, 0, bx + barW, 0);
  fillGrad.addColorStop(0, '#ff3d6e');
  fillGrad.addColorStop(0.5, '#ffd23f');
  fillGrad.addColorStop(1, '#38c6ff');

  ctx.fillStyle = fillGrad;
  ctx.fillRect(bx, by, barW * pct, barH);

  // Glossy overlay
  ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.fillRect(bx, by, barW * pct, barH / 2);

  // Percentage Text
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#000000';
  ctx.shadowBlur = 4;
  ctx.fillText(Math.floor(state.loadProgress) + '%', W/2, by + barH - 8);
  ctx.restore();

  // Loading Status Message
  ctx.font = '15px sans-serif';
  ctx.fillStyle = '#f4ecd8';
  ctx.fillText(loadMessages[state.loadMsgIndex], W/2, by + barH + 32);

  // Footer Branding
  ctx.save();
  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#ff3d6e';
  ctx.fillText('📺 youtube.com/@geodino_yt   •   📚 codezero.ge', W/2, by + barH + 72);
  ctx.restore();

  state.loadProgress += 1.1;
  if(Math.floor(state.loadProgress) % 12 === 0){
    state.loadMsgIndex = (state.loadMsgIndex + 1) % loadMessages.length;
  }
  if(state.loadProgress >= 100){
    state.mode = 'menu';
  }
}

      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 9px sans-serif';
      ctx.fillText('!', bx + subW - 8, sby + 11);
    }

  ctx.restore();

  // Promo Code Button on Start Menu Canvas
  ctx.save();
  const promoW = 340, promoH = 38;

  ctx.textAlign = 'center';

  // Top-Right Music BGM Toggle Button on Start Menu Canvas
  ctx.save();
  const mBtnW = 120, mBtnH = 32;
  const mBtnX = W - mBtnW - 16, mBtnY = 16;
  ctx.fillStyle = 'rgba(20, 28, 48, 0.9)';
  ctx.beginPath();

  else ctx.fillRect(mBtnX, mBtnY, mBtnW, mBtnH);

  ctx.strokeStyle = bgmMuted ? '#ef4444' : '#38c6ff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.font = 'bold 12px sans-serif';
  ctx.fillStyle = bgmMuted ? '#ef4444' : '#38c6ff';
  ctx.textAlign = 'center';
  ctx.fillText(bgmMuted ? '🔇 MUSIC: OFF' : '🎵 MUSIC: ON', mBtnX + mBtnW/2, mBtnY + 20);
  ctx.restore();

  ctx.restore();
}

// ---------- Product Preview Modal & Shop Functions ----------
function openPreviewModal(item, type) {
  state.previewModal = {
    active: true,
    item: item,
    type: type || 'skins',
    animState: 'idle',
    testFiring: false
  };
  sfxBell();
}

function closePreviewModal() {
  if (state.previewModal) {
    state.previewModal.active = false;
  }
  sfxBell();
}

function executeItemTransaction(item, type) {
  let isBought = false;
  let isEquipped = false;

  if (type === 'upgrades') {
    isBought = state.upgrades[item.id];
  } else if (type === 'skins') {
    isBought = (state.unlockedSkins || []).includes(item.id);
    isEquipped = state.equippedSkin === item.id;
  } else if (type === 'weapons') {
    isBought = (state.unlockedWeapons || []).includes(item.id);
    isEquipped = state.equippedWeapon === item.id;
  }

  if (isEquipped) {
    toast(`✅ ${item.title} უკვე არჩეულია!`, 1500);
    return;
  }

  if (isBought) {
    if (type === 'skins') {
      state.equippedSkin = item.id;
      saveData();
      sfxCoin();
      toast(`👕 სკინი არჩეულია: ${item.title}`, 1800);
    } else if (type === 'weapons') {
      state.equippedWeapon = item.id;
      player.weaponMode = item.id;
      saveData();
      sfxCoin();
      toast(`🔫 იარაღი არჩეულია: ${item.title}`, 1800);
    }
  } else {
    if (state.coinsCollected >= item.cost) {
      state.coinsCollected -= item.cost;
      if (type === 'upgrades') {
        state.upgrades[item.id] = true;
      } else if (type === 'skins') {
        if (!state.unlockedSkins) state.unlockedSkins = ['classic'];
        state.unlockedSkins.push(item.id);
        state.equippedSkin = item.id;
      } else if (type === 'weapons') {
        if (!state.unlockedWeapons) state.unlockedWeapons = ['pistol'];
        state.unlockedWeapons.push(item.id);
        state.equippedWeapon = item.id;
        player.weaponMode = item.id;
      }
      saveData();
      sfxCoin();
      sfxWin();
      triggerFlash('56,198,255', 0.7);
      toast(`🎉 წარმატებით შეიძინე: ${item.title}`, 2200);
    } else {
      sfxHurt();
      toast(`❌ არ გყოფნის მონეტები! (საჭიროა ${item.cost})`, 1800);
    }
  }
}

function handlePreviewModalClick(mx, my) {
  if (!state.previewModal || !state.previewModal.active || !state.previewModal.item) return false;

  const item = state.previewModal.item;
  const type = state.previewModal.type || 'skins';
  const mw = 840, mh = 510;
  const mxPos = W / 2 - mw / 2, myPos = H / 2 - mh / 2;

  // Close Button (top right ✖)
  const closeW = 40, closeH = 32;
  const cxBtn = mxPos + mw - closeW - 14, cyBtn = myPos + 10;
  if (mx >= cxBtn && mx <= cxBtn + closeW && my >= cyBtn && my <= cyBtn + closeH) {
    closePreviewModal();
    return true;
  }

  // Clicks outside modal -> close
  if (mx < mxPos || mx > mxPos + mw || my < myPos || my > myPos + mh) {
    closePreviewModal();
    return true;
  }

  const stageX = mxPos + 20, stageY = myPos + 64, stageW = 380, stageH = 422;

  if (type === 'skins') {
    const poseW = 100, poseH = 32;
    const poses = ['idle', 'run', 'jump'];
    poses.forEach((p, idx) => {
      const pxBtn = stageX + 24 + idx * (poseW + 12), pyBtn = stageY + stageH - 46;
      if (mx >= pxBtn && mx <= pxBtn + poseW && my >= pyBtn && my <= pyBtn + poseH) {
        state.previewModal.animState = p;
        sfxCoin();
      }
    });
  } else if (type === 'weapons') {
    const tfW = 200, tfH = 36;
    const tfX = stageX + stageW / 2 - tfW / 2, tfY = stageY + stageH - 48;
    if (mx >= tfX && mx <= tfX + tfW && my >= tfY && my <= tfY + tfH) {
      state.previewModal.testFiring = true;
      sfxShoot();
      shake(5);
      spawnParticles(stageX + stageW / 2 + 60, stageY + stageH / 2 - 20, '#38c6ff', 10, 2);
      setTimeout(() => {
        if (state.previewModal) state.previewModal.testFiring = false;
      }, 250);
      return true;
    }
  }

  const panelX = mxPos + 424, panelY = myPos + 64;
  const actionW = 390, actionH = 48;
  const actionX = panelX, actionY = panelY + 372;

  if (mx >= actionX && mx <= actionX + actionW && my >= actionY && my <= actionY + actionH) {
    executeItemTransaction(item, type);
    return true;
  }

  return true;
}

      { label: '🎨 ვიზუალური დიზაინი', score: 8, valText: 'LEGENDARY' },
      { label: '👑 იშვიათობა', score: 7, valText: 'CLASS A' },
      { label: '⚡ სპეციალური ეფექტები', score: 7, valText: 'AURA FX' }
    ];
  } else {
    specs = [
      { label: '⚡ ეფექტურობა', score: 7, valText: 'LEVEL MAX' },
      { label: '🛡️ ბონუს უნარი', score: 8, valText: 'ACTIVE' }
    ];
  }

  let specY = panelY + 155;
  specs.forEach(sp => {
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#cbd5e1';
    ctx.fillText(sp.label, panelX, specY);

    ctx.textAlign = 'right';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = '#38c6ff';
    ctx.fillText(sp.valText, panelX + 390, specY);

    ctx.textAlign = 'left';
    // 8 Segmented Blocks Bar
    const bStartX = panelX, bY = specY + 6, bW = 390, blockNum = 8;
    const blockWidth = (bW - (blockNum - 1) * 4) / blockNum;

    for (let i = 0; i < blockNum; i++) {
      const bx = bStartX + i * (blockWidth + 4);
      const isFilled = i < sp.score;
      ctx.fillStyle = isFilled ? '#38c6ff' : '#1e293b';
      ctx.fillRect(bx, bY, blockWidth, 10);
    }

    specY += 38;
  });
  ctx.restore();

  // Price & Wallet Box
  const priceY = panelY + 308;
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(panelX, priceY, 390, 48, 8);
  else ctx.fillRect(panelX, priceY, 390, 48);
  ctx.fill();
  ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1; ctx.stroke();

  ctx.font = 'bold 15px sans-serif';
  ctx.fillStyle = '#ffd23f';
  ctx.fillText(`🪙 ფასი: ${item.cost} მონეტა`, panelX + 16, priceY + 29);

  ctx.textAlign = 'right';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#38c6ff';
  ctx.fillText(`💰 თქვენი ბალანსი: ${state.coinsCollected} 🪙`, panelX + 374, priceY + 29);

  // Primary Action Button
  let isBought = false;
  let isEquipped = false;

  if (type === 'upgrades') {
    isBought = state.upgrades[item.id];
  } else if (type === 'skins') {
    isBought = (state.unlockedSkins || []).includes(item.id);
    isEquipped = state.equippedSkin === item.id;
  } else if (type === 'weapons') {
    isBought = (state.unlockedWeapons || []).includes(item.id);
    isEquipped = state.equippedWeapon === item.id;
  }

  const canAfford = state.coinsCollected >= item.cost;
  const actionW = 390, actionH = 48;
  const actionX = panelX, actionY = priceY + 64;

  ctx.textAlign = 'center';
  ctx.font = 'bold 16px sans-serif';

  if (isEquipped) {
    ctx.fillStyle = 'rgba(34, 197, 94, 0.15)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(actionX, actionY, actionW, actionH, 8);
    else ctx.fillRect(actionX, actionY, actionW, actionH);
    ctx.fill();
    ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.fillStyle = '#22c55e';
    ctx.fillText('✅ არჩეულია', actionX + actionW / 2, actionY + 30);

  } else if (isBought) {
    ctx.fillStyle = '#38c6ff';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(actionX, actionY, actionW, actionH, 8);
    else ctx.fillRect(actionX, actionY, actionW, actionH);
    ctx.fill();

    ctx.fillStyle = '#000000';
    ctx.fillText('🎯 აღჭურვა', actionX + actionW / 2, actionY + 30);

  } else {
    ctx.fillStyle = canAfford ? '#ffd23f' : '#1e293b';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(actionX, actionY, actionW, actionH, 8);
    else ctx.fillRect(actionX, actionY, actionW, actionH);
    ctx.fill();
    ctx.strokeStyle = canAfford ? '#ffffff' : '#334155'; ctx.lineWidth = 1; ctx.stroke();

    ctx.fillStyle = canAfford ? '#000000' : '#64748b';
    const btnLabel = canAfford ? `🛒 ყიდვა - ${item.cost} 🪙` : `❌ არ გყოფნის მონეტები (${item.cost} 🪙)`;
    ctx.fillText(btnLabel, actionX + actionW / 2, actionY + 30);
  }

  ctx.restore();
}

function drawShop(){
  drawBackground('pink');
  ctx.fillStyle = 'rgba(6, 10, 22, 0.88)';
  ctx.fillRect(0, 0, W, H);

  // Smooth scroll interpolation
  state.shopScrollY = state.shopScrollY || 0;
  state.shopTargetScrollY = state.shopTargetScrollY || 0;
  state.shopScrollY += (state.shopTargetScrollY - state.shopScrollY) * 0.25;

  ctx.textAlign = 'center';

  // Title Header
  ctx.save();
  ctx.font = '900 30px sans-serif';
  ctx.shadowColor = '#ffd23f';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#ffd23f';
  ctx.fillText('🛍️ აღჭურვილობის, სკინებისა და იარაღების მაღაზია (SHOP)', W/2, 38);
  ctx.restore();

  // Coins Balance Badge
  ctx.fillStyle = '#38c6ff';
  ctx.font = 'bold 17px sans-serif';
  ctx.fillText(`💰 შენი ბალანსი: ${state.coinsCollected} მონეტა`, W/2, 66);

  // Tabs (Upgrades, Skins, Weapons)
  const shopTabs = [
    { id: 'upgrades', label: '⚡ უნარები' },
    { id: 'skins', label: '👕 სკინები' },
    { id: 'weapons', label: '🔫 იარაღები' }
  ];

  const tabY = 82, tabW = 210, tabH = 38;
  const tabStartX = W/2 - (3 * tabW + 2 * 16)/2;

  shopTabs.forEach((tab, idx) => {
    const tx = tabStartX + idx * (tabW + 16);
    const isActive = (state.shopTab || 'upgrades') === tab.id;

    ctx.save();
    ctx.fillStyle = isActive ? '#ffd23f' : 'rgba(20, 30, 50, 0.85)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(tx, tabY, tabW, tabH, 8);
    else ctx.fillRect(tx, tabY, tabW, tabH);
    ctx.fill();

    ctx.strokeStyle = isActive ? '#ffffff' : '#38c6ff';
    ctx.lineWidth = isActive ? 2.5 : 1.5;
    ctx.stroke();

    ctx.font = 'bold 15px sans-serif';
    ctx.fillStyle = isActive ? '#000000' : '#ffffff';
    ctx.fillText(tab.label, tx + tabW/2, tabY + 24);
    ctx.restore();
  });

  // Determine current items list
  let currentItems = shopUpgrades;
  if(state.shopTab === 'skins') currentItems = shopSkins;
  if(state.shopTab === 'weapons') currentItems = shopWeapons;

  // Calculate layout bounds and scrolling limits
  const cols = 3;
  const cardW = 280, cardH = 145;
  const cardGap = 18;
  const startX = W/2 - (cols * cardW + (cols - 1) * cardGap) / 2;
  const startY = 135;

  const totalRows = Math.ceil(currentItems.length / cols);
  const totalContentH = startY + totalRows * (cardH + 14) + 20;
  const viewportTop = 125;
  const viewportBottom = H - 65;
  const viewportH = viewportBottom - viewportTop;
  const maxScrollY = Math.max(0, totalContentH - viewportBottom);

  if (state.shopTargetScrollY < 0) state.shopTargetScrollY = 0;
  if (state.shopTargetScrollY > maxScrollY) state.shopTargetScrollY = maxScrollY;

  // Clip card container area
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, viewportTop, W, viewportH);
  ctx.clip();

  ctx.save();
  ctx.translate(0, -Math.round(state.shopScrollY));

  currentItems.forEach((item, idx) => {
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const cx = startX + col * (cardW + cardGap);
    const cy = startY + row * (cardH + 14);

    let isBought = false;
    let isEquipped = false;

    if(state.shopTab === 'upgrades'){
      isBought = state.upgrades[item.id];
    } else if(state.shopTab === 'skins'){
      isBought = (state.unlockedSkins || []).includes(item.id);
      isEquipped = state.equippedSkin === item.id;
    } else if(state.shopTab === 'weapons'){
      isBought = (state.unlockedWeapons || []).includes(item.id);
      isEquipped = state.equippedWeapon === item.id;
    }

    const canAfford = state.coinsCollected >= item.cost;

    ctx.save();
    ctx.fillStyle = isEquipped ? 'rgba(25, 65, 45, 0.94)' : (isBought ? 'rgba(25, 45, 35, 0.92)' : 'rgba(18, 24, 40, 0.92)');
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(cx, cy, cardW, cardH, 10);
    else ctx.fillRect(cx, cy, cardW, cardH);
    ctx.fill();

    ctx.strokeStyle = isEquipped ? '#3fe07d' : (isBought ? '#38c6ff' : (canAfford ? '#ffd23f' : '#ff3d6e'));
    ctx.lineWidth = isEquipped ? 3 : 2;
    ctx.stroke();

    // Title
    ctx.textAlign = 'left';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillStyle = isEquipped ? '#3fe07d' : (isBought ? '#38c6ff' : '#ffffff');
    ctx.fillText(`${item.icon} ${item.title}`, cx + 12, cy + 26);

    // Description
    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#aaaaaa';
    ctx.textAlign = 'left';
    const maxDescW = cardW - 24;
    const words = item.desc.split(' ');
    let line = '';
    let descY = cy + 46;
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxDescW && n > 0) {
        ctx.fillText(line, cx + 12, descY);
        line = words[n] + ' ';
        descY += 15;
        if (descY > cy + 85) break;
      } else {
        line = testLine;
      }
    }
    if (descY <= cy + 85) {
      ctx.fillText(line, cx + 12, descY);
    }

    // Preview Button (Left Bottom)
    const prevW = 95, prevH = 30;
    const prevBx = cx + 12, prevBy = cy + cardH - prevH - 10;
    ctx.fillStyle = 'rgba(56, 198, 255, 0.22)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(prevBx, prevBy, prevW, prevH, 6);
    else ctx.fillRect(prevBx, prevBy, prevW, prevH);
    ctx.fill();
    ctx.strokeStyle = '#38c6ff'; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = '#38c6ff';
    ctx.fillText('👁️ პრევიუ', prevBx + prevW/2, prevBy + 20);

    // Action Button Area (Right Bottom)
    ctx.font = 'bold 13px sans-serif';
    if(isEquipped){
      ctx.fillStyle = '#3fe07d';
      ctx.textAlign = 'right';
      ctx.fillText('✅ არჩეულია', cx + cardW - 12, cy + cardH - 20);
    } else if(isBought){
      const btnW = 100, btnH = 30;
      const bx = cx + cardW - btnW - 12, by = cy + cardH - btnH - 10;
      ctx.fillStyle = '#38c6ff';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(bx, by, btnW, btnH, 6);
      else ctx.fillRect(bx, by, btnW, btnH);
      ctx.fill();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('🎯 არჩევა', bx + btnW/2, by + 20);
    } else {
      const btnW = 105, btnH = 30;
      const bx = cx + cardW - btnW - 12, by = cy + cardH - btnH - 10;
      ctx.fillStyle = canAfford ? '#ffd23f' : '#444444';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(bx, by, btnW, btnH, 6);
      else ctx.fillRect(bx, by, btnW, btnH);
      ctx.fill();

      ctx.textAlign = 'center';
      ctx.fillStyle = canAfford ? '#000000' : '#888888';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(`🛒 ${item.cost} 🪙`, bx + btnW/2, by + 20);
    }
    ctx.restore();
  });

  ctx.restore();
  ctx.restore();

  // Scrollbar indicator
  if (maxScrollY > 0) {
    const trackX = W - 16;
    const trackY = viewportTop;
    const trackH = viewportH;
    const thumbH = Math.max(35, (viewportH / totalContentH) * trackH);
    const thumbY = trackY + (state.shopScrollY / maxScrollY) * (trackH - thumbH);

    ctx.save();
    ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
    ctx.fillRect(trackX, trackY, 10, trackH);
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 1; ctx.strokeRect(trackX, trackY, 10, trackH);

    ctx.fillStyle = '#38c6ff';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(trackX + 1, thumbY, 8, thumbH, 4);
    else ctx.fillRect(trackX + 1, thumbY, 8, thumbH);
    ctx.fill();
    ctx.restore();
  }

  // Bottom Buttons: Promo Code & Back
  ctx.save();
  const bw = 260, bh = 42;
  const btnGap = 20;

  // Promo Code Button (Left)
  const pbx = W/2 - bw - btnGap/2, pby = H - 52;
  ctx.fillStyle = 'rgba(255, 210, 63, 0.18)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(pbx, pby, bw, bh, 10);
  else ctx.fillRect(pbx, pby, bw, bh);
  ctx.fill();
  ctx.strokeStyle = '#ffd23f';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#ffd23f';
  ctx.fillText('🎟️ პრომოკოდი (PROMO CODE)', pbx + bw/2, pby + 27);

  // Back Button (Right)
  const bbx = W/2 + btnGap/2, bby = H - 52;
  ctx.fillStyle = '#ff3d6e';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bbx, bby, bw, bh, 10);
  else ctx.fillRect(bbx, bby, bw, bh);
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#ffffff';
  const isReturningToGame = state.returnMode === 'playing' || state.returnMode === 'paused';
  const backLabel = isReturningToGame ? '⬅️ თამაშში დაბრუნება' : '⬅️ მენიუში დაბრუნება';
  ctx.fillText(backLabel, bbx + bw/2, bby + 27);
  ctx.restore();

  // Render Product Preview Modal overlay if active
  if (state.previewModal && state.previewModal.active) {
    drawPreviewModal();
  }
}

function handleShopClick(mx, my){
  // 1. Handle preview modal clicks first if open
  if (state.previewModal && state.previewModal.active) {
    if (handlePreviewModalClick(mx, my)) return;
  }

  const bw = 260, bh = 42;
  const btnGap = 20;

  // Check Promo Code Button
  const pbx = W/2 - bw - btnGap/2, pby = H - 52;
  if(mx >= pbx && mx <= pbx + bw && my >= pby && my <= pby + bh){
    sfxBell();
    openPromoCodePrompt();
    return;
  }

  // Check Back Button
  const bbx = W/2 + btnGap/2, bby = H - 52;
  if(mx >= bbx && mx <= bbx + bw && my >= bby && my <= bby + bh){
    sfxBell();
    if(state.returnMode === 'playing' || state.returnMode === 'paused'){
      state.mode = 'playing';
      if(state.upgrades.shield) player.hasShield = true;
      if(state.equippedWeapon) player.weaponMode = state.equippedWeapon;
      else if(state.upgrades.shotgun && player.weaponMode === 'pistol') player.weaponMode = 'shotgun';
    } else {
      state.mode = state.returnMode || 'menu';
    }
    return;
  }

  // Check Tab Clicks
  const tabY = 82, tabW = 210, tabH = 38;
  const tabStartX = W/2 - (3 * tabW + 2 * 16)/2;
  const shopTabs = ['upgrades', 'skins', 'weapons'];

  for(let i = 0; i < 3; i++){
    const tx = tabStartX + i * (tabW + 16);
    if(mx >= tx && mx <= tx + tabW && my >= tabY && my <= tabY + tabH){
      state.shopTab = shopTabs[i];
      state.shopScrollY = 0;
      state.shopTargetScrollY = 0;
      sfxBell();
      return;
    }
  }

  // Check Item Card Clicks inside shop viewport
  if (my >= 125 && my <= H - 65) {
    const cardMy = my + (state.shopScrollY || 0);

    let currentItems = shopUpgrades;
    if(state.shopTab === 'skins') currentItems = shopSkins;
    if(state.shopTab === 'weapons') currentItems = shopWeapons;

    const cols = 3;
    const cardW = 280, cardH = 145;
    const cardGap = 18;
    const startX = W/2 - (cols * cardW + (cols - 1) * cardGap) / 2;
    const startY = 135;

    currentItems.forEach((item, idx) => {
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      const cx = startX + col * (cardW + cardGap);
      const cy = startY + row * (cardH + 14);

      if(mx >= cx && mx <= cx + cardW && cardMy >= cy && cardMy <= cy + cardH){
        // Check preview button
        const prevW = 95, prevH = 30;
        const prevBx = cx + 12, prevBy = cy + cardH - prevH - 10;
        if(mx >= prevBx && mx <= prevBx + prevW && cardMy >= prevBy && cardMy <= prevBy + prevH){
          openPreviewModal(item, state.shopTab);
          return;
        }

        // Action button or card click
        executeItemTransaction(item, state.shopTab);
      }
    });
  }
}
