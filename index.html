}

function drawGround(theme){
  if(!theme || theme === 'pink' || theme === 'blue'){
    if(level && level.theme) theme = level.theme;
    else theme = 'dusk_suburbs';
  }

  for(const p of level.plats){
    const sx = p.x - camX;
    if(sx + p.w < -20 || sx > W + 20) continue;

    switch(theme){
      case 'dusk_suburbs':
      case 'prehistoric_jungle': {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#4fd67b');
        g.addColorStop(0.12, '#2ea24f');
        g.addColorStop(0.15, '#7b5a3a');
        g.addColorStop(1, '#422e1d');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w, p.h);

        ctx.fillStyle = '#6ee693';
        for(let i = 4; i < p.w - 6; i += 18){
          ctx.beginPath();
          ctx.moveTo(sx + i, p.y);
          ctx.lineTo(sx + i + 4, p.y - 7);
          ctx.lineTo(sx + i + 8, p.y);
          ctx.fill();
        }
        break;
      }

      case 'cyberpunk_alley':
      case 'glitch_cyberverse': {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#1e293b');
        g.addColorStop(0.2, '#0f172a');
        g.addColorStop(1, '#020617');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w, p.h);

        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(sx, p.y, p.w, 3);

        ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
        ctx.lineWidth = 1;
        for(let i = 10; i < p.w; i += 24){
          ctx.beginPath(); ctx.moveTo(sx + i, p.y); ctx.lineTo(sx + i, p.y + p.h); ctx.stroke();
        }
        break;
      }

      case 'horror_ruins':
      case 'gothic_cemetery': {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#2e382e');
        g.addColorStop(0.15, '#1a241a');
        g.addColorStop(1, '#0a100a');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w, p.h);

        ctx.fillStyle = '#22c55e';
        ctx.fillRect(sx, p.y, p.w, 4);
        for(let i = 6; i < p.w - 6; i += 12){
          ctx.beginPath(); ctx.arc(sx + i, p.y + 4, 3, 0, Math.PI*2); ctx.fill();
        }
        break;
      }

      case 'desert_canyon': {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#f59e0b');
        g.addColorStop(0.15, '#d97706');
        g.addColorStop(1, '#78350f');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w, p.h);

        ctx.fillStyle = '#fef08a';
        ctx.fillRect(sx, p.y, p.w, 3);
        break;
      }

      case 'volcanic_inferno':
      case 'infernal_volcano': {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#18181b');
        g.addColorStop(0.2, '#09090b');
        g.addColorStop(1, '#000000');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w, p.h);

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(sx, p.y, p.w, 3);
        ctx.fillStyle = '#f59e0b';
        for(let i = 8; i < p.w - 8; i += 20){
          ctx.fillRect(sx + i, p.y, 6, 4);
        }
        break;
      }

      case 'nuclear_lab':
      case 'industrial_foundry': {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#334155');
        g.addColorStop(0.2, '#1e293b');
        g.addColorStop(1, '#0f172a');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w, p.h);

        for(let i = 0; i < p.w; i += 16){
          ctx.fillStyle = (i / 16) % 2 === 0 ? '#eab308' : '#18181b';
          ctx.fillRect(sx + i, p.y, Math.min(16, p.w - i), 5);
        }
        break;
      }

      case 'frozen_tundra': {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#38c6ff');
        g.addColorStop(0.2, '#0284c7');
        g.addColorStop(1, '#0369a1');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w, p.h);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(sx, p.y, p.w, 5);

        for(let i = 12; i < p.w - 12; i += 24){
          ctx.beginPath();
          ctx.moveTo(sx + i, p.y + p.h);
          ctx.lineTo(sx + i + 4, p.y + p.h + 8);
          ctx.lineTo(sx + i + 8, p.y + p.h);
          ctx.fill();
        }
        break;
      }

      case 'cosmic_void':
      case 'alien_hive':
      case 'neon_synthwave':
      case 'ultimate_cosmos': {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#2e1065');
        g.addColorStop(0.2, '#1e1b4b');
        g.addColorStop(1, '#0f172a');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w, p.h);

        ctx.fillStyle = '#d946ef';
        ctx.fillRect(sx, p.y, p.w, 3);
        break;
      }

      case 'sky_temple': {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#f8fafc');
        g.addColorStop(0.2, '#e2e8f0');
        g.addColorStop(1, '#94a3b8');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w, p.h);

        ctx.fillStyle = '#eab308';
        ctx.fillRect(sx, p.y, p.w, 3);
        break;
      }

      case 'doomsday_city':
      case 'godzilla_ruins':
      case 'haunted_mansion':
      default: {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#27272a');
        g.addColorStop(0.2, '#18181b');
        g.addColorStop(1, '#09090b');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w, p.h);

        ctx.fillStyle = theme === 'godzilla_ruins' ? '#00f0ff' : '#ff3d6e';
        ctx.fillRect(sx, p.y, p.w, 3);
        break;
      }
    }

    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(sx, p.y, p.w, p.h);
  }
}

function drawJumpBox(jb){
  const sx = jb.x - camX;
  if(sx+jb.w<-20 || sx>W+20) return;
  const y = jb.y + (jb.bounceY || 0);

  if(jb.hit){
    ctx.fillStyle='#3a3f52';
    ctx.fillRect(sx, y, jb.w, jb.h);
    ctx.strokeStyle='#1e2230';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx, y, jb.w, jb.h);
  } else {
    // Lucky Box - solid colors
    let bgColor = '#d4a83f';
    let icon = '?';

    if(jb.type === 'sponsor') { bgColor = '#b8355a'; icon = '📢'; }
    else if(jb.type === 'tank') { bgColor = '#2d4536'; icon = '🚀'; }
    else if(jb.type === 'fastener') { bgColor = '#2a6b94'; icon = '⚡'; }
    else if(jb.type === 'plasma') { bgColor = '#008080'; icon = '⚛'; }
    else if(jb.type === 'flamethrower') { bgColor = '#b84500'; icon = '🔥'; }
    else if(jb.type === 'shotgun') { bgColor = '#c4660f'; icon = '💥'; }
    else if(jb.type === 'minigun') { bgColor = '#6b2a8f'; icon = '⚡'; }
    else if(jb.type === 'prank_bomb') { bgColor = '#a80000'; icon = '💣'; }
    else if(jb.type === 'prank_reverse') { bgColor = '#6b0080'; icon = '🌀'; }
    else if(jb.type === 'prank_zombie') { bgColor = '#1a6a2f'; icon = '🧟'; }
    else if(jb.type === 'prank_dance') { bgColor = '#a80055'; icon = '🕺'; }
    else if(jb.type === 'prank_jumpscare_giant') { bgColor = '#330000'; icon = '👻'; }

    ctx.fillStyle = bgColor;
    ctx.fillRect(sx, y, jb.w, jb.h);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(icon, sx+jb.w/2, y+jb.h*0.74);

    ctx.strokeStyle = '#555555';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx, y, jb.w, jb.h);
  }
}

function drawSign(sign){
  const sx = sign.x - camX;
  if(sx<-150||sx>W+50) return;
  const y = GROUND_Y-70;
  ctx.fillStyle='#8a5a2a';
  ctx.fillRect(sx+18,y+20,8,50);
  ctx.fillStyle='#e8c77a';
  ctx.fillRect(sx,y,64,28);
  ctx.strokeStyle='#5c3b1a'; ctx.lineWidth=2;
  ctx.strokeRect(sx,y,64,28);
  ctx.fillStyle='#2a1a08';
  ctx.font='10px sans-serif';
  ctx.textAlign='center';
  wrapText(sign.text, sx+32, y+12, 60, 11);
}

function wrapText(text,cx,cy,maxW,lh){
  const words=text.split(' ');
  let line='', lines=[];
  for(const w of words){
    const test=line+w+' ';
    if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=w+' '; }
    else line=test;
  }
  lines.push(line);
  const startY = cy - (lines.length-1)*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l.trim(), cx, startY+i*lh));
}

function drawFakespike(f){
  const sx=f.x-camX; if(sx+f.w<0||sx>W) return;
  if(f.hit){
    ctx.fillStyle='#ffe6f0';
    ctx.beginPath();
    ctx.ellipse(sx+f.w/2, f.y+f.h/2, f.w/2, f.h*1.3, 0,0,2*Math.PI);
    ctx.fill();
    ctx.strokeStyle='#ff9fc0'; ctx.stroke();
  } else {
    ctx.fillStyle='#d8d8e0';
    const n=4;
    for(let i=0;i<n;i++){
      ctx.beginPath();
      ctx.moveTo(sx+i*(f.w/n), f.y+f.h);
      ctx.lineTo(sx+i*(f.w/n)+f.w/(2*n), f.y);
      ctx.lineTo(sx+(i+1)*(f.w/n), f.y+f.h);
      ctx.fill();
    }
  }
}

function drawSpike(s){
  const sx=s.x-camX; if(sx+s.w<0||sx>W) return;
  ctx.fillStyle='#ff3d6e';
  const n=4;
  for(let i=0;i<n;i++){
    ctx.beginPath();
    ctx.moveTo(sx+i*(s.w/n), s.y+s.h);
    ctx.lineTo(sx+i*(s.w/n)+s.w/(2*n), s.y-6);
    ctx.lineTo(sx+(i+1)*(s.w/n), s.y+s.h);
    ctx.fill();
  }
}

function drawLava(l){
  const sx = l.x - camX; if(sx + l.w < -20 || sx > W + 20) return;
  const t = state.time * 0.006;

  // Molten Lava Base
  const g = ctx.createLinearGradient(0, l.y, 0, l.y + l.h);
  g.addColorStop(0, '#ff3300');
  g.addColorStop(0.35, '#ff7700');
  g.addColorStop(0.7, '#cc1100');
  g.addColorStop(1, '#550000');
  ctx.fillStyle = g;
  ctx.fillRect(sx, l.y, l.w, l.h);

  // Animated Bubbling Top Waves
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath();
  ctx.moveTo(sx, l.y);
  for(let x = 0; x <= l.w; x += 10){
    const wave = Math.sin(t*2 + (l.x + x)*0.06) * 4;
    ctx.lineTo(sx + x, l.y + wave);
  }
  ctx.lineTo(sx + l.w, l.y + l.h);
  ctx.lineTo(sx, l.y + l.h);
  ctx.closePath();
  ctx.fill();

  // Heat Outline & Lava Bubbles
  ctx.strokeStyle = '#ffaa00';
  ctx.lineWidth = 2;
  ctx.strokeRect(sx, l.y, l.w, l.h);

  const bubbleCount = Math.floor(l.w / 35);
  for(let i = 0; i < bubbleCount; i++){
    const bx = sx + ((i * 35 + state.time * 0.05) % l.w);
    const by = l.y + 12 + Math.sin(state.time * 0.01 + i) * 8;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI*2); ctx.fill();
  }
}

function drawWater(w){
  const sx = w.x - camX; if(sx + w.w < -20 || sx > W + 20) return;
  const t = state.time * 0.005;

  // Translucent Deep Water Base
  const g = ctx.createLinearGradient(0, w.y, 0, w.y + w.h);
  g.addColorStop(0, 'rgba(0, 153, 255, 0.82)');
  g.addColorStop(0.5, 'rgba(0, 85, 204, 0.90)');
  g.addColorStop(1, 'rgba(0, 30, 90, 0.96)');
  ctx.fillStyle = g;
  ctx.fillRect(sx, w.y, w.w, w.h);

  // Water Surface Animated Foam
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.beginPath();
  ctx.moveTo(sx, w.y);
  for(let x = 0; x <= w.w; x += 10){
    const wave = Math.sin(t*1.8 + (w.x + x)*0.08) * 3;
    ctx.lineTo(sx + x, w.y + 2 + wave);
  }
  ctx.lineTo(sx + w.w, w.y + w.h);
  ctx.lineTo(sx, w.y + w.h);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#38c6ff';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(sx, w.y, w.w, w.h);
}

function drawBanana(b){
  if(b.used) return;
  const sx=b.x-camX; if(sx+b.w<0||sx>W) return;
  ctx.fillStyle='#ffd23f';
  ctx.beginPath();
  ctx.ellipse(sx+b.w/2,b.y+b.h/2, b.w/2, b.h/2, 0.5,0,2*Math.PI);
  ctx.fill();
  ctx.strokeStyle='#c99b1a'; ctx.stroke();
}

function drawCoin(c){
  if(c.taken) return;
  const sx=c.x-camX; if(sx+c.w<0||sx>W) return;
  const bob = Math.sin(state.time*0.006 + c.x)*4;
  const cx = sx + c.w/2;
  const cy = c.y + c.h/2 + bob;
  const r = c.w/2;

  ctx.save();
  // Outer golden coin border
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.arc(cx, cy, r + 2, 0, 2*Math.PI);
  ctx.fill();

  // Main Blue Character Face Coin
  ctx.fillStyle = '#3fc7ea';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, 2*Math.PI);
  ctx.fill();

  // Black Mask Across Eyes
  ctx.fillStyle = '#1a1d24';
  ctx.beginPath();
  ctx.roundRect(cx - r*0.7, cy - r*0.4, r*1.4, r*0.55, 2);
  ctx.fill();

  // White eyes
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx - r*0.35, cy - r*0.1, r*0.22, 0, 2*Math.PI);
  ctx.arc(cx + r*0.35, cy - r*0.1, r*0.22, 0, 2*Math.PI);
  ctx.fill();

  // Pupils
  ctx.fillStyle = '#111111';
  ctx.beginPath();
  ctx.arc(cx - r*0.3, cy - r*0.1, r*0.1, 0, 2*Math.PI);
  ctx.arc(cx + r*0.4, cy - r*0.1, r*0.1, 0, 2*Math.PI);
  ctx.fill();

  // Cyan Lens Glow
  ctx.fillStyle = '#38c6ff';
  ctx.beginPath();
  ctx.arc(cx - r*0.35, cy - r*0.1, r*0.14, 0, 2*Math.PI);
  ctx.arc(cx + r*0.35, cy - r*0.1, r*0.14, 0, 2*Math.PI);
  ctx.fill();

  ctx.restore();
}

function drawBell(b){
  if(b.taken) return;
  const sx=b.x-camX; if(sx+b.w<0||sx>W) return;
  const bob = Math.sin(state.time*0.005 + b.x)*4;
  ctx.font='24px sans-serif';

}

function drawBush(b){

  ctx.arc(sx+b.w*0.85,b.y+b.h*0.65,b.w*0.3,0,2*Math.PI);

}

function drawFlag(f){
  const sx=f.x-camX; if(sx+f.w<0||sx>W) return;
  ctx.fillStyle='#cfcfcf';
  ctx.fillRect(sx+f.w/2-2, f.y, 4, f.h);
  ctx.fillStyle='#ff3d6e';
  ctx.beginPath();
  ctx.moveTo(sx+f.w/2+2, f.y+6);
  ctx.lineTo(sx+f.w/2+46, f.y+16);
  ctx.lineTo(sx+f.w/2+2, f.y+30);
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.font='bold 10px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('FINISH', sx+f.w/2+24, f.y+19);
}

function drawZombie(z){
  const sx = z.x - camX;
  if(sx+z.w < -60 || sx > W + 60) return;
  
  ctx.save();
  ctx.translate(sx + z.w/2, z.y + z.h/2);
  ctx.scale(z.facing * z.size, z.size);
  
  const anim = (z.animT || 0) * 0.05;
  const wobble = Math.sin(anim) * 3;
  const legCycle = Math.sin(anim * 1.5) * 8;
  const isBoss = z.isBoss;
  const isRunner = z.speed > 2.0;

  // 1. Aura & Motion Trail for Special Zombies
  if(isBoss) {
    ctx.save();
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 18;
    ctx.fillStyle = 'rgba(255, 0, 85, 0.2)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 28, 36, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  } else if(isRunner) {
    ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';
    ctx.beginPath();
    ctx.ellipse(-z.facing * 12, wobble, 16, 22, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // Zombie Skin & Rags Colors
  const fleshColor = isBoss ? '#1e4d2b' : (isRunner ? '#2f7a43' : '#326b38');
  const ragColor   = isBoss ? '#3b1c1c' : (isRunner ? '#1e293b' : '#292524');
  const pantColor  = isBoss ? '#18181b' : (isRunner ? '#0f172a' : '#1c1917');

  // 2. Tattered Legs (with walking swing & exposed bone/knee patch)
  ctx.fillStyle = pantColor;
  // Left Leg
  ctx.save();
  ctx.translate(-8, 12 + wobble);
  ctx.rotate(legCycle * 0.04);
  ctx.fillRect(-5, 0, 10, 22);
  // Torn knee hole showing rotten flesh/bone
  ctx.fillStyle = fleshColor;
  ctx.fillRect(-3, 10, 6, 4);
  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(-1, 11, 2, 2);
  ctx.restore();

  // Right Leg
  ctx.save();
  ctx.translate(6, 12 + wobble);
  ctx.rotate(-legCycle * 0.04);
  ctx.fillStyle = pantColor;
  ctx.fillRect(-5, 0, 10, 22);
  ctx.restore();

  // 3. Torso / Tattered Ripped Clothes
  ctx.fillStyle = ragColor;
  ctx.beginPath();
  ctx.moveTo(-16, -14 + wobble);
  ctx.lineTo(16, -14 + wobble);
  ctx.lineTo(14, 14 + wobble);
  // Ripped torn hem bottom
  ctx.lineTo(8, 18 + wobble);
  ctx.lineTo(2, 12 + wobble);
  ctx.lineTo(-4, 17 + wobble);
  ctx.lineTo(-10, 13 + wobble);
  ctx.lineTo(-14, 14 + wobble);
  ctx.closePath();
  ctx.fill();

  // Exposed Ribcage / Blood stain on chest
  ctx.fillStyle = '#ff0033';
  ctx.beginPath(); ctx.ellipse(2, -2 + wobble, 5, 7, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#cbd5e1';
  ctx.fillRect(-1, -6 + wobble, 5, 2);
  ctx.fillRect(0, -3 + wobble, 4, 2);

  // 4. Boss Armor Accessories (Spiked Metal Shoulder Pads)
  if(isBoss) {
    ctx.fillStyle = '#334155';
    ctx.beginPath();
    ctx.moveTo(-18, -14 + wobble);
    ctx.lineTo(-26, -24 + wobble);
    ctx.lineTo(-12, -18 + wobble);
    ctx.fill();
    ctx.strokeStyle = '#ff0055';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // 5. Outstretched Clawing Arms with Sharp Claws
  ctx.fillStyle = fleshColor;
  // Back Arm
  ctx.save();
  ctx.translate(-14, -8 + wobble);
  ctx.rotate(-0.4 + Math.sin(anim)*0.2);
  ctx.fillRect(0, -4, 18, 7);
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(18, -4, 4, 2);
  ctx.fillRect(18, -1, 4, 2);
  ctx.restore();

  // Front Arm (Reaching forward menacingly)
  ctx.save();
  ctx.translate(8, -8 + wobble);
  ctx.rotate(-0.2 + Math.cos(anim)*0.3);
  ctx.fillStyle = fleshColor;
  ctx.fillRect(0, -4, 22, 8);
  ctx.fillStyle = '#111827';
  ctx.beginPath();
  ctx.moveTo(22, -4); ctx.lineTo(27, -6); ctx.lineTo(22, -2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(22, -1); ctx.lineTo(28, -1); ctx.lineTo(22, 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(22, 2); ctx.lineTo(26, 4); ctx.lineTo(22, 4); ctx.fill();
  ctx.restore();

  // 6. Detailed Head & Skull
  ctx.fillStyle = fleshColor;
  ctx.beginPath();
  ctx.ellipse(0, -22 + wobble, 16, 17, 0, 0, Math.PI*2);
  ctx.fill();

  // Rotten Brain / Skull Patch on top right
  ctx.fillStyle = '#dc2626';
  ctx.beginPath();
  ctx.arc(6, -30 + wobble, 6, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#f87171';
  ctx.beginPath(); ctx.arc(5, -31 + wobble, 3, 0, Math.PI*2); ctx.fill();

  // Boss Spiked Horns
  if(isBoss) {
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.moveTo(-8, -34 + wobble); ctx.lineTo(-14, -48 + wobble); ctx.lineTo(-2, -36 + wobble);
    ctx.moveTo(2, -34 + wobble); ctx.lineTo(8, -48 + wobble); ctx.lineTo(12, -34 + wobble);
    ctx.fill();
  }

  // 7. Glowing Evil Eyes with Halo
  ctx.save();
  ctx.shadowColor = isBoss ? '#ff0000' : (isRunner ? '#00ffcc' : '#ff0033');
  ctx.shadowBlur = 10;
  ctx.fillStyle = isBoss ? '#ff0000' : (isRunner ? '#00ffcc' : '#ff1100');
  
  ctx.beginPath(); ctx.arc(-6, -24 + wobble, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -24 + wobble, 4.5, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#ffff00';
  ctx.beginPath(); ctx.arc(-5, -24 + wobble, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, -24 + wobble, 2, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // 8. Open Mouth with Jagged Fangs & Dripping Slime
  ctx.fillStyle = '#09090b';
  ctx.beginPath();
  ctx.ellipse(2, -12 + wobble, 8, 6, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#fef08a';
  ctx.beginPath(); ctx.moveTo(-3, -17 + wobble); ctx.lineTo(-1, -12 + wobble); ctx.lineTo(1, -17 + wobble); ctx.fill();
  ctx.beginPath(); ctx.moveTo(3, -17 + wobble); ctx.lineTo(5, -12 + wobble); ctx.lineTo(7, -17 + wobble); ctx.fill();

  ctx.fillStyle = isBoss ? '#ff0033' : '#22c55e';
  ctx.beginPath();
  ctx.arc(3, -6 + wobble + Math.sin(anim*3)*2, 2, 0, Math.PI*2);
  ctx.fill();

  // 9. Sleek Glass Health Bar Above Head
  const hpRatio = Math.max(0, Math.min(1, z.health / z.maxHealth));
  const barW = isBoss ? 52 : 36;
  const barH = isBoss ? 8 : 6;
  const barX = -barW / 2;
  const barY = -48 + wobble;

  ctx.fillStyle = 'rgba(10, 15, 26, 0.82)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(barX, barY, barW, barH, 3);
  else ctx.fillRect(barX, barY, barW, barH);
  ctx.fill();

  const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
  grad.addColorStop(0, '#ef4444');
  grad.addColorStop(1, isBoss ? '#a855f7' : '#f59e0b');

  ctx.fillStyle = grad;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(barX, barY, barW * hpRatio, barH, 3);
  else ctx.fillRect(barX, barY, barW * hpRatio, barH);
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barW, barH);

  if(isBoss) {
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff3d6e';
    ctx.fillText('👑 BOSS', 0, barY - 4);
  }

  ctx.restore();
}

function drawBullet(b){
  const sx = b.x - camX;
  if(sx<0 || sx>W) return;
  ctx.fillStyle = b.color || '#ffd23f';
  ctx.beginPath();
  ctx.arc(sx, b.y, 6, 0, 2*Math.PI);
  ctx.fill();
}

function drawParticles(){
  for(const p of particles){
    const sx = p.x - camX;
    if(sx < -50 || sx > W + 50) continue;
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(sx, p.y, p.size, 0, 2*Math.PI);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for(const sc of shellCasings){
    const sx = sc.x - camX;
    ctx.save();
    ctx.translate(sx, sc.y);
    ctx.rotate(sc.rot);
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(-2, -1, 5, 2);
    ctx.restore();
  }

  for(const ft of floatingTexts){
    const sx = ft.x - camX;
    ctx.save();
    ctx.font = 'bold 18px sans-serif';
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = ft.life / 60;
    ctx.fillText(ft.text, sx, ft.y);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ---------- Detailed Gun Renderer ----------
function drawDetailedGun(ctx, mode = 'pistol', opts = {}) {
  const scale = opts.scale || 1;
  const recoil = opts.recoil || 0;
  const time = opts.time || (state ? state.time : 0);
  const showLaser = opts.showLaser !== false;
  const isFiring = opts.isFiring || false;

  ctx.save();
  ctx.scale(scale, scale);
  ctx.translate(-recoil, 0);

  if (mode === 'pistol') {
    // 🔫 Plasma Pistol (Ultra-Detailed Tactical Pistol)
    // Textured Carbon Fiber Pistol Grip
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.moveTo(-4, 2); ctx.lineTo(-12, 18); ctx.lineTo(-3, 20); ctx.lineTo(5, 5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#38c6ff'; ctx.lineWidth = 1; ctx.stroke();
    // Grip Ribs
    ctx.fillStyle = '#334155';
    for(let gy = 6; gy <= 16; gy += 4) {
      ctx.fillRect(-9 + gy*0.2, gy, 6, 2);
    }

    // Lower Frame & Trigger Guard
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(-6, -2, 28, 8);
    ctx.strokeStyle = '#475569'; ctx.lineWidth = 1; ctx.strokeRect(-6, -2, 28, 8);
    // Trigger
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(2, 6, 4, 0, Math.PI); ctx.stroke();

    // Upper Slide (Dual-Tone Metallic)
    const slideGrad = ctx.createLinearGradient(0, -8, 0, 0);
    slideGrad.addColorStop(0, '#64748b'); slideGrad.addColorStop(0.4, '#334155'); slideGrad.addColorStop(1, '#0f172a');
    ctx.fillStyle = slideGrad;
    ctx.fillRect(-8, -8, 34, 8);
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.strokeRect(-8, -8, 34, 8);

    // Serrations on back slide
    ctx.fillStyle = '#0f172a';
    for(let sx = -6; sx <= 0; sx += 2) { ctx.fillRect(sx, -7, 1, 6); }

    // Ejection Port with Brass Cartridge detail
    ctx.fillStyle = '#1e293b'; ctx.fillRect(6, -7, 8, 4);
    ctx.fillStyle = '#eab308'; ctx.fillRect(8, -6, 4, 2);

    // Plasma Core Conduit Tube
    ctx.fillStyle = '#0284c7'; ctx.fillRect(14, -5, 12, 3);
    ctx.fillStyle = '#38c6ff'; ctx.fillRect(16, -4, 8, 1);

    // Tactical Under-Barrel Laser Module
    ctx.fillStyle = '#090d16'; ctx.fillRect(10, 0, 12, 5);
    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(22, 2.5, 1.5, 0, Math.PI*2); ctx.fill();

    // Holo-Sight Optic on Top Rail
    ctx.fillStyle = '#0f172a'; ctx.fillRect(2, -12, 10, 4);
    ctx.strokeStyle = '#38c6ff'; ctx.lineWidth = 1; ctx.strokeRect(2, -12, 10, 4);
    ctx.fillStyle = 'rgba(56, 198, 255, 0.7)'; ctx.fillRect(4, -11, 6, 2);

    // Extended Threaded Muzzle Brake
    ctx.fillStyle = '#0f172a'; ctx.fillRect(26, -6, 8, 5);
    ctx.fillStyle = '#38c6ff'; ctx.fillRect(32, -7, 2, 7);

    if (showLaser) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 61, 110, 0.85)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(34, -3.5); ctx.lineTo(180, -3.5); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(180, -3.5, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    if (isFiring) {
      ctx.save();
      ctx.fillStyle = '#38c6ff'; ctx.shadowColor = '#38c6ff'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(36, -3.5, 8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

  } else if (mode === 'shotgun') {
    // 💥 Heavy Tactical Shotgun (Dual Barrel & Shell Saddle)
    // Polymer Stock with Rubber Buttpad
    ctx.fillStyle = '#1c1917';
    ctx.beginPath();
    ctx.moveTo(-10, -2); ctx.lineTo(-24, 6); ctx.lineTo(-24, 16); ctx.lineTo(-14, 18); ctx.lineTo(-6, 10);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#dc2626'; ctx.fillRect(-24, 6, 3, 10); // Red recoil pad accent

    // Main Steel Receiver Box
    const recGrad = ctx.createLinearGradient(0, -8, 0, 8);
    recGrad.addColorStop(0, '#44403c'); recGrad.addColorStop(0.5, '#27272a'); recGrad.addColorStop(1, '#18181b');
    ctx.fillStyle = recGrad;
    ctx.fillRect(-6, -8, 28, 16);
    ctx.strokeStyle = '#71717a'; ctx.lineWidth = 1.2; ctx.strokeRect(-6, -8, 28, 16);

    // Ejection Door with Brass Shell
    ctx.fillStyle = '#09090b'; ctx.fillRect(4, -6, 10, 6);
    ctx.fillStyle = '#eab308'; ctx.fillRect(6, -5, 6, 4);

    // Red Ammo Shell Saddle Bracket Mounted on Side (4 Shells)
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = '#dc2626'; ctx.fillRect(-2 + i * 5, -12, 4, 4);
      ctx.fillStyle = '#eab308'; ctx.fillRect(-2 + i * 5, -8, 4, 1.5);
    }

    // Ribbed Pump-Action Forearm Grip
    ctx.fillStyle = '#3f3f46'; ctx.fillRect(18, 2, 16, 7);
    ctx.fillStyle = '#18181b';
    for (let x = 20; x <= 30; x += 3) { ctx.fillRect(x, 2, 1.5, 7); }

    // Dual Heavy Steel Barrels
    ctx.fillStyle = '#52525b';
    ctx.fillRect(22, -7, 24, 5); // Upper barrel
    ctx.fillRect(22, -1, 24, 5); // Lower barrel

    // Heat Vents on Upper Barrel Shroud
    ctx.fillStyle = '#18181b';
    for (let hx = 24; x = hx <= 42; hx += 4) { ctx.fillRect(hx, -6, 2, 3); }

    // Choke Muzzle Compensators
    ctx.fillStyle = '#27272a';
    ctx.fillRect(46, -8, 5, 7);
    ctx.fillRect(46, -2, 5, 7);

    // Fiber-optic Front Sight
    ctx.fillStyle = '#22c55e'; ctx.fillRect(44, -10, 3, 2);

    if (showLaser) {
      ctx.strokeStyle = 'rgba(239, 68, 68, 0.8)';
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(51, -4.5); ctx.lineTo(180, -4.5); ctx.stroke();
    }

    if (isFiring) {
      ctx.save();
      ctx.fillStyle = '#ff7700'; ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.arc(52, -4.5, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffff55'; ctx.beginPath(); ctx.arc(52, -4.5, 6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

  } else if (mode === 'triple') {
    // 🔥 Triple Beam Laser Rifle (High-Tech Tri-Barrel)
    // Main Sci-fi Receiver Body
    const mainGrad = ctx.createLinearGradient(0, -9, 0, 9);
    mainGrad.addColorStop(0, '#1e293b'); mainGrad.addColorStop(0.5, '#0f172a'); mainGrad.addColorStop(1, '#020617');
    ctx.fillStyle = mainGrad;
    ctx.fillRect(-10, -8, 28, 16);
    ctx.strokeStyle = '#38c6ff'; ctx.lineWidth = 1.2; ctx.strokeRect(-10, -8, 28, 16);

    // Extended Pulsing Energy Cartridge Magazine
    ctx.fillStyle = '#0f172a'; ctx.fillRect(-2, 8, 10, 12);
    ctx.fillStyle = '#0284c7'; ctx.fillRect(0, 10, 6, 8);
    const pulseGlow = Math.sin(time * 0.01) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(56, 198, 255, ${pulseGlow})`; ctx.fillRect(1, 11, 4, 6);

    // Holographic Target Scope on Upper Rail
    ctx.fillStyle = '#1e293b'; ctx.fillRect(2, -14, 14, 5);
    ctx.strokeStyle = '#ff3d6e'; ctx.lineWidth = 1; ctx.strokeRect(2, -14, 14, 5);
    ctx.fillStyle = '#ff3d6e'; ctx.beginPath(); ctx.arc(9, -11.5, 2, 0, Math.PI*2); ctx.fill();

    // 3 Triangular Barrel Coils Assembly
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(18, -10, 24, 4); // Top barrel
    ctx.fillRect(18, -3, 24, 4);  // Middle barrel
    ctx.fillRect(18, 4, 24, 4);   // Bottom barrel

    // Neon Cyan Energy Conduit Rings
    for (let bx = 22; bx <= 38; bx += 6) {
      ctx.fillStyle = '#38c6ff';
      ctx.fillRect(bx, -11, 2, 20);
    }

    // Heavy Muzzle Emitters
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(42, -11, 4, 6);
    ctx.fillRect(42, -4, 4, 6);
    ctx.fillRect(42, 3, 4, 6);

    if (showLaser) {
      ctx.strokeStyle = 'rgba(56, 198, 255, 0.75)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(46, -8); ctx.lineTo(180, -12);
      ctx.moveTo(46, -1); ctx.lineTo(180, -1);
      ctx.moveTo(46, 5); ctx.lineTo(180, 10);
      ctx.stroke();
    }

    if (isFiring) {
      ctx.save();
      ctx.fillStyle = '#38c6ff'; ctx.shadowColor = '#ff3d6e'; ctx.shadowBlur = 15;
      ctx.beginPath(); ctx.arc(48, -8, 6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(48, -1, 6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(48, 5, 6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

  } else if (mode === 'plasma') {
    // ⚛ Plasma Cannon (Animated Plasma Core & Copper Field Coils)
    // Main Frame
    ctx.fillStyle = '#1e293b'; ctx.fillRect(-14, -9, 16, 18);
    ctx.fillStyle = '#0f172a'; ctx.fillRect(2, -11, 26, 22);
    ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 1.5; ctx.strokeRect(2, -11, 26, 22);

    // Glass Containment Cylinder housing Swirling Plasma Orb
    ctx.save();
    ctx.fillStyle = 'rgba(0, 255, 204, 0.25)';
    ctx.beginPath(); ctx.ellipse(15, 0, 10, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 1; ctx.stroke();

    // Swirling Internal Plasma Orb
    const orbX = 15 + Math.sin(time * 0.008) * 4;
    const orbY = Math.cos(time * 0.008) * 3;
    ctx.fillStyle = '#00ffcc'; ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(orbX, orbY, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Copper Field Coils wrapped around outer barrel
    for (let cxPos = 28; cxPos <= 38; cxPos += 4) {
      ctx.fillStyle = '#b45309'; ctx.fillRect(cxPos, -9, 2.5, 18);
      ctx.fillStyle = '#f59e0b'; ctx.fillRect(cxPos + 0.5, -9, 1, 18);
    }

    // Heavy Front Plasma Nozzle Funnel
    ctx.fillStyle = '#0f172a'; ctx.fillRect(40, -7, 8, 14);
    ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 1; ctx.strokeRect(40, -7, 8, 14);

    if (showLaser) {
      ctx.strokeStyle = 'rgba(0, 255, 204, 0.7)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(48, 0); ctx.lineTo(180, 0); ctx.stroke();
    }

    if (isFiring) {
      ctx.save();
      ctx.fillStyle = '#00ffcc'; ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 22;
      ctx.beginPath(); ctx.arc(50, 0, 10, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

  } else if (mode === 'minigun') {
    // ⚡ Vulcan Heavy Minigun (6 Rotating Barrels & Belt Feeder)
    // Motor Housing Frame
    ctx.fillStyle = '#111827'; ctx.fillRect(-12, -9, 26, 18);
    ctx.strokeStyle = '#38c6ff'; ctx.lineWidth = 1.2; ctx.strokeRect(-12, -9, 26, 18);

    // Ammo Drum Container attached below frame
    ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(-2, 11, 8, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 1; ctx.stroke();

    // Flexible Ammo Belt Feed
    ctx.fillStyle = '#eab308';
    for (let ab = -8; ab <= 2; ab += 3) { ctx.fillRect(ab, 5, 2, 5); }

    // Spinning Barrel Support Disk
    const rot = (time * 0.08) % 6;
    ctx.fillStyle = '#374151'; ctx.fillRect(14, -10, 6, 20);

    // 6 Rotating Metallic Barrels
    ctx.fillStyle = '#9ca3af';
    ctx.fillRect(20, -9 + rot * 0.2, 26, 2.5);
    ctx.fillRect(20, -5 - rot * 0.2, 26, 2.5);
    ctx.fillRect(20, -1 + rot * 0.1, 26, 2.5);
    ctx.fillRect(20, 3 - rot * 0.1, 26, 2.5);
    ctx.fillRect(20, 7 + rot * 0.2, 26, 2.5);

    // Front Muzzle Clamp Ring
    ctx.fillStyle = '#1f2937'; ctx.fillRect(46, -10, 4, 20);

    if (showLaser) {
      ctx.strokeStyle = 'rgba(56, 198, 255, 0.65)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(50, 0); ctx.lineTo(180, 0); ctx.stroke();
    }

    if (isFiring) {
      ctx.save();
      ctx.fillStyle = '#ffd23f'; ctx.shadowColor = '#38c6ff'; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(52, (Math.random() - 0.5) * 8, 9, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

  } else if (mode === 'flamethrower') {
    // 🔥 Hellfire Flamethrower (Dual Fuel Canisters & Ignition Pilot Light)
    // Main Body Housing
    ctx.fillStyle = '#271c19'; ctx.fillRect(-8, -8, 22, 16);

    // Dual High-Pressure Red Fuel Tanks Mounted with Straps
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(-6, 8, 8, 12);  // Tank 1
    ctx.fillRect(3, 8, 8, 12);   // Tank 2
    ctx.fillStyle = '#f59e0b'; ctx.fillRect(-6, 12, 17, 2); // Metal Mounting Strap
    ctx.fillStyle = '#1c1917'; ctx.beginPath(); ctx.arc(-2, 10, 2, 0, Math.PI*2); ctx.fill(); // Pressure Gauge

    // Long Burner Tube wrapped with Heat-Resistant Insulation
    ctx.fillStyle = '#44403c'; ctx.fillRect(14, -6, 20, 12);
    ctx.fillStyle = '#78350f'; ctx.fillRect(20, -6, 3, 12); ctx.fillRect(28, -6, 3, 12); // Insulation wraps

    // Flared Heat Shield Cone Nozzle
    ctx.fillStyle = '#1c1917';
    ctx.beginPath();
    ctx.moveTo(34, -8); ctx.lineTo(42, -10); ctx.lineTo(42, 10); ctx.lineTo(34, 8);
    ctx.closePath(); ctx.fill();

    // Ignition Pilot Light Flame Tip
    ctx.save();
    const flameSize = 3 + Math.sin(time * 0.03) * 1.5;
    ctx.fillStyle = '#f97316'; ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(44, 0, flameSize, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (isFiring) {
      ctx.save();
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#ef4444' : '#eab308';
        ctx.shadowColor = '#f97316'; ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.arc(46 + i * 12, (Math.random() - 0.5) * 8, 7 + i * 3.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }

  ctx.restore();
}

// ---------- Dino Character Drawing ----------
function drawPlayer(){
  const sx = player.x - camX;
  const sy = player.y;

  // Render War Tank if in tank mode
  if(player.weaponMode === 'tank'){
    ctx.save();
    ctx.translate(sx + player.w/2, sy + player.h/2 + 4);
    ctx.scale(player.facing, 1);

    if(player.invuln>0 && Math.floor(player.invuln/4)%2===0){
      ctx.globalAlpha = 0.5;
    }

    const runCycle = Math.abs(player.vx) > 0.5 ? Math.sin(player.animT * 0.08) * 3 : 0;

    // Dark Tread Wheels & Caterpillar Tracks
    ctx.fillStyle = '#1c2421';
    ctx.fillRect(-42, 10, 84, 20);

    // Moving Wheels inside track
    ctx.fillStyle = '#3a4742';
    for(let wx = -32; wx <= 32; wx += 16){
      ctx.beginPath();
      ctx.arc(wx + runCycle, 20, 7, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#111';
      ctx.stroke();
    }

    // Steel Armored Body (Camo Green)
    ctx.fillStyle = '#2d4536';
    ctx.fillRect(-38, -10, 76, 22);
    ctx.fillStyle = '#1e3025';
    ctx.fillRect(-30, -18, 60, 10);

    // Red Star / CODEZERO Emblem
    ctx.fillStyle = '#ff3d6e';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('★ CODEZERO', 0, 4);

    // Turret & Big Heavy Cannon Barrel
    ctx.save();
    ctx.translate(10 - player.gunRecoil, -14);
    ctx.fillStyle = '#1e3025';
    ctx.fillRect(0, -7, 48, 14);
    ctx.fillStyle = '#111814';
    ctx.fillRect(48, -9, 9, 18); // Heavy Muzzle Brake

    // Laser sight
    ctx.strokeStyle = 'rgba(255, 61, 110, 0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(57, 0);
    ctx.lineTo(240, 0);
    ctx.stroke();
    ctx.restore();

    // Dino head poking out wearing military helmet
    ctx.fillStyle = '#3fc7ea';
    ctx.beginPath(); ctx.ellipse(-10, -22, 12, 12, 0, 0, Math.PI*2); ctx.fill();

    // Military Helmet
    ctx.fillStyle = '#223829';
    ctx.beginPath(); ctx.ellipse(-10, -28, 14, 8, 0, 0, Math.PI*2); ctx.fill();

    // Eyes & Mask
    ctx.fillStyle = '#0d2436';
    ctx.fillRect(-22, -26, 24, 6);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-14, -23, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-6, -23, 2, 0, Math.PI*2); ctx.fill();

    ctx.restore();

    // Floating Speech Bubble if falling
    if(player.isFalling){
      ctx.save();
      const bw = 200, bh = 42;
      const bx = sx + player.w/2 - bw/2;
      const by = sy - 65;

      ctx.shadowColor = '#ff3d6e';
      ctx.shadowBlur = 12;

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 10);
      else ctx.fillRect(bx, by, bw, bh);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ff3d6e';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(sx + player.w/2 - 10, by + bh);
      ctx.lineTo(sx + player.w/2, by + bh + 12);
      ctx.lineTo(sx + player.w/2 + 10, by + bh);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#ff3d6e';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#ff3d6e';
      ctx.font = 'bold 17px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ადიოს მუჩაჩოოსსსს! 🗣️', bx + bw/2, by + 27);
      ctx.restore();
    }
    return;
  }

  ctx.save();
  ctx.translate(sx+player.w/2, sy+player.h/2);

  if(player.isFalling){
    ctx.rotate(player.fallRotation);
  } else {
    ctx.scale(player.facing, 1);
  }

  const running = Math.abs(player.vx)>0.5 && player.onGround;
  const runCycle = running ? Math.sin(player.animT*0.03)*8 : 0;
  const legCycle = running ? Math.sin(player.animT*0.03)*12 : 0;

  if(player.invuln>0 && Math.floor(player.invuln/4)%2===0){
    ctx.globalAlpha = 0.4;
  }

  // Skin styling configuration
  const skin = state.equippedSkin || 'classic';
  let legsColor = '#8b5cf6';
  let bodyColor = '#ff3d6e';
  let headColor = '#3fc7ea';
  let maskColor = '#0d2436';
  let eyeColor  = '#eaffff';

  if(skin === 'gold'){
    legsColor = '#b8860b';
    bodyColor = '#ffd23f';
    headColor = '#ffe066';
    maskColor = '#222222';
    eyeColor  = '#ffffff';
  } else if(skin === 'lasha'){
    legsColor = '#111111';
    bodyColor = '#111111';
    headColor = '#ffffff';
    maskColor = '#000000';
    eyeColor  = '#000000';
  } else if(skin === 'cyber'){
    legsColor = '#7000ff';
    bodyColor = '#ff00aa';
    headColor = '#00ffcc';
    maskColor = '#0d001a';
    eyeColor  = '#00ffff';
  } else if(skin === 'zombie'){
    legsColor = '#1b4d1b';
    bodyColor = '#2e8b57';
    headColor = '#32cd32';
    maskColor = '#0a1a0a';
    eyeColor  = '#ff0000';
  } else if(skin === 'dragon'){
    legsColor = '#880000';
    bodyColor = '#cc1100';
    headColor = '#ff3300';
    maskColor = '#330000';
    eyeColor  = '#ffff00';
  } else if(skin === 'godzilla'){
    legsColor = '#0f172a';
    bodyColor = '#1e293b';
    headColor = '#334155';
    maskColor = '#020617';
    eyeColor  = '#00f0ff';
  }

  // Special Back Spines for Godzilla skin
  if(skin === 'godzilla'){
    ctx.save();
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(-16, -10); ctx.lineTo(-26, -16); ctx.lineTo(-14, -2);
    ctx.moveTo(-14, 4); ctx.lineTo(-24, 0); ctx.lineTo(-12, 12);
    ctx.fill();
    ctx.restore();
  }

  // Legs with dynamic running leg-swing
  ctx.fillStyle = legsColor;
  ctx.save();
  ctx.translate(-8, player.h*0.18 + runCycle);
  ctx.rotate(legCycle*0.05);
  ctx.fillRect(-4, 0, 8, 18);
  ctx.restore();

  ctx.save();
  ctx.translate(4, player.h*0.18 - runCycle);
  ctx.rotate(-legCycle*0.05);
  ctx.fillRect(-4, 0, 8, 18);
  ctx.restore();

  // Body (Shirt / Jacket / Armor)
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.moveTo(-15, player.h*0.18);
  ctx.lineTo(-17,-8);
  ctx.quadraticCurveTo(0,-18,17,-8);
  ctx.lineTo(15, player.h*0.18);
  ctx.closePath();
  ctx.fill();

  // Left Arm & Hand (Slow, natural, realistic motion)
  const armSwing = running 
    ? Math.sin(player.animT * 0.008) * 0.25 
    : Math.sin(state.time * 0.002) * 0.05;

  ctx.save();
  ctx.translate(-13, -3); // Shoulder joint
  ctx.rotate(armSwing);
  ctx.fillStyle = bodyColor;
  ctx.fillRect(-3, 0, 7, 14); // Upper sleeve
  // Forearm & Hand Fist
  ctx.fillStyle = (skin === 'gold' || skin === 'cyber' || skin === 'zombie') ? headColor : '#fcd34d';
  ctx.fillRect(-2.5, 12, 6, 6);
  ctx.beginPath();
  ctx.arc(0.5, 18, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Right arm holding Detailed Weapon
  ctx.save();
  ctx.translate(6, -2);
  drawDetailedGun(ctx, player.weaponMode || 'pistol', {
    scale: 0.9,
    recoil: player.gunRecoil,
    time: state.time,
    showLaser: true
  });
  ctx.restore();

  // Head
  if(skin === 'lasha'){
    ctx.save();
    // Wild Black Hair/Scribbles on sides
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    // Left hair scribbles
    ctx.moveTo(-14, -24); ctx.lineTo(-25, -26); ctx.lineTo(-18, -21); ctx.lineTo(-27, -17);
    // Right hair scribbles
    ctx.moveTo(14, -24); ctx.lineTo(25, -26); ctx.lineTo(18, -21); ctx.lineTo(27, -17);
    ctx.stroke();

    // White Square Paper Face
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(-14, -35, 28, 27, 3);
    else ctx.fillRect(-14, -35, 28, 27);
    ctx.fill();
    ctx.stroke();

    // X X Eyes
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    // Left X
    ctx.moveTo(-9, -29); ctx.lineTo(-3, -21);
    ctx.moveTo(-3, -29); ctx.lineTo(-9, -21);
    // Right X
    ctx.moveTo(3, -29); ctx.lineTo(9, -21);
    ctx.moveTo(9, -29); ctx.lineTo(3, -21);
    ctx.stroke();

    // Smile
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(0, -18, 5, 0.15*Math.PI, 0.85*Math.PI);
    ctx.stroke();
    ctx.restore();
  } else {
    ctx.fillStyle = headColor;
    ctx.beginPath();
    ctx.ellipse(0,-22,14,15,0,0,2*Math.PI);
    ctx.fill();

    // Mask Band / Visor
    ctx.fillStyle = maskColor;
    ctx.fillRect(-14,-28,28,8);

    // Cyber Visor Glow
    if(skin === 'cyber'){
      ctx.save();
      ctx.fillStyle = '#00f0ff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 8;
      ctx.fillRect(-12, -26, 24, 4);
      ctx.restore();
    }

    // Dragon Horns
    if(skin === 'dragon'){
      ctx.save();
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      ctx.moveTo(-8, -30); ctx.lineTo(-16, -42); ctx.lineTo(-3, -33);
      ctx.moveTo(8, -30); ctx.lineTo(16, -42); ctx.lineTo(3, -33);
      ctx.fill();
      ctx.restore();
    }

    // Golden Ninja Crown
    if(skin === 'gold'){
      ctx.save();
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      ctx.moveTo(-10, -32); ctx.lineTo(-5, -42); ctx.lineTo(0, -34); ctx.lineTo(5, -42); ctx.lineTo(10, -32);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ff0055';
      ctx.beginPath(); ctx.arc(0, -36, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // Eyes
    ctx.fillStyle = eyeColor;
    ctx.beginPath(); ctx.ellipse(-5,-22,3.8,3,0,0,2*Math.PI); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5,-22,3.8,3,0,0,2*Math.PI); ctx.fill();
    ctx.fillStyle='#0b0e14';
    ctx.beginPath(); ctx.arc(-4,-22,1.8,0,2*Math.PI); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-22,1.8,0,2*Math.PI); ctx.fill();

    // Mouth
    ctx.fillStyle='#0b0e14';
    ctx.beginPath(); ctx.ellipse(0,-14,5,4,0,0,2*Math.PI); ctx.fill();
  }

  ctx.restore();

  // Floating Speech Bubble for "ადიოს მუჩაჩოოსსსს"
  if(player.isFalling){
    ctx.save();
    const bw = 200, bh = 42;
    const bx = sx + player.w/2 - bw/2;
    const by = sy - 65;

    ctx.shadowColor = '#ff3d6e';
    ctx.shadowBlur = 12;

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 10);
    else ctx.fillRect(bx, by, bw, bh);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ff3d6e';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(sx + player.w/2 - 10, by + bh);
    ctx.lineTo(sx + player.w/2, by + bh + 12);
    ctx.lineTo(sx + player.w/2 + 10, by + bh);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#ff3d6e';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#ff3d6e';
    ctx.font = 'bold 17px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ადიოს მუჩაჩოოსსსს! 🗣️', bx + bw/2, by + 27);
    ctx.restore();
  }
}

  const t = state.jumpscareTimer;
  ctx.save();
  ctx.globalAlpha = Math.min(1, t/15);
  ctx.fillStyle='#ff0033';
  ctx.font='bold 160px sans-serif';
  ctx.textAlign='center';
  const icon = state.jumpscareType === 'demon' ? '👹' : '💀';

}

function drawCityBuildings(){
  if(!level.isGodzillaLevel) return;
  for(const b of cityBuildings){
    const sx = b.x - camX;
    if(sx + b.w < -100 || sx > W + 100) continue;

    if(b.destroyed){
      // Crumbling rubble & burning embers
      ctx.fillStyle = '#1a121c';
      ctx.fillRect(sx, b.y + b.h - 40, b.w, 40);
      ctx.fillStyle = '#2b1d2c';
      ctx.fillRect(sx + 20, b.y + b.h - 60, b.w - 40, 20);

      // Fire & smoke
      const fTime = state.time * 0.01;
      ctx.fillStyle = Math.sin(fTime + b.x) > 0 ? '#ff4400' : '#ffaa00';
      ctx.beginPath();
      ctx.arc(sx + b.w/2, b.y + b.h - 50, 22, 0, Math.PI*2);
      ctx.fill();
    } else {
      // Intact skyscraper
      ctx.fillStyle = '#0e1626';
      ctx.fillRect(sx, b.y, b.w, b.h);
      ctx.strokeStyle = '#38c6ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(sx, b.y, b.w, b.h);

      // Lit Windows grid
      ctx.fillStyle = '#ffd23f';
      for(let wx = sx + 15; wx < sx + b.w - 15; wx += 25){
        for(let wy = b.y + 15; wy < b.y + b.h - 15; wy += 25){
          if((Math.floor(wx + wy) % 3) !== 0){
            ctx.fillRect(wx, wy, 12, 12);
          }
        }
      }
    }
  }
}

function drawGodzilla(){
  if(!godzillaBoss.active) return;
  const g = godzillaBoss;
  const sx = g.x - camX;
  if(sx + g.w < -150 || sx > W + 150) return;

  ctx.save();
  ctx.translate(sx + g.w/2, g.y + g.h/2);
  ctx.scale(g.facing, 1);

  const wobble = Math.sin(g.animT * 0.008) * 6;

  // Godzilla Body (Dark Slate Green Kaiju)
  ctx.fillStyle = '#1e382b';
  ctx.beginPath();
  ctx.ellipse(0, 10 + wobble, 75, 95, 0, 0, Math.PI*2);
  ctx.fill();

  // Spikes on spine (Glowing Neon Blue)
  ctx.fillStyle = g.isBeaming ? '#00e5ff' : '#0088cc';
  for(let i = -4; i <= 4; i++){
    ctx.beginPath();
    ctx.moveTo(-75, i * 20 + wobble);
    ctx.lineTo(-105, i * 20 - 15 + wobble);
    ctx.lineTo(-65, i * 20 + 15 + wobble);
    ctx.fill();
  }

  // Godzilla Head
  ctx.fillStyle = '#1e382b';
  ctx.beginPath();
  ctx.ellipse(25, -80 + wobble, 45, 38, 0, 0, Math.PI*2);
  ctx.fill();

  // Snout & Jaw
  ctx.fillRect(35, -95 + wobble, 40, 30);

  // Fiery Eyes
  ctx.fillStyle = '#ff1100';
  ctx.beginPath(); ctx.arc(45, -92 + wobble, 7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffff00';
  ctx.beginPath(); ctx.arc(47, -92 + wobble, 3, 0, Math.PI*2); ctx.fill();

  // Mouth & Atomic Breath Glow
  if(g.isBeaming){
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath(); ctx.ellipse(55, -75 + wobble, 18, 12, 0, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(55, -75 + wobble, 12, 8, 0, 0, Math.PI*2); ctx.fill();
    // Sharp teeth
    ctx.fillStyle = '#fff';
    ctx.fillRect(50, -82 + wobble, 3, 5);
    ctx.fillRect(58, -82 + wobble, 3, 5);
  }

  // Arms & Legs
  ctx.fillStyle = '#182e23';
  ctx.fillRect(15, -20 + wobble, 35, 18);
  ctx.fillRect(-35, 65 + wobble, 45, 45);
  ctx.fillRect(10, 65 + wobble, 45, 45);

  ctx.restore();

  // Atomic Beam Effect
  if(g.isBeaming){
    const beamStartX = g.facing === -1 ? sx - 10 : sx + g.w + 10;
    const beamY = g.y + 45;

    ctx.save();
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 25;
    ctx.fillRect(beamStartX - (g.facing === -1 ? 1200 : 0), beamY - 20, 1200, 40);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(beamStartX - (g.facing === -1 ? 1200 : 0), beamY - 8, 1200, 16);
    ctx.restore();
  }

  // Godzilla Boss Health Bar Header
  const barW = 420, barH = 18;
  const bx = W/2 - barW/2, by = 48;
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(bx - 12, by - 26, barW + 24, barH + 36);
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx - 12, by - 26, barW + 24, barH + 36);

  ctx.fillStyle = '#ff3d6e';

function triggerNukeSequence(){
  if(nukeSeq.active) return;
  nukeSeq.active = true;
  nukeSeq.timer = 0;
  nukeSeq.missileY = H + 120;
  nukeSeq.missileX = W / 2;
  nukeSeq.exploded = false;
  nukeSeq.flash = 0;
  sfxDemonic();
  shake(40);
  triggerFlash('255, 100, 0', 0.9);
  toast("☢️ 🚨 ატომური რაკეტის გაშვება დეტექტირებულია! 🚨 ☢️", 3000);
}

function updateNukeSequence(dt){
  if(!nukeSeq.active) return;
  nukeSeq.timer += dt;

  if(!nukeSeq.exploded){
    nukeSeq.missileY -= 14;
    shake(16);
    spawnParticles(nukeSeq.missileX, nukeSeq.missileY + 65, '#ff4400', 8, 2.5);
    spawnParticles(nukeSeq.missileX, nukeSeq.missileY + 80, '#444444', 10, 2);

    if(nukeSeq.missileY < H * 0.22){
      nukeSeq.exploded = true;
      shake(55);
      sfxDemonic();
      triggerFlash('255, 255, 255', 1.0);
      toast("💥 ☢️ ატომური ბომბის აფეთქება! ქალაქი განადგურდა! ☢️ 💥", 3000);

      // Crumble all city buildings instantly
      for(const b of cityBuildings) b.destroyed = true;

      for(let i = 0; i < 90; i++){
        spawnParticles(nukeSeq.missileX, nukeSeq.missileY, i%2===0 ? '#ff3d6e' : '#ffd23f', 90, 4.5);
      }
    }
  } else {
    shake(22);
  }

  if(nukeSeq.timer > 3400){
    state.mode = 'gameover';
  }
}

function drawGodzillaProjectiles(){
  for(const p of godzillaProjectiles){
    const sx = p.x - camX;
    if(sx < -100 || sx > W + 100) continue;

    ctx.save();
    if(p.type === 'fireball'){
      ctx.fillStyle = p.color || '#ff2200';
      ctx.beginPath();
      ctx.arc(sx, p.y, p.size, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#ffff00';
      ctx.beginPath();
      ctx.arc(sx, p.y, p.size * 0.5, 0, Math.PI*2);
      ctx.fill();
    } else if(p.type === 'shockwave'){
      ctx.fillStyle = p.color || '#00f0ff';
      ctx.beginPath();
      ctx.ellipse(sx + p.w/2, p.y + p.h/2, p.w/2, p.h/2, 0, 0, Math.PI*2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawNukeSequence(){
  if(!nukeSeq.active) return;

  if(!nukeSeq.exploded){
    const mx = nukeSeq.missileX;
    const my = nukeSeq.missileY;

    ctx.save();
    // Missile body
    ctx.fillStyle = '#a0aab2';
    ctx.fillRect(mx - 15, my - 50, 30, 80);
    // Warhead nose cone
    ctx.fillStyle = '#ff2200';
    ctx.beginPath();
    ctx.moveTo(mx - 15, my - 50);
    ctx.lineTo(mx, my - 85);
    ctx.lineTo(mx + 15, my - 50);
    ctx.fill();

    // Nuclear symbol on body ☢️
    ctx.fillStyle = '#111';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('☢️', mx, my - 10);

    // Rocket fins
    ctx.fillStyle = '#ff2200';
    ctx.beginPath(); ctx.moveTo(mx - 15, my + 10); ctx.lineTo(mx - 28, my + 35); ctx.lineTo(mx - 15, my + 30); ctx.fill();
    ctx.beginPath(); ctx.moveTo(mx + 15, my + 10); ctx.lineTo(mx + 28, my + 35); ctx.lineTo(mx + 15, my + 30); ctx.fill();

    // Fire plume thrust
    ctx.fillStyle = '#ff6600';
    ctx.beginPath();
    ctx.moveTo(mx - 12, my + 30);
    ctx.lineTo(mx, my + 95 + Math.random()*20);
    ctx.lineTo(mx + 12, my + 30);
    ctx.fill();
    ctx.restore();
  } else {
    // Nuclear Mushroom Cloud
    const mx = nukeSeq.missileX;
    const my = H * 0.22;

    ctx.save();
    // Mushroom Stem
    ctx.fillStyle = 'rgba(255, 100, 0, 0.85)';
    ctx.beginPath();
    ctx.moveTo(mx - 30, H);
    ctx.lineTo(mx - 15, my);
    ctx.lineTo(mx + 15, my);
    ctx.lineTo(mx + 30, H);
    ctx.fill();

    // Massive Glowing Cap
    const capRad = 180 + Math.sin(state.time * 0.01) * 20;
    const grad = ctx.createRadialGradient(mx, my, 20, mx, my, capRad);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.3, '#ffcc00');
    grad.addColorStop(0.7, '#ff3300');
    grad.addColorStop(1, 'rgba(100, 0, 0, 0.9)');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(mx, my, capRad, 0, Math.PI*2);
    ctx.fill();

    // Shockwave Ring
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.ellipse(mx, my + 40, capRad * 1.5, capRad * 0.4, 0, 0, Math.PI*2);
    ctx.stroke();

    ctx.restore();
  }
}

}

// ---------- Product Preview Modal & Shop Functions ----------
function openPreviewModal(item, type) {
  state.previewModal = {
    active: true,
    item: item,
    type: type || 'skins',
    animState: 'idle',
    testFiring: false
  };
  sfxBell();
}

function closePreviewModal() {
  if (state.previewModal) {
    state.previewModal.active = false;
  }
  sfxBell();
}

function executeItemTransaction(item, type) {
  let isBought = false;
  let isEquipped = false;

  if (type === 'upgrades') {
    isBought = state.upgrades[item.id];
  } else if (type === 'skins') {
    isBought = (state.unlockedSkins || []).includes(item.id);
    isEquipped = state.equippedSkin === item.id;
  } else if (type === 'weapons') {
    isBought = (state.unlockedWeapons || []).includes(item.id);
    isEquipped = state.equippedWeapon === item.id;
  }

  if (isEquipped) {
    toast(`✅ ${item.title} უკვე არჩეულია!`, 1500);
    return;
  }

  if (isBought) {
    if (type === 'skins') {
      state.equippedSkin = item.id;
      saveData();
      sfxCoin();
      toast(`👕 სკინი არჩეულია: ${item.title}`, 1800);
    } else if (type === 'weapons') {
      state.equippedWeapon = item.id;
      player.weaponMode = item.id;
      saveData();
      sfxCoin();
      toast(`🔫 იარაღი არჩეულია: ${item.title}`, 1800);
    }
  } else {
    if (state.coinsCollected >= item.cost) {
      state.coinsCollected -= item.cost;
      if (type === 'upgrades') {
        state.upgrades[item.id] = true;
      } else if (type === 'skins') {
        if (!state.unlockedSkins) state.unlockedSkins = ['classic'];
        state.unlockedSkins.push(item.id);
        state.equippedSkin = item.id;
      } else if (type === 'weapons') {
        if (!state.unlockedWeapons) state.unlockedWeapons = ['pistol'];
        state.unlockedWeapons.push(item.id);
        state.equippedWeapon = item.id;
        player.weaponMode = item.id;
      }
      saveData();
      sfxCoin();
      sfxWin();
      triggerFlash('56,198,255', 0.7);
      toast(`🎉 წარმატებით შეიძინე: ${item.title}`, 2200);
    } else {
      sfxHurt();
      toast(`❌ არ გყოფნის მონეტები! (საჭიროა ${item.cost})`, 1800);
    }
  }
}

function handlePreviewModalClick(mx, my) {
  if (!state.previewModal || !state.previewModal.active || !state.previewModal.item) return false;

  const item = state.previewModal.item;
  const type = state.previewModal.type || 'skins';
  const mw = 840, mh = 510;
  const mxPos = W / 2 - mw / 2, myPos = H / 2 - mh / 2;

  // Close Button (top right ✖)
  const closeW = 40, closeH = 32;
  const cxBtn = mxPos + mw - closeW - 14, cyBtn = myPos + 10;
  if (mx >= cxBtn && mx <= cxBtn + closeW && my >= cyBtn && my <= cyBtn + closeH) {
    closePreviewModal();
    return true;
  }

  // Clicks outside modal -> close
  if (mx < mxPos || mx > mxPos + mw || my < myPos || my > myPos + mh) {
    closePreviewModal();
    return true;
  }

  const stageX = mxPos + 20, stageY = myPos + 64, stageW = 380, stageH = 422;

  if (type === 'skins') {
    const poseW = 100, poseH = 32;
    const poses = ['idle', 'run', 'jump'];
    poses.forEach((p, idx) => {
      const pxBtn = stageX + 24 + idx * (poseW + 12), pyBtn = stageY + stageH - 46;
      if (mx >= pxBtn && mx <= pxBtn + poseW && my >= pyBtn && my <= pyBtn + poseH) {
        state.previewModal.animState = p;
        sfxCoin();
      }
    });
  } else if (type === 'weapons') {
    const tfW = 200, tfH = 36;
    const tfX = stageX + stageW / 2 - tfW / 2, tfY = stageY + stageH - 48;
    if (mx >= tfX && mx <= tfX + tfW && my >= tfY && my <= tfY + tfH) {
      state.previewModal.testFiring = true;
      sfxShoot();
      shake(5);
      spawnParticles(stageX + stageW / 2 + 60, stageY + stageH / 2 - 20, '#38c6ff', 10, 2);
      setTimeout(() => {
        if (state.previewModal) state.previewModal.testFiring = false;
      }, 250);
      return true;
    }
  }

  const panelX = mxPos + 424, panelY = myPos + 64;
  const actionW = 390, actionH = 48;
  const actionX = panelX, actionY = panelY + 372;

  if (mx >= actionX && mx <= actionX + actionW && my >= actionY && my <= actionY + actionH) {
    executeItemTransaction(item, type);
    return true;
  }

  return true;
}

  }

  }

  const mxPos = W / 2 - mw / 2, myPos = H / 2 - mh / 2;

  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Top Header Bar
  ctx.fillStyle = '#111827';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(mxPos, myPos, mw, 50, [12, 12, 0, 0]);

  ctx.fillText(catPath, mxPos + 20, myPos + 30);

  ctx.font = 'bold 15px sans-serif';
  ctx.fillStyle = '#f8fafc';
  ctx.fillText(item.title, mxPos + 20 + ctx.measureText(catPath).width + 6, myPos + 30);

  // Close Button ✖
  const closeW = 40, closeH = 30;

  else ctx.fillRect(cxBtn, cyBtn, closeW, closeH);
  ctx.fill();
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 1; ctx.stroke();

  ctx.textAlign = 'center';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('✕', cxBtn + closeW / 2, cyBtn + 20);

  // 3. Showcase Vault Stage (Left Panel)
  const stageX = mxPos + 20, stageY = myPos + 64, stageW = 380, stageH = 422;

  ctx.fillStyle = '#070c18';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(stageX, stageY, stageW, stageH, 8);
  else ctx.fillRect(stageX, stageY, stageW, stageH);
  ctx.fill();
  ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1.5; ctx.stroke();

  // Floor Grid Lines in Showcase Vault
  ctx.save();
  ctx.strokeStyle = 'rgba(51, 65, 85, 0.35)';
  ctx.lineWidth = 1;
  const floorY = stageY + stageH - 75;
  for (let i = -4; i <= 4; i++) {
    ctx.beginPath();
    ctx.moveTo(stageX + stageW / 2 + i * 20, floorY - 30);
    ctx.lineTo(stageX + stageW / 2 + i * 45, floorY + 40);
    ctx.stroke();
  }
  ctx.restore();

  // Corner HUD Crosshairs
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5;

  ctx.beginPath(); ctx.moveTo(stageX + 10, stageY + 10 + chSize); ctx.lineTo(stageX + 10, stageY + 10); ctx.lineTo(stageX + 10 + chSize, stageY + 10); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(stageX + stageW - 10 - chSize, stageY + 10); ctx.lineTo(stageX + stageW - 10, stageY + 10); ctx.lineTo(stageX + stageW - 10, stageY + 10 + chSize); ctx.stroke();

  // Pedestal Ellipse
  const pedX = stageX + stageW / 2, pedY = floorY;

  if (type === 'skins') {

}


function drawShop(){
  drawBackground('pink');
  ctx.fillStyle = 'rgba(6, 10, 22, 0.88)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  // Title Header
  ctx.save();
  ctx.font = '900 30px sans-serif';
  ctx.shadowColor = '#ffd23f';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#ffd23f';
  ctx.fillText('🛍️ აღჭურვილობის, სკინებისა და იარაღების მაღაზია (SHOP)', W/2, 38);
  ctx.restore();

  // Coins Balance Badge
  ctx.fillStyle = '#38c6ff';
  ctx.font = 'bold 17px sans-serif';
  ctx.fillText(`💰 შენი ბალანსი: ${state.coinsCollected} მონეტა`, W/2, 66);

  // Tabs (Upgrades, Skins, Weapons)
  const shopTabs = [
    { id: 'upgrades', label: '⚡ უნარები' },
    { id: 'skins', label: '👕 სკინები' },
    { id: 'weapons', label: '🔫 იარაღები' }
  ];

  const tabY = 82, tabW = 210, tabH = 38;
  const tabStartX = W/2 - (3 * tabW + 2 * 16)/2;

  shopTabs.forEach((tab, idx) => {
    const tx = tabStartX + idx * (tabW + 16);
    const isActive = (state.shopTab || 'upgrades') === tab.id;

    ctx.save();
    ctx.fillStyle = isActive ? '#ffd23f' : 'rgba(20, 30, 50, 0.85)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(tx, tabY, tabW, tabH, 8);
    else ctx.fillRect(tx, tabY, tabW, tabH);
    ctx.fill();

    ctx.strokeStyle = isActive ? '#ffffff' : '#38c6ff';
    ctx.lineWidth = isActive ? 2.5 : 1.5;
    ctx.stroke();

    ctx.font = 'bold 15px sans-serif';
    ctx.fillStyle = isActive ? '#000000' : '#ffffff';
    ctx.fillText(tab.label, tx + tabW/2, tabY + 24);
    ctx.restore();
  });

  // Determine current items list
  let currentItems = shopUpgrades;
  if(state.shopTab === 'skins') currentItems = shopSkins;
  if(state.shopTab === 'weapons') currentItems = shopWeapons;

  // Render Cards
  const cols = currentItems.length > 6 ? 4 : 3;
  const cardW = cols === 4 ? 210 : 270, cardH = 145;
  const cardGap = cols === 4 ? 14 : 20;
  const startX = W/2 - (cols * cardW + (cols-1)*cardGap)/2;
  const startY = cols === 4 ? 132 : 135;

  currentItems.forEach((item, idx) => {
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const cx = startX + col * (cardW + cardGap);
    const cy = startY + row * (cardH + 14);

    let isBought = false;
    let isEquipped = false;

    if(state.shopTab === 'upgrades'){
      isBought = state.upgrades[item.id];
    } else if(state.shopTab === 'skins'){
      isBought = (state.unlockedSkins || []).includes(item.id);
      isEquipped = state.equippedSkin === item.id;
    } else if(state.shopTab === 'weapons'){
      isBought = (state.unlockedWeapons || []).includes(item.id);
      isEquipped = state.equippedWeapon === item.id;
    }

    const canAfford = state.coinsCollected >= item.cost;

    ctx.save();
    ctx.fillStyle = isEquipped ? 'rgba(25, 65, 45, 0.94)' : (isBought ? 'rgba(25, 45, 35, 0.92)' : 'rgba(18, 24, 40, 0.92)');
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(cx, cy, cardW, cardH, 10);
    else ctx.fillRect(cx, cy, cardW, cardH);
    ctx.fill();

    ctx.strokeStyle = isEquipped ? '#3fe07d' : (isBought ? '#38c6ff' : (canAfford ? '#ffd23f' : '#ff3d6e'));
    ctx.lineWidth = isEquipped ? 3 : 2;
    ctx.stroke();

    // Card Title
    ctx.textAlign = 'left';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillStyle = isEquipped ? '#3fe07d' : (isBought ? '#38c6ff' : '#ffffff');
    ctx.fillText(`${item.icon} ${item.title}`, cx + 12, cy + 26);

    // Desc with line wrapping
    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#aaaaaa';
    ctx.textAlign = 'left';
    const maxDescW = cardW - 24;
    const words = item.desc.split(' ');
    let line = '';
    let descY = cy + 46;
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxDescW && n > 0) {
        ctx.fillText(line, cx + 12, descY);
        line = words[n] + ' ';
        descY += 15;
        if (descY > cy + 85) break;
      } else {
        line = testLine;
      }
    }
    if (descY <= cy + 85) {
      ctx.fillText(line, cx + 12, descY);
    }

    // Preview Button (Left Bottom)
    const prevW = cols === 4 ? 80 : 92, prevH = 30;
    const prevBx = cx + 12, prevBy = cy + cardH - prevH - 10;
    ctx.fillStyle = 'rgba(56, 198, 255, 0.22)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(prevBx, prevBy, prevW, prevH, 6);
    else ctx.fillRect(prevBx, prevBy, prevW, prevH);
    ctx.fill();
    ctx.strokeStyle = '#38c6ff'; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = '#38c6ff';
    ctx.fillText('👁️ პრევიუ', prevBx + prevW/2, prevBy + 20);

    // Action Button Area (Right Bottom)
    ctx.font = 'bold 13px sans-serif';
    if(isEquipped){
      ctx.fillStyle = '#3fe07d';
      ctx.textAlign = 'right';
      ctx.fillText('✅ არჩეულია', cx + cardW - 12, cy + cardH - 20);
    } else if(isBought){
      const btnW = cols === 4 ? 85 : 100, btnH = 30;
      const bx = cx + cardW - btnW - 12, by = cy + cardH - btnH - 10;
      ctx.fillStyle = '#38c6ff';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(bx, by, btnW, btnH, 6);
      else ctx.fillRect(bx, by, btnW, btnH);
      ctx.fill();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('🎯 არჩევა', bx + btnW/2, by + 20);
    } else {
      const btnW = cols === 4 ? 85 : 105, btnH = 30;
      const bx = cx + cardW - btnW - 12, by = cy + cardH - btnH - 10;
      ctx.fillStyle = canAfford ? '#ffd23f' : '#444444';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(bx, by, btnW, btnH, 6);
      else ctx.fillRect(bx, by, btnW, btnH);
      ctx.fill();

      ctx.textAlign = 'center';
      ctx.fillStyle = canAfford ? '#000000' : '#888888';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(`🛒 ${item.cost} 🪙`, bx + btnW/2, by + 20);
    }
    ctx.restore();
  });

  // Bottom Buttons: Promo Code & Back
  ctx.save();
  const bw = 260, bh = 42;
  const btnGap = 20;

  // Promo Code Button (Left)
  const pbx = W/2 - bw - btnGap/2, pby = H - 52;
  ctx.fillStyle = 'rgba(255, 210, 63, 0.18)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(pbx, pby, bw, bh, 10);
  else ctx.fillRect(pbx, pby, bw, bh);
  ctx.fill();
  ctx.strokeStyle = '#ffd23f';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#ffd23f';
  ctx.fillText('🎟️ პრომოკოდი (PROMO CODE)', pbx + bw/2, pby + 27);

  // Back Button (Right)
  const bbx = W/2 + btnGap/2, bby = H - 52;
  ctx.fillStyle = '#ff3d6e';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bbx, bby, bw, bh, 10);
  else ctx.fillRect(bbx, bby, bw, bh);
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#ffffff';
  const isReturningToGame = state.returnMode === 'playing' || state.returnMode === 'paused';
  const backLabel = isReturningToGame ? '⬅️ თამაშში დაბრუნება' : '⬅️ მენიუში დაბრუნება';
  ctx.fillText(backLabel, bbx + bw/2, bby + 27);
  ctx.restore();

  // Render Product Preview Modal overlay if active
  if (state.previewModal && state.previewModal.active) {
    drawPreviewModal();
  }
}

function handleShopClick(mx, my){
  // 1. Handle preview modal clicks first if open
  if (state.previewModal && state.previewModal.active) {
    if (handlePreviewModalClick(mx, my)) return;
  }

  const bw = 260, bh = 42;
  const btnGap = 20;

  // Check Promo Code Button
  const pbx = W/2 - bw - btnGap/2, pby = H - 52;
  if(mx >= pbx && mx <= pbx + bw && my >= pby && my <= pby + bh){
    sfxBell();
    openPromoModal();
    return;
  }

  // Check Back Button
  const bbx = W/2 + btnGap/2, bby = H - 52;
  if(mx >= bbx && mx <= bbx + bw && my >= bby && my <= bby + bh){
    sfxBell();
    if(state.returnMode === 'playing' || state.returnMode === 'paused'){
      state.mode = 'playing';
      if(state.upgrades.shield) player.hasShield = true;
      if(state.upgrades.maxHp && state.lives < 10) state.lives = Math.max(state.lives, 10);
      if(state.equippedWeapon) player.weaponMode = state.equippedWeapon;
      else if(state.upgrades.shotgun && player.weaponMode === 'pistol') player.weaponMode = 'shotgun';
    } else {
      state.mode = state.returnMode || 'menu';
    }
    return;
  }

  // Check Tab Clicks
  const tabY = 82, tabW = 210, tabH = 38;
  const tabStartX = W/2 - (3 * tabW + 2 * 16)/2;
  const shopTabs = ['upgrades', 'skins', 'weapons'];

  for(let i = 0; i < 3; i++){
    const tx = tabStartX + i * (tabW + 16);
    if(mx >= tx && mx <= tx + tabW && my >= tabY && my <= tabY + tabH){
      state.shopTab = shopTabs[i];
      sfxBell();
      return;
    }
  }

  // Check Item Card Clicks
  let currentItems = shopUpgrades;
  if(state.shopTab === 'skins') currentItems = shopSkins;
  if(state.shopTab === 'weapons') currentItems = shopWeapons;

  const cols = currentItems.length > 6 ? 4 : 3;
  const cardW = cols === 4 ? 210 : 270, cardH = 145;
  const cardGap = cols === 4 ? 14 : 20;
  const startX = W/2 - (cols * cardW + (cols-1)*cardGap)/2;
  const startY = cols === 4 ? 132 : 135;

  currentItems.forEach((item, idx) => {
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const cx = startX + col * (cardW + cardGap);
    const cy = startY + row * (cardH + 14);

    if(mx >= cx && mx <= cx + cardW && my >= cy && my <= cy + cardH){
      // Check if clicked right action button directly
      const actionBtnW = cols === 4 ? 85 : 100, actionBtnH = 30;
      const abx = cx + cardW - actionBtnW - 12, aby = cy + cardH - actionBtnH - 10;

      if (mx >= abx && mx <= abx + actionBtnW && my >= aby && my <= aby + actionBtnH) {
        executeItemTransaction(item, state.shopTab);
      } else {
        // Clicked card or Preview button -> Open Product Preview Page Modal!
        openPreviewModal(item, state.shopTab);
      }
    }
  });
}

function drawLevelSelect(){
  drawBackground('pink');
  ctx.fillStyle = 'rgba(6, 10, 22, 0.90)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  // Title Header
  ctx.save();
  ctx.font = '900 28px sans-serif';
  ctx.shadowColor = '#38c6ff';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#38c6ff';
  ctx.fillText('🗺️ დონეების არჩევა (LEVEL SELECT & DIFFICULTY)', W/2, 38);
  ctx.restore();

  // Grid of levels (7 columns x 3 rows)
  const cols = 7;
  const cardW = 120, cardH = 125;
  const gapX = 10, gapY = 10;
  const totalW = cols * cardW + (cols - 1) * gapX;
  const startX = (W - totalW) / 2;
  const startY = 52;

  for(let idx = 0; idx < LEVELS.length; idx++){
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const cx = startX + col * (cardW + gapX);
    const cy = startY + row * (cardH + gapY);

    const isUnlocked = (idx + 1) <= (state.unlockedLevels || 1);
    const lvl = LEVELS[idx];
    const isGodzilla = lvl && (lvl.isGodzillaLevel || idx === 20);

    ctx.save();
    ctx.fillStyle = isUnlocked ? (isGodzilla ? 'rgba(50, 20, 30, 0.95)' : 'rgba(20, 32, 54, 0.92)') : 'rgba(10, 12, 18, 0.7)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(cx, cy, cardW, cardH, 8);
    else ctx.fillRect(cx, cy, cardW, cardH);
    ctx.fill();

    ctx.strokeStyle = isUnlocked ? (idx === state.levelIndex ? '#ffd23f' : (isGodzilla ? '#ff3d6e' : '#38c6ff')) : '#444444';
    ctx.lineWidth = idx === state.levelIndex ? 3 : 1.5;
    ctx.stroke();

    ctx.textAlign = 'center';

    // Episode Badge
    ctx.font = 'bold 13px sans-serif';
    ctx.fillStyle = isGodzilla ? '#ff3d6e' : (isUnlocked ? '#ffd23f' : '#666666');
    ctx.fillText(`EP. ${idx + 1}` + (isGodzilla ? ' 🦖' : ''), cx + cardW/2, cy + 20);

    // Level Name
    ctx.font = 'bold 10px sans-serif';
    ctx.fillStyle = isUnlocked ? '#ffffff' : '#555555';
    let shortName = lvl ? (lvl.name.split('—')[1] || lvl.name) : `Level ${idx+1}`;
    shortName = shortName.trim();
    if(shortName.length > 13) shortName = shortName.slice(0, 12) + '…';
    ctx.fillText(shortName, cx + cardW/2, cy + 40);

    // Difficulty Rating Badge
    if(isUnlocked && lvl && lvl.diffRating){
      ctx.font = 'bold 9px sans-serif';
      ctx.fillStyle = lvl.diffColor || '#38c6ff';
      ctx.fillText(`[${lvl.diffRating}]`, cx + cardW/2, cy + 58);

      // Gimmick Mini Title
      if(lvl.gimmickTitle){
        ctx.font = '9px sans-serif';
        ctx.fillStyle = '#cbd5e1';
        let gTitle = lvl.gimmickTitle.split(' ')[0] + ' ' + (lvl.gimmickTitle.split(' ')[1] || '');
        if(gTitle.length > 12) gTitle = gTitle.slice(0, 11) + '…';
        ctx.fillText(gTitle, cx + cardW/2, cy + 74);
      }
    }

    // Play/Locked Status
    ctx.font = 'bold 12px sans-serif';
    if(isUnlocked){
      ctx.fillStyle = isGodzilla ? '#ff3d6e' : '#3fe07d';
      ctx.fillText('▶ PLAY', cx + cardW/2, cy + 106);
    } else {
      ctx.fillStyle = '#ff3d6e';
      ctx.fillText('🔒 LOCKED', cx + cardW/2, cy + 106);
    }
    ctx.restore();
  }

  // Back Button
  ctx.save();
  const bw = 280, bh = 42;
  const bx = W/2 - bw/2, by = H - 50;
  ctx.fillStyle = '#ff3d6e';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 10);
  else ctx.fillRect(bx, by, bw, bh);
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#ffffff';
  const isReturningToGame = state.returnMode === 'playing' || state.returnMode === 'paused';
  const backLabel = isReturningToGame ? '⬅️ თამაშში დაბრუნება (RETURN TO GAME)' : '⬅️ მენიუში დაბრუნება';
  ctx.fillText(backLabel, W/2, by + 26);
  ctx.restore();
}
