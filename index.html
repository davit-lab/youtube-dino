  // Check Back Button
  const bw = 280, bh = 42;
  const bx = W/2 - bw/2, by = H - 50;
  if(mx >= bx && mx <= bx + bw && my >= by && my <= by + bh){
    sfxBell();
    if(state.returnMode === 'playing' || state.returnMode === 'paused'){
      state.mode = 'playing';
    } else {
      state.mode = state.returnMode || 'menu';
    }
    return;
  }

  const cols = 7;
  const cardW = 120, cardH = 125;
  const gapX = 10, gapY = 10;
  const totalW = cols * cardW + (cols - 1) * gapX;
  const startX = (W - totalW) / 2;
  const startY = 52;

  for(let idx = 0; idx < LEVELS.length; idx++){
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const cx = startX + col * (cardW + gapX);
    const cy = startY + row * (cardH + gapY);

    if(mx >= cx && mx <= cx + cardW && my >= cy && my <= cy + cardH){
      if((idx + 1) <= (state.unlockedLevels || 1)){
        sfxCoin();
        state.levelIndex = idx;
        loadLevel(idx);
        state.mode = 'playing';
        state.returnMode = 'playing';
        toast(`▶ ეპიზოდი ${idx + 1} დაიწყო!`, 1800);
      } else {
        sfxHurt();
        toast("🔒 ეს დონე ჯერ დაბლოკილია!", 1500);
      }
    }
  }
}

function handleMenuClick(mx, my){
  // Start Button
  const btnW = 460, btnH = 48;
  const bx = W/2 - btnW/2, by = H/2 + 45;
  if(mx >= bx && mx <= bx + btnW && my >= by && my <= by + btnH){
    startGame();
    return;
  }

  // Sub buttons: Shop & Levels
  const subW = 220, subH = 42;
  const sbx1 = W/2 - subW - 10, sby = H/2 + 108;
  const sbx2 = W/2 + 10;

  if(mx >= sbx1 && mx <= sbx1 + subW && my >= sby && my <= sby + subH){
    openShop();
    return;
  } else if(mx >= sbx2 && mx <= sbx2 + subW && my >= sby && my <= sby + subH){
    openLevelSelect();
    return;
  }

  // Promo Code Button
  const promoW = 340, promoH = 38;
  const pbx = W/2 - promoW/2, pby = H/2 + 160;
  if(mx >= pbx && mx <= pbx + promoW && my >= pby && my <= pby + promoH){
    sfxBell();
    openPromoModal();
    return;
  }
}

function openShop(){
  loadSavedData();
  if(state.mode !== 'shop' && state.mode !== 'levelselect'){
    state.returnMode = state.mode;
  }
  state.mode = 'shop';
}

function openLevelSelect(){
  if(state.mode !== 'shop' && state.mode !== 'levelselect'){
    state.returnMode = state.mode;
  }
  state.mode = 'levelselect';
}

function openPromoModal(){
  const modal = document.getElementById('promoModal');
  if(modal){
    modal.style.display = 'flex';
    const input = document.getElementById('promoInput');
    if(input){
      input.value = '';
      setTimeout(() => input.focus(), 100);
    }
  } else {
    enterPromoCodePrompt();
  }
}

function closePromoModal(){
  const modal = document.getElementById('promoModal');
  if(modal) modal.style.display = 'none';
}

function submitPromoCode(){
  const input = document.getElementById('promoInput');
  const raw = input ? input.value : '';
  const code = raw.trim().toUpperCase();

  if(code === 'DINOMAGARIA'){
    state.coinsCollected = Math.max((state.coinsCollected || 0) + 999999, 999999);
    saveData();
    sfxWin();
    triggerFlash('255,210,63', 0.8);
    toast('🎉 პრომოკოდი წარმატებით გააქტიურდა! მიიღე 999,999 მონეტა!', 3500);
    closePromoModal();
  } else if(code === ''){
    toast('⚠️ შეიყვანეთ პრომოკოდი!', 1500);
  } else {
    sfxHurt();
    toast('❌ არასწორი პრომოკოდი!', 2000);
  }
}

function fillQuickPromoCode(code){
  const input = document.getElementById('promoInput');
  if(input) input.value = code;
  submitPromoCode();
}

function enterPromoCodePrompt(){
  const res = prompt("შეიყვანეთ პრომოკოდი (ENTER PROMO CODE):");
  if(res !== null){
    const code = res.trim().toUpperCase();
    if(code === 'DINOMAGARIA'){
      state.coinsCollected = Math.max((state.coinsCollected || 0) + 999999, 999999);
      saveData();
      sfxWin();
      triggerFlash('255,210,63', 0.8);
      toast('🎉 პრომოკოდი წარმატებით გააქტიურდა! მიიღე 999,999 მონეტა!', 3500);
    } else if(code.length > 0) {
      sfxHurt();
      toast('❌ არასწორი პრომოკოდი!', 2000);
    }
  }
}

function drawPauseOverlay(){
  ctx.fillStyle='rgba(0,0,0,.75)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#fff';
  ctx.font='bold 44px sans-serif';
  ctx.fillText('შეჩერებულია ⏸️', W/2, H/2 - 20);
  
  ctx.font='bold 20px sans-serif';
  ctx.fillStyle='#ffd23f';
  ctx.fillText('დააჭირე P / შეეხე გასაგრძელებლად', W/2, H/2 + 30);
}

function drawGameOver(){
  drawBackground('pink');
  ctx.fillStyle='rgba(0,0,0,.78)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';

  if(state.lastKilledByGodzilla || (level && level.isGodzillaLevel)){
    // Godzilla Victory Screen
    ctx.fillStyle = '#ff3d6e';
    ctx.font = 'bold 34px sans-serif';
    ctx.fillText('🦖 გოდზილას აპოკალიფსური გამარჯვება! 🏙️', W/2, 75);

    // Dark Ominous Speech Cloud from Godzilla
    const cloudW = 480, cloudH = 110;
    const cloudX = W/2 - cloudW/2, cloudY = H/2 - 130;
    ctx.fillStyle = '#120517';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(cloudX, cloudY, cloudW, cloudH, 12);
    else ctx.fillRect(cloudX, cloudY, cloudW, cloudH);
    ctx.fill();

    ctx.strokeStyle = '#ff3d6e';
    ctx.lineWidth = 3.5;
    ctx.stroke();

    // Exact requested quote in cloud
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px Georgia, serif';
    ctx.fillText('"შენი დროც დადგა —', cloudX + cloudW/2, cloudY + 42);
    ctx.fillStyle = '#ffd23f';
    ctx.fillText('ნიღაბი უნდა მოიხსნა!"', cloudX + cloudW/2, cloudY + 78);

    ctx.fillStyle = '#ff3d6e';
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText('გადაქცეული ხარ ხულიგნად! 💀', W/2, H/2 + 25);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('საბოლოო ქულა: ' + state.score, W/2, H/2 + 65);

    ctx.font = 'bold 20px sans-serif';
    const blink = Math.floor(state.time/400)%2===0;
    ctx.fillStyle = blink ? '#ffd23f' : '#ffffff';
    ctx.fillText('დააჭირე SPACE / ENTER თავიდან საცდელად 🔄', W/2, H/2 + 115);
  } else {
    ctx.fillStyle='#ff3d6e';
    ctx.font='bold 42px sans-serif';
    ctx.fillText('💀 8-ვე სიცოცხლე ამოიწურა! 💀', W/2, H/2 - 40);
    ctx.fillStyle='#fff';
    ctx.font='bold 24px sans-serif';
    ctx.fillText('საბოლოო ქულა: ' + state.score, W/2, H/2 + 10);
    ctx.font='bold 20px sans-serif';
    const blink = Math.floor(state.time/400)%2===0;
    ctx.fillStyle = blink ? '#ffd23f' : '#ffffff';
    ctx.fillText('დააჭირე SPACE / ENTER თამაშის თავიდან დასაწყებად 🔄', W/2, H/2 + 65);
  }
}

function drawLevelClear(){
  ctx.fillStyle='rgba(0,0,0,.5)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ffd23f';
  ctx.font='bold 44px sans-serif';
  ctx.fillText('დონე გავლილია! 🎉', W/2, H/2-10);
  ctx.fillStyle='#fff';
  ctx.font='20px sans-serif';
  ctx.fillText('მზად იყავი შემდეგი გიჟური დონისთვის!', W/2, H/2+30);
}

function drawWin(){
  drawBackground('pink');
  for(let i=0;i<70;i++){
    const cx = (i*47 + state.time*0.2) % W;
    const cy = (i*83 + state.time*0.4) % H;
    ctx.fillStyle = i%3===0?'#ffd23f': i%3===1?'#ff3d6e':'#38c6ff';
    ctx.fillRect(cx,cy,6,9);
  }
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#38c6ff';
  ctx.font='bold 48px sans-serif';
  ctx.fillText('ყველა დონე დაძლეულია! 🏆', W/2, H/2-60);
  ctx.fillStyle='#fff';
  ctx.font='22px sans-serif';
  ctx.fillText('საბოლოო ქულა: '+state.score, W/2, H/2-15);
  ctx.fillText('გამოწერების მეტრი: '+Math.floor(state.subs)+'%', W/2, H/2+20);
  ctx.font='bold 18px sans-serif';
  const blink = Math.floor(state.time/400)%2===0;
  if(blink) ctx.fillText('დააჭირე SPACE თამაშის თავიდან საწყებად', W/2, H/2+65);
}

function drawDeathCamOverlay(){
  if(!state.deathCam || !state.deathCam.active) return;

  const progress = 1 - Math.max(0, state.deathCam.timer) / state.deathCam.maxTimer;
  const ease = Math.sin(progress * Math.PI * 0.5);

  ctx.save();

  // 1. Dark Crimson Radial Vignette
  const vignetteGrad = ctx.createRadialGradient(W/2, H/2, W*0.18, W/2, H/2, W*0.75);
  vignetteGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  vignetteGrad.addColorStop(0.65, 'rgba(120, 0, 20, 0.42)');
  vignetteGrad.addColorStop(1, 'rgba(20, 0, 5, 0.90)');
  ctx.fillStyle = vignetteGrad;
  ctx.fillRect(0, 0, W, H);

  // 2. Cinematic Black Letterbox Bars
  const barHeight = Math.min(52, 52 * ease);
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, barHeight);
  ctx.fillRect(0, H - barHeight, W, barHeight);

  // 3. Header Banner Text
  ctx.font = '900 15px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff3d6e';
  ctx.shadowColor = '#ff3d6e';
  ctx.shadowBlur = 12;
  const recDot = (Math.floor(state.time / 250) % 2 === 0) ? '🔴 ' : '⭕ ';
  ctx.fillText(`${recDot}DEATH CAM • SLOW MOTION [0.25x SPEED]`, W / 2, Math.max(22, barHeight * 0.62));

  // 4. Center Target Locking Reticle
  const cx = W / 2, cy = H / 2;
  const reticleSize = 48 - ease * 16;
  const pulse = Math.sin(state.time * 0.012) * 5;

  ctx.strokeStyle = '#ff3d6e';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#ff0033';
  ctx.shadowBlur = 14;

  // Pulsing Target Circle
  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(10, reticleSize + pulse), 0, Math.PI * 2);
  ctx.stroke();

  // Outer Dashed Rotating Ring
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.arc(cx, cy, reticleSize + 20, state.time * 0.003, state.time * 0.003 + Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // Crosshair Corner Ticks
  const tickLen = 14;
  ctx.beginPath();
  ctx.moveTo(cx - reticleSize - tickLen, cy); ctx.lineTo(cx - reticleSize + 4, cy);
  ctx.moveTo(cx + reticleSize - 4, cy); ctx.lineTo(cx + reticleSize + tickLen, cy);
  ctx.moveTo(cx, cy - reticleSize - tickLen); ctx.lineTo(cx, cy - reticleSize + 4);
  ctx.moveTo(cx, cy + reticleSize - 4); ctx.lineTo(cx, cy + reticleSize + tickLen);
  ctx.stroke();

  // Target Location Coordinates Badge
  ctx.fillStyle = '#ff3d6e';
  ctx.font = 'bold 11px monospace';
  ctx.fillText(`LOC: X:${Math.round(state.deathCam.deathX)} Y:${Math.round(state.deathCam.deathY)} • FATAL IMPACT`, cx, cy + reticleSize + 32);

  // 5. Georgian Death Cause Banner
  const msg = state.deathCam.causeMsg || "კრიტიკული დამარცხება! 💀";
  ctx.font = '900 18px sans-serif';
  const textWidth = ctx.measureText(msg).width;
  const pw = Math.max(320, textWidth + 60);

  ctx.fillStyle = 'rgba(15, 0, 5, 0.88)';
  ctx.fillRect(W/2 - pw/2, H - barHeight - 42, pw, 34);
  ctx.strokeStyle = '#ff3d6e';
  ctx.lineWidth = 2;
  ctx.strokeRect(W/2 - pw/2, H - barHeight - 42, pw, 34);

  ctx.fillStyle = '#ffd23f';
  ctx.shadowColor = '#ff0033';
  ctx.shadowBlur = 10;
  ctx.fillText(msg, W / 2, H - barHeight - 19);

  // 6. Slow-Mo Replay Progress Countdown Bar
  const barW = 300;
  const fillW = barW * (1 - progress);
  ctx.fillStyle = 'rgba(255, 61, 110, 0.25)';
  ctx.fillRect(W/2 - barW/2, H - 10, barW, 5);
  ctx.fillStyle = '#ff3d6e';
  ctx.shadowColor = '#ff3d6e';
  ctx.shadowBlur = 8;
  ctx.fillRect(W/2 - barW/2, H - 10, fillW, 5);

  ctx.restore();
}

// ---------- Main Game Loop ----------
let lastTime = performance.now();
function loop(now){
  const dt = Math.min(33, now-lastTime);
  lastTime = now;
  state.time += dt;

  updateBgmTrack();

  const mobileCtrl = document.getElementById('mobileControls');
  if(mobileCtrl){
    const isMobileDevice = window.innerWidth <= 860 || ('ontouchstart' in window);
    mobileCtrl.style.display = (state.mode === 'playing' && isMobileDevice) ? 'flex' : 'none';
  }

  ctx.save();
  if(state.shake>0){
    const sx = (Math.random()-0.5)*state.shake;
    const sy = (Math.random()-0.5)*state.shake;
    ctx.translate(sx,sy);
    state.shake *= 0.86;
    if(state.shake<0.5) state.shake=0;
  }

  if(state.mode==='loading'){
    drawLoading();
  } else if(state.mode==='menu'){
    drawMenu();
  } else if(state.mode==='shop'){
    drawShop();
  } else if(state.mode==='levelselect'){
    drawLevelSelect();
  } else {
    drawBackground(level.theme || level.bgHue);
    drawWeatherWorld();

    ctx.save();
    if(state.deathCam && state.deathCam.active){
      const progress = 1 - Math.max(0, state.deathCam.timer) / state.deathCam.maxTimer;
      const ease = Math.sin(progress * Math.PI * 0.5);
      const zoom = 1 + ease * 1.35;

      const deathX = state.deathCam.deathX;
      const deathY = state.deathCam.deathY;

      const startX = camX + W * 0.38;
      const startY = camY + H * 0.5;

      const curFocusX = startX + (deathX - startX) * ease;
      const curFocusY = startY + (deathY - startY) * ease;

      ctx.translate(W / 2, H / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-curFocusX, -curFocusY);
    } else {
      ctx.translate(0, -camY);
    }

    drawCityBuildings();
    drawGround(level.theme || level.bgHue);
    if(level.lavas) level.lavas.forEach(drawLava);
    if(level.waters) level.waters.forEach(drawWater);
    level.signs.forEach(drawSign);
    level.fakespikes.forEach(drawFakespike);
    level.spikes.forEach(drawSpike);
    level.bananas.forEach(drawBanana);
    level.coins.forEach(drawCoin);
    level.bells.forEach(drawBell);
    level.bushes.forEach(drawBush);
    if(level.jumpboxes) level.jumpboxes.forEach(drawJumpBox);
    drawFlag(level.flag);
    drawGodzilla();
    drawGodzillaProjectiles();
    zombies.forEach(drawZombie);
    bullets.forEach(drawBullet);
    drawPlayer();
    drawParticles();

    ctx.restore();

    drawWeatherOverlay();
    drawNukeSequence();
    drawJumpscare();
    drawSponsorPopup();
    if(state.deathCam && state.deathCam.active){
      drawDeathCamOverlay();
    }
    drawHUD();

    if(state.mode==='playing'){
      if(state.deathCam && state.deathCam.active){
        const slowDt = dt * 0.22;
        state.deathCam.timer -= dt;
        updateParticles(0.22);
        updateZombies(slowDt);
        if(state.deathCam.timer <= 0){
          state.deathCam.active = false;
          if(!nukeSeq.active){
            state.mode = 'gameover';
          }
        }
      } else {
        updatePlayer(dt);
        updateGodzilla(dt);
        updateNukeSequence(dt);
        updateWeather(dt);
      }
    } else if(state.mode==='paused'){
      drawPauseOverlay();
    } else if(state.mode==='gameover'){
      drawGameOver();
    } else if(state.mode==='levelclear'){
      drawLevelClear();
    } else if(state.mode==='win'){
      drawWin();
    }
  }

  if(state.flashAlpha>0){
    ctx.fillStyle=`rgba(${state.flashColor},${state.flashAlpha})`;
    ctx.fillRect(0,0,W,H);
    state.flashAlpha *= 0.86;
    if(state.flashAlpha<0.02) state.flashAlpha=0;
  }

  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
