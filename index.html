function updateBullets(){
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life--;
    
    // Bullet collision with pushboxes
    if(level && level.pushboxes){
      for(const box of level.pushboxes){
        const bBox = {x: b.x - (b.size||4), y: b.y - (b.size||4), w: (b.size||4)*2, h: (b.size||4)*2};
        if(overlap(bBox, box)){
          b.life = 0;
          spawnParticles(b.x, b.y, '#d97706', 6, 1.2);
          break;
        }
      }
    }

    // Trail particles for plasma orb, flamethrower and tank shell
    if(b.isPlasma && Math.random() < 0.6){
      spawnParticles(b.x, b.y, '#00ffcc', 3, 0.5);
    }
    if(b.isFlame && Math.random() < 0.6){
      spawnParticles(b.x, b.y, '#ffaa00', 2, 0.4);
    }
    if(b.isTankShell && Math.random() < 0.8){
      spawnParticles(b.x, b.y, '#ff6600', 3, 0.6);
      spawnParticles(b.x, b.y, '#333333', 2, 0.4);
    }
    // Rocket smoke trail
    if(b.isRocket && Math.random() < 0.9){
      spawnParticles(b.x - (b.vx > 0 ? 14 : -14), b.y, '#888888', 3, 0.7);
      spawnParticles(b.x, b.y, '#ff6600', 2, 0.5);
    }
    // Grenade physics: affected by gravity, bounces off platforms
    if(b.isGrenade){
      b.vy += GRAVITY * 0.7;
      if(b.vy > 12) b.vy = 12;
      b.fuseTimer--;
      // Bounce off platforms
      if(level && level.plats){
        for(const p of (level.plats || [])){
          const bBox = {x: b.x - b.size, y: b.y - b.size, w: b.size*2, h: b.size*2};
          if(overlap(bBox, p) && b.vy > 0 && b.bounces < 3){
            b.vy = -b.vy * 0.5;
            b.vx *= 0.7;
            b.bounces++;
          }
        }
      }
      // Explode when fuse runs out
      if(b.fuseTimer <= 0 && !b.hasExploded){
        b.hasExploded = true;
        b.life = 0;
        shake(22); sfxDemonic();
        spawnParticles(b.x, b.y, '#ff6600', 40, 3.5);
        spawnParticles(b.x, b.y, '#ffff00', 20, 2.5);
        spawnParticles(b.x, b.y, '#888888', 25, 2);
        addFloatingText(b.x, b.y - 20, 'BOOM!', '#ff6600');
        // AOE damage
        for(const z of zombies){
          const dx = (z.x+z.w/2) - b.x, dy = (z.y+z.h/2) - b.y;
          if(Math.sqrt(dx*dx+dy*dy) < 140){ z.health -= 7; z.vx += dx*0.12; z.vy -= 6; }
        }
        if(godzillaBoss.active){
          const dx = (godzillaBoss.x+godzillaBoss.w/2)-b.x, dy=(godzillaBoss.y+godzillaBoss.h/2)-b.y;
          if(Math.sqrt(dx*dx+dy*dy) < 180){ godzillaBoss.hp -= 12; }
        }
      }
    }
    // Rocket explodes on hitting anything solid
    if(b.isRocket && !b.hasExploded && level && level.plats){
      for(const p of (level.plats || [])){
        const bBox = {x: b.x - b.size, y: b.y - b.size, w: b.size*2, h: b.size*2};
        if(overlap(bBox, p)){
          b.hasExploded = true; b.life = 0;
          shake(30); sfxDemonic();
          spawnParticles(b.x, b.y, '#ff4400', 50, 4);
          spawnParticles(b.x, b.y, '#ffff00', 30, 3);
          spawnParticles(b.x, b.y, '#888888', 30, 2.5);
          addFloatingText(b.x, b.y - 20, 'BOOM!', '#ff4400');
          for(const z of zombies){
            const dx=(z.x+z.w/2)-b.x, dy=(z.y+z.h/2)-b.y;
            if(Math.sqrt(dx*dx+dy*dy) < 180){ z.health -= 10; z.vx += dx*0.15; z.vy -= 8; }
          }
          if(godzillaBoss.active){
            const dx=(godzillaBoss.x+godzillaBoss.w/2)-b.x, dy=(godzillaBoss.y+godzillaBoss.h/2)-b.y;
            if(Math.sqrt(dx*dx+dy*dy) < 200){ godzillaBoss.hp -= 18; }
          }
          break;
        }
      }
    }

    let hit = false;

    // Collision with Godzilla
    if(godzillaBoss.active){
      const gBox = { x: godzillaBoss.x, y: godzillaBoss.y, w: godzillaBoss.w, h: godzillaBoss.h };
      const bulletBox = { x: b.x - b.size, y: b.y - b.size, w: b.size*2, h: b.size*2 };
      if(overlap(bulletBox, gBox)){
        godzillaBoss.hp -= (b.damage || 1);
        spawnParticles(b.x, b.y, b.color || '#ff0055', b.isTankShell ? 35 : 12);
        sfxZombieHit();
        shake(b.isTankShell ? 20 : 6);
        addFloatingText(godzillaBoss.x + 60, godzillaBoss.y - 20, "-" + (b.damage||1) + " HP! 💥", '#ff3d6e');
        
        if(b.isTankShell){
          sfxDemonic();
          spawnParticles(b.x, b.y, '#ff4400', 30, 2.5);
        }
        hit = true;
      }
    }

    if(!hit){
      for(const z of zombies){
        const bulletBox = { x: b.x - b.size, y: b.y - b.size, w: b.size*2, h: b.size*2 };
        if(overlap(bulletBox, z)){
          z.health -= (b.damage || 1);
          spawnParticles(b.x, b.y, b.color || '#ffd23f', b.isPlasma ? 25 : 10);
          sfxZombieHit();
          
          if(b.isPlasma || b.isTankShell){
            shake(14); sfxFall();
            for(const otherZ of zombies){
              const dx = otherZ.x - b.x, dy = otherZ.y - b.y;
              if(Math.sqrt(dx*dx + dy*dy) < 160) otherZ.health -= 4;
            }
          }
          if(b.isRocket && !b.hasExploded){
            b.hasExploded = true;
            shake(30); sfxDemonic();
            spawnParticles(b.x, b.y, '#ff4400', 50, 4);
            spawnParticles(b.x, b.y, '#ffff00', 30, 3);
            addFloatingText(b.x, b.y - 20, 'BOOM!', '#ff4400');
            for(const otherZ of zombies){
              const dx=(otherZ.x+otherZ.w/2)-b.x, dy=(otherZ.y+otherZ.h/2)-b.y;
              if(Math.sqrt(dx*dx+dy*dy) < 180){ otherZ.health -= 10; otherZ.vx += dx*0.15; otherZ.vy -= 8; }
            }
          }
          hit = true;
          break;
        }
      }
    }

    if(!hit && level && level.jumpboxes){
      for(const jb of (level.jumpboxes || [])){
        if(!jb.hit){
          const bulletBox = { x: b.x - b.size, y: b.y - b.size, w: b.size*2, h: b.size*2 };
          if(overlap(bulletBox, jb)){
            activateJumpbox(jb);
            hit = true;
            break;
          }
        }
      }
    }
    
    if(hit || b.life <= 0){
      bullets.splice(i, 1);
    }
  }
}

function updateZombies(dt){
  for(let i = zombies.length - 1; i >= 0; i--){
    const z = zombies[i];
    z.animT += dt;
    
    let onPlatform = false;
    let platformBelow = null;
    let platformsNearby = [];
    
    for(const p of (level.plats || [])){
      const distToP = Math.hypot((z.x + z.w/2) - (p.x + p.w/2), (z.y + z.h/2) - (p.y + p.h/2));
      if(distToP < 400) platformsNearby.push({...p, dist: distToP});
    }
    
    for(const p of (level.plats || [])){
      if(overlap(z, p)){
        const prevBottom = z.y - (z.vy || 0) + z.h;
        if((z.vy || 0) >= 0 && prevBottom <= p.y + 12){
          z.y = p.y - z.h;
          z.vy = 0;
          onPlatform = true;
          platformBelow = p;
        }
      }
    }
    
    const dx = player.x - z.x;
    const dy = player.y - z.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if(dist < 800 && dist > 15){
      const moveDir = dx > 0 ? 1 : -1;
      const playerHigher = dy < -40;
      
      if(onPlatform){
        let canMove = true;
        if(platformBelow){
          const atEdge = (moveDir > 0 && z.x + z.w > platformBelow.x + platformBelow.w - 15) || 
                         (moveDir < 0 && z.x < platformBelow.x + 15);
          
          if(atEdge){
            canMove = false;
            z.vx = 0;
          }
        }

        if(canMove){
          z.vx = (dx / dist) * z.speed;
          z.facing = dx > 0 ? 1 : -1;
        }
      } else {
        z.vx *= 0.98; // Less air control to avoid drifting into pits
      }
    } else if(onPlatform){
      z.vx *= 0.85;
    } else {
      z.vx *= 0.94;
    }
    
    const lastX = z.x;
    z.x += z.vx;
    for(const p of (level.plats || [])){
      if(overlap(z, p)){
        const prevBottom = z.y - (z.vy || 0) + z.h;
        if(prevBottom > p.y + 8){ 
           z.x = lastX;
           z.vx = 0;
           break;
        }
      }
    }

    z.vy = (z.vy || 0) + GRAVITY;
    if(z.vy > 18) z.vy = 18;
    z.y += z.vy;
    
    if(z.y > H + 300){
      zombies.splice(i, 1);
      continue;
    }
    
    if(overlap(player, z) && player.invuln <= 0 && !player.dead && !player.isFalling){
      const isStepping = player.vy > 0 && (player.y + player.h - player.vy) <= (z.y + 16);
      if(isStepping){
        // Stepping / landing on zombie head bounces player off WITHOUT killing the zombie!
        player.vy = -11;
        player.onGround = false;
        sfxJump();
        shake(8);
        spawnParticles(player.x + player.w/2, z.y, '#38c6ff', 10, 1.2);
        spawnParticles(z.x + z.w/2, z.y, '#55aa33', 10, 1.5);
        addFloatingText(z.x, z.y - 15, "👟 ბაუნსი! (Zombie alive!)", '#ffd23f');
      } else if(!player.isBitten){
        player.isBitten = true;
        player.bitePhase = 'hand';
        player.biteProgress = 0;
        player.biteTimer = 0;
        player.bitingZombie = z;
        sfxHurt();
        sfxScare();
        shake(18);
        triggerFlash('255,0,0', 0.5);
        spawnParticles(player.x + player.w/2, player.y + 15, '#ff0033', 25, 1.8);
        toast("⚠️ 🧟‍♂️ ზომბი გიტევსს! დააჭირე SPACE / F / K-ს სწრაფად გასათავისუფლებლად!", 2500);
      }
    }
    
    if(z.health <= 0){
      spawnParticles(z.x + z.w/2, z.y + z.h/2, z.color, 20, 1.5);
      spawnParticles(z.x + z.w/2, z.y + z.h/2, '#ff0033', 15, 2);
      shake(10);
      zombies.splice(i, 1);
      state.zombiesKilledInLevel++;
      trackQuestProgress('zombies', 1);
      
      // Update Combo
      state.comboCount++;
      state.comboTimer = 2000; // 2 seconds
      
      // Update Rage
      const rageGain = (z.isElite ? 15 : 5) + Math.min(10, state.comboCount);
      state.rageEnergy = Math.min(100, state.rageEnergy + rageGain);
      if(state.rageEnergy >= 100 && !state.isRageActive) {
        state.isRageActive = true;
        state.rageTimer = 8000; // 8 seconds of rage
        sfxDemonic();
        triggerFlash('255, 100, 0', 0.6);
        toast("🔥 RAGE MODE ACTIVATED! 🔥", 2000);
      }

      const points = z.maxHealth * 25 * (1 + state.comboCount * 0.1) * (z.isElite ? 2 : 1);
      state.score += Math.floor(points);
      sfxZombieHit();
      addFloatingText(z.x, z.y - 10, "+" + Math.floor(points) + " 💀", z.isElite ? '#ff9f1c' : '#ff3d6e');
      toast(z.isBoss ? "🔥 გიგანტური ბოსი განადგურდა! +" + Math.floor(points) : (z.isElite ? "🌟 ელიტური ზომბი განადგურდა! +" + Math.floor(points) : "ზომბი განადგურდა! +" + Math.floor(points)), 1000);
    }
  }
}

function updateGodzilla(dt){
  if(!godzillaBoss.active) return;
  const g = godzillaBoss;
  g.animT += dt;

  // Rage Mode Trigger when HP drops below 250
  if(g.hp <= 250 && !g.isRaging){
    g.isRaging = true;
    g.vx = 3.2;
    shake(30);
    sfxDemonic();
    triggerFlash('255,0,0', 0.8);
    toast("🔥 ⚠️ გოდზილა განრისხდა! ⚠️ 🔥", 2500);
  }

  // Godzilla marches down the city street chasing the tank
  g.x += g.vx * g.facing;
  if(g.x < 1200) { g.facing = 1; }
  if(g.x > level.width - 1500) { g.facing = -1; }

  // Stomp screen shake & Shockwave Attack
  g.stompTimer += dt;
  const stompInterval = g.isRaging ? 800 : 1200;
  if(g.stompTimer > stompInterval){
    g.stompTimer = 0;
    shake(g.isRaging ? 20 : 15);
    sfxDemonic();
    spawnParticles(g.x + g.w/2, g.y + g.h, '#ff3d6e', 22, 1.8);

    // Launch ground shockwave toward player
    godzillaProjectiles.push({
      type: 'shockwave',
      x: g.x + (g.facing === -1 ? -20 : g.w + 20),
      y: GROUND_Y - 26,
      vx: g.facing * (g.isRaging ? 9 : 7),
      vy: 0,
      w: 36, h: 26,
      life: 180,
      color: '#00f0ff'
    });
  }

  // Radioactive Fireball Volley Attack
  g.fireballTimer += dt;
  const fireballInterval = g.isRaging ? 1800 : 2800;
  if(g.fireballTimer > fireballInterval){
    g.fireballTimer = 0;
    sfxDemonic();
    shake(12);
    // Launch 3 radioactive fireballs towards player
    for(let i = 0; i < 3; i++){
      const dx = (player.x - g.x);
      const dir = dx > 0 ? 1 : -1;
      godzillaProjectiles.push({
        type: 'fireball',
        x: g.x + g.w/2,
        y: g.y + 40,
        vx: dir * (5 + i*1.5) + (Math.random()*2 - 1),
        vy: -5 - i*1.2,
        size: 16 + i*2,
        life: 200,
        color: '#ff2200'
      });
    }
  }

  // Atomic Beam attack
  g.beamTimer += dt;
  const beamInterval = g.isRaging ? 2200 : 3600;
  if(g.beamTimer > beamInterval){
    g.beamTimer = 0;
    g.isBeaming = true;
    g.beamDuration = g.isRaging ? 1400 : 1100;
    sfxDemonic();
    shake(28);
    triggerFlash('0,180,255', 0.8);
    toast("⚡ ⚠️ გოდზილას ატომური ლაზერი! ⚠️ ⚡", 1500);
  }

  if(g.isBeaming){
    g.beamDuration -= dt;
    if(g.beamDuration <= 0) g.isBeaming = false;

    // Beam hitbox against player
    const beamBox = {
      x: g.facing === -1 ? g.x - 1400 : g.x + g.w,
      y: g.y + 45,
      w: 1400,
      h: 65
    };
    if(overlap(player, beamBox) && player.invuln <= 0 && !player.dead){
      hurtPlayer("💥 გოდზილას ატომურმა ლაზერმა დაგწვა! 💥", "godzilla");
    }
  }

  // Update Godzilla's extra projectiles (fireballs & shockwaves)
  for(let i = godzillaProjectiles.length - 1; i >= 0; i--){
    const p = godzillaProjectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    if(p.type === 'fireball'){
      p.vy += 0.18; // gravity on fireball arc
      if(p.y >= GROUND_Y - 20) p.vy = -p.vy * 0.4;
      spawnParticles(p.x, p.y, '#ff4400', 2, 0.5);
    } else if(p.type === 'shockwave'){
      spawnParticles(p.x, p.y + p.h/2, '#00e5ff', 3, 0.4);
    }

    // Check hit on player
    const pBox = p.type === 'shockwave' ? 
      { x: p.x, y: p.y, w: p.w, h: p.h } : 
      { x: p.x - p.size, y: p.y - p.size, w: p.size*2, h: p.size*2 };

    if(overlap(player, pBox) && player.invuln <= 0 && !player.dead){
      hurtPlayer(p.type==='shockwave' ? "⚡ გოდზილას დარტყმითმა ტალღამ გადაგატრიალა! ⚡" : "🔥 გოდზილას რადიოაქტიურმა ცეცხლმა დაგაზიანა! 🔥", "godzilla");
      godzillaProjectiles.splice(i, 1);
      continue;
    }

    if(p.life <= 0){
      godzillaProjectiles.splice(i, 1);
    }
  }

  // Stomp / Body collision with player
  if(overlap(player, g) && player.invuln <= 0 && !player.dead){
    hurtPlayer("🦖 გოდზილამ გაგჭყლიტა! 🦖", "godzilla");
  }

  // Destroy city buildings in path
  for(const b of cityBuildings){
    if(!b.destroyed && (g.x + g.w > b.x && g.x < b.x + b.w)){
      b.destroyed = true;
      shake(24);
      sfxDemonic();
      spawnParticles(b.x + b.w/2, b.y + b.h/2, '#ff4400', 35, 2);
      spawnParticles(b.x + b.w/2, b.y + b.h/2, '#777777', 30, 1.5);
      addFloatingText(b.x + 30, b.y - 20, "🏢 შენობა დაინგრა! 💥", '#ffaa00');
    }
  }

  // Defeat condition
  if(g.hp <= 0){
    g.active = false;
    godzillaProjectiles = [];
    shake(40);
    triggerFlash('255,215,0', 1.0);
    sfxWin();
    spawnParticles(g.x + g.w/2, g.y + g.h/2, '#ffd23f', 80, 4);
    spawnParticles(g.x + g.w/2, g.y + g.h/2, '#ff3d6e', 80, 4);
    toast("🏆 გოდზილა დამარცხდა! შენ გადაარჩინე ქალაქი! 🏆", 3500);
    state.score += 10000;
    setTimeout(() => {
      levelClear();
    }, 2500);
  }
}

function updateParticles(timeScale = 1){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * timeScale;
    p.y += p.vy * timeScale;
    p.vy += 0.25 * timeScale;
    p.life -= timeScale;
    p.size *= Math.pow(0.96, timeScale);
    if(p.life <= 0 || p.size < 0.4){
      particles.splice(i, 1);
    }
  }

  for(let i = shellCasings.length - 1; i >= 0; i--){
    const sc = shellCasings[i];
    sc.x += sc.vx * timeScale; sc.y += sc.vy * timeScale;
    sc.vy += 0.4 * timeScale;
    sc.rot += sc.vRot * timeScale;
    sc.life -= timeScale;
    if(sc.life <= 0) shellCasings.splice(i, 1);
  }

  for(let i = floatingTexts.length - 1; i >= 0; i--){
    const ft = floatingTexts[i];
    ft.y += ft.vy * timeScale;
    ft.life -= timeScale;
    if(ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

  return levels;
}

let LEVELS = buildLevels();
let level = LEVELS[0];

function skipLevel(){
  if(state.mode!=='playing' && state.mode!=='paused') return;
  sfxWin();
  toast("⏩ დონე გამოტოვებულია!", 1500);
  levelClear();
}

function toast(text, ms=1600){
  state.toastText = text;
  state.toastTimer = ms;
}

function triggerFlash(color, alpha){
  state.flashColor = color;
  state.flashAlpha = alpha;
}

function shake(amount){
  if(state && state.settings){
    if(state.settings.screenShake === 'off') return;
    if(state.settings.screenShake === 'reduced') amount *= 0.35;
  }
  state.shake = Math.max(state.shake, amount);
}

function triggerDash(){
  if(player.dashCooldown > 0 || player.dead || player.isBitten) return;
  player.dashTimer = 220;
  player.dashCooldown = 800;
  player.invuln = 22;
  sfxJump();
  shake(6);
  spawnParticles(player.x + player.w/2, player.y + player.h/2, '#38c6ff', 18, 2);
  toast("⚡ TURBO DASH! ⚡", 700);
}

// ---------- Update Mechanics ----------
function updatePlayer(dt){
  if(player.dead) return;

  // Lasha Skin Weapon Lock (Lasha strictly uses his Electric Guitar)
  if(state.equippedSkin === 'lasha'){
    player.weaponMode = 'guitar';
  }

  // Electro Turbo Boost Timer
  if(player.electroTurboTimer > 0){
    player.electroTurboTimer -= dt;
    if(Math.random() < 0.35){
      spawnParticles(player.x + Math.random()*player.w, player.y + Math.random()*player.h, '#ffd23f', 1, 0.8);
    }
  }

  if(state.comboTimer > 0){
    state.comboTimer -= dt;
    if(state.comboTimer <= 0) state.combo = 0;
  }

  // Coin & Collectible Magnet Ability
  if(state.upgrades.magnet && level){
    const items = [
      ...(level.coins||[]),
      ...(level.energyCrystals||[]),
      ...(level.electroOrbs||[]),
      ...(level.goldTrophies||[])
    ];
    items.forEach(c => {
      if(c.taken) return;
      const dx = (player.x + player.w/2) - (c.x + c.w/2);
      const dy = (player.y + player.h/2) - (c.y + c.h/2);
      const dist = Math.hypot(dx, dy);
      if(dist < 240){
        c.x += (dx / dist) * 8;
        c.y += (dy / dist) * 8;
      }
    });
  }

  // Handle Falling off world state with "ადიოს მუჩაჩოოსსსს"
  if(player.isFalling){
    player.fallTimer += dt;
    player.fallRotation += 0.14;
    player.vy = (player.vy || 3) + GRAVITY * 0.7;
    player.y += player.vy;
    player.x += player.facing * 1.5;

    // Smooth camera tracking panning down following the player into the abyss
    let targetCamY = Math.max(0, player.y - H * 0.42);
    camY += (targetCamY - camY) * 0.12;

    // Wind & debris particles rushing up during fall
    if(Math.random() < 0.65){
      particles.push({
        x: player.x + (Math.random() - 0.5) * 50,
        y: player.y + 20,
        vx: (Math.random() - 0.5) * 3,
        vy: -Math.random() * 8 - 4,
        life: 25,
        color: Math.random() < 0.5 ? '#ff3d6e' : '#ffd23f',
        size: 3 + Math.random() * 3
      });
    }

    const pitThresholdY = (level && level.isVerticalLevel) ? ((level.risingHordeY || GROUND_Y + 500) + 150) : (GROUND_Y + 180);
    if(player.fallTimer > 1200 || player.y > pitThresholdY){
      sfxDeathCustom();
      hurtPlayer("ადიოს მუჩაჩოოსსსს! 💀", "pit");
    }
    return;
  }

  if(player.fastenerTimer > 0) player.fastenerTimer -= dt;
  if(player.reverseControlsTimer > 0) player.reverseControlsTimer -= dt;

  // Handle Zombie Biting & Struggle state
  if(player.isBitten){
    player.vx = 0;
    player.biteTimer += dt;

    // Pin biting zombie to player arm or leg
    const z = player.bitingZombie;
    if(z && z.health > 0){
      z.x = player.x + (player.facing === 1 ? 22 : -28);
      z.y = player.bitePhase === 'hand' ? player.y - 4 : player.y + 18;
      z.facing = player.facing === 1 ? -1 : 1;
      z.vx = 0; z.vy = 0;
    } else {
      player.isBitten = false;
      player.bitingZombie = null;
    }

    // Blood spray particles
    if(Math.random() < 0.35){
      spawnParticles(
        player.x + player.w/2 + (player.facing * 12),
        player.y + (player.bitePhase === 'hand' ? 12 : 36),
        '#ff0033', 4, 1.2
      );
    }

    // Phase transition timers (2.2s per phase if not escaped)
    if(player.bitePhase === 'hand' && player.biteTimer > 2200){
      player.bitePhase = 'foot';
      player.biteTimer = 0;
      player.biteProgress = Math.max(0, player.biteProgress - 25);
      sfxHurt();
      sfxScare();
      shake(20);
      triggerFlash('255,0,0', 0.6);
      spawnParticles(player.x + player.w/2, player.y + 36, '#ff0033', 30, 2);
      toast("🩸 ⚠️ ზომბი გადავიდა ფეხზე! სწრაფად დააჭირე SPACE / F / K! 🦶", 2500);
      addFloatingText(player.x, player.y - 25, "🩸 ფეხის კბენა!", '#ff0033');
    } else if(player.bitePhase === 'foot' && player.biteTimer > 2200){
      player.isBitten = false;
      player.bitingZombie = null;
      hurtPlayer("🧟‍♂️ ზომბიმ გეოდინო შეიპყრო და შეჭამა! 💀", "zombie");
      return;
    }
  }

  const isFastener = player.fastenerTimer > 0;
  const isReverse = player.reverseControlsTimer > 0;
  const isBike = player.weaponMode === 'bike';

  const rageSpeedMult = state.isRageActive ? 1.35 : 1.0;
  const bikeSpeedMult = isBike ? 1.6 : 1.0;
  const turboSpeedMult = (player.electroTurboTimer > 0) ? 1.35 : 1.0;
  const speed = (isFastener ? 8.2 : 4.8) * rageSpeedMult * bikeSpeedMult * turboSpeedMult;
  const baseJumpPower = (state.settings && state.settings.highJumpAssist) ? -16.0 : -13.8;
  const jumpPower = (isFastener ? -17.5 : baseJumpPower) * (state.isRageActive ? 1.1 : 1.0) * (isBike ? 0.9 : 1.0);

  // Auto-fire gameplay setting
  
  let leftKey = keys['ArrowLeft']||keys['KeyA'];
  let rightKey = keys['ArrowRight']||keys['KeyD'];

  if(isReverse){
    const temp = leftKey; leftKey = rightKey; rightKey = temp;
  }

  const left = leftKey;
  const right = rightKey;

  if(player.gunRecoil > 0) player.gunRecoil *= 0.8;

  // Dash controls
  if(keys['ShiftLeft']||keys['ShiftRight']||keys['KeyE']){
    if(!player.dashKeyPressed){
      player.dashKeyPressed = true;
      triggerDash();
    }
  } else {
    player.dashKeyPressed = false;
  }

  if(state.isRageActive && Math.random() < 0.25){
    particles.push({
      x: player.x + Math.random() * player.w,
      y: player.y + player.h,
      vx: (Math.random() - 0.5) * 2,
      vy: -Math.random() * 3,
      life: 20,
      color: '#ff4d00',
      size: 4
    });
  }
  
  if(player.dashTimer > 0){
    player.dashTimer -= dt;
    player.vx = player.facing * 15.5;
    if(Math.random() < 0.6){
      particles.push({
        x: player.x + Math.random() * player.w,
        y: player.y + Math.random() * player.h,
        vx: -player.facing * (2 + Math.random()*2),
        vy: (Math.random() - 0.5) * 2,
        life: 16,
        color: Math.random() < 0.5 ? '#38c6ff' : '#ffd23f',
        size: 4
      });
    }
  } else if(player.slipping>0){
    player.slipping--;
    player.vx = player.facing*7.5*(player.slipping/40);
  } else {
    if(left){ player.vx = -speed; player.facing=-1; }
    else if(right){ player.vx = speed; player.facing=1; }
    else { player.vx *= (0.78 + (1 - (weather.slipperyFactor || 1)) * 0.16); }
  }

  if(player.dashCooldown > 0) player.dashCooldown -= dt;

  // Running & Fastener particles
  if(player.onGround && Math.abs(player.vx) > 1){
    if(isBike){
      // Motorcycle exhaust & wheel smoke
      if(Math.random() < 0.4){
        spawnParticles(player.x + (player.facing === 1 ? -22 : 22), player.y + player.h, '#888', 3, 0.4);
      }
      if(Math.random() < 0.3){
        spawnParticles(player.x + (player.facing === 1 ? 28 : -28), player.y + player.h, '#555', 1, 0.3);
      }
    }
    if(isFastener){
      spawnParticles(player.x+player.w/2, player.y+player.h, Math.random()<0.5?'#38c6ff':'#ffd23f', 2, 0.5);
    } else if(Math.random()<0.35){
      particles.push({
        x: player.x + (player.facing===-1? player.w : 0),
        y: player.y + player.h - 4,
        vx: -player.facing * (1 + Math.random()*2),
        vy: -Math.random()*1.5,
        life: 18, color: '#a08560', size: 3
      });
    }
  }

  // Wings / Golden Angel Wings flight timer & soaring controls
  if(player.wingsTimer > 0){
    player.wingsTimer -= dt;
    if(keys['Space']||keys['ArrowUp']||keys['KeyW']){
      player.vy = Math.max(-13.5, player.vy - 1.15); // Powerful continuous soaring flight
      player.onGround = false;
      if(Math.random() < 0.4){
        spawnParticles(player.x + player.w/2 + (Math.random()-0.5)*20, player.y + player.h - 4, '#ffd23f', 2, 1.8);
        spawnParticles(player.x + player.w/2 + (Math.random()-0.5)*20, player.y + player.h - 4, '#ffffff', 2, 1.5);
      }
    }
  }

  // Jump, Double Jump & Wall Jump
  if(keys['Space']||keys['ArrowUp']||keys['KeyW']){
    if(player.onGround && !player.jumpKeyPressed){
      player.vy = jumpPower;
      player.onGround = false;
      player.jumpCount = 1;
      player.jumpKeyPressed = true;
      sfxJump();
      spawnParticles(player.x+player.w/2, player.y+player.h, isFastener?'#38c6ff':'#ffffff', 10);
    } else if(!player.onGround && !player.jumpKeyPressed && state.upgrades.doubleJump && player.jumpCount === 1){
      player.vy = jumpPower * 0.92;
      player.jumpCount = 2;
      player.jumpKeyPressed = true;
      sfxJump();
      spawnParticles(player.x+player.w/2, player.y+player.h, '#38c6ff', 18, 2.5);
      toast("🚀 DOUBLE JUMP!", 600);
    } else if(!player.onGround && !player.jumpKeyPressed){
      // Wall Jump
      let wallDir = 0;
      for(const p of (level.plats || [])){
        if(player.y + player.h > p.y + 4 && player.y < p.y + p.h - 4){
          if(Math.abs((player.x + player.w) - p.x) < 14) wallDir = -1;
          else if(Math.abs(player.x - (p.x + p.w)) < 14) wallDir = 1;
        }
      }
      if(wallDir !== 0){
        player.vy = -14.8;
        player.vx = wallDir * 11.5;
        player.facing = wallDir;
        player.jumpCount = 1;
        player.jumpKeyPressed = true;
        sfxJump();
        spawnParticles(player.x + (wallDir === -1 ? player.w : 0), player.y + player.h/2, '#38c6ff', 20, 2.5);
        toast("🧗‍♂️ WALL JUMP!", 600);
        addFloatingText(player.x, player.y - 25, "🧗‍♂️ WALL JUMP!", '#38c6ff');
      }
    }
  } else {
    player.jumpKeyPressed = false;
  }

  player.vy += GRAVITY;
  if(player.vy>18) player.vy=18;

  player.x += player.vx;
  player.y += player.vy;

  if(player.x < camX+4) player.x = camX+4;

  // Platform collision & moving platforms update
  const wasOnGround = player.onGround;
  player.onGround = false;
  for(const p of (level.plats || [])){
    // Update platform movement
    if(p.vx){
      p.x += p.vx;
      if(p.x <= p.minX || p.x >= p.maxX) p.vx *= -1;
    }
    if(p.vy){
      p.y += p.vy;
      if(p.y <= p.minY || p.y >= p.maxY) p.vy *= -1;
    }

    if(p.oneWay){
      if(overlap(player, p)){
        const prevBottom = player.y - player.vy + player.h;
        if(player.vy >= 0 && prevBottom <= p.y + 8){
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
          if(p.vx) player.x += p.vx;
        }
      }
      continue;
    }

    if(overlap(player,p)){
      const prevBottom = player.y - player.vy + player.h;
      if(player.vy >= 0 && prevBottom <= p.y+4){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
        if(p.vx) player.x += p.vx; // carry player
      } else if(player.vy<0 && player.y - player.vy >= p.y+p.h-4){
        player.y = p.y+p.h;
        player.vy = 1;
      } else {
        if(player.vx>0) player.x = p.x - player.w;
        else if(player.vx<0) player.x = p.x + p.w;
        player.vx = 0;
      }
    }
  }

  // Movable Pushboxes Physics & Collision
  if(level.pushboxes){
    for(const b of level.pushboxes){
      b.vy = (b.vy || 0) + GRAVITY * 0.75;
      if(b.vy > 14) b.vy = 14;
      b.vx = (b.vx || 0) * 0.82; // friction

      b.x += b.vx;
      b.y += b.vy;

      // Pushbox vs Platforms collision
      b.onGround = false;
      for(const p of (level.plats || [])){
        if(overlap(b, p)){
          const prevBoxBottom = b.y - b.vy + b.h;
          if(b.vy >= 0 && prevBoxBottom <= p.y + 8){
            b.y = p.y - b.h;
            b.vy = 0;
            b.onGround = true;
          } else {
            if(b.vx > 0) b.x = p.x - b.w;
            else if(b.vx < 0) b.x = p.x + p.w;
            b.vx = 0;
          }
        }
      }

      // Player vs Pushbox collision
      if(overlap(player, b)){
        const prevPlayerBottom = player.y - player.vy + player.h;
        if(player.vy >= 0 && prevPlayerBottom <= b.y + 10){
          player.y = b.y - player.h;
          player.vy = 0;
          player.onGround = true;
        } else {
          if(player.vx > 0){
            b.vx = Math.max(b.vx, player.vx * 0.75);
            player.x = b.x - player.w;
          } else if(player.vx < 0){
            b.vx = Math.min(b.vx, player.vx * 0.75);
            player.x = b.x + b.w;
          }
        }
      }
    }
  }

  // Cloud Parkour Platforms (Spring Bounce into clouds)
  for(const c of (level.clouds || [])){
    const curY = c.y + Math.sin(state.time * (c.bobSpeed || 0.003) + c.x * 0.01) * (c.bobAmp || 6);
    const cloudBox = { x: c.x, y: curY, w: c.w, h: c.h };
    if(overlap(player, cloudBox)){
      const prevBottom = player.y - player.vy + player.h;
      if(player.vy >= 0 && prevBottom <= curY + 12){
        player.y = curY - player.h;
        player.vy = -16.2; // Spring jump boost!
        player.onGround = true;
        sfxJump();
        spawnParticles(player.x + player.w/2, curY, '#38c6ff', 20, 2.5);
        spawnParticles(player.x + player.w/2, curY, '#ffffff', 14, 2.0);
        toast("☁️ ღრუბლის ბატუტი! 🚀 (სუპერ ნახტომი)", 900);
      }
    }
  }

  // Timed Pop-up Spikes
  for(const ps of (level.popspikes || [])){
    const cycle = (state.time + (ps.offset || 0)) % (ps.period || 2000);
    const isUp = cycle < ((ps.period || 2000) / 2);
    if(isUp){
      if(overlap(player, ps) && player.invuln <= 0){
        hurtPlayer("მოძრავი გილიოტინის ხაფანგი! 🩸");
      }
    } else {
      if(overlap(player, ps)){
        const prevBottom = player.y - player.vy + player.h;
        if(player.vy >= 0 && prevBottom <= ps.y + 10){
          player.y = ps.y - player.h;
          player.vy = 0;
          player.onGround = true;
        }
      }
    }
  }

  // Trampoline Spring Pads
  for(const tp of (level.trampolines || [])){
    if(overlap(player, tp)){
      player.vy = -19.5;
      player.onGround = true;
      sfxJump();
      shake(8);
      spawnParticles(tp.x + tp.w/2, tp.y, '#ffd23f', 20, 2.8);
      toast("🚀 TRAMPOLINE LAUNCH! 🚀", 700);
    }
  }

  // Speed Booster Strips
  for(const bs of (level.boosters || [])){
    if(overlap(player, bs)){
      player.vx = player.facing * 22;
      sfxJump();
      spawnParticles(player.x, player.y + player.h, '#00f0ff', 12, 3);
      toast("⚡ SUPERSONIC BOOST STRIP! ⚡", 600);
    }
  }


  // Gravity Runes
  for(const gr of (level.gravityRunes || [])){
    if(!gr.taken && overlap(player, gr)){
      gr.taken = true;
      sfxBell();
      sfxScare();
      shake(15);
      triggerFlash('168,85,247', 0.8);
      player.vy = -16;
      player.reverseControlsTimer = 4000;
      spawnParticles(gr.x + gr.w/2, gr.y + gr.h/2, '#a855f7', 25, 2.5);
      toast("🔮 გრავიტაციული რუნა! სუპერ ნახტომი & კოსმიური ჰაერი! 🌌", 2200);
    }
  }

  // Rolling Boulders
  for(const bd of (level.boulders || [])){
    bd.x += bd.vx || -3.5;
    bd.angle = (bd.angle || 0) - 0.12;

    const bBox = { x: bd.x - bd.r, y: bd.y - bd.r, w: bd.r * 2, h: bd.r * 2 };
    if(overlap(player, bBox) && player.invuln <= 0){
      hurtPlayer("💥 გიგანტური მოგორავე ლოდის დარტყმა!");
      player.vx = -8;
      shake(18);
    }
  }

  // Poison Skull Traps (Collect & Hurt)
  for(const t of (level.traps || [])){
    if(!t.taken && overlap(player, t)){
      t.taken = true;
      sfxHurt();
      sfxScare();
      shake(22);
      triggerFlash('168,85,247', 0.85);
      spawnParticles(t.x + t.w/2, t.y + t.h/2, '#a855f7', 28, 2.5);
      toast("💀 შხამიანი ხაფანგი! -1 სიცოცხლე!", 2200);
      hurtPlayer("💀 მოწამლული ხაფანგის შეგროვება!");
    }
  }

  // Spinning Saw Hazards
  for(const s of (level.spinners || [])){
    const px = player.x + player.w/2;
    const py = player.y + player.h/2;
    const dist = Math.hypot(px - s.cx, py - s.cy);
    if(dist < (s.r || 36) + 12 && player.invuln <= 0){
      spawnParticles(px, py, '#ef4444', 20, 2.5);
      sfxHurt();
      shake(16);
      hurtPlayer("მბრუნავი ხერხის პირის დარტყმა! 🪚");
    }
  }

  // PRO OBBY: Laser Beams
  for(const l of (level.lasers || [])){
    const cycle = (state.time + (l.offset || 0)) % (l.period || 2000);
    const isActive = cycle < ((l.period || 2000) / 2);
    if(isActive){
      const laserRect = { x: l.x, y: l.y + l.h/2 - 4, w: l.w, h: 8 };
      if(overlap(player, laserRect) && player.invuln <= 0){
        spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff0055', 24, 3.0);
        sfxHurt();
        shake(20);
        hurtPlayer("⚡ ელექტრო-ლაზერული ბარიერი! 🩸");
      }
    }
  }

  // PRO OBBY: Heavy Hydraulic Crushers
  for(const cr of (level.crushers || [])){
    if(cr.dropProgress === undefined) cr.dropProgress = 0;
    if(!cr.state) cr.state = 'top';

    if(cr.state === 'top'){
      cr.timer = (cr.timer || 0) + dt;
      if(cr.timer > 1200){
        cr.state = 'dropping';
        cr.timer = 0;
      }
    } else if(cr.state === 'dropping'){
      cr.dropProgress += (cr.dropSpeed || 9);
      if(cr.dropProgress >= (cr.maxDrop || 140)){
        cr.dropProgress = cr.maxDrop || 140;
        cr.state = 'bottom';
        cr.timer = 0;
        shake(15);
        sfxHurt();
      }
    } else if(cr.state === 'bottom'){
      cr.timer = (cr.timer || 0) + dt;
      if(cr.timer > 600){
        cr.state = 'rising';
        cr.timer = 0;
      }
    } else if(cr.state === 'rising'){
      cr.dropProgress -= (cr.riseSpeed || 2.5);
      if(cr.dropProgress <= 0){
        cr.dropProgress = 0;
        cr.state = 'top';
        cr.timer = 0;
      }
    }

    const curY = cr.topY + cr.dropProgress;
    const crusherRect = { x: cr.x, y: curY, w: cr.w, h: cr.h + 12 };
    if(overlap(player, crusherRect) && player.invuln <= 0){
      spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ef4444', 28, 3.5);
      sfxHurt();
      shake(25);
      hurtPlayer("⛓️ მძიმე ჰიდრავლიკური გილიოტინა! 🩸");
    }
  }

  // PRO OBBY: Lava Firejets
  for(const fj of (level.firejets || [])){
    const cycle = (state.time + (fj.offset || 0)) % (fj.period || 2200);
    const isActive = cycle < 1100;
    if(isActive){
      const flameRect = { x: fj.x - 10, y: fj.y - (fj.flameH || 130), w: fj.w + 20, h: fj.flameH || 130 };
      if(overlap(player, flameRect) && player.invuln <= 0){
        spawnParticles(player.x + player.w/2, player.y + player.h/2, '#f59e0b', 20, 2.5);
        sfxHurt();
        shake(18);
        hurtPlayer("🔥 ცეცხლოვანი ვულკანის ნაკადი! 🌋");
      }
    }
  }

  // Swinging Axe Hazards
  for(const ax of (level.swingingAxes || [])){
    const angle = Math.sin(state.time * (ax.speed || 0.002) + (ax.offset || 0)) * (ax.range || 1.2);
    const axX = ax.cx + Math.sin(angle) * ax.len;
    const axY = ax.cy + Math.cos(angle) * ax.len;
    const px = player.x + player.w/2;
    const py = player.y + player.h/2;
    const dist = Math.hypot(px - axX, py - axY);
    if(dist < 45 && player.invuln <= 0){
      spawnParticles(px, py, '#94a3b8', 25, 3.0);
      sfxHurt();
      shake(22);
      hurtPlayer("🪓 მბრუნავი ნაჯახის დარტყმა! 🩸");
    }
  }

  // Conveyor Belts
  for(const cv of (level.conveyors || [])){
    if(overlap(player, cv)){
      const prevBottom = player.y - player.vy + player.h;
      if(player.vy >= 0 && prevBottom <= cv.y + 10){
        player.y = cv.y - player.h;
        player.vy = 0;
        player.onGround = true;
        player.x += cv.speed; // Push player
      }
    }
  }

  // PRO OBBY: Acid Geysers
  for(const ag of (level.acidGeysers || [])){
    const cycle = (state.time + (ag.offset || 0)) % (ag.period || 2000);
    const isActive = cycle < 1000;
    if(isActive){
      const acidRect = { x: ag.x - 18, y: ag.y - 120, w: 36, h: 120 };
      if(overlap(player, acidRect) && player.invuln <= 0){
        spawnParticles(player.x + player.w/2, player.y + player.h/2, '#10b981', 20, 2.5);
        sfxHurt();
        shake(18);
        hurtPlayer("🧪 ტოქსიკური მჟავას ამოფრქვევა! 🤢");
      }
    }
  }

  // PRO OBBY: Crumbling Platforms
  for(const cp of (level.crumblingPlats || [])){
    if(cp.broken){
      cp.respawnTimer = (cp.respawnTimer || 0) + dt;
      if(cp.respawnTimer > 3500){
        cp.broken = false;
        cp.stepped = false;
        cp.stepTimer = 0;
        cp.respawnTimer = 0;
      }
      continue;
    }

    if(overlap(player, cp)){
      const prevBottom = player.y - player.vy + player.h;
      if(player.vy >= 0 && prevBottom <= cp.y + 12){
        player.y = cp.y - player.h;
        player.vy = 0;
        player.onGround = true;
        cp.stepped = true;
      }
    }

    if(cp.stepped){
      cp.stepTimer = (cp.stepTimer || 0) + dt;
      if(cp.stepTimer > 450){
        cp.broken = true;
        sfxHurt();
        spawnParticles(cp.x + cp.w/2, cp.y + cp.h/2, '#f59e0b', 24, 2.5);
      }
    }
  }

  // Dust cloud landing effect when player hits ground after falling
  if(!wasOnGround && player.onGround){
    spawnParticles(player.x + player.w/2, player.y + player.h, '#d4b483', 18, 1.6);
    spawnParticles(player.x + player.w/2, player.y + player.h, '#ffffff', 10, 1.2);
    spawnParticles(player.x + player.w/2, player.y + player.h, '#a08560', 12, 1.4);
  }

  // Trigger "ადიოს მუჩაჩოოსსსს" when falling off world into pit
  const maxFallLimitY = (level && level.isVerticalLevel) ? (level.risingHordeY || GROUND_Y + 500) : (GROUND_Y + 25);
  if(player.y > maxFallLimitY && !player.isFalling && !player.onGround){
    player.isFalling = true;
    player.fallTimer = 0;
    player.fallRotation = 0;
    player.vy = 4;
    sfxFall();
    sfxDeathCustom();
    shake(20);
    toast("ადიოს მუჩაჩოოსსსს! 💀", 2200);
    addFloatingText(player.x, player.y - 30, "ადიოს მუჩაჩოოსსსს! 🗣️", '#ff3d6e');
  }

  // Fake spikes
  for(const f of (level.fakespikes || [])){
    if(overlap(player,f) && !f.hit){
      f.hit = true;
      sfxPrankGood();
      toast("დაისვენე, ეს ბალიშია 🛏️", 1400);
    }
  }

  // Real spikes
  for(const s of (level.spikes || [])){
    if(overlap(player,s) && player.invuln<=0){
      hurtPlayer("მოულოდნელი ხაფანგი! 🩸");
    }
  }

  // Lava hazards
  if(level.lavas){
    for(const l of level.lavas){
      if(overlap(player, l) && player.invuln <= 0){
        spawnParticles(player.x+player.w/2, player.y+player.h, '#ff5500', 16, 2.5);
        spawnParticles(player.x+player.w/2, player.y+player.h, '#ffd23f', 12, 2.0);
        hurtPlayer("ცხელ ლავაში ჩავარდი! 🌋🔥");
      }
    }
  }

  // Water hazards / deep crosses
  if(level.waters){
    for(const w of level.waters){
      if(overlap(player, w) && player.invuln <= 0){
        spawnParticles(player.x+player.w/2, w.y+10, '#38c6ff', 16, 2.2);
        spawnParticles(player.x+player.w/2, w.y+10, '#ffffff', 10, 1.8);
        hurtPlayer("წყლის გადაკვეთაში ჩაიძირე! 🌊💀");
      }
    }
  }

  // Bananas
  for(const b of (level.bananas || [])){
    if(overlap(player,b) && player.slipping<=0 && !b.used){
      player.slipping = 40;
      sfxSlip();
      toast("ბანანის კალთა! უუუ 🍌", 1200);
    }
  }

  // Coins
  for(const c of (level.coins || [])){
    if(!c.taken && overlap(player,c)){
      c.taken = true;
      state.coinsCollectedInLevel++;
      const coinAdd = (state.settings && (state.settings.difficulty === 'hardcore')) ? 2 : 1;
      addScore(10 * coinAdd);
      state.coinsCollected = (state.coinsCollected || 0) + coinAdd;
      trackQuestProgress('coins', coinAdd);
      sfxCoin();
      spawnParticles(c.x+c.w/2, c.y+c.h/2, '#38c6ff', 8);
      checkAchievements();
    }
  }

  // Energy Crystals (💎)
  for(const c of (level.energyCrystals || [])){
    if(!c.taken && overlap(player, c)){
      c.taken = true;
      sfxWin();
      addScore(500);
      state.coinsCollected = (state.coinsCollected || 0) + 25;
      trackQuestProgress('crystals', 1);
      spawnParticles(c.x + c.w/2, c.y + c.h/2, '#00f0ff', 16, 2);
      addFloatingText(c.x, c.y - 10, "+25 🪙 +500 SCORE 💎", '#00f0ff');
      checkAchievements();
    }
  }

  // Electro Orbs (⚡)
  for(const o of (level.electroOrbs || [])){
    if(!o.taken && overlap(player, o)){
      o.taken = true;
      sfxWin();
      addScore(300);
      state.coinsCollected = (state.coinsCollected || 0) + 10;
      player.electroTurboTimer = 6000; // 6 seconds electro speed boost!
      spawnParticles(o.x + o.w/2, o.y + o.h/2, '#ffd23f', 16, 2);
      toast("⚡ ELECTRO TURBO BOOST! ⚡ (სუპერ სიჩქარე!)", 2200);
      addFloatingText(o.x, o.y - 10, "⚡ TURBO BOOST! ⚡", '#ffd23f');
    }
  }

  // Gold Trophies (🏆)
  for(const t of (level.goldTrophies || [])){
    if(!t.taken && overlap(player, t)){
      t.taken = true;
      sfxBell();
      addScore(1000);
      state.coinsCollected = (state.coinsCollected || 0) + 50;
      trackQuestProgress('trophies', 1);
      spawnParticles(t.x + t.w/2, t.y + t.h/2, '#ffd23f', 22, 2.5);
      toast("🏆 ოქროს თასი მიღებულია! +1000 ქულა! 🏆", 2200);
      addFloatingText(t.x, t.y - 10, "🏆 CHAMPION TROPHY! +50 🪙", '#ffd23f');
    }
  }

  // Golden Wings (🪽) - Soaring Flight Power-up!
  for(const w of (level.wings || [])){
    if(!w.taken && overlap(player, w)){
      w.taken = true;
      sfxWin();
      sfxBell();
      player.wingsTimer = 15000; // 15 seconds of soaring flight power!
      player.vy = -12;
      shake(12);
      spawnParticles(w.x + w.w/2, w.y + w.h/2, '#ffd23f', 28, 3.2);
      spawnParticles(w.x + w.w/2, w.y + w.h/2, '#ffffff', 22, 2.6);
      toast("🪽 ოქროს ფრთები! (HOLD SPACE / UP TO FLY!) 🚀✨", 3200);
      addFloatingText(w.x, w.y - 15, "🪽 GOLDEN WINGS OF FLIGHT! 🚀", '#ffd23f');
    }
  }

  // Bells
  for(const b of (level.bells || [])){
    if(!b.taken && overlap(player,b)){
      b.taken = true;
      addScore(150);
      sfxBell();
      spawnParticles(b.x+b.w/2, b.y+b.h/2, '#ff3d6e', 10);
      toast("+150 ქულა! 🔔", 1200);
    }
  }
  // Jumpboxes / Lucky Drops (Hit from below, kick from above, or sides!)
  for(const jb of (level.jumpboxes || [])){
    if(!jb.hit && overlap(player, jb)){
      const comesFromAbove = player.vy >= 0 && (player.y + player.h - player.vy) <= (jb.y + 16);
      activateJumpbox(jb);

      if(comesFromAbove){
        // Kicked/landed on top of lucky drop from above -> bounce player up high!
        player.vy = -12.5;
        player.onGround = true;
      } else {
        // Hit from below -> push player down slightly
        player.vy = Math.max(player.vy, 2);
      }
    }
    if(jb.bounceY){
      jb.bounceY += 1.5;
      if(jb.bounceY > 0) jb.bounceY = 0;
    }
  }

  // Bushes jumpscare
  for(const bush of (level.bushes || [])){
    const triggerZone = rect(bush.x-40, bush.y-60, bush.w+80, bush.h+60);
    if(!bush.triggered && overlap(player,triggerZone)){
      bush.triggered = true;
      doJumpscare('face');
    }
  }

  // Building Swinging Traversal (Ropes / Steel Hooks)
  if(level && level.swingPoints){
    for(const sp of level.swingPoints){
      const px = player.x + player.w/2;
      const py = player.y + player.h/2;
      const dist = Math.hypot(px - sp.x, py - sp.y);
      if(dist < (sp.radius || 190) && !player.onGround && player.vy > -3){
        if(player.isSwinging !== sp){
          player.isSwinging = sp;
          sfxJump();
          toast("🎯 SWINGING HOOK LATCHED!", 700);
          addFloatingText(player.x, player.y - 30, "🎯 HOOK LATCHED!", '#38c6ff');
        }
      }
      if(player.isSwinging === sp){
        const angle = Math.atan2(px - sp.x, py - sp.y);
        sp.swingAngle = (sp.swingAngle || angle) + 0.05 * player.facing;
        const len = sp.len || 150;
        player.x = sp.x + Math.sin(sp.swingAngle) * len - player.w/2;
        player.y = sp.y + Math.cos(sp.swingAngle) * len - player.h/2;
        if(keys['Space']||keys['ArrowUp']||keys['KeyW']){
          player.isSwinging = null;
          player.vy = -16.5;
          player.vx = player.facing * 16.0;
          player.jumpCount = 1;
          player.jumpKeyPressed = true;
          sfxJump();
          shake(10);
          spawnParticles(player.x + player.w/2, player.y + player.h/2, '#38c6ff', 25, 3.0);
          toast("🚀 MASSIVE SWING LAUNCH! 💥", 1000);
          addFloatingText(player.x, player.y - 30, "🚀 SWING LAUNCH!", '#ffd23f');
        }
      }
    }
  }

  // Steam Vents
  if(level && level.steamVents){
    for(const sv of level.steamVents){
      const cycle = (state.time + (sv.offset || 0)) % (sv.period || 2200);
      if(cycle < 1100){
        const steamRect = { x: sv.x, y: sv.y - (sv.h || 120), w: sv.w || 40, h: sv.h || 120 };
        if(overlap(player, steamRect)){
          player.vy = -15.5;
          sfxJump();
          spawnParticles(player.x + player.w/2, player.y + player.h, '#e2e8f0', 12, 2.0);
          addFloatingText(player.x, player.y - 20, "💨 STEAM VENT BOOST!", '#cbd5e1');
        }
      }
    }
  }

  // Continuous Chase Dynamic: Escalating Rising Horde / Collapse
  if(level && level.risingHordeSpeed && state.mode === 'playing' && !player.dead){
    if(level.risingHordeY === undefined) level.risingHordeY = GROUND_Y + 120;
    level.risingHordeY -= (level.risingHordeSpeed || 0.88) * (dt * 0.06);
    if(player.y + player.h >= level.risingHordeY && player.invuln <= 0){
      spawnParticles(player.x + player.w/2, player.y + player.h, '#ef4444', 30, 3.0);
      sfxHurt();
      shake(22);
      hurtPlayer("🔥 ზომბების ორდომ და ნანგრევებმა მოგაკითხა! 🧟‍♂️💀", "pit");
    }
  }

  // Checkpoint Interaction (Only when safely standing on solid ground away from hazards)
  if(level && level.checkpoints && state.levelIndex !== 0){
    for(const cp of level.checkpoints){
      if(!cp.active && player.onGround && !player.isFalling && player.vy >= 0 && overlap(player, cp)){
        cp.active = true;
        level.activeCheckpoint = { x: cp.x + cp.w/2 - player.w/2, y: cp.y + cp.h - player.h - 2 };
        trackQuestProgress('checkpoints', 1);
        sfxWin();
        shake(12);
        spawnParticles(cp.x + cp.w/2, cp.y + cp.h/2, '#22c55e', 30, 2.2);
        spawnParticles(cp.x + cp.w/2, cp.y + cp.h/2, '#ffd23f', 20, 1.8);
        addFloatingText(cp.x, cp.y - 30, "🚩 ჩექფოინთი გააქტიურდა! ✅", '#22c55e');
        toast("🚩 ჩექფოინთი შენახულია! დაღუპვისას აქედან განაგრძობ! ✅", 2800);
      }
    }
  }

  // Flag -> level clear
  if(overlap(player, level.flag)){
    levelClear();
  }

  if(player.invuln>0) player.invuln--;
  if(player.crying>0) player.crying--;
  player.animT += dt;

  camX = Math.max(0, Math.min(level.width - W, player.x - W*0.38));
  if(player.wingsTimer > 0 || (level && level.isVerticalLevel) || player.y < GROUND_Y - 220){
    let targetCamY = Math.min(0, player.y - H * 0.45);
    camY += (targetCamY - camY) * 0.14;
  } else if(!player.isFalling){
    let targetCamY = 0;
    camY += (targetCamY - camY) * 0.14;
  }
  
  updateZombies(dt);
  updateBullets();
  updateParticles();
}

function hurtPlayer(msg, cause='zombie'){
  const isPit = cause === 'pit';
  if((player.invuln > 0 && !isPit) || player.dead) return;

  if(player.hasShield && !isPit){
    player.hasShield = false;
    player.invuln = 60;
    sfxBell();
    shake(12);
    triggerFlash('56,198,255', 0.8);
    toast("🛡️ ენერგოფარმა დარტყმა აირეკლა!", 2000);
    spawnParticles(player.x+player.w/2, player.y+player.h/2, '#38c6ff', 35, 3);
    return;
  }

  const isHardcore = state.settings && state.settings.difficulty === 'hardcore';
  player.invuln = isHardcore ? 30 : 60; // Reduced invuln frames in hardcore

  if(isPit){
    player.hasShield = false;
    player.isFalling = false;
  }

  const dmg = (isHardcore && !isPit) ? 2 : 1;
  state.lives = Math.max(0, state.lives - dmg);
  player.crying = 60;
  if(cause === 'godzilla') state.lastKilledByGodzilla = true;
  sfxHurt();
  shake(18);
  triggerFlash('255,0,50', 0.65);
  toast(`ადიოს მუჩაჩოოოსსსს! 🗣️ ${msg} (დარჩა ${state.lives} ❤️)`, 2500);

  if(state.lives<=0){
    player.dead = true;
    player.isFalling = false;
    sfxDeathCustom();
    sfxDemonic();
    sfxScare();
    const spawnY = Math.min(H - 60, Math.max(80, player.y + player.h/2));
    const deathX = player.x + player.w/2;

    spawnParticles(deathX, spawnY, '#ff3d6e', 50, 3.2);
    spawnParticles(deathX, spawnY, '#ffd23f', 40, 2.8);
    spawnParticles(deathX, spawnY, '#ffffff', 30, 2.0);

    state.deathCam = {
      active: true,
      timer: 2400,
      maxTimer: 2400,
      deathX: deathX,
      deathY: spawnY,
      causeMsg: msg || "კრიტიკული დამარცხება! 💀",
      zoom: 1
    };

    shake(30);
    triggerFlash('255,0,0', 0.85);

    if(state.lastKilledByGodzilla || (level && level.isGodzillaLevel)){
      triggerNukeSequence();
    }
  } else {
    resetPlayer(level.spawn);
    if(level.isGodzillaLevel) player.weaponMode = 'tank';
    camX = 0; camY = 0;
  }
}

function doJumpscare(type='face'){
  state.jumpscareActive = true;
  state.jumpscareTimer = 38;
  state.jumpscareType = type;
  if(type === 'demon'){
    sfxDemonic();
  } else {
    sfxScare();
  }
  shake(25);
  triggerFlash('255,0,0', 0.9);
}

function levelClear(){
  if(state.mode!=='playing') return;
  sfxWin();
  unlockAchievement('levelSurvived', '🏆 დონის გადარჩენილი!', 'შენ წარმატებით გადარჩი და დაასრულე დონე!');
  trackQuestProgress('level_win', 1);
  
  // Calculate Stars
  let stars = 1; // 1 for completion
  const coinPct = state.totalCoinsInLevel > 0 ? (state.coinsCollectedInLevel / state.totalCoinsInLevel) : 1;
  const zombiePct = state.totalZombiesInLevel > 0 ? (state.zombiesKilledInLevel / state.totalZombiesInLevel) : 1;
  
  if(coinPct >= 0.8) stars++;
  if(zombiePct >= 0.8) stars++;
  
  // Record stars if higher
  const currentStars = state.levelStars[state.levelIndex] || 0;
  if(stars > currentStars) {
    state.levelStars[state.levelIndex] = stars;
  }
  
  state.unlockedLevels = Math.max(state.unlockedLevels || 1, state.levelIndex + 2);
  saveData();
  state.mode = 'levelclear';
  setTimeout(()=>{
    if(state.levelIndex < LEVELS.length-1){
      state.levelIndex++;
      loadLevel(state.levelIndex);
      state.mode = 'playing';
    } else {
      state.mode = 'win';
    }
  }, 2200);
}

function loadLevel(idx){
  if(state.deathCam) state.deathCam.active = false;
  level = LEVELS[idx];
  
  // Reset active checkpoint for new level
  level.activeCheckpoint = null;
  if(level.checkpoints) level.checkpoints.forEach(cp => cp.active = false);

  // Reset session counters
  state.coinsCollectedInLevel = 0;
  state.zombiesKilledInLevel = 0;
  state.totalCoinsInLevel = (level.coins || []).length;
  state.totalZombiesInLevel = (level.zombies || []).length;

  (level.coins || []).forEach(c=>c.taken=false);
  (level.energyCrystals || []).forEach(c=>c.taken=false);
  (level.electroOrbs || []).forEach(o=>o.taken=false);
  (level.goldTrophies || []).forEach(t=>t.taken=false);
  (level.wings || []).forEach(w=>w.taken=false);
  (level.bells || []).forEach(b=>b.taken=false);
  (level.bananas || []).forEach(b=>b.used=false);
  (level.fakespikes || []).forEach(f=>f.hit=false);
  (level.bushes || []).forEach(b=>b.triggered=false);
  if(level.jumpboxes) level.jumpboxes.forEach(jb=>{ jb.hit=false; jb.bounceY=0; });
  if(level.pushboxes){
    level.pushboxes.forEach(b => {
      b.x = b.origX;
      b.y = b.origY;
      b.vx = 0;
      b.vy = 0;
      b.onGround = false;
    });
  }
  if(level.traps){
    level.traps.forEach(t => t.taken = false);
  }
  
  resetPlayer(level.spawn);
  camX=0; camY=0;
  zombies = []; bullets = []; particles = []; shellCasings = []; floatingTexts = [];
  
  if(level.zombies){
    (level.zombies || []).forEach(z => spawnZombie(z.x, z.y, z.type));
  }

  // Godzilla level setup
  if(level.isGodzillaLevel){
    player.weaponMode = 'tank';
    state.lastKilledByGodzilla = false;
    nukeSeq.active = false;
    godzillaProjectiles = [];
    godzillaBoss = {
      active: true,
      x: 3200, y: GROUND_Y - 210, w: 190, h: 220,
      hp: 500, maxHp: 500,
      vx: 2.2, facing: -1,
      animT: 0,
      beamTimer: 0,
      isBeaming: false,
      beamDuration: 0,
      stompTimer: 0,
      fireballTimer: 0,
      isRaging: false
    };

    // Build city buildings for destruction
    cityBuildings = [];
    for(let i=0; i<30; i++){
      cityBuildings.push({
        x: 400 + i * 280,
        y: GROUND_Y - (220 + Math.sin(i*3)*80),
        w: 180 + (i%3)*30,
        h: 220 + Math.sin(i*3)*80,
        destroyed: false
      });
    }
  } else {
    godzillaBoss.active = false;
  }

  // Final Boss every 4 levels (levels 4, 8, 12, 16, 20)
  initFinalBoss(idx);

  // Airplane level special init
  if(level.isAirplaneLevel){
    initAirplaneLevel();
  } else {
    airplane.active = false;
  }

  initWeather();

  if (level.diffRating && level.gimmickTitle) {
    toast(`🎮 ${level.name} [${level.diffRating} ${level.diffStars}] — ${level.gimmickTitle}!`, 3500);
  } else {
    toast(`🎮 ${level.name}`, 2200);
  }
}

function restartLevel(){
  if(state.mode==='playing'||state.mode==='paused'||state.mode==='gameover'){
    const baseLives = state.upgrades.maxHp ? 10 : 8;
    const isHardcore = state.settings && state.settings.difficulty === 'hardcore';
    state.lives = isHardcore ? Math.floor(baseLives * 0.6) : baseLives;
    loadLevel(state.levelIndex);
    state.mode='playing';
  }
}

function togglePause(){
  if(state.mode==='playing'){ state.mode='paused'; }
  else if(state.mode==='paused'){ state.mode='playing'; }
}

function startGame(){
  ac();
  state.levelIndex = 0;
  state.score = 0;
  const baseLives = state.upgrades.maxHp ? 10 : 8;
  const isHardcore = state.settings && state.settings.difficulty === 'hardcore';
  state.lives = isHardcore ? Math.floor(baseLives * 0.6) : baseLives;
  loadLevel(0);
  state.mode = 'playing';
}

// ---------- Drawing Rendering Engine ----------
function drawBackground(theme){
  if(!theme || theme === 'pink' || theme === 'blue'){
    if(level && level.theme) theme = level.theme;
    else theme = 'dusk_suburbs';
  }

  switch(theme){
    case 'decaying_skyscraper': {
      // Decaying Skyscraper Storm & Fire Background
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0a0314');
      g.addColorStop(0.4, '#1b0922');
      g.addColorStop(0.8, '#2a0a18');
      g.addColorStop(1, '#3d0c0c');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // Distant Lightning Flashes in Storm
      if(Math.random() < 0.03){
        ctx.fillStyle = 'rgba(180, 210, 255, 0.25)';
        ctx.fillRect(0, 0, W, H);
      }

      // Parallax Distant Tower Framework Silhouettes
      ctx.save();
      ctx.fillStyle = 'rgba(20, 10, 28, 0.7)';
      for(let i = -1; i < 8; i++){
        const bx = (i * 240 - camX * 0.1) % (W + 240) - 80;
        const h = 320 + (i % 3) * 60;
        ctx.fillRect(bx, H - h, 140, h);
        // Broken illuminated windows
        ctx.fillStyle = (i % 2 === 0) ? '#ff3d3d' : '#f59e0b';
        ctx.globalAlpha = 0.35;
        for(let wy = H - h + 20; wy < H - 40; wy += 35){
          ctx.fillRect(bx + 15, wy, 25, 18);
          ctx.fillRect(bx + 80, wy, 25, 18);
        }
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = 'rgba(20, 10, 28, 0.7)';
      }
      ctx.restore();

      // Flashing Emergency Beacon Light at Top Center
      ctx.save();
      const beaconX = W * 0.5;
      const beaconGlow = Math.sin(state.time * 0.008) * 0.5 + 0.5;
      const bGrad = ctx.createRadialGradient(beaconX, 60, 5, beaconX, 60, 180);
      bGrad.addColorStop(0, `rgba(239, 68, 68, ${0.4 + beaconGlow * 0.4})`);
      bGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
      ctx.fillStyle = bGrad;
      ctx.beginPath(); ctx.arc(beaconX, 60, 180, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      break;
    }

    case 'dusk_suburbs': {
      // 1. Sunset Suburbs
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#1c0a2a');
      g.addColorStop(0.35, '#5c1d47');
      g.addColorStop(0.7, '#d94f38');
      g.addColorStop(1, '#f39c12');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      // Giant Setting Sun
      ctx.save();
      const sunX = W * 0.72 - (camX * 0.03) % W;
      const sunGrad = ctx.createRadialGradient(sunX, 160, 20, sunX, 160, 110);
      sunGrad.addColorStop(0, '#ffffff');
      sunGrad.addColorStop(0.4, '#ffd23f');
      sunGrad.addColorStop(1, 'rgba(243, 156, 18, 0)');
      ctx.fillStyle = sunGrad;
      ctx.beginPath(); ctx.arc(sunX, 160, 110, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      // Suburb Hills Parallax (Seamless)
      for(let layer=0; layer<3; layer++){
        const speed = 0.08 + layer*0.08;
        const color = layer===0 ? 'rgba(74, 21, 56, 0.45)' : layer===1 ? 'rgba(110, 35, 60, 0.55)' : 'rgba(145, 45, 55, 0.65)';
        ctx.fillStyle = color;
        const spacing = 480;
        const offset = (camX * speed) % spacing;
        for(let x = -spacing; x < W + spacing; x += spacing){
          const bx = x - offset;

      // Rainbow Victory Fireworks Sparks
      for(let i=0; i<50; i++){
        const fx = (i*137 + state.time*0.1) % W;
        const fy = (i*71 + Math.sin(state.time*0.005 + i)*20) % (H - 60);
        const hue = (i * 35 + state.time * 0.1) % 360;
        ctx.fillStyle = `hsl(${hue}, 100%, 70%)`;
        ctx.fillRect(fx, fy, 3, 3);
      }
      break;
    }
  }
}

function drawGround(theme){
  if(!theme || theme === 'pink' || theme === 'blue'){
    if(level && level.theme) theme = level.theme;
    else theme = 'dusk_suburbs';
  }

  const plats = (level.plats || []);
  for(let idx=0; idx<plats.length; idx++){
    const p = plats[idx];
    const sx = p.x - camX;
    if(sx + p.w < -20 || sx > W + 20) continue;

    // Check for neighbor to right to eliminate 1px anti-alias grid seams
    let extraW = 0;
    const nextP = plats.find(o => Math.abs(o.x - (p.x + p.w)) < 4 && Math.abs(o.y - p.y) < 3);
    if(nextP) extraW = 3;

    switch(theme){
      case 'decaying_skyscraper': {
        // Concrete floor slab with steel girders and yellow hazard stripes
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#334155');
        g.addColorStop(0.3, '#1e293b');
        g.addColorStop(1, '#0f172a');
        ctx.fillStyle = g;
        ctx.fillRect(Math.floor(sx), Math.floor(p.y), Math.ceil(p.w + extraW), Math.ceil(p.h));

        // Steel Top Border
        ctx.fillStyle = '#64748b';
        ctx.fillRect(Math.floor(sx), Math.floor(p.y), Math.ceil(p.w + extraW), 4);

        // Yellow-Black Hazard Stripes along platform top
        ctx.save();
        ctx.beginPath();
        ctx.rect(sx, p.y + 4, p.w + extraW, 6);
        ctx.clip();
        for(let i = -20; i < p.w + extraW + 20; i += 16){
          ctx.fillStyle = (i / 16) % 2 === 0 ? '#f59e0b' : '#0f172a';
          ctx.beginPath();
          ctx.moveTo(sx + i, p.y + 4);
          ctx.lineTo(sx + i + 10, p.y + 4);
          ctx.lineTo(sx + i + 4, p.y + 10);
          ctx.lineTo(sx + i - 6, p.y + 10);
          ctx.fill();
        }
        ctx.restore();

        // Rivets
        ctx.fillStyle = '#94a3b8';
        for(let i = 12; i < p.w - 10; i += 40){
          ctx.beginPath(); ctx.arc(sx + i, p.y + p.h - 8, 2.5, 0, Math.PI*2); ctx.fill();
        }
        break;
      }

      case 'dusk_suburbs':
      case 'prehistoric_jungle': {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#4fd67b');
        g.addColorStop(0.12, '#2ea24f');
        g.addColorStop(0.15, '#7b5a3a');
        g.addColorStop(1, '#422e1d');
        ctx.fillStyle = g;
        ctx.fillRect(Math.floor(sx), Math.floor(p.y), Math.ceil(p.w + extraW), Math.ceil(p.h));

        // Smooth wind-animated grass blades
        ctx.fillStyle = '#6ee693';
        for(let i = 4; i < p.w - 2; i += 14){
          const sway = Math.sin(state.time * 0.003 + (p.x + i) * 0.02) * 3.8;
          ctx.beginPath();
          ctx.moveTo(sx + i, p.y + 1);
          ctx.lineTo(sx + i + 3 + sway, p.y - 7);
          ctx.lineTo(sx + i + 7, p.y + 1);
          ctx.fill();
        }
        break;
      }

      case 'cyberpunk_alley':
      case 'glitch_cyberverse': {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#1e293b');
        g.addColorStop(0.2, '#0f172a');
        g.addColorStop(1, '#020617');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w + extraW, p.h);

        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(sx, p.y, p.w + extraW, 3);

        ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
        ctx.lineWidth = 1;
        for(let i = 10; i < p.w; i += 24){
          ctx.beginPath(); ctx.moveTo(sx + i, p.y); ctx.lineTo(sx + i, p.y + p.h); ctx.stroke();
        }
        break;
      }

      case 'horror_ruins':
      case 'gothic_cemetery': {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#2e382e');
        g.addColorStop(0.15, '#1a241a');
        g.addColorStop(1, '#0a100a');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w + extraW, p.h);

        ctx.fillStyle = '#22c55e';
        ctx.fillRect(sx, p.y, p.w + extraW, 4);
        for(let i = 6; i < p.w - 6; i += 12){
          ctx.beginPath(); ctx.arc(sx + i, p.y + 4, 3, 0, Math.PI*2); ctx.fill();
        }
        break;
      }

      case 'desert_canyon': {

        ctx.fillRect(sx, p.y, p.w + extraW, 3);

        ctx.fillRect(sx, p.y, p.w, 3);
        ctx.fillStyle = '#d946ef';
        ctx.fillRect(sx, p.y + 3, p.w, 1);
        break;
      }

      case 'pro_infernal_abyss':
      case 'pro_volcano_magma': {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#2a0808');
        g.addColorStop(0.3, '#120202');
        g.addColorStop(1, '#000000');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w, p.h);

        ctx.fillStyle = '#ff3d6e';
        ctx.fillRect(sx, p.y, p.w, 4);
        ctx.fillStyle = '#ffcc00';
        for(let i = 6; i < p.w - 6; i += 18){
          ctx.fillRect(sx + i, p.y, 8, 2);
        }
        break;
      }

      case 'pro_toxic_wasteland':
      case 'pro_acid_sewers':
      case 'pro_atomic_reactor': {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#022e1f');
        g.addColorStop(0.3, '#01170f');
        g.addColorStop(1, '#000000');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w, p.h);

        ctx.fillStyle = '#10b981';
        ctx.fillRect(sx, p.y, p.w, 4);
        for(let i = 10; i < p.w - 10; i += 20){
          ctx.beginPath(); ctx.arc(sx + i, p.y + 4, 2.5, 0, Math.PI*2); ctx.fill();
        }
        break;
      }

      case 'doomsday_city':
      case 'godzilla_ruins':
      case 'haunted_mansion':
      default: {
        const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        g.addColorStop(0, '#27272a');
        g.addColorStop(0.2, '#18181b');
        g.addColorStop(1, '#09090b');
        ctx.fillStyle = g;
        ctx.fillRect(sx, p.y, p.w, p.h);

        ctx.fillStyle = theme === 'godzilla_ruins' ? '#00f0ff' : '#ff3d6e';
        ctx.fillRect(sx, p.y, p.w, 3);
        break;
      }
    }

    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(sx, p.y, p.w, p.h);
  }
}

function drawSign(sign){

function wrapText(text,cx,cy,maxW,lh){
  const words=text.split(' ');
  let line='', lines=[];
  for(const w of words){
    const test=line+w+' ';
    if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=w+' '; }
    else line=test;
  }
  lines.push(line);
  const startY = cy - (lines.length-1)*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l.trim(), cx, startY+i*lh));
}

function drawPushbox(b){
  const sx = b.x - camX;

  const y = b.y;

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(sx + b.w/2, y + b.h + 2, b.w/2, 4, 0, 0, Math.PI*2);
  ctx.fill();

  const g = ctx.createLinearGradient(0, y, 0, y + b.h);
  g.addColorStop(0, '#d97706');
  g.addColorStop(0.5, '#b45309');
  g.addColorStop(1, '#78350f');
  ctx.fillStyle = g;
  ctx.fillRect(sx, y, b.w, b.h);

  ctx.strokeStyle = '#451a03';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(sx, y, b.w, b.h);
  ctx.beginPath();
  ctx.moveTo(sx, y + b.h*0.33); ctx.lineTo(sx + b.w, y + b.h*0.33);
  ctx.moveTo(sx, y + b.h*0.66); ctx.lineTo(sx + b.w, y + b.h*0.66);
  ctx.moveTo(sx + 3, y + 3); ctx.lineTo(sx + b.w - 3, y + b.h - 3);
  ctx.stroke();

  ctx.fillStyle = '#64748b';
  const cs = 7;
  ctx.fillRect(sx, y, cs, cs);
  ctx.fillRect(sx + b.w - cs, y, cs, cs);
  ctx.fillRect(sx, y + b.h - cs, cs, cs);
  ctx.fillRect(sx + b.w - cs, y + b.h - cs, cs, cs);

  ctx.fillStyle = '#fef08a';
  ctx.font = 'bold 9px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('📦 PUSH', sx + b.w/2, y + b.h*0.58);
}

function drawLaserBeam(l){
  const sx = l.x - camX;
  if(sx + l.w < -30 || sx > W + 30) return;
  const cycle = (state.time + (l.offset || 0)) % (l.period || 2000);
  const isActive = cycle < ((l.period || 2000) / 2);

  ctx.fillStyle = '#0f172a';
  ctx.fillRect(sx - 8, l.y, 8, l.h);
  ctx.fillRect(sx + l.w, l.y, 8, l.h);
  ctx.fillStyle = isActive ? '#ff0055' : '#475569';
  ctx.fillRect(sx - 10, l.y + l.h/2 - 6, 12, 12);
  ctx.fillRect(sx + l.w - 2, l.y + l.h/2 - 6, 12, 12);

  if(isActive){
    ctx.save();
    const beamColor = l.color || '#ff0055';
    ctx.shadowColor = beamColor;
    ctx.shadowBlur = 18;
    ctx.fillStyle = beamColor;
    ctx.fillRect(sx, l.y + l.h/2 - 3, l.w, 6);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(sx, l.y + l.h/2 - 1, l.w, 2);

    if(Math.random() < 0.4){
      const px = sx + Math.random() * l.w;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(px, l.y + l.h/2 - 4 + Math.random()*8, 3, 3);
    }
    ctx.restore();
  } else {
    ctx.strokeStyle = 'rgba(239, 68, 68, 0.35)';
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(sx, l.y + l.h/2);
    ctx.lineTo(sx + l.w, l.y + l.h/2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawCrusher(cr){
  const sx = cr.x - camX;
  if(sx + cr.w < -30 || sx > W + 30) return;

  const curY = cr.topY + (cr.dropProgress || 0);

  ctx.fillStyle = '#1e293b';
  ctx.fillRect(sx - 6, cr.topY - 12, cr.w + 12, 12);
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 1;
  ctx.strokeRect(sx - 6, cr.topY - 12, cr.w + 12, 12);

  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(sx + 12, cr.topY);
  ctx.lineTo(sx + 12, curY);
  ctx.moveTo(sx + cr.w - 12, cr.topY);
  ctx.lineTo(sx + cr.w - 12, curY);
  ctx.stroke();

  ctx.fillStyle = '#0f172a';
  ctx.fillRect(sx, curY, cr.w, cr.h);
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 2;
  ctx.strokeRect(sx, curY, cr.w, cr.h);

  ctx.fillStyle = '#eab308';
  for(let i = 0; i < cr.w; i += 20){
    ctx.beginPath();
    ctx.moveTo(sx + i, curY);
    ctx.lineTo(sx + i + 10, curY);
    ctx.lineTo(sx + i, curY + 12);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = '#dc2626';
  const n = Math.max(3, Math.floor(cr.w / 14));
  const spikeW = cr.w / n;
  for(let i = 0; i < n; i++){
    ctx.beginPath();
    ctx.moveTo(sx + i*spikeW, curY + cr.h);
    ctx.lineTo(sx + i*spikeW + spikeW/2, curY + cr.h + 14);
    ctx.lineTo(sx + (i+1)*spikeW, curY + cr.h);
    ctx.fill();
  }
}

function drawFirejet(fj){

function drawSwingingAxe(ax){
  const sx = ax.cx - camX;
  if(sx < -200 || sx > W + 200) return;
  
  const angle = Math.sin(state.time * (ax.speed || 0.002) + (ax.offset || 0)) * (ax.range || 1.2);
  const axX = ax.cx + Math.sin(angle) * ax.len;
  const axY = ax.cy + Math.cos(angle) * ax.len;
  const saxX = axX - camX;
  
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(sx, ax.cy);
  ctx.lineTo(saxX, axY);
  ctx.stroke();
  
  ctx.save();
  ctx.translate(saxX, axY);
  ctx.rotate(-angle);
  
  // Axe Head
  ctx.fillStyle = '#94a3b8';
  ctx.beginPath();
  ctx.moveTo(-30, 0);
  ctx.quadraticCurveTo(0, 40, 30, 0);
  ctx.lineTo(0, -10);
  ctx.closePath();
  ctx.fill();
  
  ctx.strokeStyle = '#f1f5f9';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  ctx.restore();
}

function drawConveyor(cv){
  const sx = cv.x - camX;
  if(sx + cv.w < -20 || sx > W + 20) return;
  
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(sx, cv.y, cv.w, cv.h);
  
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 2;
  const step = 20;
  const offset = (state.time * cv.speed * 0.5) % step;
  
  for(let x = -step; x < cv.w + step; x += step){
    const px = sx + x + offset;
    if(px > sx && px < sx + cv.w){
      ctx.beginPath();
      ctx.moveTo(px, cv.y);
      ctx.lineTo(px, cv.y + cv.h);
      ctx.stroke();
    }
  }
  
  ctx.strokeStyle = '#0f172a';
  ctx.strokeRect(sx, cv.y, cv.w, cv.h);
}

function drawTrap(t){

function drawSpinner(s){
  const sx = s.cx - camX;
  if(sx < -80 || sx > W + 80) return;

  ctx.save();
  ctx.translate(sx, s.cy);
  s.angle = (s.angle || 0) + (s.speed || 0.04);
  ctx.rotate(s.angle);

  const count = 4;
  for(let i = 0; i < count; i++){
    ctx.rotate((Math.PI * 2) / count);
    ctx.fillStyle = i % 2 === 0 ? '#ef4444' : '#f59e0b';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-8, -s.r * 0.6);
    ctx.lineTo(0, -s.r);
    ctx.lineTo(8, -s.r * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.stroke();
  }

  ctx.fillStyle = '#1e293b';
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ef4444';
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

function drawSpike(s){
  const sx=s.x-camX; if(sx+s.w<0||sx>W) return;
  const theme = level.theme || 'dusk_suburbs';
  
  if(theme === 'cyber' || theme === 'cyberpunk_alley' || theme === 'pro_cyber_matrix' || theme === 'pro_plasma_storm'){
    // Laser Spikes
    ctx.fillStyle='#00f0ff';
    ctx.shadowColor='#00f0ff';
    ctx.shadowBlur=10;
    const n=5;
    for(let i=0;i<n;i++){
      ctx.beginPath();
      ctx.moveTo(sx+i*(s.w/n)+2, s.y+s.h);
      ctx.lineTo(sx+i*(s.w/n)+s.w/(2*n), s.y-8);
      ctx.lineTo(sx+(i+1)*(s.w/n)-2, s.y+s.h);
      ctx.fill();
    }
    ctx.shadowBlur=0;
  } else if(theme === 'horror_ruins' || theme === 'gothic_cemetery' || theme === 'pro_demonic_realm'){
    // Bone Spikes
    ctx.fillStyle='#e2e8f0';
    const n=3;
    for(let i=0;i<n;i++){
      ctx.beginPath();
      ctx.moveTo(sx+i*(s.w/n)+5, s.y+s.h);
      ctx.quadraticCurveTo(sx+i*(s.w/n)+s.w/(2*n), s.y-10, sx+(i+1)*(s.w/n)-5, s.y+s.h);
      ctx.fill();
      ctx.fillStyle='#94a3b8';
      ctx.fillRect(sx+i*(s.w/n)+s.w/(2*n)-2, s.y+s.h-10, 4, 10);
      ctx.fillStyle='#e2e8f0';
    }
  } else if(theme === 'pro_volcano_magma' || theme === 'volcanic_inferno'){
    // Obsidian Spikes
    ctx.fillStyle='#1c1917';
    const n=4;
    for(let i=0;i<n;i++){
      ctx.beginPath();
      ctx.moveTo(sx+i*(s.w/n), s.y+s.h);
      ctx.lineTo(sx+i*(s.w/n)+s.w/(2*n), s.y-4);
      ctx.lineTo(sx+(i+1)*(s.w/n), s.y+s.h);
      ctx.fill();
      ctx.strokeStyle='#ef4444';
      ctx.lineWidth=1;
      ctx.stroke();
    }
  } else {
    // Default Spikes
    ctx.fillStyle='#ff3d6e';
    const n=4;
    for(let i=0;i<n;i++){
      ctx.beginPath();
      ctx.moveTo(sx+i*(s.w/n), s.y+s.h);
      ctx.lineTo(sx+i*(s.w/n)+s.w/(2*n), s.y-6);
      ctx.lineTo(sx+(i+1)*(s.w/n), s.y+s.h);
      ctx.fill();
    }
  }
}

function drawLava(l){
  const sx = l.x - camX; if(sx + l.w < -20 || sx > W + 20) return;
  const t = state.time * 0.004;
  const theme = level.theme || 'dusk_suburbs';

  let color1 = '#ff4400', color2 = '#ff8800', color3 = '#aa0000', color4 = '#330000', foamColor = 'rgba(255, 200, 0, 0.85)';

  if(theme === 'cyber' || theme === 'pro_plasma_storm' || theme === 'pro_cyber_matrix'){
    color1 = '#8b5cf6'; color2 = '#d946ef'; color3 = '#4c1d95'; color4 = '#1e1b4b'; foamColor = 'rgba(0, 240, 255, 0.8)';
  } else if(theme === 'nuclear_lab' || theme === 'pro_atomic_reactor' || theme === 'pro_toxic_wasteland'){
    color1 = '#10b981'; color2 = '#34d399'; color3 = '#064e3b'; color4 = '#022c22'; foamColor = 'rgba(167, 243, 208, 0.8)';
  }

  // Realistic Molten Base with Sub-layers
  const g = ctx.createLinearGradient(0, l.y, 0, l.y + l.h);
  g.addColorStop(0, color1);
  g.addColorStop(0.4, color2);
  g.addColorStop(0.8, color3);
  g.addColorStop(1, color4);
  
  ctx.save();
  ctx.fillStyle = g;
  ctx.fillRect(sx, l.y, l.w, l.h);

  // Heat Distortion / Glow Pattern
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0; i<2; i++){
    const off = Math.sin(t + i) * 10;
    ctx.fillStyle = `rgba(255, 100, 0, ${0.15 - i*0.05})`;
    ctx.beginPath();
    ctx.ellipse(sx + l.w/2 + off, l.y + l.h/2, l.w*0.8, l.h*0.4, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  // Animated Bubbling Top with noise-like waves
  ctx.fillStyle = foamColor;
  ctx.beginPath();
  ctx.moveTo(sx, l.y + 100);
  ctx.lineTo(sx, l.y);
  for(let x = 0; x <= l.w; x += 8){
    const wave1 = Math.sin(t*2.2 + (l.x + x)*0.05) * 5;
    const wave2 = Math.sin(t*1.1 + (l.x + x)*0.02) * 3;
    ctx.lineTo(sx + x, l.y + wave1 + wave2);
  }
  ctx.lineTo(sx + l.w, l.y + 100);
  ctx.fill();

  // Embers / Bubbles rising
  const bubbleCount = Math.floor(l.w / 40);
  for(let i = 0; i < bubbleCount; i++){
    const bID = (l.x + i*40);
    const bx = sx + ((i * 40 + state.time * 0.04) % l.w);
    const by = l.y + 5 + ( (bID + state.time*0.08) % 60);
    if(by < l.y + l.h) {
      ctx.fillStyle = '#fff7ed';
      ctx.beginPath(); ctx.arc(bx, by, 1.5 + Math.sin(t+i)*1, 0, Math.PI*2); ctx.fill();
    }
  }
}

function drawWater(w){
  const sx = w.x - camX; if(sx + w.w < -20 || sx > W + 20) return;
  const t = state.time * 0.003;
  const theme = level.theme || 'dusk_suburbs';

  let color1 = 'rgba(0, 150, 255, 0.7)', color2 = 'rgba(0, 80, 200, 0.85)', color3 = 'rgba(0, 30, 80, 0.95)', foamColor = 'rgba(255, 255, 255, 0.55)';

  if(theme === 'horror_ruins' || theme === 'gothic_cemetery' || theme === 'pro_demonic_realm'){
    color1 = 'rgba(180, 0, 0, 0.75)'; color2 = 'rgba(100, 0, 0, 0.88)'; color3 = 'rgba(40, 0, 0, 0.95)'; foamColor = 'rgba(255, 100, 100, 0.4)';
  } else if(theme === 'desert_canyon'){
    color1 = 'rgba(180, 120, 40, 0.7)'; color2 = 'rgba(120, 60, 20, 0.88)'; color3 = 'rgba(60, 30, 10, 0.95)'; foamColor = 'rgba(255, 200, 100, 0.4)';
  }

  // Realistic Water with Depth and Refraction Simulation
  const g = ctx.createLinearGradient(0, w.y, 0, w.y + w.h);
  g.addColorStop(0, color1);
  g.addColorStop(0.5, color2);
  g.addColorStop(1, color3);
  
  ctx.save();
  ctx.fillStyle = g;
  ctx.fillRect(sx, w.y, w.w, w.h);

  // Internal Caustics / Refraction (Lighter patches)
  ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  for(let i=0; i<3; i++){
     const shift = (state.time * 0.02 + i*20) % w.w;
     ctx.fillRect(sx + shift, w.y, 15, w.h);
  }
  ctx.restore();

  // Animated Surface Waves
  ctx.fillStyle = foamColor;
  ctx.beginPath();
  ctx.moveTo(sx, w.y + 100);
  ctx.lineTo(sx, w.y);
  for(let x = 0; x <= w.w; x += 10){
    const wave1 = Math.sin(t*3 + (w.x + x)*0.07) * 4;
    const wave2 = Math.cos(t*1.5 + (w.x + x)*0.03) * 2;
    ctx.lineTo(sx + x, w.y + wave1 + wave2);
  }
  ctx.lineTo(sx + w.w, w.y + 100);
  ctx.fill();

  // Highlight Edge
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(sx, w.y);
  ctx.lineTo(sx+w.w, w.y);
  ctx.stroke();
}

function drawCoin(c){
  if(c.taken) return;
  const sx=c.x-camX; if(sx+c.w<0||sx>W) return;
  const bob = Math.sin(state.time*0.006 + c.x)*4;
  const cx = sx + c.w/2;
  const cy = c.y + c.h/2 + bob;
  const r = c.w/2;

  ctx.save();
  // Outer golden coin border
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.arc(cx, cy, r + 2, 0, 2*Math.PI);
  ctx.fill();

  // Main Blue Character Face Coin
  ctx.fillStyle = '#3fc7ea';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, 2*Math.PI);
  ctx.fill();

  // Black Mask Across Eyes
  ctx.fillStyle = '#1a1d24';
  ctx.beginPath();
  ctx.roundRect(cx - r*0.7, cy - r*0.4, r*1.4, r*0.55, 2);
  ctx.fill();

  // White eyes
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx - r*0.35, cy - r*0.1, r*0.22, 0, 2*Math.PI);
  ctx.arc(cx + r*0.35, cy - r*0.1, r*0.22, 0, 2*Math.PI);
  ctx.fill();

  // Pupils
  ctx.fillStyle = '#111111';
  ctx.beginPath();
  ctx.arc(cx - r*0.3, cy - r*0.1, r*0.1, 0, 2*Math.PI);
  ctx.arc(cx + r*0.4, cy - r*0.1, r*0.1, 0, 2*Math.PI);
  ctx.fill();

  // Cyan Lens Glow
  ctx.fillStyle = '#38c6ff';
  ctx.beginPath();
  ctx.arc(cx - r*0.35, cy - r*0.1, r*0.14, 0, 2*Math.PI);
  ctx.arc(cx + r*0.35, cy - r*0.1, r*0.14, 0, 2*Math.PI);
  ctx.fill();

  ctx.restore();
}

function drawCheckpoint(cp){
  const sx = cp.x - camX;
  if(sx + (cp.w || 36) < -60 || sx > W + 60) return;

  const isActive = cp.active;
  const poleX = sx + 8;
  const poleY = cp.y;
  const poleH = cp.h || 70;

  ctx.save();

  // Base stand
  ctx.fillStyle = isActive ? '#15803d' : '#334155';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(sx - 6, poleY + poleH - 12, 28, 12, 3);
  else ctx.fillRect(sx - 6, poleY + poleH - 12, 28, 12);
  ctx.fill();

  if(isActive){
    // Glowing ring pulse around base
    ctx.shadowColor = '#22c55e';
    ctx.shadowBlur = 18;
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(sx + 8, poleY + poleH - 6, 22, 6, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Spawn green ambient particles
    if(Math.random() < 0.25){
      particles.push({
        x: cp.x + Math.random() * 20 - 5,
        y: cp.y + poleH - 10,
        vx: (Math.random() - 0.5) * 1.5,
        vy: -1 - Math.random() * 2,
        life: 30, maxLife: 30,
        color: '#4ade80', size: 2 + Math.random() * 3
      });
    }
  }

  // Metallic Steel Pole
  const poleGrad = ctx.createLinearGradient(poleX, poleY, poleX + 5, poleY);
  poleGrad.addColorStop(0, '#64748b');
  poleGrad.addColorStop(0.5, '#f8fafc');
  poleGrad.addColorStop(1, '#334155');
  ctx.fillStyle = poleGrad;
  ctx.fillRect(poleX, poleY, 5, poleH);

  // Gold or Silver Ball on top
  ctx.fillStyle = isActive ? '#f59e0b' : '#94a3b8';
  ctx.beginPath();
  ctx.arc(poleX + 2.5, poleY - 4, 6, 0, Math.PI * 2);
  ctx.fill();

  // Waving Banner Flag
  const wave = Math.sin(state.time * 0.008 + cp.x) * 4;
  ctx.shadowColor = isActive ? '#22c55e' : '#3b82f6';
  ctx.shadowBlur = isActive ? 16 : 6;

  ctx.fillStyle = isActive ? '#16a34a' : '#2563eb';
  ctx.beginPath();
  ctx.moveTo(poleX + 5, poleY);
  ctx.lineTo(poleX + 48 + wave, poleY + 10);
  ctx.lineTo(poleX + 42, poleY + 24);
  ctx.lineTo(poleX + 50 + wave, poleY + 38);
  ctx.lineTo(poleX + 5, poleY + 38);
  ctx.closePath();
  ctx.fill();

  // Flag Border
  ctx.strokeStyle = isActive ? '#facc15' : '#60a5fa';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Flag Icon
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'left';
  ctx.shadowBlur = 0;
  ctx.fillText(isActive ? '✅' : '🚩', poleX + 10, poleY + 24);

  // Hovering Label
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = isActive ? '#4ade80' : '#93c5fd';
  ctx.shadowColor = isActive ? '#15803d' : '#1e3a8a';
  ctx.shadowBlur = 8;
  ctx.fillText(isActive ? '✅ ჩექფოინთი! (SAVED)' : '🚩 ჩექფოინთი', poleX + 2.5, poleY - 14);

  ctx.restore();
}
