  ctx.fill(); ctx.stroke();
  ctx.font = 'bold 12px sans-serif';
  ctx.fillStyle = '#ffd23f';
  ctx.fillText('🎟️ პრომო კოდი', pBtnX + pBtnW/2, pBtnY + 20);
  ctx.restore();

  ctx.fillStyle = '#ffd23f';
  ctx.font = 'bold 15px sans-serif';
  ctx.fillText(`⭐ საერთო ვარსკვლავები: ${totalStars} / 75`, W/2 - 70, 52);

  // Star Progress Bar for 75 Stars Level Gate
  const sBarW = 180, sBarH = 6;
  const sBarX = W/2 - sBarW/2 - 70, sBarY = 58;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  if(ctx.roundRect) {
    ctx.beginPath(); ctx.roundRect(sBarX, sBarY, sBarW, sBarH, 3); ctx.fill();
  } else {
    ctx.fillRect(sBarX, sBarY, sBarW, sBarH);
  }
  const sFill = Math.min(1, totalStars / 75);
  ctx.fillStyle = totalStars >= 75 ? '#3fe07d' : '#ffd23f';
  if(ctx.roundRect) {
    ctx.beginPath(); ctx.roundRect(sBarX, sBarY, sBarW * sFill, sBarH, 3); ctx.fill();
  } else {
    ctx.fillRect(sBarX, sBarY, sBarW * sFill, sBarH);
  }

  // Page Tabs: Ep 1-22 | Ep 23-44
  const tabW = 280, tabH = 32;
  const tabY = 72;
  const tab1X = W/2 - tabW - 10;
  const tab2X = W/2 + 10;

  // Tab 1: Ep 1-22
  ctx.fillStyle = state.levelTab === 0 ? '#38c6ff' : 'rgba(30, 41, 59, 0.8)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(tab1X, tabY, tabW, tabH, 6);
  else ctx.fillRect(tab1X, tabY, tabW, tabH);
  ctx.fill();
  ctx.fillStyle = state.levelTab === 0 ? '#000000' : '#ffffff';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('⭐ ეპიზოდები 1 - 22 (STANDARD)', tab1X + tabW/2, tabY + 21);

  // Tab 2: Ep 23-44
  ctx.fillStyle = state.levelTab === 1 ? '#ff3d6e' : 'rgba(30, 41, 59, 0.8)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(tab2X, tabY, tabW, tabH, 6);
  else ctx.fillRect(tab2X, tabY, tabW, tabH);
  ctx.fill();
  ctx.fillStyle = state.levelTab === 1 ? '#ffffff' : '#ffffff';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('🔥 ეპიზოდები 23 - 44 (PRO OBBY & 75⭐ REQ)', tab2X + tabW/2, tabY + 21);

  // Grid of levels (7 columns x 3 rows = 21, page 0: 0-21, page 1: 22-43)
  const cols = 7;
  const cardW = 120, cardH = 108;
  const gapX = 10, gapY = 8;
  const totalW = cols * cardW + (cols - 1) * gapX;
  const startX = (W - totalW) / 2;
  const startY = 112;

  const startIndex = state.levelTab === 0 ? 0 : 22;
  const endIndex = Math.min(LEVELS.length, startIndex + 22);

  for(let i = 0; i < (endIndex - startIndex); i++){
    const idx = startIndex + i;
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cx = startX + col * (cardW + gapX);
    const cy = startY + row * (cardH + gapY);

    const isUnlocked = (idx + 1) <= (state.unlockedLevels || 1);
    const lvl = LEVELS[idx];
    const isGodzilla = lvl && (lvl.isGodzillaLevel || idx === 20 || idx === 36);

    // Star requirements check
    let starReq = 0;
    if(idx >= 30) starReq = 75;
    else if(idx >= 20) starReq = 50;
    else if(idx >= 10) starReq = 25;

    const starBlocked = totalStars < starReq && !(state.unlockedLevels >= 100);

    ctx.save();
    ctx.fillStyle = (isUnlocked && !starBlocked) ? (isGodzilla ? 'rgba(50, 20, 30, 0.95)' : 'rgba(20, 32, 54, 0.92)') : 'rgba(10, 12, 18, 0.7)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(cx, cy, cardW, cardH, 8);
    else ctx.fillRect(cx, cy, cardW, cardH);
    ctx.fill();

    ctx.strokeStyle = (isUnlocked && !starBlocked) ? (idx === state.levelIndex ? '#ffd23f' : (isGodzilla ? '#ff3d6e' : '#38c6ff')) : '#444444';
    ctx.lineWidth = idx === state.levelIndex ? 3 : 1.5;
    ctx.stroke();

    ctx.textAlign = 'center';

    // Episode Badge
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = isGodzilla ? '#ff3d6e' : ((isUnlocked && !starBlocked) ? '#ffd23f' : '#666666');
    ctx.fillText(`EP. ${idx + 1}` + (isGodzilla ? ' 🦖' : ''), cx + cardW/2, cy + 18);

    // Level Name
    ctx.font = 'bold 9.5px sans-serif';
    ctx.fillStyle = (isUnlocked && !starBlocked) ? '#ffffff' : '#555555';
    let shortName = lvl ? (lvl.name.split('—')[1] || lvl.name) : `Level ${idx+1}`;
    shortName = shortName.trim();
    if(shortName.length > 13) shortName = shortName.slice(0, 12) + '…';
    ctx.fillText(shortName, cx + cardW/2, cy + 34);

    // Difficulty Rating Badge
    if(isUnlocked && !starBlocked && lvl && lvl.diffRating){
      ctx.font = 'bold 8.5px sans-serif';
      ctx.fillStyle = lvl.diffColor || '#38c6ff';
      ctx.fillText(`[${lvl.diffRating}]`, cx + cardW/2, cy + 49);

      // Gimmick Mini Title
      if(lvl.gimmickTitle){
        ctx.font = '8px sans-serif';
        ctx.fillStyle = '#cbd5e1';
        let gTitle = lvl.gimmickTitle.split(' ')[0] + ' ' + (lvl.gimmickTitle.split(' ')[1] || '');
        if(gTitle.length > 12) gTitle = gTitle.slice(0, 11) + '…';
        ctx.fillText(gTitle, cx + cardW/2, cy + 63);
      }
    }

    // Stars earned for this level
    const stars = (state.levelStars && state.levelStars[idx]) || 0;
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    let starStr = '';
    for(let s=0; s<3; s++) starStr += (s < stars) ? '⭐' : '☆';
    ctx.fillText(starStr, cx + cardW/2, cy + 78);

    // Play/Locked Status
    ctx.font = 'bold 11px sans-serif';
    if(isUnlocked && !starBlocked){
      ctx.fillStyle = isGodzilla ? '#ff3d6e' : '#3fe07d';
      ctx.fillText('▶ PLAY', cx + cardW/2, cy + 96);
    } else {
      ctx.fillStyle = '#ff3d6e';
      if(starBlocked){
        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        if(ctx.roundRect) {
          ctx.beginPath(); ctx.roundRect(cx, cy, cardW, cardH, 8); ctx.fill();
        } else {
          ctx.fillRect(cx, cy, cardW, cardH);
        }
        
        ctx.font = '24px sans-serif';
        ctx.fillText('🔒', cx + cardW/2, cy + cardH/2);
        
        ctx.fillStyle = '#ff3d6e';
        ctx.font = 'bold 9px sans-serif';
        ctx.fillText(`⭐ ${starReq} STARS REQ`, cx + cardW/2, cy + cardH - 10);
        ctx.restore();
      } else {
        ctx.fillText('🔒 LOCKED', cx + cardW/2, cy + 96);
      }
    }
    ctx.restore();
  }

  // Back Button
  ctx.save();
  const bw = 280, bh = 42;
  const bx = W/2 - bw/2, by = H - 50;
  ctx.fillStyle = '#ff3d6e';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 10);
  else ctx.fillRect(bx, by, bw, bh);
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#ffffff';
  const isReturningToGame = state.returnMode === 'playing' || state.returnMode === 'paused';
  const backLabel = isReturningToGame ? '⬅️ თამაშში დაბრუნება (RETURN TO GAME)' : '⬅️ მენიუში დაბრუნება';
  ctx.fillText(backLabel, W/2, by + 26);
  ctx.restore();
}

function handleLevelSelectClick(mx, my){
  // Check Promocode Header Button Click
  const pBtnW = 160, pBtnH = 32;
  const pBtnX = W - pBtnW - 20, pBtnY = 12;
  if(mx >= pBtnX && mx <= pBtnX + pBtnW && my >= pBtnY && my <= pBtnY + pBtnH){
    sfxBell();
    openPromoCodePrompt();
    return;
  }

  // Check Back Button
  const bw = 280, bh = 42;
  const bx = W/2 - bw/2, by = H - 50;
  if(mx >= bx && mx <= bx + bw && my >= by && my <= by + bh){
    sfxBell();
    if(state.returnMode === 'playing' || state.returnMode === 'paused'){
      state.mode = 'playing';
    } else {
      state.mode = state.returnMode || 'menu';
    }
    return;
  }

  // Check Tab Clicks
  const tabW = 280, tabH = 32;
  const tabY = 72;
  const tab1X = W/2 - tabW - 10;
  const tab2X = W/2 + 10;

  if(my >= tabY && my <= tabY + tabH){
    if(mx >= tab1X && mx <= tab1X + tabW){
      state.levelTab = 0;
      sfxBell();
      return;
    } else if(mx >= tab2X && mx <= tab2X + tabW){
      state.levelTab = 1;
      sfxBell();
      return;
    }
  }

  // Grid of levels
  const cols = 7;
  const cardW = 120, cardH = 108;
  const gapX = 10, gapY = 8;
  const totalW = cols * cardW + (cols - 1) * gapX;
  const startX = (W - totalW) / 2;
  const startY = 112;

  const startIndex = (state.levelTab || 0) === 0 ? 0 : 22;
  const endIndex = Math.min(LEVELS.length, startIndex + 22);

  for(let i = 0; i < (endIndex - startIndex); i++){
    const idx = startIndex + i;
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cx = startX + col * (cardW + gapX);
    const cy = startY + row * (cardH + gapY);

    if(mx >= cx && mx <= cx + cardW && my >= cy && my <= cy + cardH){
      const totalStars = Object.values(state.levelStars || {}).reduce((a, b) => a + (b || 0), 0);
      const isUnlocked = (idx + 1) <= (state.unlockedLevels || 1);

      let starReq = 0;
      if(idx >= 30) starReq = 75;
      else if(idx >= 20) starReq = 50;
      else if(idx >= 10) starReq = 25;

      const starBlocked = totalStars < starReq && !(state.unlockedLevels >= 100);

      if(isUnlocked && !starBlocked){
        sfxCoin();
        state.levelIndex = idx;
        loadLevel(idx);
        state.mode = 'playing';
        state.returnMode = 'playing';
        toast(`▶ ეპიზოდი ${idx + 1} დაიწყო!`, 1800);
      } else {
        sfxHurt();
        if(starBlocked){
          toast(`🔒 გჭირდება ${starReq} ვარსკვლავი! (გაქვს: ${totalStars}) - გამოიყენე პრომო კოდი 'codezero'!`, 3000);
        } else {
          toast("🔒 ეს დონე ჯერ დაბლოკილია! გაიარე წინა დონე!", 2000);
        }
      }
    }
  }
}

function drawDailyQuests(){
  drawBackground('pink');
  ctx.fillStyle = 'rgba(6, 10, 22, 0.90)';
  ctx.fillRect(0, 0, W, H);

  // Floating ambient embers
  ctx.save();
  for(let i = 0; i < 20; i++){
    const px = (i * 147 + state.time * 0.25) % W;
    const py = (i * 97 + Math.sin(state.time * 0.002 + i) * 15) % H;
    ctx.fillStyle = i % 2 === 0 ? 'rgba(34, 197, 94, 0.35)' : 'rgba(56, 198, 255, 0.35)';
    ctx.beginPath();
    ctx.arc(px, py, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.textAlign = 'center';

  // Title Header
  ctx.save();
  ctx.font = '900 32px sans-serif';
  ctx.shadowColor = '#22c55e';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#22c55e';
  ctx.fillText('🎯 ყოველდღიური დავალებები (DAILY QUESTS)', W/2, 42);
  ctx.restore();

  // Subtitle / Date / Balance
  ctx.fillStyle = '#94a3b8';
  ctx.font = 'bold 14px sans-serif';
  const todayStr = (state.dailyQuests && state.dailyQuests.lastDate) ? state.dailyQuests.lastDate : getTodayDateString();
  ctx.fillText(`📅 თარიღი: ${todayStr} | 💰 ბალანსი: ${state.coinsCollected || 0} 🪙 | 🔄 განახლება: ყოველდღიურად`, W/2, 68);

  // Cards layout: 2 columns x 3 rows
  const cardW = 430, cardH = 108;
  const colGap = 20, rowGap = 16;
  const startX1 = W/2 - cardW - colGap/2;
  const startX2 = W/2 + colGap/2;
  const startY = 88;

  DAILY_QUESTS_LIST.forEach((q, idx) => {
    const col = idx % 2;
    const row = Math.floor(idx / 2);
    const cx = col === 0 ? startX1 : startX2;
    const cy = startY + row * (cardH + rowGap);

    const prog = (state.dailyQuests && state.dailyQuests.progress) ? (state.dailyQuests.progress[q.id] || 0) : 0;
    const isCompleted = prog >= q.target;
    const isClaimed = (state.dailyQuests && state.dailyQuests.claimed) ? state.dailyQuests.claimed[q.id] : false;

    ctx.save();

    // Card background
    ctx.fillStyle = isClaimed ? 'rgba(15, 23, 42, 0.85)' : (isCompleted ? 'rgba(20, 45, 30, 0.92)' : 'rgba(15, 23, 42, 0.9)');
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(cx, cy, cardW, cardH, 12);
    else ctx.fillRect(cx, cy, cardW, cardH);
    ctx.fill();

    // Card Border
    ctx.strokeStyle = isClaimed ? '#334155' : (isCompleted ? '#22c55e' : '#38c6ff');
    ctx.lineWidth = isCompleted && !isClaimed ? 2.5 : 1.5;
    if(isCompleted && !isClaimed){
      ctx.shadowColor = '#22c55e';
      ctx.shadowBlur = 12;
    }
    ctx.stroke();

    // Icon & Quest Title
    ctx.textAlign = 'left';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillStyle = isClaimed ? '#94a3b8' : (isCompleted ? '#4ade80' : '#ffffff');
    ctx.fillText(`${q.title}`, cx + 16, cy + 28);

    // Reward Badge on top right
    ctx.font = 'bold 14px sans-serif';
    ctx.fillStyle = '#ffd23f';
    ctx.textAlign = 'right';
    ctx.fillText(`🎁 +${q.reward} 🪙`, cx + cardW - 16, cy + 28);

    // Quest Description
    ctx.textAlign = 'left';
    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#cbd5e1';
    ctx.fillText(q.desc, cx + 16, cy + 50);

    // Progress Bar
    const barX = cx + 16, barY = cy + 64, barW = cardW - 160, barH = 18;
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(barX, barY, barW, barH, 9);
    else ctx.fillRect(barX, barY, barW, barH);
    ctx.fill();

    const pct = Math.min(1, prog / q.target);
    if(pct > 0){
      const fillW = Math.max(14, barW * pct);
      const grad = ctx.createLinearGradient(barX, 0, barX + fillW, 0);
      grad.addColorStop(0, '#16a34a');
      grad.addColorStop(1, '#4ade80');
      ctx.fillStyle = isClaimed ? '#475569' : grad;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(barX, barY, fillW, barH, 9);
      else ctx.fillRect(barX, barY, fillW, barH);
      ctx.fill();
    }

    // Progress text on bar
    ctx.textAlign = 'center';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#000000';
    ctx.shadowBlur = 4;
    ctx.fillText(`${prog} / ${q.target} (${Math.round(pct*100)}%)`, barX + barW/2, barY + 13);
    ctx.shadowBlur = 0;

    // Action Button on card right
    const btnX = cx + cardW - 132, btnY = cy + 56, btnW = 116, btnH = 36;
    if(isClaimed){
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(btnX, btnY, btnW, btnH, 8);
      else ctx.fillRect(btnX, btnY, btnW, btnH);
      ctx.fill();

      ctx.font = 'bold 12px sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.textAlign = 'center';
      ctx.fillText('✅ მიღებულია', btnX + btnW/2, btnY + 22);
    } else if(isCompleted){
      const pulse = Math.sin(state.time * 0.008 + idx) * 0.15 + 0.85;
      ctx.fillStyle = `rgba(34, 197, 94, ${pulse})`;
      ctx.shadowColor = '#22c55e';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(btnX, btnY, btnW, btnH, 8);
      else ctx.fillRect(btnX, btnY, btnW, btnH);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.font = 'bold 12px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText('🎁 აღება (+'+q.reward+')', btnX + btnW/2, btnY + 22);
    } else {
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(btnX, btnY, btnW, btnH, 8);
      else ctx.fillRect(btnX, btnY, btnW, btnH);
      ctx.fill();

      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'center';
      ctx.fillText('⏳ მიმდინარეობს', btnX + btnW/2, btnY + 22);
    }

    ctx.restore();
  });

  // Return to Menu Button
  ctx.save();
  const backW = 320, backH = 46;
  const backX = W/2 - backW/2, backY = H - 65;

  ctx.fillStyle = '#1e293b';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(backX, backY, backW, backH, 10);
  else ctx.fillRect(backX, backY, backW, backH);
  ctx.fill();

  ctx.strokeStyle = '#22c55e';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#22c55e';
  ctx.textAlign = 'center';
  const isReturningToGame = state.returnMode === 'playing' || state.returnMode === 'paused';
  const backLabel = isReturningToGame ? '⬅️ თამაშში დაბრუნება (RETURN)' : '⬅️ მენიუში დაბრუნება';
  ctx.fillText(backLabel, W/2, backY + 28);
  ctx.restore();
}

function handleMenuClick(mx, my){
  // Start Button
  const btnW = 460, btnH = 48;
  const bx = W/2 - btnW/2, by = H/2 + 45;
  if(mx >= bx && mx <= bx + btnW && my >= by && my <= by + btnH){
    startGame();
    return;
  }

  // Sub buttons: Shop, Quests, Wheel, Settings, Levels
  const subW = 92, subH = 42;
  const spacing = 8;
  const totalW = 5 * subW + 4 * spacing;
  const startX = W/2 - totalW/2;
  const sby = H/2 + 108;

  if(my >= sby && my <= sby + subH){
    if(mx >= startX && mx <= startX + subW){
      openShop(); return;
    } else if(mx >= startX + subW + spacing && mx <= startX + 2*subW + spacing){
      openDailyQuests(); return;
    } else if(mx >= startX + 2*subW + 2*spacing && mx <= startX + 3*subW + 2*spacing){
      openLuckyWheel(); return;
    } else if(mx >= startX + 3*subW + 3*spacing && mx <= startX + 4*subW + 3*spacing){
      openSettings(); return;
    } else if(mx >= startX + 4*subW + 4*spacing && mx <= startX + 5*subW + 4*spacing){
      openLevelSelect(); return;
    }
  }

  // Promo Code Button
  const promoW = 340, promoH = 38;
  const pbx = W/2 - promoW/2, pby = H/2 + 160;
  if(mx >= pbx && mx <= pbx + promoW && my >= pby && my <= pby + promoH){
    sfxBell();
    openPromoCodePrompt();
    return;
  }

  // Music Toggle Button
  const mBtnW = 120, mBtnH = 32;
  const mBtnX = W - mBtnW - 16, mBtnY = 16;
  if(mx >= mBtnX && mx <= mBtnX + mBtnW && my >= mBtnY && my <= mBtnY + mBtnH){
    sfxBell();
    toggleBgmMute();
    return;
  }
}

function handleSettingsClick(mx, my){
  const startY = 85;
  const rowH = 40;
  const col2X = W/2 + 20;
  const btnW = 200, btnH = 32;

  const settingsList = [
    { key: 'difficulty', options: ['easy', 'normal', 'hardcore'] },
    { key: 'gameSpeed', options: ['relaxed', 'normal', 'turbo'] },
    { key: 'screenShake', options: ['full', 'reduced', 'off'] },
    { key: 'bgmVolume', options: [0, 0.25, 0.5, 0.75, 1] },
    { key: 'sfxVolume', options: [0, 0.25, 0.5, 0.75, 1] },
    { key: 'highJumpAssist', options: [false, true] },
    { key: 'showFPS', options: [false, true] }
  ];

  settingsList.forEach((item, idx) => {
    const ry = startY + idx * rowH;
    if(mx >= col2X && mx <= col2X + btnW && my >= ry && my <= ry + btnH){
      const curVal = state.settings[item.key];
      const curIdx = item.options.indexOf(curVal);
      const nextIdx = (curIdx + 1) % item.options.length;
      state.settings[item.key] = item.options[nextIdx];
      
      if(item.key === 'bgmVolume'){
         const g = getBgmMasterGain();

         g.gain.setValueAtTime(bgmMuted ? 0 : (0.22 * bgmVol), ac().currentTime);
      }

      sfxCoin();
      saveData();
    }
  });

  // Back Button
  const backW = 320, backH = 46;

    sfxBell();
  }
}

const LUCKY_ITEMS = [
  { label: '500 🪙', color: '#ffd23f', type: 'coins_500' },
  { label: '⚡ ლაზერი', color: '#00f0ff', type: 'laser' },
  { label: '🌟 ოქროს აურა', color: '#eab308', type: 'aura' },
  { label: '❤️ +3 გული', color: '#ef4444', type: 'lives' },
  { label: '🗣️ ადიოს!', color: '#ff3d6e', type: 'adios' },
  { label: '100 🪙', color: '#38c6ff', type: 'coins_100' },
  { label: '🚀 TURBO SPEED', color: '#22c55e', type: 'turbo' },
  { label: '250 🪙', color: '#f97316', type: 'coins_250' }
];

function drawLuckyWheel(){
  drawBackground('cyberpunk_alley');
  ctx.fillStyle = 'rgba(5, 8, 20, 0.82)';
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.textAlign = 'center';

  // Title Header
  ctx.font = 'bold 30px sans-serif';
  ctx.fillStyle = '#ffd23f';
  ctx.shadowColor = '#ffd23f';
  ctx.shadowBlur = 12;
  ctx.fillText('🎡 იღბლიანი ბორბალი (LUCKY WHEEL)', W/2, 45);

  ctx.font = 'bold 13px sans-serif';
  ctx.fillStyle = '#38c6ff';
  ctx.shadowBlur = 0;
  ctx.fillText('დაატრიალე ბორბალი და მოიგე ჯეკპოტები, ოქროს აურა, პრომო კოდები და მონეტები!', W/2, 68);

  const cx = W/2;
  const cy = H/2 + 10;
  const radius = 150;
  const slices = LUCKY_ITEMS.length;
  const sliceAngle = (Math.PI * 2) / slices;

  if(!state.luckyWheel) openLuckyWheel();
  const lw = state.luckyWheel;

  // Wheel Physics Animation
  if(lw.spinning){
    lw.angle += lw.spinSpeed;
    lw.spinSpeed *= 0.982;
    if(Math.random() < 0.25) sfxCoin();

    if(lw.spinSpeed < 0.003){
      lw.spinning = false;
      lw.spinSpeed = 0;

      // Fix: The arrow is at the top (1.5 * Math.PI). Slice 0 starts at lw.angle.
      // The relative angle on the wheel that points to the arrow is (ArrowAngle - lw.angle).
      const arrowPos = 1.5 * Math.PI; 
      const wheelTheta = (arrowPos - lw.angle) % (Math.PI * 2);
      const normalizedTheta = (wheelTheta + Math.PI * 2) % (Math.PI * 2);
      const winIndex = Math.floor(normalizedTheta / sliceAngle) % slices;
      const winner = LUCKY_ITEMS[winIndex];
      lw.winner = winner;

      sfxWin();
      sfxBell();
      shake(20);
      triggerFlash('255,210,63', 0.8);
      spawnParticles(cx, cy, '#ffd23f', 45, 3.5);
      spawnParticles(cx, cy, '#00f0ff', 35, 3.0);

      if(winner.type === 'coins_500'){
        state.coinsCollected = (state.coinsCollected || 0) + 500;
        lw.prizeMsg = "🎉 ჯეკპოტი! +500 ოქროს მონეტა! 💰";
      } else if(winner.type === 'laser'){
        state.coinsCollected = (state.coinsCollected || 0) + 150;
        lw.prizeMsg = "⚡ სუპერ ლაზერული იარაღი მიღებულია! 💥";
      } else if(winner.type === 'aura'){
        state.equippedSkin = 'gold_dino';
        lw.prizeMsg = "🌟 ოქროს დინო აურის სკინი განბლოკილია! 🦖";
      } else if(winner.type === 'lives'){
        state.lives = Math.min(10, state.lives + 3);
        lw.prizeMsg = "❤️ +3 დამატებითი სიცოცხლე მიღებულია!";
      } else if(winner.type === 'adios'){
        state.coinsCollected = (state.coinsCollected || 0) + 5000;
        lw.prizeMsg = "🗣️ ადიოს მუჩაჩოოოსსსს! +5000 🪙";
        sfxDeathCustom();
      } else if(winner.type === 'coins_100'){
        state.coinsCollected = (state.coinsCollected || 0) + 100;
        lw.prizeMsg = "💰 +100 ოქროს მონეტა!";
      } else if(winner.type === 'turbo'){
        state.upgrades.speed = true;
        lw.prizeMsg = "🚀 TURBO SPEED ბუსტი გააქტიურდა!";
      } else if(winner.type === 'coins_250'){
        state.coinsCollected = (state.coinsCollected || 0) + 250;
        lw.prizeMsg = "💰 +250 ოქროს მონეტა!";
      }
    }
  }

  // Outer Wheel Frame & Outer Light Bulbs
  ctx.save();
  ctx.translate(cx, cy);

  ctx.fillStyle = '#1e1b4b';
  ctx.beginPath(); ctx.arc(0, 0, radius + 16, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffd23f';
  ctx.lineWidth = 6;
  ctx.stroke();

  for(let i = 0; i < 16; i++){
    const ba = (i * Math.PI * 2) / 16;
    const bx = Math.cos(ba) * (radius + 8);
    const by = Math.sin(ba) * (radius + 8);
    ctx.fillStyle = ((i + Math.floor(state.time / 200)) % 2 === 0) ? '#ffd23f' : '#ffffff';
    ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI * 2); ctx.fill();
  }

  // Slices
  for(let i = 0; i < slices; i++){
    const startA = lw.angle + i * sliceAngle;
    const endA = startA + sliceAngle;
    const item = LUCKY_ITEMS[i];

    ctx.fillStyle = item.color;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0, 0, radius, startA, endA);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.rotate(startA + sliceAngle / 2);
    ctx.textAlign = 'right';
    
    // Highlight the winning slice
    const isWinner = !lw.spinning && lw.winner && LUCKY_ITEMS[i].type === lw.winner.type;
    if(isWinner){
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px sans-serif';
    } else {
      ctx.fillStyle = '#111827';
      ctx.font = 'bold 12px sans-serif';
    }
    
    ctx.fillText(item.label, radius - 12, 4);
    ctx.restore();
  }

  // Center Hub & Spin Button
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#38c6ff';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = '#ffd23f';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('SPIN', 0, -2);
  ctx.font = 'bold 10px sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('🎡', 0, 12);

  ctx.restore();

  // Top Pointer Arrow
  ctx.fillStyle = '#ff3d6e';
  ctx.shadowColor = '#ff0033';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(cx - 16, cy - radius - 22);
  ctx.lineTo(cx + 16, cy - radius - 22);
  ctx.lineTo(cx, cy - radius + 2);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // Spin Button
  const spinBtnW = 220, spinBtnH = 44;
  const spinBtnX = W/2 - spinBtnW/2, spinBtnY = H - 85;

  ctx.fillStyle = lw.spinning ? 'rgba(100,100,100,0.5)' : '#22c55e';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(spinBtnX, spinBtnY, spinBtnW, spinBtnH, 10);
  else ctx.fillRect(spinBtnX, spinBtnY, spinBtnW, spinBtnH);
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 15px sans-serif';
  ctx.fillText(lw.spinning ? '🔄 ტრიალებს...' : '🎰 დაატრიალე (50 🪙)', W/2, spinBtnY + 27);

  if(lw.prizeMsg){
    ctx.fillStyle = '#ffd23f';
    ctx.font = 'bold 17px sans-serif';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 10;
    ctx.fillText(lw.prizeMsg, W/2, H - 105);
    ctx.shadowBlur = 0;
  }

  // Back Button
  const backBtnW = 120, backBtnH = 36;
  const backBtnX = 20, backBtnY = 18;
  ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(backBtnX, backBtnY, backBtnW, backBtnH, 8);
  else ctx.fillRect(backBtnX, backBtnY, backBtnW, backBtnH);
  ctx.fill();
  ctx.strokeStyle = '#38c6ff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px sans-serif';
  ctx.fillText('⬅️ უკან', backBtnX + backBtnW/2, backBtnY + 23);

  // Coins Display
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd23f';
  ctx.font = 'bold 15px sans-serif';
  ctx.fillText(`💰 მონეტები: ${state.coinsCollected || 0}`, W - 20, 32);

  ctx.restore();
}

function handleLuckyWheelClick(mx, my){
  const lw = state.luckyWheel;
  if(!lw) return;

  const backBtnW = 120, backBtnH = 36;
  const backBtnX = 20, backBtnY = 18;
  if(mx >= backBtnX && mx <= backBtnX + backBtnW && my >= backBtnY && my <= backBtnY + backBtnH){
    sfxBell();
    state.mode = 'menu';
    return;
  }

  const spinBtnW = 220, spinBtnH = 44;
  const spinBtnX = W/2 - spinBtnW/2, spinBtnY = H - 85;

  const cx = W/2, cy = H/2 + 10;
  const distCenter = Math.hypot(mx - cx, my - cy);

  const isSpinClick = (mx >= spinBtnX && mx <= spinBtnX + spinBtnW && my >= spinBtnY && my <= spinBtnY + spinBtnH) || (distCenter < 50);

  if(isSpinClick){
    if(lw.spinning) return;
    const cost = 50;
    if((state.coinsCollected || 0) < cost){
      sfxHurt();
      toast("❌ არ გყოფნის მონეტები! სჭირდება 50 🪙", 2000);
      return;
    }
    state.coinsCollected -= cost;
    lw.winner = null;
    lw.prizeMsg = '';
    lw.spinning = true;
    lw.spinSpeed = 0.28 + Math.random() * 0.12;
    sfxBell();
    toast("🎰 ბორბალი ტრიალებს! წარმატებას გისურვებთ!", 1500);
  }
}

function drawDeathCamOverlay(){
  if(!state.deathCam || !state.deathCam.active) return;

  const progress = 1 - Math.max(0, state.deathCam.timer) / state.deathCam.maxTimer;
  const ease = Math.sin(progress * Math.PI * 0.5);

  ctx.save();

  // 1. Dark Crimson Radial Vignette
  const vignetteGrad = ctx.createRadialGradient(W/2, H/2, W*0.18, W/2, H/2, W*0.75);
  vignetteGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  vignetteGrad.addColorStop(0.65, 'rgba(120, 0, 20, 0.42)');
  vignetteGrad.addColorStop(1, 'rgba(20, 0, 5, 0.90)');
  ctx.fillStyle = vignetteGrad;
  ctx.fillRect(0, 0, W, H);

  // 2. Cinematic Black Letterbox Bars
  const barHeight = Math.min(52, 52 * ease);
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, barHeight);
  ctx.fillRect(0, H - barHeight, W, barHeight);

  // 3. Header Banner Text
  ctx.font = '900 15px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff3d6e';
  ctx.shadowColor = '#ff3d6e';
  ctx.shadowBlur = 12;
  const recDot = (Math.floor(state.time / 250) % 2 === 0) ? '🔴 ' : '⭕ ';
  ctx.fillText(`${recDot}DEATH CAM • SLOW MOTION [0.25x SPEED]`, W / 2, Math.max(22, barHeight * 0.62));

  // 4. Center Target Locking Reticle
  const cx = W / 2, cy = H / 2;
  const reticleSize = 48 - ease * 16;
  const pulse = Math.sin(state.time * 0.012) * 5;

  ctx.strokeStyle = '#ff3d6e';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#ff0033';
  ctx.shadowBlur = 14;

  // Pulsing Target Circle
  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(10, reticleSize + pulse), 0, Math.PI * 2);
  ctx.stroke();

  // Outer Dashed Rotating Ring
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.arc(cx, cy, reticleSize + 20, state.time * 0.003, state.time * 0.003 + Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // Crosshair Corner Ticks
  const tickLen = 14;
  ctx.beginPath();
  ctx.moveTo(cx - reticleSize - tickLen, cy); ctx.lineTo(cx - reticleSize + 4, cy);
  ctx.moveTo(cx + reticleSize - 4, cy); ctx.lineTo(cx + reticleSize + tickLen, cy);
  ctx.moveTo(cx, cy - reticleSize - tickLen); ctx.lineTo(cx, cy - reticleSize + 4);
  ctx.moveTo(cx, cy + reticleSize - 4); ctx.lineTo(cx, cy + reticleSize + tickLen);
  ctx.stroke();

  // Target Location Coordinates Badge
  ctx.fillStyle = '#ff3d6e';
  ctx.font = 'bold 11px monospace';
  ctx.fillText(`LOC: X:${Math.round(state.deathCam.deathX)} Y:${Math.round(state.deathCam.deathY)} • FATAL IMPACT`, cx, cy + reticleSize + 32);

  // 5. Georgian Death Cause Banner
  const msg = state.deathCam.causeMsg || "კრიტიკული დამარცხება! 💀";
  ctx.font = '900 18px sans-serif';
  const textWidth = ctx.measureText(msg).width;
  const pw = Math.max(320, textWidth + 60);

  ctx.fillStyle = 'rgba(15, 0, 5, 0.88)';
  ctx.fillRect(W/2 - pw/2, H - barHeight - 42, pw, 34);
  ctx.strokeStyle = '#ff3d6e';
  ctx.lineWidth = 2;
  ctx.strokeRect(W/2 - pw/2, H - barHeight - 42, pw, 34);

  ctx.fillStyle = '#ffd23f';
  ctx.shadowColor = '#ff0033';
  ctx.shadowBlur = 10;
  ctx.fillText(msg, W / 2, H - barHeight - 19);

  // 6. Slow-Mo Replay Progress Countdown Bar
  const barW = 300;
  const fillW = barW * (1 - progress);
  ctx.fillStyle = 'rgba(255, 61, 110, 0.25)';
  ctx.fillRect(W/2 - barW/2, H - 10, barW, 5);
  ctx.fillStyle = '#ff3d6e';
  ctx.shadowColor = '#ff3d6e';
  ctx.shadowBlur = 8;
  ctx.fillRect(W/2 - barW/2, H - 10, fillW, 5);

  ctx.restore();
}

// ---------- Main Game Loop ----------
let lastTime = performance.now();
function loop(now){
  let dt = Math.min(33, now-lastTime);
  lastTime = now;

  if(state.settings){
    if(state.settings.gameSpeed === 'relaxed') dt *= 0.75;
    else if(state.settings.gameSpeed === 'turbo') dt *= 1.35;
  }

  state.time += dt;

  updateBgmTrack();

  const mobileCtrl = document.getElementById('mobileControls');
  if(mobileCtrl){
    const isMobileDevice = window.innerWidth <= 860 || ('ontouchstart' in window);
    mobileCtrl.style.display = (state.mode === 'playing' && isMobileDevice) ? 'flex' : 'none';
  }

  ctx.save();
  if(state.shake>0){
    const sx = (Math.random()-0.5)*state.shake;
    const sy = (Math.random()-0.5)*state.shake;
    ctx.translate(sx,sy);
    state.shake *= 0.86;
    if(state.shake<0.5) state.shake=0;
  }

  if(state.mode==='loading'){
    drawLoading();
  } else if(state.mode==='menu'){
    drawMenu();
  } else if(state.mode==='shop'){
    drawShop();
  } else if(state.mode==='dailyquests'){
    drawDailyQuests();
  } else if(state.mode==='levelselect'){
    drawLevelSelect();
  } else if(state.mode==='settings'){
    drawSettings();
  } else if(state.mode==='luckywheel'){
    drawLuckyWheel();
  } else {
    if(level && level.isAirplaneLevel){
      drawAirplaneLevel();
      drawParticles();
    } else {
      drawBackground(level.theme || level.bgHue);
      drawWeatherWorld();

      ctx.save();
      if(state.deathCam && state.deathCam.active){
        const progress = 1 - Math.max(0, state.deathCam.timer) / state.deathCam.maxTimer;
        const ease = Math.sin(progress * Math.PI * 0.5);
        const zoom = 1 + ease * 1.35;

        const deathX = state.deathCam.deathX;
        const deathY = state.deathCam.deathY;

        const startX = camX + W * 0.38;
        const startY = camY + H * 0.5;

        const curFocusX = startX + (deathX - startX) * ease;
        const curFocusY = startY + (deathY - startY) * ease;

        ctx.translate(W / 2, H / 2);
        ctx.scale(zoom, zoom);
        ctx.translate(-curFocusX, -curFocusY);
      } else {
        ctx.translate(0, -camY);
      }

      drawCityBuildings();
      drawGround(level.theme || level.bgHue);
      if(level.lavas) level.lavas.forEach(drawLava);
      if(level.waters) level.waters.forEach(drawWater);
      if(level.clouds) level.clouds.forEach(drawCloud);
      if(level.crumblingPlats) level.crumblingPlats.forEach(drawCrumblingPlat);
      if(level.pushboxes) level.pushboxes.forEach(drawPushbox);
      if(level.signs) level.signs.forEach(drawSign);
      if(level.fakespikes) level.fakespikes.forEach(drawFakespike);
      if(level.spikes) level.spikes.forEach(drawSpike);
      if(level.popspikes) level.popspikes.forEach(drawPopSpike);
      if(level.trampolines) level.trampolines.forEach(drawTrampoline);
      if(level.swingPoints) level.swingPoints.forEach(drawSwingPoint);
      if(level.steamVents) level.steamVents.forEach(drawSteamVent);
      if(level.heliPad) drawHeliPad(level.heliPad);
      drawRisingHorde();
      if(level.boosters) level.boosters.forEach(drawBooster);
      if(level.gravityRunes) level.gravityRunes.forEach(drawGravityRune);
      if(level.boulders) level.boulders.forEach(drawBoulder);
      if(level.spinners) level.spinners.forEach(drawSpinner);
      if(level.swingingAxes) level.swingingAxes.forEach(drawSwingingAxe);
      if(level.conveyors) level.conveyors.forEach(drawConveyor);
      if(level.acidGeysers) level.acidGeysers.forEach(drawAcidGeyser);
      if(level.firejets) level.firejets.forEach(drawFirejet);
      if(level.lasers) level.lasers.forEach(drawLaserBeam);
      if(level.crushers) level.crushers.forEach(drawCrusher);
      if(level.bananas) level.bananas.forEach(drawBanana);
      if(level.coins) level.coins.forEach(drawCoin);
      if(level.energyCrystals) level.energyCrystals.forEach(drawEnergyCrystal);
      if(level.electroOrbs) level.electroOrbs.forEach(drawElectroOrb);
      if(level.goldTrophies) level.goldTrophies.forEach(drawGoldTrophy);
      if(level.wings) level.wings.forEach(drawWingItem);
      if(level.traps) level.traps.forEach(drawTrap);
      if(level.bells) level.bells.forEach(drawBell);
      if(level.bushes) level.bushes.forEach(drawBush);
      if(level.jumpboxes) level.jumpboxes.forEach(drawJumpBox);
      if(level.checkpoints) level.checkpoints.forEach(drawCheckpoint);
      drawFlag(level.flag);
      drawGodzilla();
      drawFinalBoss();
      drawGodzillaProjectiles();
      zombies.forEach(drawZombie);
      bullets.forEach(drawBullet);
      drawPlayer();
      drawParticles();

      ctx.restore();
    }

    drawWeatherOverlay();
    drawNukeSequence();
    drawJumpscare();
    if(state.deathCam && state.deathCam.active){
      drawDeathCamOverlay();
    }
    drawHUD();

    if(state && state.settings && state.settings.showFPS){
      ctx.save();
      ctx.fillStyle = '#38c6ff';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`FPS: ${Math.round(1000/dt)}`, 10, H - 12);
      ctx.restore();
    }

    if(state.mode==='playing'){
      if(state.deathCam && state.deathCam.active){
        const slowDt = dt * 0.22;
        state.deathCam.timer -= dt;
        updateParticles(0.22);
        updateZombies(slowDt);
        if(state.deathCam.timer <= 0){
          state.deathCam.active = false;
          if(!nukeSeq.active){
            state.mode = 'gameover';
          }
        }
      } else {
        if(level && level.isAirplaneLevel){
          updateAirplaneLevel(dt);
          updateBullets();
          updateParticles(1);
        } else {
          // Update Combo and Rage
  if(state.comboTimer > 0) {
    state.comboTimer -= dt;
    if(state.comboTimer <= 0) state.comboCount = 0;
  }
  
  if(state.isRageActive) {
    state.rageTimer -= dt;
    state.rageEnergy = (state.rageTimer / 8000) * 100;
    if(state.rageTimer <= 0) {
      state.isRageActive = false;
      state.rageEnergy = 0;
      toast("Rage Mode Cooled Down", 1500);
    }
  }

  updatePlayer(dt);
          updateGodzilla(dt);
          updateFinalBoss(dt);
          updateNukeSequence(dt);
        }
        updateWeather(dt);
      }
    } else if(state.mode==='paused'){
      drawPauseOverlay();
    } else if(state.mode==='gameover'){
      drawGameOver();
    } else if(state.mode==='levelclear'){
      drawLevelClear();
    } else if(state.mode==='win'){
      drawWin();
    }
  }

  if(state.flashAlpha>0){
    ctx.fillStyle=`rgba(${state.flashColor},${state.flashAlpha})`;
    ctx.fillRect(0,0,W,H);
    state.flashAlpha *= 0.86;
    if(state.flashAlpha<0.02) state.flashAlpha=0;
  }

  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
