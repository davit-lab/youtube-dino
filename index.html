<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>დინო: ხულიგანური პარკური</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0e14;
    --panel:#141826;
    --blue:#38c6ff;
    --blue-dark:#1a6fa8;
    --pink:#ff3d6e;
    --pink-dark:#c21f4a;
    --yellow:#ffd23f;
    --cream:#f4ecd8;
    --green:#3fe07d;
  }
  *{box-sizing:border-box; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background: radial-gradient(ellipse at 50% 0%, #1c2438 0%, #06080d 80%);
    font-family: 'Noto Sans Georgian', 'Arial', 'Trebuchet MS', sans-serif;
    color: var(--cream);
  }
  #wrap{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  canvas{
    background:#080b10;
    image-rendering: pixelated;
    border: 3px solid var(--blue-dark);
    border-radius: 8px;
    max-width: 98vw;
    max-height: 94vh;
  }
  #hint{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    font-size:12px; opacity:.75; letter-spacing:.5px; text-align:center;
    pointer-events:none; text-shadow:0 1px 3px #000;
  }
  #topBarControls{
    position:absolute; top:12px; right:18px;
    display:flex; gap:10px; z-index:10;
  }
  .btn-ui{
    background:rgba(20,24,38,0.85); border:1.5px solid var(--blue);
    color:var(--cream); padding:6px 14px; border-radius:6px;
    font-size:13px; font-weight:bold; cursor:pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    transition: all 0.2s ease;
  }
  .btn-ui:hover{
    background:var(--blue); color:#000; transform:scale(1.05);
  }
  .btn-ui.skip{
    border-color:var(--yellow); color:var(--yellow);
  }
  .btn-ui.skip:hover{
    background:var(--yellow); color:#000;
  }

  /* Promo Modal Overlay Styles */
  #promoModal {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 380px; max-width: 92vw;
    background: rgba(10, 16, 30, 0.96);
    border: 3px solid var(--yellow);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 0 35px rgba(255, 210, 63, 0.6), 0 10px 50px rgba(0,0,0,0.95);
    color: #fff;
    text-align: center;
    z-index: 250;
    display: none;
    flex-direction: column;
    gap: 14px;
    font-family: sans-serif;
    backdrop-filter: blur(8px);
  }
  #promoModal h2 {
    margin: 0; font-size: 22px; color: var(--yellow); text-shadow: 0 0 12px rgba(255, 210, 63, 0.7);
  }
  #promoInput {
    width: 100%; padding: 12px; font-size: 18px; font-weight: bold; text-align: center;
    border-radius: 10px; border: 2.5px solid var(--blue); background: #070c18; color: #fff;
    outline: none; box-sizing: border-box; text-transform: uppercase; letter-spacing: 1.5px;
  }
  #promoInput:focus {
    border-color: var(--yellow); box-shadow: 0 0 14px rgba(255, 210, 63, 0.6);
  }
  .promo-btn-group {
    display: flex; gap: 10px; justify-content: center; margin-top: 4px;
  }
  .btn-promo-submit {
    flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px;
    border: none; background: var(--yellow); color: #000; cursor: pointer;
    box-shadow: 0 4px 14px rgba(255, 210, 63, 0.5); transition: transform 0.1s;
  }
  .btn-promo-submit:active { transform: scale(0.95); }
  .btn-promo-close {
    padding: 12px 18px; font-size: 15px; font-weight: bold; border-radius: 8px;
    border: 2px solid #555; background: rgba(255,255,255,0.05); color: #ccc; cursor: pointer;
  }
  .btn-promo-close:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .promo-quick-btn {
    background: rgba(56, 198, 255, 0.15); border: 1.5px dashed var(--blue); color: var(--blue);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer;
    transition: all 0.15s ease;
  }
  .promo-quick-btn:hover { background: var(--blue); color: #000; }
  #mobileControls{
    position:absolute; bottom:18px; left:0; right:0;
    display:none; justify-content:space-between; align-items:flex-end;
    padding:0 22px; pointer-events:none;
    z-index:100;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  #mobileControls .ctrl-btn{
    pointer-events:auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:66px; height:66px; border-radius:50%;
    border:2.5px solid var(--blue); background:rgba(12, 16, 28, 0.9);
    color:var(--cream); font-size:22px; font-weight:bold;
    box-shadow: 0 4px 14px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,255,255,0.2);
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s ease, background-color 0.08s ease, box-shadow 0.08s ease;
  }
  #mobileControls .ctrl-btn:active,
  #mobileControls .ctrl-btn.active{
    transform: scale(0.92);
    background: rgba(56, 198, 255, 0.35);
    box-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 16px rgba(56, 198, 255, 0.6);
  }
  #mobileControls .left{
    display:flex; gap:12px; align-items:center;
  }
  #mobileControls .right{
    display:flex; gap:16px; align-items:flex-end;
  }
  /* Stagger Jump and Shoot to prevent accidental misclicks */
  #mobileControls #btnJump {
    width: 74px; height: 74px;
    border-color: var(--pink); color: #fff;
    background: rgba(255, 61, 110, 0.28);
    transform: translateY(-10px);
  }
  #mobileControls #btnJump:active,
  #mobileControls #btnJump.active {
    background: var(--pink); color: #fff;
    transform: translateY(-10px) scale(0.92);
    box-shadow: 0 0 22px rgba(255, 61, 110, 0.9);
  }
  #mobileControls #btnShoot {
    width: 68px; height: 68px;
    border-color: var(--yellow); color: var(--yellow);
    background: rgba(255, 210, 63, 0.22);
  }
  #mobileControls #btnShoot:active,
  #mobileControls #btnShoot.active {
    background: var(--yellow); color: #000;
    transform: scale(0.92);
    box-shadow: 0 0 22px rgba(255, 210, 63, 0.9);
  }
  .btn-icon {
    font-size: 22px;
    line-height: 1;
  }
  .btn-subtext {
    font-size: 9px;
    letter-spacing: 0.5px;
    margin-top: 1px;
    font-weight: 800;
    text-transform: uppercase;
    opacity: 0.9;
  }
  @media (max-width:860px){
    #mobileControls{display:flex;}
  }
</style>
</head>
<body>
<div id="wrap">

  <div id="promoModal">
    <h2>🎟️ პრომო კოდი (PROMO CODE)</h2>
    <p style="font-size:13px; color:#cbd5e1; margin:0;">შეიყვანე ადმინ ან სატესტო პრომო კოდი (მაგ. <strong style="color:var(--yellow);">codezero</strong>)</p>
    <input type="text" id="promoInput" placeholder="შეიყვანე კოდი..." autocomplete="off" onkeydown="if(event.key==='Enter') submitPromoCode()" />
    
    <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:2px;">
      <button class="btn-ui" onclick="setPromoQuick('codezero')" style="font-size:12px; padding:5px 10px; border-color:var(--yellow); color:var(--yellow); background:rgba(255,210,63,0.15);">⚡ codezero</button>
      <button class="btn-ui" onclick="setPromoQuick('godmode')" style="font-size:12px; padding:5px 10px; border-color:var(--blue); color:var(--blue); background:rgba(56,198,255,0.15);">🛡️ godmode</button>
      <button class="btn-ui" onclick="setPromoQuick('pro')" style="font-size:12px; padding:5px 10px; border-color:#3fe07d; color:#3fe07d; background:rgba(63,224,125,0.15);">⭐ pro</button>
    </div>

    <div id="promoMsg" style="font-size:13px; font-weight:bold; min-height:20px; transition:all 0.2s;"></div>

    <div class="promo-btn-group">
      <button class="btn-promo-submit" onclick="submitPromoCode()">🚀 გააქტიურება (ACTIVATE)</button>
      <button class="btn-promo-close" onclick="closePromoModal()">❌ დახურვა</button>
    </div>
  </div>

  <canvas id="game" width="960" height="540"></canvas>

  <div id="mobileControls">
    <div class="left">
      <button id="btnLeft" class="ctrl-btn" aria-label="გადაადგილება მარცხნივ"><span class="btn-icon">◀</span></button>
      <button id="btnRight" class="ctrl-btn" aria-label="გადაადგილება მარჯვნივ"><span class="btn-icon">▶</span></button>
    </div>
    <div class="right">
      <button id="btnDash" class="ctrl-btn" aria-label="დეში" style="border-color:var(--blue); background:rgba(56,198,255,0.22);"><span class="btn-icon">⚡</span><span class="btn-subtext">DASH</span></button>
      <button id="btnShoot" class="ctrl-btn" aria-label="სროლა"><span class="btn-icon">🔫</span><span class="btn-subtext">სროლა</span></button>
      <button id="btnJump" class="ctrl-btn" aria-label="ხტომა"><span class="btn-icon">⤴</span><span class="btn-subtext">ახტომა</span></button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- Audio System (Synthesized Retro/Horror SFX) ----------
let actx;
function ac(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } return actx; }

function beep(freq, dur, type='square', vol=0.05, delay=0, freqEnd=null){
  try{
    const sfxVol = (typeof state !== 'undefined' && state && state.settings && state.settings.sfxVolume !== undefined) ? state.settings.sfxVolume : 1.0;
    if(sfxVol <= 0) return;
    vol *= sfxVol;

    const a = ac();
    const t0 = a.currentTime + delay;
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(freqEnd !== null){
      osc.frequency.exponentialRampToValueAtTime(Math.max(10, freqEnd), t0 + dur);
    }
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(a.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }catch(e){}
}

function sfxClick(){ beep(300, 0.04, 'sine', 0.05, 0, 150); }
function sfxJump(){ beep(420,0.12,'square',0.06,0,780); }
function sfxCoin(){ beep(880,0.08,'square',0.06,0,1320); }
function sfxBell(){ beep(660,0.1,'triangle',0.07); beep(990,0.15,'triangle',0.06,0.08); }
function sfxHurt(){ beep(220,0.25,'sawtooth',0.09,0,40); }
function sfxPrankGood(){ beep(300,0.06,'square',0.05); beep(200,0.06,'square',0.05,0.06); beep(500,0.12,'square',0.06,0.12); }
function sfxScare(){ 
  beep(140, 0.45, 'sawtooth', 0.15, 0, 40); 
  beep(80, 0.6, 'square', 0.12, 0.05, 30);
}
function sfxDemonic(){
  beep(90, 0.8, 'sawtooth', 0.18, 0, 30);
  beep(120, 0.7, 'square', 0.15, 0.08, 40);
  beep(60, 0.9, 'triangle', 0.2, 0.15, 20);
}
function sfxCodeZero(){
  [523, 659, 784, 1046, 1318].forEach((f,i)=>beep(f,0.12,'sine',0.08,i*0.06));
}
function sfxWin(){ [523,659,784,1046,1318,1568].forEach((f,i)=>beep(f,0.18,'triangle',0.07,i*0.1)); }
function sfxAchievement(){
  [600, 750, 900, 1150, 1400].forEach((f,i)=>beep(f,0.15,'triangle',0.08,i*0.07));
}
function sfxSlip(){ beep(450,0.35,'sine',0.06,0,120); }
function sfxShoot(){ 
  beep(320,0.05,'square',0.09,0,80); 
  beep(120,0.1,'sawtooth',0.08,0.02,30); 
}
// Pre-load the audio to ensure it plays immediately when called
const deathAudio = new Audio('death.mp3');
deathAudio.volume = 1.0;
deathAudio.load();

function sfxDeathCustom(){
  try {
    if (typeof window !== 'undefined' && window.speechSynthesis) {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance('ადიოს მუჩაჩოოს');
      msg.lang = 'ka-GE';
      msg.volume = 1.0;
      msg.rate = 0.9;
      msg.pitch = 0.8;
      window.speechSynthesis.speak(msg);
    }
    
    // Play the pre-loaded mp3 file
    deathAudio.currentTime = 0;
    deathAudio.play().catch(e => {
      console.warn("Audio play blocked or failed, retrying on next frame...", e);
    });
  } catch(e) {}
}

function sfxZombieHit(){ beep(240,0.12,'sawtooth',0.08,0,80); }
function sfxFall(){ beep(600, 1.2, 'sawtooth', 0.08, 0, 40); }
function sfxBoxHit(){ beep(300,0.1,'square',0.08,0,600); }

// ---------- Background Music System (Procedural Web Audio Engine) ----------
let bgmMuted = false;
let bgmCurrentTrack = null; // 'menu' | 'action' | 'horror' | 'godzilla'
let bgmStep = 0;
let bgmMasterGain = null;
let bgmInterval = null;

function getBgmMasterGain(){
  const a = ac();
  const bgmVol = (typeof state !== 'undefined' && state && state.settings && state.settings.bgmVolume !== undefined) ? state.settings.bgmVolume : 1.0;
  if(!bgmMasterGain){
    bgmMasterGain = a.createGain();
    bgmMasterGain.gain.setValueAtTime(bgmMuted ? 0 : (0.22 * bgmVol), a.currentTime);
    bgmMasterGain.connect(a.destination);
  } else {
    bgmMasterGain.gain.setValueAtTime(bgmMuted ? 0 : (0.22 * bgmVol), a.currentTime);
  }
  return bgmMasterGain;
}

function toggleBgmMute(){
  ac();
  if(actx && actx.state === 'suspended') actx.resume();
  bgmMuted = !bgmMuted;
  const a = ac();
  const g = getBgmMasterGain();
  const btn = document.getElementById('btnMuteBgm');
  if(btn){
    btn.innerHTML = bgmMuted ? '🔇 Music: OFF' : '🎵 Music: ON';
    btn.style.borderColor = bgmMuted ? '#ff3d6e' : '#38c6ff';
  }
}

function startBgmEngine(){
  if(!bgmInterval){
    bgmInterval = setInterval(stepBgmSequence, 125);
  }
}

function playBgmNote(freq, dur, type='square', vol=0.08, attack=0.01, decay=0.1, detune=0, filterFreq=null){
  if(bgmMuted) return;
  try{
    const a = ac();
    if(a.state === 'suspended') return;
    const gMaster = getBgmMasterGain();
    const t0 = a.currentTime;
    const osc = a.createOscillator();
    const gain = a.createGain();
    
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(detune !== 0) osc.detune.setValueAtTime(detune, t0);

    const actualVol = (state && state.mode === 'paused') ? vol * 0.35 : vol;

    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(actualVol, t0 + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);

    if(filterFreq){
      const filter = a.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(filterFreq, t0);
      osc.connect(filter);
      filter.connect(gain);
    } else {
      osc.connect(gain);
    }

    gain.connect(gMaster);
    osc.start(t0);
    osc.stop(t0 + attack + decay + 0.05);
  } catch(e){}
}

function playBgmDrums(type='kick', vol=0.1){
  if(bgmMuted) return;
  try{
    const a = ac();
    if(a.state === 'suspended') return;
    const gMaster = getBgmMasterGain();
    const t0 = a.currentTime;
    const actualVol = (state && state.mode === 'paused') ? vol * 0.35 : vol;
    
    if(type === 'kick'){
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.frequency.setValueAtTime(160, t0);
      osc.frequency.exponentialRampToValueAtTime(30, t0 + 0.15);
      gain.gain.setValueAtTime(actualVol, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
      osc.connect(gain); gain.connect(gMaster);
      osc.start(t0); osc.stop(t0 + 0.16);
    } else if(type === 'godzilla_stomp'){
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, t0);
      osc.frequency.exponentialRampToValueAtTime(22, t0 + 0.35);
      
      const filter = a.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(350, t0);
      
      gain.gain.setValueAtTime(actualVol * 1.5, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.38);
      
      osc.connect(filter); filter.connect(gain); gain.connect(gMaster);
      osc.start(t0); osc.stop(t0 + 0.4);
    } else if(type === 'hihat'){
      const bufferSize = Math.floor(a.sampleRate * 0.04);
      const buffer = a.createBuffer(1, bufferSize, a.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const whiteNoise = a.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = a.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 5000;

      const gain = a.createGain();
      gain.gain.setValueAtTime(actualVol * 0.4, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.04);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(gMaster);
      whiteNoise.start(t0);
    }
  }catch(e){}
}

function stepBgmSequence(){
  if(bgmMuted || !bgmCurrentTrack) return;

  const s = bgmStep % 32;

  if(bgmCurrentTrack === 'menu'){
    // Menu Chiptune Theme
    const bassNotes = [130.81, 130.81, 164.81, 164.81, 174.61, 174.61, 196.00, 196.00];
    if(s % 4 === 0){
      playBgmNote(bassNotes[Math.floor(s/4) % bassNotes.length], 0.2, 'triangle', 0.1, 0.01, 0.18);
    }
    const arpNotes = [261.63, 329.63, 392.00, 523.25, 659.25, 523.25, 392.00, 329.63];
    if(s % 2 === 0){
      playBgmNote(arpNotes[(s/2)%arpNotes.length], 0.1, 'sine', 0.05, 0.01, 0.08);
    }
    if(s % 8 === 4) playBgmDrums('hihat', 0.06);

  } else if(bgmCurrentTrack === 'action'){
    // Energetic 8-Bit Platformer Action BGM
    const bassScale = [130.81, 130.81, 196.00, 130.81, 174.61, 174.61, 220.00, 196.00];
    if(s % 2 === 0){
      playBgmNote(bassScale[Math.floor(s/2) % bassScale.length], 0.12, 'square', 0.08, 0.005, 0.1);
    }
    const leadScale = [261.63, 329.63, 392.00, 466.16, 523.25, 466.16, 392.00, 329.63];
    if(s % 3 === 0){
      playBgmNote(leadScale[Math.floor(s/3) % leadScale.length], 0.1, 'triangle', 0.06, 0.01, 0.09);
    }
    if(s % 4 === 0) playBgmDrums('kick', 0.08);
    if(s % 2 === 1) playBgmDrums('hihat', 0.05);

  } else if(bgmCurrentTrack === 'horror'){
    // Eerie Ghostly Ambient Horror Track
    if(s === 0 || s === 16){
      playBgmNote(43.65, 0.8, 'sawtooth', 0.12, 0.08, 0.7, -12, 250); // Low F1 rumble
      playBgmDrums('kick', 0.12);
    }
    if(s === 8 || s === 24){
      playBgmNote(41.20, 0.8, 'sawtooth', 0.12, 0.08, 0.7, 12, 220); // Low E1 rumble
    }
    // Random eerie bell chime
    if(s === 4 || s === 12 || s === 20 || s === 28){
      const chimes = [739.99, 880.00, 1046.50, 1244.51, 1479.98];
      const bellFreq = chimes[Math.floor(s/4) % chimes.length];
      playBgmNote(bellFreq, 0.35, 'sine', 0.05, 0.01, 0.32);
    }

  } else if(bgmCurrentTrack === 'godzilla'){
    // Godzilla Apocalyptic Horror Boss Track
    if(s % 8 === 0){
      playBgmDrums('godzilla_stomp', 0.22);
      playBgmNote(32.70, 0.6, 'sawtooth', 0.18, 0.02, 0.5, 0, 180); // Low C1
      // Dissonant tritone brass hit
      playBgmNote(65.41, 0.4, 'sawtooth', 0.14, 0.01, 0.35, -15, 350); // C2
      playBgmNote(92.50, 0.4, 'sawtooth', 0.14, 0.01, 0.35, 15, 350);  // F#2
    }
    if(s % 2 === 0){
      // Fast pulsing menace bass
      const menaceNotes = [65.41, 65.41, 69.30, 65.41, 92.50, 87.31, 65.41, 69.30];
      playBgmNote(menaceNotes[Math.floor(s/2) % menaceNotes.length], 0.08, 'square', 0.1, 0.005, 0.07);
    }
    if(s === 4 || s === 12 || s === 20 || s === 28){
      // High laser/alarm siren sweep
      playBgmNote(987.77, 0.15, 'sawtooth', 0.06, 0.01, 0.12);
    }
    if(s % 4 === 2){
      playBgmDrums('hihat', 0.07);
    }
  }

  bgmStep++;
}

function updateBgmTrack(){
  startBgmEngine();
  if(actx && actx.state === 'suspended'){
    actx.resume();
  }

  let targetTrack = 'menu';

  if(!state || state.mode === 'menu'){
    targetTrack = 'menu';
  } else if(state.mode === 'playing' || state.mode === 'paused'){

function bindHold(id, downFn, upFn, options = {}){
  const el = document.getElementById(id);
  if(!el) return;

  let activeInterval = null;
  let isDown = false;

  const onDown = (ev) => {
    if(ev && ev.cancelable) ev.preventDefault();
    if(ev) ev.stopPropagation();
    if(isDown) return;
    isDown = true;
    el.classList.add('active');

    downFn();

    if(options.autoRepeat){
      if(activeInterval) clearInterval(activeInterval);
      activeInterval = setInterval(() => {
        if(isDown) downFn();
      }, options.repeatInterval || 160);
    }
  };

  const onUp = (ev) => {
    if(ev && ev.cancelable) ev.preventDefault();
    if(ev) ev.stopPropagation();
    if(!isDown) return;
    isDown = false;
    el.classList.remove('active');

    if(activeInterval){
      clearInterval(activeInterval);
      activeInterval = null;
    }

    if(upFn) upFn();
  };

  el.addEventListener('touchstart', onDown, { passive: false });
  el.addEventListener('touchend', onUp, { passive: false });
  el.addEventListener('touchcancel', onUp, { passive: false });

  el.addEventListener('mousedown', (e) => {
    if(e.button === 0) onDown(e);
  });
  el.addEventListener('mouseup', onUp);
  el.addEventListener('mouseleave', onUp);
}

function handleCanvasPointer(e){
  const rect = canvas.getBoundingClientRect();
  const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
  const clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
  const mx = (clientX - rect.left) * (W / rect.width);
  const my = (clientY - rect.top) * (H / rect.height);

  if(state.mode === 'shop'){
    handleShopClick(mx, my);
  } else if(state.mode === 'dailyquests'){
    handleDailyQuestsClick(mx, my);
  } else if(state.mode === 'levelselect'){
    handleLevelSelectClick(mx, my);
  } else if(state.mode === 'settings'){
    handleSettingsClick(mx, my);
  } else if(state.mode === 'menu'){
    handleMenuClick(mx, my);
  } else if(state.mode === 'luckywheel'){
    handleLuckyWheelClick(mx, my);
  } else if(state.mode === 'gameover'){
    const bw = 190, bh = 46, gap = 18;
    const startX = W/2 - (3 * bw + 2 * gap) / 2;
    const btnY = H/2 + 65;
    const bx2 = startX + bw + gap;
    const bx3 = startX + 2 * (bw + gap);

    if(my >= btnY && my <= btnY + bh){
      if(mx >= startX && mx <= startX + bw){
        sfxBell();
        restartLevel();
        return;
      } else if(mx >= bx2 && mx <= bx2 + bw){
        sfxBell();
        state.mode = 'levelselect';
        return;
      } else if(mx >= bx3 && mx <= bx3 + bw){
        sfxBell();
        state.mode = 'menu';
        return;
      }
    }
    sfxBell();
    restartLevel();
  } else if(state.mode === 'win'){
    const bw = 190, bh = 46, gap = 18;
    const startX = W/2 - (3 * bw + 2 * gap) / 2;
    const btnY = H/2 + 55;
    const bx2 = startX + bw + gap;
    const bx3 = startX + 2 * (bw + gap);

    if(my >= btnY && my <= btnY + bh){
      if(mx >= startX && mx <= startX + bw){
        sfxBell();
        startGame();
        return;
      } else if(mx >= bx2 && mx <= bx2 + bw){
        sfxBell();
        state.mode = 'levelselect';
        return;
      } else if(mx >= bx3 && mx <= bx3 + bw){
        sfxBell();
        state.mode = 'menu';
        return;
      }
    }
    sfxBell();
    startGame();
  } else if(state.mode === 'playing' || state.mode === 'paused'){
    const hudBtnH = 28;
    const pBtnW = 38;
    const pBtnX = W - pBtnW - 12, pBtnY = 10;
    const mBtnW = 40;
    const mBtnX = pBtnX - mBtnW - 8, mBtnY = 10;

    if(my >= pBtnY && my <= pBtnY + hudBtnH){
      if(mx >= pBtnX && mx <= pBtnX + pBtnW){
        sfxBell();
        togglePause();
        return;
      } else if(mx >= mBtnX && mx <= mBtnX + mBtnW){
        sfxBell();
        toggleBgmMute();
        return;
      }
    }
  }
}

function getTodayDateString(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function checkDailyReset(){
  if(!state.dailyQuests){
    state.dailyQuests = { lastDate: '', progress: {}, claimed: {} };
  }
  const today = getTodayDateString();
  if(state.dailyQuests.lastDate !== today){
    state.dailyQuests.lastDate = today;
    state.dailyQuests.progress = {};
    state.dailyQuests.claimed = {};
    DAILY_QUESTS_LIST.forEach(q => {
      state.dailyQuests.progress[q.id] = 0;
      state.dailyQuests.claimed[q.id] = false;
    });
    saveData();
  }
}

function trackQuestProgress(type, amount = 1){
  if(!state.dailyQuests) checkDailyReset();
  const today = getTodayDateString();
  if(state.dailyQuests.lastDate !== today) checkDailyReset();

  let changed = false;
  DAILY_QUESTS_LIST.forEach(q => {
    if(q.type === type && !state.dailyQuests.claimed[q.id]){
      const current = state.dailyQuests.progress[q.id] || 0;
      if(current < q.target){
        const next = Math.min(q.target, current + amount);
        state.dailyQuests.progress[q.id] = next;
        changed = true;
        if(next >= q.target){
          sfxWin();
          sfxBell();
          toast(`🎯 დავალება შესრულდა: ${q.title}! (+${q.reward} 🪙)`, 3800);
          spawnParticles(W/2, 60, '#22c55e', 25, 2);
        }
      }
    }
  });

  if(changed){
    saveData();
  }
}

function claimQuestReward(questId){
  if(!state.dailyQuests) checkDailyReset();
  const q = DAILY_QUESTS_LIST.find(item => item.id === questId);
  if(!q) return;

  const prog = state.dailyQuests.progress[q.id] || 0;
  const isClaimed = state.dailyQuests.claimed[q.id];

  if(prog >= q.target && !isClaimed){
    state.dailyQuests.claimed[q.id] = true;
    state.coinsCollected = (state.coinsCollected || 0) + q.reward;
    saveData();
    sfxCoin();
    sfxWin();
    triggerFlash('34,197,94', 0.65);
    spawnParticles(W/2, H/2, '#22c55e', 35, 3);
    spawnParticles(W/2, H/2, '#ffd23f', 25, 2.5);
    toast(`🎉 საჩუქარი მიღებულია! +${q.reward} 🪙 მონეტა!`, 3000);
  }
}

function hasClaimableQuests(){
  if(!state.dailyQuests) return false;
  checkDailyReset();
  return DAILY_QUESTS_LIST.some(q => {
    const prog = state.dailyQuests.progress[q.id] || 0;
    const claimed = state.dailyQuests.claimed[q.id];
    return prog >= q.target && !claimed;
  });
}

  toast(`⚔️ ${td.nameGeo} — TIER ${td.tier} BOSS! ⚔️`, 3500);
}

function updateFinalBoss(dt){
  if(!finalBoss.active || finalBoss.dead) return;
  const fb = finalBoss;
  fb.animT += dt;

  // Enrage at 30% HP
  if(fb.hp <= fb.maxHp * 0.3 && !fb.enraged){
    fb.enraged = true;
    shake(30); sfxDemonic();
    triggerFlash('255,0,0', 0.7);
    toast(`💢 ${fb.nameGeo} — ENRAGE! 💢`, 2500);
  }

  // Movement toward player
  const dx = (player.x + player.w/2) - (fb.x + fb.w/2);
  fb.facing = dx > 0 ? 1 : -1;
  const spd = fb.speed * (fb.enraged ? 1.5 : 1);
  fb.vx = (dx / (Math.abs(dx) + 0.01)) * spd;

  // Platform collision
  let onGround = false;
  for(const p of (level.plats || [])){
    const bBox = {x: fb.x, y: fb.y, w: fb.w, h: fb.h};
    if(overlap(bBox, p)){
      const prevBottom = fb.y - (fb.vy || 0) + fb.h;
      if((fb.vy||0) >= 0 && prevBottom <= p.y + 6){
        fb.y = p.y - fb.h;
        fb.vy = 0;
        onGround = true;
      }
    }
  }
  fb.vy = (fb.vy || 0) + GRAVITY * 0.8;
  if(fb.vy > 16) fb.vy = 16;
  fb.x += fb.vx;
  fb.y += fb.vy;

  // Attack system
  fb.attackTimer += dt;
  const interval = fb.enraged ? 900 : 1600;
  if(fb.attackTimer > interval){
    fb.attackTimer = 0;
    const atk = fb.enraged ? 'multi' : FINAL_BOSS_TIERS[fb.tier-1].atk;
    // Launch projectile toward player
    const angle = Math.atan2((player.y+10)-(fb.y+fb.h*0.3), (player.x+player.w/2)-(fb.x+fb.w/2));
    if(atk === 'multi'){
      for(let ai=-1; ai<=1; ai++){
        fb.projectiles.push({ x:fb.x+fb.w/2, y:fb.y+fb.h*0.3, vx:Math.cos(angle+ai*0.4)*8, vy:Math.sin(angle+ai*0.4)*8, life:90, color:fb.auraColor, size:9 });
      }
    } else {
      fb.projectiles.push({ x:fb.x+fb.w/2, y:fb.y+fb.h*0.3, vx:Math.cos(angle)*7, vy:Math.sin(angle)*7, life:110, color:fb.auraColor, size:fb.tier===3?14:10 });
    }
    shake(10); sfxDemonic();
    spawnParticles(fb.x+fb.w/2, fb.y+fb.h*0.3, fb.auraColor, 15, 1.5);
  }

  // Update projectiles
  for(let i = fb.projectiles.length-1; i>=0; i--){
    const p = fb.projectiles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if(Math.random()<0.4) spawnParticles(p.x, p.y, p.color, 2, 0.4);
    // Hit player
    if(!player.dead && !player.invuln){
      const pBox = {x:p.x-p.size,y:p.y-p.size,w:p.size*2,h:p.size*2};
      if(overlap(pBox, {x:player.x,y:player.y,w:player.w,h:player.h})){
        hurtPlayer("💥 ბოსის ნასროლმა დაგაზიანა!", "boss");
        p.life = 0;
      }
    }
    if(p.life <= 0) fb.projectiles.splice(i, 1);
  }

  // Melee hit player on contact
  if(!player.dead && !player.invuln){
    if(overlap({x:fb.x,y:fb.y,w:fb.w,h:fb.h},{x:player.x,y:player.y,w:player.w,h:player.h})){
      hurtPlayer("💥 ბოსმა დაგარტყა!", "boss");
    }
  }

  // Bullet hits
  for(let i = bullets.length-1; i>=0; i--){
    const b = bullets[i];
    const bBox={x:b.x-b.size,y:b.y-b.size,w:b.size*2,h:b.size*2};
    if(overlap(bBox,{x:fb.x,y:fb.y,w:fb.w,h:fb.h})){
      fb.hp -= (b.damage || 1);
      spawnParticles(b.x, b.y, fb.auraColor, 10, 1.2);
      sfxZombieHit();
      addFloatingText(fb.x+fb.w/2, fb.y-12, '-'+(b.damage||1), fb.auraColor);
      if(b.isRocket && !b.hasExploded){
        b.hasExploded = true; fb.hp -= 10;
        shake(24); spawnParticles(b.x,b.y,'#ff4400',40,3.5);
      }
      bullets.splice(i, 1);
    }
  }

  // Boss death
  if(fb.hp <= 0 && !fb.dead){
    fb.dead = true;
    fb.deathAnimTimer = 120;
    for(let i=0;i<8;i++) spawnParticles(fb.x+fb.w/2+Math.random()*80-40, fb.y+Math.random()*fb.h, fb.auraColor, 30, 3);
    shake(40); sfxWin(); sfxDemonic();
    triggerFlash('255,210,63', 0.9);
    addScore(fb.reward);
    state.coinsCollected = (state.coinsCollected||0) + Math.floor(fb.reward/5);
    toast(`🏆 ${fb.nameGeo} დამარცხდა! +${fb.reward} ქულა!`, 4000);
    finalBoss.active = false;
  }
}

function drawFinalBoss(){
  if(!finalBoss.active && !(finalBoss.dead && finalBoss.deathAnimTimer > 0)) return;
  const fb = finalBoss;
  const sx = fb.x - camX;
  if(sx + fb.w < -100 || sx > W + 100) return;

  ctx.save();
  ctx.translate(sx + fb.w/2, fb.y + fb.h/2);
  ctx.scale(fb.facing, 1);

  const wobble = Math.sin(fb.animT * 0.007) * (fb.enraged ? 8 : 4);
  const pulse = Math.sin(fb.animT * 0.012) * 0.15 + 0.85;

  // Aura ring
  ctx.save();
  ctx.globalAlpha = 0.25 * pulse;
  ctx.fillStyle = fb.auraColor;
  ctx.beginPath();
  ctx.ellipse(0, 0, fb.w*0.7, fb.h*0.6, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();

  const hw = fb.w / 2, hh = fb.h / 2;

  // Thick heavy legs
  ctx.fillStyle = fb.color;
  ctx.fillRect(-hw*0.4, hh*0.4 + wobble*0.3, hw*0.35, hh*0.6);
  ctx.fillRect(hw*0.05, hh*0.4 - wobble*0.3, hw*0.35, hh*0.6);

  // Main body
  ctx.fillStyle = fb.color;
  ctx.beginPath();
  ctx.ellipse(0, wobble*0.2, hw*0.75, hh*0.7, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = fb.auraColor;
  ctx.lineWidth = 3;
  ctx.stroke();

  // Shoulder armor plates
  ctx.fillStyle = fb.auraColor;
  ctx.beginPath();
  ctx.moveTo(-hw*0.7, -hh*0.1); ctx.lineTo(-hw*1.1, -hh*0.4+wobble); ctx.lineTo(-hw*0.5, -hh*0.3); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hw*0.7, -hh*0.1); ctx.lineTo(hw*1.1, -hh*0.4+wobble); ctx.lineTo(hw*0.5, -hh*0.3); ctx.closePath(); ctx.fill();

  // Arms reaching forward
  ctx.fillStyle = fb.color;
  ctx.fillRect(hw*0.5, -hh*0.2 + wobble, hw*0.7, hh*0.25);
  ctx.fillRect(-hw*1.2, -hh*0.2 - wobble, hw*0.7, hh*0.25);

  // Head
  ctx.fillStyle = fb.color;
  ctx.beginPath();
  ctx.ellipse(0, -hh*0.8 + wobble, hw*0.55, hh*0.4, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = fb.auraColor;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Crown / horns based on tier
  ctx.fillStyle = fb.auraColor;
  if(fb.tier >= 1){
    // Crown spikes
    for(let ci=-2; ci<=2; ci++){
      ctx.beginPath(); ctx.moveTo(ci*hw*0.2, -hh*1.1+wobble); ctx.lineTo(ci*hw*0.2-6, -hh*1.4+wobble); ctx.lineTo(ci*hw*0.2+6, -hh*1.4+wobble); ctx.closePath(); ctx.fill();
    }
  }

  // Glowing eyes
  ctx.save();
  ctx.shadowColor = fb.auraColor; ctx.shadowBlur = 16;
  ctx.fillStyle = fb.auraColor;
  ctx.beginPath(); ctx.arc(-hw*0.2, -hh*0.85+wobble, hh*0.1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(hw*0.2, -hh*0.85+wobble, hh*0.1, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-hw*0.18, -hh*0.86+wobble, hh*0.04, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(hw*0.22, -hh*0.86+wobble, hh*0.04, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.restore();

  // Draw projectiles
  for(const p of fb.projectiles){
    const px = p.x - camX;
    ctx.save();
    ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(px, p.y, p.size, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Boss HP bar at top of screen
  const barW = 440, barH = 20, bx = W/2 - barW/2, by = 48;
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(bx-14, by-28, barW+28, barH+40);
  ctx.strokeStyle = fb.auraColor; ctx.lineWidth = 2;
  ctx.strokeRect(bx-14, by-28, barW+28, barH+40);

  ctx.fillStyle = fb.enraged ? '#ef4444' : fb.auraColor;
  ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(`${fb.enraged ? '💢 ENRAGED — ' : ''}${fb.name} — ${fb.nameGeo} [TIER ${fb.tier}]`, W/2, by-10);

  ctx.fillStyle = '#1a1a2e'; ctx.fillRect(bx, by, barW, barH);
  const hpFill = Math.max(0, fb.hp / fb.maxHp);
  const hpGrad = ctx.createLinearGradient(bx,0,bx+barW,0);
  hpGrad.addColorStop(0, fb.auraColor); hpGrad.addColorStop(1, fb.enraged ? '#ef4444' : '#ffffff');
  ctx.fillStyle = hpGrad;
  ctx.fillRect(bx, by, barW * hpFill, barH);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, barW, barH);

  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(`${Math.max(0,fb.hp)} / ${fb.maxHp} HP`, W/2, by + barH + 14);
}

let nukeSeq = {
  active: false,
  timer: 0,
  missileY: H + 120,
  missileX: W / 2,
  exploded: false,
  flash: 0,
  smokeParticles: []
};

// ---------- Airplane Level System ----------
const airplane = {
  active: false,
  x: 80, y: 200, w: 110, h: 42,
  vx: 0, vy: 0,
  speed: 3.5, maxVy: 4,
  animT: 0,
  exhaust: [],
  shields: 25, maxShields: 25,
  invuln: 0,
  engineTrail: [],
  shootTimer: 0,
  hasRevived: false,
  regenTimer: 0
};

let airEnemies = [];   // zombie aircraft
let airBullets = [];   // player air bullets
let airGroundTurrets = []; // ground turrets
let airClouds = [];
let airScrollX = 0;
let airBossActive = false;
let airBoss = { x:0, y:0, w:160, h:70, hp:350, maxHp:350, animT:0, vx:0, vy:0, shootTimer:0, enraged:false, dead:false };

function initAirplaneLevel(){
  airplane.active = true;
  airplane.w = 110; airplane.h = 42;
  airplane.x = 80; airplane.y = 200;
  airplane.vx = 0; airplane.vy = 0;
  airplane.shields = 25; airplane.maxShields = 25;
  airplane.invuln = 0;
  airplane.exhaust = []; airplane.engineTrail = [];
  airplane.shootTimer = 0;
  airplane.hasRevived = false;
  airplane.regenTimer = 0;
  airEnemies = []; airBullets = []; airGroundTurrets = [];
  airScrollX = 0; airBossActive = false;
  airBoss.dead = false; airBoss.hp = 350;
  // Generate ground turrets at fixed intervals
  for(let i = 0; i < 14; i++){
    airGroundTurrets.push({ x: 600 + i*850, y: H - 60, w:32, h:40, hp:3, cooldown:0, destroyed:false });
  }
  // Generate initial clouds
  airClouds = [];
  for(let i=0; i<18; i++){
    airClouds.push({ x: Math.random()*14000, y: 40+Math.random()*280, r: 40+Math.random()*60, speed: 0.4+Math.random()*0.6 });
  }
  // Set player initial position to hanging underneath airplane
  player.w = 32; player.h = 44;
  player.x = 80; player.y = 240; player.vx = 0; player.vy = 0; player.facing = 1;
}

function updateAirplaneLevel(dt){
  if(!level || !level.isAirplaneLevel || !airplane.active) return;
  airplane.animT += dt;
  if(airplane.invuln > 0) airplane.invuln--;

  // Passive Shield Auto-Regeneration (restores 1 shield every 2 seconds if not hit)
  if(airplane.invuln <= 0 && airplane.shields < airplane.maxShields){
    airplane.regenTimer = (airplane.regenTimer || 0) + dt;
    if(airplane.regenTimer > 2000){
      airplane.shields++;
      airplane.regenTimer = 0;
    }
  } else {
    airplane.regenTimer = 0;
  }

  // Controls: W/S or UP/DOWN for Y altitude, A/D or LEFT/RIGHT for X speed adjustment
  const upHeld = keys['w'] || keys['arrowup'] || keys['W'] || keys['KeyW'] || keys['ArrowUp'];
  const downHeld = keys['s'] || keys['arrowdown'] || keys['S'] || keys['KeyS'] || keys['ArrowDown'];
  const leftHeld = keys['a'] || keys['arrowleft'] || keys['A'] || keys['KeyA'] || keys['ArrowLeft'];
  const rightHeld = keys['d'] || keys['arrowright'] || keys['D'] || keys['KeyD'] || keys['ArrowRight'];

  if(upHeld)   airplane.vy = Math.max(airplane.vy - 0.45, -airplane.maxVy);
  if(downHeld) airplane.vy = Math.min(airplane.vy + 0.45,  airplane.maxVy);
  airplane.vy *= 0.88; // Damping

  let fwdSpd = 2.4;
  if(rightHeld) fwdSpd += 1.8;
  if(leftHeld)  fwdSpd -= 1.4;

  const maxW = level.width || 14000;
  airplane.x = Math.max(20, Math.min(maxW - 200, airplane.x + fwdSpd));
  airplane.y = Math.max(20, Math.min(H - 120, airplane.y + airplane.vy));

  // Check flag / level finish reach
  const finishX = level.flag ? level.flag.x - 60 : maxW - 500;
  if(airplane.x >= finishX){
    levelClear();
    return;
  }

  // Collect coins in airplane mode
  if(level.coins){
    for(let i = level.coins.length - 1; i >= 0; i--){
      const c = level.coins[i];
      const plBox = {x: player.x - 10, y: player.y - 10, w: player.w + 20, h: player.h + 20};
      const airBox = {x: airplane.x - 10, y: airplane.y - 10, w: airplane.w + 20, h: airplane.h + 20};
      if(overlap(c, plBox) || overlap(c, airBox)){
        state.score += 15;
        sfxCoin();
        spawnParticles(c.x + 11, c.y + 11, '#facc15', 8, 1);
        if(airplane.shields < airplane.maxShields) airplane.shields++;
        addFloatingText(c.x, c.y, '+15 💰 (+1 Shield)', '#facc15');
        level.coins.splice(i, 1);
      }
    }
  }

  // Collect bells in airplane mode
  if(level.bells){
    for(let i = level.bells.length - 1; i >= 0; i--){
      const b = level.bells[i];
      const plBox = {x: player.x - 10, y: player.y - 10, w: player.w + 20, h: player.h + 20};
      const airBox = {x: airplane.x - 10, y: airplane.y - 10, w: airplane.w + 20, h: airplane.h + 20};
      if(overlap(b, plBox) || overlap(b, airBox)){
        state.score += 100;
        sfxBell();
        airplane.shields = Math.min(airplane.maxShields, airplane.shields + 5);
        spawnParticles(b.x + 13, b.y + 15, '#eab308', 15, 2);
        toast('🔔 საჰაერო ზარი: +5 ფარი! 🔔', 1500);
        level.bells.splice(i, 1);
      }
    }
  }

  // Collect jumpboxes in airplane mode
  if(level.jumpboxes){
    for(const jb of level.jumpboxes){
      if(!jb.hit){
        const plBox = {x: player.x, y: player.y, w: player.w, h: player.h};
        const airBox = {x: airplane.x, y: airplane.y, w: airplane.w, h: airplane.h};
        if(overlap(jb, plBox) || overlap(jb, airBox)){
          activateJumpbox(jb);
          airplane.shields = Math.min(airplane.maxShields, airplane.shields + 8);
          toast('🎁 საჰაერო ყუთი: იარაღის განახლება & +8 ფარი! ✈️', 2000);
        }
      }
    }
  }

  // Dynamic Hanging Hero Position & Physics ("გაკიდების სისტემა")
  const pitchAngle = Math.sin(airplane.animT * 0.05) * 0.04 + (airplane.vy * 0.03);
  const swingAngle = Math.sin(airplane.animT * 0.06) * 0.14 - (airplane.vy * 0.05);

  const anchorX = airplane.x + airplane.w * 0.42;
  const anchorY = airplane.y + airplane.h * 0.8;
  const hangLength = 36;
  const heroX = anchorX + Math.sin(pitchAngle + swingAngle) * hangLength;
  const heroY = anchorY + Math.cos(pitchAngle + swingAngle) * hangLength;

  player.x = heroX - player.w / 2;
  player.y = heroY - player.h / 2;
  player.w = 32; player.h = 44;
  player.facing = 1;
  camX = Math.max(0, airplane.x - 180);

  // Airplane & Hanging Shooting System
  const shootKeyHeld = keys['Space'] || keys[' '] || keys['KeyK'] || keys['KeyF'] || keys['KeyJ'] || mouseState.isDown;
  if(shootKeyHeld){
    airplane.shootTimer -= dt;
    if(airplane.shootTimer <= 0){
      shoot();
      const mode = player.weaponMode || 'pistol';
      airplane.shootTimer = (mode === 'minigun' || mode === 'flamethrower') ? 75 : 170;
    }
  } else {
    airplane.shootTimer = 0;
  }

  // Engine smoke and particle trail
  airplane.engineTrail.unshift({x: airplane.x - 6, y: airplane.y + airplane.h * 0.4, life: 20});
  if(airplane.engineTrail.length > 35) airplane.engineTrail.pop();

  // Spawn enemy aircraft every ~2.5 seconds
  const spawnInterval = airBossActive ? 99999 : (800 - state.levelIndex * 8);
  if(Math.floor(state.time / spawnInterval) > Math.floor((state.time - dt) / spawnInterval)){
    const ey = 40 + Math.random() * (H - 180);
    const isFast = Math.random() < 0.35;
    airEnemies.push({
      x: W + camX + 60, y: ey, w: isFast?52:64, h: isFast?22:30,
      vx: -(3.0 + Math.random()*1.8) * (isFast?1.5:1),
      vy: (Math.random()-0.5)*1.2,
      hp: isFast?1:2, maxHp: isFast?1:2,
      animT: Math.random()*100,
      isFast, shootTimer: 80+Math.random()*120
    });
  }

  // Spawn air boss at 70% level progress
  const levelProgress = camX / ((level.width || 14000) - W);
  if(levelProgress > 0.7 && !airBossActive && !airBoss.dead){
    airBossActive = true;
    airBoss.x = W + camX; airBoss.y = H/2 - 35;
    airBoss.hp = 350; airBoss.maxHp = 350;
    airBoss.vx = -1.5; airBoss.vy = 0;
    airBoss.animT = 0; airBoss.enraged = false; airBoss.shootTimer = 0;
    shake(25); sfxDemonic(); triggerFlash('255,100,0', 0.7);
    toast('💀 CODEZERO ზომბი-ბომბდამშენი გამოჩნდა! 💀', 3500);
  }

  // Air boss update
  if(airBossActive && !airBoss.dead){
    airBoss.animT += dt;
    if(airBoss.hp <= airBoss.maxHp * 0.35 && !airBoss.enraged){
      airBoss.enraged = true; shake(20); sfxDemonic();
      toast('💢 ბომბდამშენი განრისხდა!', 2000);
    }
    const spd = airBoss.enraged ? 2.2 : 1.5;
    airBoss.vx = (airplane.x - airBoss.x > 0 ? 0.5 : -0.5) * spd;
    airBoss.vy = (airplane.y - airBoss.y > 0 ? 1 : -1) * spd * 0.7;
    airBoss.x += airBoss.vx; airBoss.y += airBoss.vy;
    airBoss.y = Math.max(30, Math.min(H - 100, airBoss.y));
    airBoss.x = Math.max(camX + W*0.4, Math.min(camX + W - 20, airBoss.x));

    airBoss.shootTimer += dt;
    const shotInterval = airBoss.enraged ? 850 : 1400;
    if(airBoss.shootTimer > shotInterval){
      airBoss.shootTimer = 0;
      const ang = Math.atan2((airplane.y+18)-(airBoss.y+35), airplane.x - airBoss.x);
      for(let si=-1; si<=1; si++){
        airBullets.push({x:airBoss.x, y:airBoss.y+35, vx:Math.cos(ang+si*0.3)*9, vy:Math.sin(ang+si*0.3)*9, life:80, color:'#ef4444', size:9, isEnemy:true});
      }
      shake(8);
    }
    // Boss bullet hit by player
    for(let bi = bullets.length-1; bi>=0; bi--){
      const b = bullets[bi];
      const bBox={x:b.x-b.size,y:b.y-b.size,w:b.size*2,h:b.size*2};
      if(overlap(bBox,{x:airBoss.x,y:airBoss.y,w:airBoss.w,h:airBoss.h})){
        airBoss.hp -= (b.damage||1) * (b.isRocket?3:1);
        spawnParticles(b.x,b.y,'#ef4444',12,1.5);
        sfxZombieHit();
        addFloatingText(airBoss.x+airBoss.w/2, airBoss.y-12, '-'+(b.damage||1), '#ef4444');
        bullets.splice(bi,1);
        if(airBoss.hp<=0){ airBoss.dead=true; airBossActive=false; shake(40); sfxWin(); addScore(1000); triggerFlash('255,210,63',0.9); toast('✈️ CODEZERO ბომბდამშენი განადგურდა! +1000 ქულა!',4000); }
      }
    }
  }

  // Update air enemies
  for(let i = airEnemies.length-1; i>=0; i--){
    const e = airEnemies[i];
    e.animT += dt;
    e.x += e.vx; e.y += e.vy;
    e.vy += (Math.sin(e.animT*0.008)*0.08);
    e.y = Math.max(30, Math.min(H-80, e.y));
    // Enemy shoots
    e.shootTimer -= dt;
    if(e.shootTimer <= 0){
      e.shootTimer = 100 + Math.random()*120;
      airBullets.push({x:e.x, y:e.y+e.h/2, vx:-7.5, vy:(Math.random()-0.5)*1.8, life:60, color:'#ef4444', size:7, isEnemy:true});
    }
    // Hit by player bullet
    for(let bi=bullets.length-1; bi>=0; bi--){
      const b = bullets[bi];
      const bBox={x:b.x-b.size,y:b.y-b.size,w:b.size*2,h:b.size*2};
      if(overlap(bBox,{x:e.x,y:e.y,w:e.w,h:e.h})){
        e.hp -= (b.damage||1);
        spawnParticles(b.x,b.y,'#ff6600',10,1.5);
        sfxZombieHit();
        bullets.splice(bi,1);
        if(e.hp<=0){ spawnParticles(e.x+e.w/2,e.y+e.h/2,'#ff4400',30,2.5); sfxFall(); addScore(25); airEnemies.splice(i,1); break; }
      }
    }
    if(airEnemies[i] && e.x < camX - 200) airEnemies.splice(i,1);
  }

  // Update ground turrets
  for(const t of airGroundTurrets){
    if(t.destroyed) continue;
    t.cooldown -= dt;
    if(t.cooldown <= 0){
      t.cooldown = 2200;
      airBullets.push({x:t.x+16, y:t.y, vx:(Math.random()-0.5)*2, vy:-8.5, life:60, color:'#f59e0b', size:7, isEnemy:true, isTurretShell:true});
    }
    // Hit by player bullet
    for(let bi=bullets.length-1; bi>=0; bi--){
      const b = bullets[bi];
      const bBox={x:b.x-b.size,y:b.y-b.size,w:b.size*2,h:b.size*2};
      if(overlap(bBox,{x:t.x,y:t.y,w:t.w,h:t.h})){
        t.hp -= (b.damage||1);
        bullets.splice(bi,1);
        sfxZombieHit(); spawnParticles(t.x+16,t.y,'#f59e0b',10,1.5);
        if(t.hp<=0){ t.destroyed=true; addScore(30); spawnParticles(t.x+16,t.y+20,'#ff4400',25,2.5); break; }
      }
    }
  }

  // Helper damage function
  function applyAirplaneDamage(){
    airplane.shields--;
    airplane.invuln = 120; // 2 seconds of invulnerability
    shake(18); sfxHurt();
    spawnParticles(player.x+player.w/2, player.y+player.h/2, '#ff3d6e', 20, 2);
    triggerFlash('255,61,110', 0.5);
    if(airplane.shields <= 0){
      if(!airplane.hasRevived){
        airplane.hasRevived = true;
        airplane.shields = 12;
        airplane.invuln = 180;
        shake(28);
        triggerFlash('0,255,120', 0.8);
        toast("🛡️ ავარიული ფარის გადატვირთვა! +12 ფარი!", 2500);
      } else {
        player.dead = true;
        state.mode = 'gameover';
      }
    }
  }

  // Update air bullets (both player and enemy)
  for(let i=airBullets.length-1; i>=0; i--){
    const b = airBullets[i];
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if(b.isTurretShell) b.vy += 0.15; // slight arc
    if(b.isEnemy && airplane.invuln<=0){
      const plBox={x:player.x,y:player.y,w:player.w,h:player.h};
      const airBox={x:airplane.x,y:airplane.y,w:airplane.w,h:airplane.h};
      const bBox={x:b.x-b.size,y:b.y-b.size,w:b.size*2,h:b.size*2};
      if(overlap(bBox,plBox) || overlap(bBox,airBox)){
        b.life=0;
        applyAirplaneDamage();
      }
    }
    if(b.life<=0) airBullets.splice(i,1);
  }

  // Enemy aircraft collision with airplane or hanging player
  for(let i=airEnemies.length-1; i>=0; i--){
    const e = airEnemies[i];
    const airBox={x:airplane.x,y:airplane.y,w:airplane.w,h:airplane.h};
    const plBox={x:player.x,y:player.y,w:player.w,h:player.h};
    if(airplane.invuln<=0 && (overlap({x:e.x,y:e.y,w:e.w,h:e.h},airBox) || overlap({x:e.x,y:e.y,w:e.w,h:e.h},plBox))){
      e.hp=0; airEnemies.splice(i,1);
      applyAirplaneDamage();
    }
  }
}

function drawAirplaneLevel(){
  if(!level || !level.isAirplaneLevel) return;

  // 1. Dynamic Atmosphere & Sky Gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#090d16');
  skyGrad.addColorStop(0.3, '#1e1b4b');
  skyGrad.addColorStop(0.65, '#312e81');
  skyGrad.addColorStop(0.85, '#4338ca');
  skyGrad.addColorStop(1, '#ea580c');
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, H);

  // High altitude wind streaks
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1;
  const windOffset = (state.time * 0.8) % 300;
  for(let wy = 30; wy < H - 100; wy += 45){
    ctx.beginPath();
    ctx.moveTo((windOffset * 2 + wy * 10) % W, wy);
    ctx.lineTo(((windOffset * 2 + wy * 10) % W) + 120, wy);
    ctx.stroke();
  }

  // Distant Mountain & Skyscraper Silhouette Horizon
  ctx.fillStyle = '#0f172a';
  for(let mx = -100; mx < W + 200; mx += 140){
    const cx = (mx - camX * 0.04) % (W + 280) - 100;
    ctx.beginPath();
    ctx.moveTo(cx, H - 45);
    ctx.lineTo(cx + 60, H - 120);
    ctx.lineTo(cx + 100, H - 80);
    ctx.lineTo(cx + 140, H - 45);
    ctx.fill();
    // Skyscraper blocks
    ctx.fillRect(cx + 40, H - 160, 35, 115);
    // Flickering windows
    ctx.fillStyle = '#fef08a';
    if(Math.floor(state.time / 400 + cx) % 2 === 0){
      ctx.fillRect(cx + 46, H - 145, 5, 8);
      ctx.fillRect(cx + 60, H - 130, 5, 8);
    }
    ctx.fillStyle = '#0f172a';
  }

  // Horizon Glowing Ground/Water Strip
  ctx.fillStyle = '#020617';
  ctx.fillRect(0, H - 45, W, 45);
  ctx.fillStyle = '#f97316';
  ctx.fillRect(0, H - 46, W, 2);

  // Multi-layered Parallax Clouds
  for(const cl of airClouds){
    const cx = ((cl.x - camX * cl.speed * 0.35)) % (W + 300) - 50;
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.beginPath();
    ctx.arc(cx, cl.y, cl.r, 0, Math.PI*2);
    ctx.arc(cx + cl.r*0.65, cl.y - cl.r*0.25, cl.r*0.75, 0, Math.PI*2);
    ctx.arc(cx - cl.r*0.55, cl.y + cl.r*0.15, cl.r*0.65, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // Coins, Bells, Crystals, Orbs, Trophies, Flags & Sky Collectibles
  if(level.coins) level.coins.forEach(drawCoin);
  if(level.energyCrystals) level.energyCrystals.forEach(drawEnergyCrystal);
  if(level.electroOrbs) level.electroOrbs.forEach(drawElectroOrb);
  if(level.goldTrophies) level.goldTrophies.forEach(drawGoldTrophy);
  if(level.bells) level.bells.forEach(drawBell);
  if(level.jumpboxes) level.jumpboxes.forEach(drawJumpBox);
  if(level.signs) level.signs.forEach(drawSign);
  if(level.checkpoints) level.checkpoints.forEach(drawCheckpoint);
  drawFlag(level.flag);

  // Ground Turrets (Anti-Aircraft)
  for(const t of airGroundTurrets){
    const tx = t.x - camX;
    if(tx < -50 || tx > W+50) continue;
    if(t.destroyed){
      ctx.fillStyle='#1e293b'; ctx.fillRect(tx, t.y+20, t.w, 20);
      spawnParticles(tx+16, t.y+10, '#ff4400', 1, 0.5);
    } else {
      ctx.fillStyle='#334155'; ctx.fillRect(tx, t.y+10, t.w, 30);
      ctx.fillStyle='#475569'; ctx.fillRect(tx+8, t.y, 14, 12);
      ctx.strokeStyle='#f87171'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(tx+15, t.y); ctx.lineTo(tx+15, t.y-22); ctx.stroke();
    }
  }

  // Air Enemies (Zombie Fighter Jets, Helicopters & Biplanes)
  for(const e of airEnemies){
    const ex = e.x - camX;
    if(ex < -100 || ex > W + 100) continue;
    ctx.save();
    ctx.translate(ex + e.w/2, e.y + e.h/2);
    ctx.scale(-1, 1); // facing left towards Dino
    const wobble = Math.sin(e.animT * 0.03) * 4;

    // Emit damage smoke when injured
    if(e.hp < e.maxHp && Math.random() < 0.4){
      spawnParticles(e.x + e.w/2, e.y + e.h/2, '#ef4444', 2, 1);
    }

    if(e.isFast){
      // 🚀 ZOMBIE FIGHTER JET
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.moveTo(-e.w*0.5, wobble);
      ctx.lineTo(e.w*0.45, wobble - 10);
      ctx.lineTo(e.w*0.55, wobble);
      ctx.lineTo(e.w*0.45, wobble + 10);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1.5; ctx.stroke();

      // Jet Delta Wings
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.moveTo(0, wobble - 10); ctx.lineTo(-e.w*0.4, wobble - 22); ctx.lineTo(-e.w*0.1, wobble - 5); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, wobble + 10); ctx.lineTo(-e.w*0.4, wobble + 22); ctx.lineTo(-e.w*0.1, wobble + 5); ctx.fill();

      // Jet Thruster Flame
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.arc(-e.w*0.52, wobble, 5 + Math.random()*3, 0, Math.PI*2); ctx.fill();

      // Glowing Red Cockpit Visor
      ctx.fillStyle = '#ef4444'; ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 8;
      ctx.fillRect(e.w*0.2, wobble - 4, 10, 5); ctx.shadowBlur = 0;
    } else {
      // 🚁 ZOMBIE HELICOPTER / BIPLANE
      ctx.fillStyle = '#451a03';
      ctx.beginPath(); ctx.ellipse(0, wobble, e.w*0.42, e.h*0.38, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1.5; ctx.stroke();

      // Double Wings
      ctx.fillStyle = '#78350f';
      ctx.fillRect(-e.w*0.4, wobble - 7, e.w*0.8, 6);
      ctx.fillRect(-e.w*0.3, wobble + 6, e.w*0.6, 5);

      // Skull Emblem
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(-e.w*0.08, wobble - 1, 4, 0, Math.PI*2); ctx.fill();

      // Spinning Nose Propeller
      ctx.fillStyle = '#1c1917';
      ctx.beginPath(); ctx.ellipse(e.w*0.44, wobble, 8, 6, 0, 0, Math.PI*2); ctx.fill();
      const propRot = e.animT * 0.16;
      ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(e.w*0.48 + Math.cos(propRot)*14, wobble + Math.sin(propRot)*14);
      ctx.lineTo(e.w*0.48 - Math.cos(propRot)*14, wobble - Math.sin(propRot)*14);
      ctx.stroke();
    }

    // Health Bar
    ctx.fillStyle = '#0f172a'; ctx.fillRect(-e.w/2, -e.h/2 - 10, e.w, 5);
    ctx.fillStyle = '#ef4444'; ctx.fillRect(-e.w/2, -e.h/2 - 10, e.w * (Math.max(0, e.hp) / e.maxHp), 5);
    ctx.restore();
  }

  // Air Boss (Zombie Megafortress Zeppelin)
  if(airBossActive && !airBoss.dead){
    const bx = airBoss.x - camX;
    ctx.save();
    ctx.translate(bx + airBoss.w/2, airBoss.y + airBoss.h/2);
    ctx.scale(-1, 1);
    const bwobble = Math.sin(airBoss.animT * 0.008) * 6;

    // Red Searchlight Beam sweeping across sky toward player
    const beamAng = Math.sin(airBoss.animT * 0.03) * 0.25;
    ctx.save();
    ctx.fillStyle = 'rgba(239, 68, 68, 0.18)';
    ctx.beginPath();
    ctx.moveTo(airBoss.w*0.4, bwobble);
    ctx.lineTo(airBoss.w*0.4 + Math.cos(beamAng - 0.3) * 500, bwobble + Math.sin(beamAng - 0.3) * 500);
    ctx.lineTo(airBoss.w*0.4 + Math.cos(beamAng + 0.3) * 500, bwobble + Math.sin(beamAng + 0.3) * 500);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // Heavy Armored Hull
    ctx.fillStyle = airBoss.enraged ? '#7f1d1d' : '#271010';
    ctx.beginPath(); ctx.ellipse(0, bwobble, airBoss.w*0.46, airBoss.h*0.42, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = airBoss.enraged ? '#ef4444' : '#b91c1c'; ctx.lineWidth = 3.5; ctx.stroke();

    // Painted Stencil Text
    ctx.font = '900 12px sans-serif'; ctx.fillStyle = '#fca5a5'; ctx.textAlign = 'center';
    ctx.fillText('CODEZERO MEGA-ZOMBIE', 0, bwobble - 2);

    // Wings & Turrets
    ctx.fillStyle = '#4c1d95';
    ctx.fillRect(-airBoss.w*0.48, bwobble - 10, airBoss.w*0.96, 16);
    ctx.fillStyle = '#18181b';
    ctx.beginPath(); ctx.ellipse(airBoss.w*0.46, bwobble, 16, 12, 0, 0, Math.PI*2); ctx.fill();

    // Dual Props
    for(let pi = -1; pi <= 1; pi += 2){
      const pr = airBoss.animT * 0.12 + pi * Math.PI / 2;
      ctx.strokeStyle = '#f1f5f9'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(pi*40 + Math.cos(pr)*20, bwobble + Math.sin(pr)*20);
      ctx.lineTo(pi*40 - Math.cos(pr)*20, bwobble - Math.sin(pr)*20);
      ctx.stroke();
    }

    ctx.restore();

    // Boss Health Bar HUD
    const bbarW = 420, bbarH = 20, bbx = W/2 - bbarW/2, bby = 50;
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(bbx - 14, bby - 28, bbarW + 28, bbarH + 42);
    ctx.strokeStyle = airBoss.enraged ? '#ef4444' : '#f97316'; ctx.lineWidth = 2; ctx.strokeRect(bbx - 14, bby - 28, bbarW + 28, bbarH + 42);
    ctx.fillStyle = airBoss.enraged ? '#ef4444' : '#facc15'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`${airBoss.enraged ? '💢 განრისხებული: ' : ''}💀 CODEZERO ზომბი-ბომბდამშენი (BOSS) 💀`, W/2, bby - 8);
    ctx.fillStyle = '#18181b'; ctx.fillRect(bbx, bby, bbarW, bbarH);
    const bfill = Math.max(0, airBoss.hp / airBoss.maxHp);
    const bgrad = ctx.createLinearGradient(bbx, 0, bbx + bbarW, 0);
    bgrad.addColorStop(0, '#ef4444'); bgrad.addColorStop(1, '#f97316');
    ctx.fillStyle = bgrad; ctx.fillRect(bbx, bby, bbarW * bfill, bbarH);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(bbx, bby, bbarW, bbarH);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText(`${Math.max(0, Math.floor(airBoss.hp))} / ${airBoss.maxHp} HP (${Math.floor(bfill*100)}%)`, W/2, bby + bbarH + 15);
  }

  // Air Enemy Bullets
  for(const b of airBullets){
    const bx2 = b.x - camX;
    ctx.save();
    ctx.fillStyle = b.isEnemy ? '#ef4444' : '#ffd23f';
    ctx.shadowColor = b.color || '#ffd23f'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(bx2, b.y, b.size*0.75, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Player Bullets
  bullets.forEach(drawBullet);

  // ---------- DRAW ASSEMBLED CODEZERO AIRPLANE & HANGING DINO CHARACTER ----------
  const apx = airplane.x - camX;
  const apy = airplane.y;

  // Engine Exhaust Flame & Jet Particles
  for(let i = airplane.engineTrail.length - 1; i >= 0; i--){
    const tr = airplane.engineTrail[i];
    tr.life--;
    if(tr.life <= 0){
      airplane.engineTrail.splice(i, 1);
      continue;
    }
    const trx = tr.x - camX;
    const alpha = Math.max(0, Math.min(1, tr.life / 20));
    const r = Math.max(0, 7 * (tr.life / 20));
    ctx.save(); ctx.globalAlpha = alpha * 0.7;
    ctx.fillStyle = Math.random() < 0.5 ? '#f97316' : '#facc15';
    ctx.beginPath(); ctx.arc(trx, tr.y, r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  const pitchAngle = Math.sin(airplane.animT * 0.05) * 0.04 + (airplane.vy * 0.03);
  const swingAngle = Math.sin(airplane.animT * 0.06) * 0.14 - (airplane.vy * 0.05);
  const wobble2 = Math.sin(airplane.animT * 0.04) * 2;

  ctx.save();
  ctx.translate(apx + airplane.w/2, apy + airplane.h/2);
  ctx.rotate(pitchAngle);

  if(airplane.invuln > 0 && Math.floor(airplane.invuln / 5) % 2 === 0) ctx.globalAlpha = 0.4;

  // 1. TOP MAIN WING
  ctx.fillStyle = '#1e3a8a';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(-airplane.w*0.48, wobble2 - 22, airplane.w*0.96, 10, 4);
  else ctx.fillRect(-airplane.w*0.48, wobble2 - 22, airplane.w*0.96, 10);
  ctx.fill();
  ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 1.5; ctx.stroke();

  // Top Wing Branding
  ctx.save();
  ctx.font = '900 10px monospace'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('CODEZERO', 0, wobble2 - 17);
  ctx.restore();

  // Wingtip Strobe Lights
  ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(-airplane.w*0.46, wobble2 - 17, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#10b981'; ctx.beginPath(); ctx.arc(airplane.w*0.46, wobble2 - 17, 3, 0, Math.PI*2); ctx.fill();

  // Struts
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-airplane.w*0.35, wobble2 - 12); ctx.lineTo(-airplane.w*0.35, wobble2 + 6);
  ctx.moveTo(airplane.w*0.35, wobble2 - 12); ctx.lineTo(airplane.w*0.35, wobble2 + 6);
  ctx.stroke();

  // 2. MAIN FUSELAGE
  const fuseGrad = ctx.createLinearGradient(0, wobble2 - 15, 0, wobble2 + 15);
  fuseGrad.addColorStop(0, '#1e293b'); fuseGrad.addColorStop(0.5, '#0f172a'); fuseGrad.addColorStop(1, '#1e3a8a');
  ctx.fillStyle = fuseGrad;
  ctx.beginPath(); ctx.ellipse(0, wobble2, airplane.w*0.46, airplane.h*0.42, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();

  // Yellow Hazard Stripes
  ctx.fillStyle = '#facc15';
  ctx.beginPath(); ctx.moveTo(-airplane.w*0.36, wobble2 - 8); ctx.lineTo(-airplane.w*0.28, wobble2 - 8); ctx.lineTo(-airplane.w*0.34, wobble2 + 8); ctx.lineTo(-airplane.w*0.42, wobble2 + 8); ctx.closePath(); ctx.fill();

  // "CODEZERO" Logo
  ctx.save();
  ctx.font = '900 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#facc15'; ctx.fillText('CODEZERO', 2, wobble2 - 1);
  ctx.lineWidth = 1; ctx.strokeStyle = '#000000'; ctx.strokeText('CODEZERO', 2, wobble2 - 1);
  ctx.restore();

  // Cockpit Canopy
  ctx.fillStyle = 'rgba(56, 189, 248, 0.7)';
  ctx.beginPath(); ctx.ellipse(airplane.w*0.18, wobble2 - 8, 14, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#e0f2fe'; ctx.lineWidth = 1.5; ctx.stroke();

  // 3. LOWER WING
  ctx.fillStyle = '#1d4ed8';
  ctx.fillRect(-airplane.w*0.38, wobble2 + 8, airplane.w*0.76, 8);

  // Chrome Nose & Propeller
  ctx.fillStyle = '#f59e0b';
  ctx.beginPath(); ctx.ellipse(airplane.w*0.44, wobble2, 11, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.stroke();

  const propAng = airplane.animT * 0.22;
  ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 4;
  for(let pa = 0; pa < 3; pa++){
    const ang = propAng + (pa * Math.PI * 2 / 3);
    ctx.beginPath();
    ctx.moveTo(airplane.w*0.48, wobble2);
    ctx.lineTo(airplane.w*0.48 + Math.cos(ang)*18, wobble2 + Math.sin(ang)*18);
    ctx.stroke();
  }

  // Tail Fin
  ctx.fillStyle = '#1e3a8a';
  ctx.beginPath();
  ctx.moveTo(-airplane.w*0.4, wobble2 - 6);
  ctx.lineTo(-airplane.w*0.56, wobble2 - 26);
  ctx.lineTo(-airplane.w*0.38, wobble2 - 6);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 1.5; ctx.stroke();

  // ---------- 7. HANGING DINO SYSTEM ----------
  ctx.save();
  ctx.translate(-airplane.w*0.08, wobble2 + 14);
  ctx.rotate(swingAngle);

  // Brackets
  ctx.fillStyle = '#475569';
  ctx.fillRect(-12, -2, 8, 6); ctx.fillRect(4, -2, 8, 6);

  // Harness Cables
  ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-8, 2); ctx.lineTo(-8, 30);
  ctx.moveTo(8, 2);  ctx.lineTo(8, 30);
  ctx.stroke();

  // Handle Bar
  ctx.fillStyle = '#f59e0b'; ctx.fillRect(-16, 28, 32, 6);
  ctx.fillStyle = '#0f172a'; ctx.fillRect(-14, 29, 6, 4); ctx.fillRect(8, 29, 6, 4);

  // *** HANGING DINO PLAYER CHARACTER ***
  ctx.save();
  ctx.translate(0, 32); // Position Dino under hanging bar

  const skin = state.activeSkin || player.skin || 'classic';

let weather = {
  type: 'clear', // 'clear', 'rain', 'fog', 'thunderstorm'
  timer: 0,
  nextChange: 18000,
  drops: [],
  fogClouds: [],
  thunderTimer: 0,
  curFogAlpha: 0,
  targetFogAlpha: 0,
  slipperyFactor: 1.0
};

function initWeather(){
  const types = ['clear', 'rain', 'fog', 'thunderstorm'];
  if(level && level.isGodzillaLevel){
    weather.type = Math.random() < 0.5 ? 'thunderstorm' : 'fog';
  } else {
    weather.type = types[Math.floor(Math.random() * types.length)];
  }

  weather.timer = 0;
  weather.nextChange = 30000;
  weather.thunderTimer = 0;

  weather.drops = [];
  for(let i = 0; i < 180; i++){
    weather.drops.push({
      x: Math.random() * (W + 300) - 150,
      y: Math.random() * H,
      speed: 12 + Math.random() * 9,
      len: 14 + Math.random() * 12,
      alpha: 0.35 + Math.random() * 0.45
    });
  }

  weather.fogClouds = [];
  for(let i = 0; i < 12; i++){
    weather.fogClouds.push({
      x: Math.random() * 4000,
      y: 40 + Math.random() * (H - 120),
      r: 160 + Math.random() * 140,
      vx: (0.3 + Math.random() * 0.5) * (Math.random() < 0.5 ? 1 : -1),
      alpha: 0.25 + Math.random() * 0.25
    });
  }

  applyWeatherType(weather.type, true);
}

function applyWeatherType(newType, isInitial=false){
  weather.type = newType;
  
  // Theme-aware weather overrides
  const theme = (level && level.theme) || 'dusk_suburbs';
  
  if(theme === 'volcanic_inferno' || theme === 'infernal_volcano'){
    // Volcano level always has ash/embers instead of clear weather
    if(newType === 'clear' || newType === 'rain') weather.type = 'ash';
  } else if(theme === 'nuclear_lab' || theme === 'pro_toxic_wasteland'){
    // Lab levels have toxic haze
    if(newType === 'clear') weather.type = 'haze';
  } else if(theme === 'frozen_tundra'){
    // Tundra level has snow instead of rain
    if(newType === 'rain' || newType === 'thunderstorm') weather.type = 'snow';
  }

  if(weather.type === 'clear'){
    weather.targetFogAlpha = 0;
    weather.slipperyFactor = 1.0;
  } else if(weather.type === 'rain'){
    weather.targetFogAlpha = 0.22;
    weather.slipperyFactor = 0.88;
  } else if(weather.type === 'thunderstorm'){
    weather.targetFogAlpha = 0.45;
    weather.slipperyFactor = 0.78;
    if(!isInitial) {
      sfxDemonic();
      shake(16);
      triggerFlash('255,255,255', 0.8);
    }
  } else if(weather.type === 'fog'){
    weather.targetFogAlpha = 0.75;
    weather.slipperyFactor = 1.0;
    if(!isInitial) {
      sfxScare();
      shake(12);
    }
  } else if(weather.type === 'ash'){
    weather.targetFogAlpha = 0.4;
    weather.slipperyFactor = 1.0;
  } else if(weather.type === 'haze'){
    weather.targetFogAlpha = 0.55;
    weather.slipperyFactor = 1.0;
  } else if(weather.type === 'snow'){
    weather.targetFogAlpha = 0.35;
    weather.slipperyFactor = 0.85;
  }
}

function updateWeather(dt){
  weather.timer += dt;

  if(weather.timer >= 30000){
    weather.timer = 0;
    weather.nextChange = 30000;
    const types = ['clear', 'rain', 'fog', 'thunderstorm'].filter(t => t !== weather.type);
    const nextType = types[Math.floor(Math.random() * types.length)];
    applyWeatherType(nextType);
  }

  weather.curFogAlpha += (weather.targetFogAlpha - weather.curFogAlpha) * 0.03;

  if(weather.type === 'rain' || weather.type === 'thunderstorm'){
    for(const d of weather.drops){
      d.y += d.speed;
      d.x += 2.2;
      if(d.y > H){
        d.y = -20;
        d.x = Math.random() * (W + 600) - 300;
        
        // Splash logic when hitting ground
        if(Math.random() < 0.2) {
           const screenX = d.x - camX;
           if(screenX > 0 && screenX < W) {
             spawnParticles(d.x, GROUND_Y, '#38c6ff', 1, 0.4);
           }
        }
      }
    }
  } else if(weather.type === 'snow'){
    for(const d of weather.drops){
      d.y += d.speed * 0.35;
      d.x += Math.sin(state.time * 0.001 + d.y * 0.01) * 3;
      if(d.y > H){
        d.y = -20;
        d.x = Math.random() * (W + 600) - 300;
      }
    }
  } else if(weather.type === 'ash'){
    for(const d of weather.drops){
      d.y += d.speed * 0.25;
      d.x += Math.sin(state.time * 0.002 + d.y * 0.01) * 2;
      if(d.y > H){
        d.y = -20;
        d.x = Math.random() * (W + 600) - 300;
      }
    }
  }

  for(const cloud of weather.fogClouds){
    cloud.x += cloud.vx;
    if(cloud.x < -400) cloud.x = 4400;
    if(cloud.x > 4400) cloud.x = -400;
  }

  if(weather.type === 'thunderstorm'){
    weather.thunderTimer += dt;
    if(weather.thunderTimer > 4000 + Math.random() * 4000){
      weather.thunderTimer = 0;
      sfxDemonic();
      shake(22);
      triggerFlash('255,255,255', 0.9);
      spawnParticles(player.x + (Math.random()-0.5)*400, 30, '#ffffff', 20, 2);
    }
  }
}

function drawWeatherWorld(){
  if(weather.curFogAlpha > 0.05){
    ctx.save();
    const hazeColor = (weather.type === 'ash') ? '70, 60, 60' : (weather.type === 'haze') ? '80, 160, 100' : '100, 130, 160';
    for(const cloud of weather.fogClouds){
      const cx = cloud.x - camX * 0.4;
      if(cx < -350 || cx > W + 350) continue;
      const grad = ctx.createRadialGradient(cx, cloud.y, 10, cx, cloud.y, cloud.r);
      grad.addColorStop(0, `rgba(${hazeColor}, ${cloud.alpha * weather.curFogAlpha * 0.8})`);
      grad.addColorStop(0.6, `rgba(${hazeColor}, ${cloud.alpha * weather.curFogAlpha * 0.4})`);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cloud.y, cloud.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  if((weather.type === 'rain' || weather.type === 'thunderstorm') && weather.drops){
    ctx.save();
    ctx.strokeStyle = weather.type === 'thunderstorm' ? 'rgba(200, 235, 255, 0.65)' : 'rgba(120, 200, 255, 0.45)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for(const d of weather.drops){
      ctx.moveTo(d.x - camX * 0.1, d.y); // Parallax effect for rain
      ctx.lineTo(d.x - camX * 0.1 - 4, d.y + d.len);
    }
    ctx.stroke();
    ctx.restore();
  } else if(weather.type === 'snow' && weather.drops){
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    for(const d of weather.drops){
       const sx = d.x - camX * 0.15;
       ctx.beginPath();
       ctx.arc(sx, d.y, 2.5, 0, Math.PI*2);
       ctx.fill();
    }
    ctx.restore();
  } else if(weather.type === 'ash' && weather.drops){
    ctx.save();
    for(const d of weather.drops){
       const sx = d.x - camX * 0.2;
       ctx.fillStyle = `rgba(255, 120, 40, ${d.alpha * 0.8})`;
       ctx.beginPath();
       ctx.arc(sx, d.y, 2, 0, Math.PI*2);
       ctx.fill();
    }
    ctx.restore();
  }
}

function drawWeatherOverlay(){
  if(weather.curFogAlpha > 0.15){
    ctx.save();
    const px = player.x - camX + player.w/2;
    const py = player.y + player.h/2;
    const maxAlpha = Math.min(0.82, weather.curFogAlpha * 0.9);
    
    const spotlightRad = 190;
    const grad = ctx.createRadialGradient(px, py, 25, px, py, spotlightRad);
    grad.addColorStop(0, 'rgba(255, 240, 200, 0.05)');
    grad.addColorStop(0.4, `rgba(10, 15, 25, ${maxAlpha * 0.4})`);
    grad.addColorStop(1, `rgba(5, 8, 16, ${maxAlpha})`);

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    const beamAngle = player.facing === 1 ? 0 : Math.PI;
    const beamGrad = ctx.createRadialGradient(px, py, 10, px + player.facing * 160, py, 220);
    beamGrad.addColorStop(0, 'rgba(255, 235, 180, 0.18)');
    beamGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = beamGrad;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.arc(px, py, 260, beamAngle - 0.4, beamAngle + 0.4);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }
}

function openPromoCodePrompt(){

function setPromoQuick(code){

function submitPromoCode(){
  const input = document.getElementById('promoInput');
  const msg = document.getElementById('promoMsg');
  if(!input) return;
  const val = input.value.trim();
  if(!val){
    if(msg){
      msg.style.color = '#ef4444';
      msg.textContent = '❌ გთხოვთ შეიყვანოთ კოდი!';
    }
    return;
  }
  applyPromoCode(val);
}

  player.weaponMode = (state.equippedSkin === 'lasha') ? 'guitar' : (state.equippedWeapon || (state.upgrades.shotgun ? 'shotgun' : 'pistol'));

  player.isBitten = false; player.bitePhase = 'hand'; player.biteProgress = 0; player.biteTimer = 0; player.bitingZombie = null;
  player.dashTimer = 0; player.dashCooldown = 0; player.jumpCount = 0;
  if(state.upgrades.shield && player.hasShield === undefined) player.hasShield = true;
  camX = Math.max(0, player.x - W/3);
  camY = Math.min(0, player.y - H * 0.45);
}

// ---------- Game Entities ----------
let zombies = [];
let bullets = [];
let particles = [];
let shellCasings = [];
let floatingTexts = [];

function spawnParticles(x, y, color, count = 10, speedMult = 1){
  for(let i = 0; i < count; i++){
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 8 * speedMult,
      vy: (Math.random() - 0.5) * 8 * speedMult - 2,
      life: 40 + Math.random() * 25,
      maxLife: 65,
      color: color,
      size: 3 + Math.random() * 5
    });
  }
}

function spawnShellCasing(x, y, dir){
  shellCasings.push({
    x, y,
    vx: -dir * (2 + Math.random()*3),
    vy: -3 - Math.random()*3,
    rot: Math.random()*Math.PI,
    vRot: (Math.random()-0.5)*0.4,
    life: 60
  });
}

function addFloatingText(x, y, text, color='#ffd23f'){
  floatingTexts.push({ x, y, text, color, life: 60, vy: -1.5 });
}

function spawnZombie(x, y, customType = null){
  const type = customType || Math.random();
  let health = 2, speed = 1.6, color = '#3a7a3a', size = 1, isBoss = false, isMutant = false;

  // Level progression difficulty scaling
  const levelDifficulty = state.levelIndex || 0;
  const hpMult = (level && level.zombieHpMult) ? level.zombieHpMult : 1;
  const rawSpdMult = (level && level.zombieSpeedMult) ? level.zombieSpeedMult : 1;
  const spdMult = Math.min(1.2, rawSpdMult); // Capped multiplier so PRO levels remain fair & playable!
  
  if(type === 'mutant' || type === 'titan' || (typeof type === 'number' && type > 0.94)){
    // Giant Mutant Titan Zombie - Heavy HP, manageable speed
    health = Math.round((25 + levelDifficulty * 2.0) * hpMult);
    speed = (0.85 + Math.min(0.35, levelDifficulty * 0.01)) * spdMult;
    color = '#881337';
    size = 2.2 + Math.min(0.6, levelDifficulty * 0.015);
    isBoss = true;
    isMutant = true;
  } else if(type === 'boss' || (typeof type === 'number' && type > 0.82)){
    // Boss Zombie - Strong & imposing
    health = Math.round((10 + levelDifficulty * 1.1) * hpMult);
    speed = (1.1 + Math.min(0.45, levelDifficulty * 0.012)) * spdMult;
    color = '#6b2020';
    size = 1.5 + Math.min(0.4, levelDifficulty * 0.012);
    isBoss = true;
  } else if(typeof type === 'number' && type < 0.35){
    // Fast runner zombie - controlled capped speed (max ~2.8)
    health = Math.round((3 + levelDifficulty * 0.3) * hpMult);
    speed = (1.9 + Math.min(0.8, levelDifficulty * 0.02)) * spdMult;
    color = '#2a6a4a';
    size = 0.85 + Math.min(0.2, levelDifficulty * 0.005);
  } else {
    // Standard zombie - steady speed (max ~2.0)
    health = Math.round((4 + levelDifficulty * 0.5) * hpMult);
    speed = (1.25 + Math.min(0.5, levelDifficulty * 0.015)) * spdMult;
    color = '#3a7a3a';
    size = 1.0 + Math.min(0.3, levelDifficulty * 0.008);
  }
  
  if(state.settings){
    if(state.settings.difficulty === 'easy'){
      speed *= 0.82;
      health = Math.max(1, Math.floor(health * 0.75));
    } else if(state.settings.difficulty === 'hardcore'){
      speed *= 1.25;
      health = Math.ceil(health * 1.5);
      if(isBoss) health *= 1.3; 
    }
  }

  // Elite Zombie chance
  const isElite = !isBoss && Math.random() < 0.20;
  if(isElite){
    health *= 2.8;
    speed *= 1.45;
    color = '#ff9f1c'; // Golden/Orange Elite
    size *= 1.2;
  }

  zombies.push({
    x: x, y: y, w: 38 * size, h: 56 * size,
    vx: 0, vy: 0,
    health: health, maxHealth: health,
    animT: Math.random()*100,
    facing: 1, speed: speed, color: color, size: size,
    isBoss,
    isElite,
    isMutant
  });
}

function boostBiteEscape(){
  if(!player.isBitten || player.dead) return;
  player.biteProgress += 20; // ~5 keypresses to fill 100%
  shake(10);
  sfxZombieHit();
  spawnParticles(player.x + player.w/2, player.y + 20, '#ffffff', 8, 1.2);
  spawnParticles(player.x + player.w/2, player.y + 20, '#ff3d6e', 12, 1.5);
  addFloatingText(player.x + (Math.random()-0.5)*20, player.y - 20, "🥊 " + Math.min(100, Math.floor(player.biteProgress)) + "%", '#ffd23f');

  if(player.biteProgress >= 100){
    player.isBitten = false;
    player.invuln = 70; // 1.2s safety invulnerability
    sfxWin();
    shake(25);
    triggerFlash('255, 215, 0', 0.7);

    if(player.bitingZombie){
      const z = player.bitingZombie;
      z.health -= 6;
      z.vx = player.facing * 16;
      z.vy = -10;
      spawnParticles(z.x + z.w/2, z.y + z.h/2, '#ff0033', 40, 2.5);
    }
    player.bitingZombie = null;
    toast("🦵 დინომ თავი დაიხსნა და ზომბი მოიგერია! 💥", 2500);
  }
}
