<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>გეოდინო: ხულიგანური პარკური</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
canvas#game { width: min(99vw, 1250px, calc(94vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; image-rendering: pixelated; touch-action: none; cursor: pointer; display: block; }
#mobileControls { display: none; position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0; justify-content: space-between; align-items: flex-end; padding: 0 16px; z-index: 99; pointer-events: none; }
#mobileControls button { pointer-events: auto; width: clamp(58px, 16vw, 72px); height: clamp(58px, 16vw, 72px); border: 2px solid rgba(255,255,255,0.34); border-radius: 22px; background: linear-gradient(145deg, rgba(46,60,84,0.92), rgba(12,17,28,0.94)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 5px 0 rgba(0,0,0,0.45), 0 8px 22px rgba(0,0,0,0.32); color: #f6f8ff; font: 700 clamp(24px, 7vw, 32px)/1 sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; transition: transform 80ms ease, filter 80ms ease, box-shadow 80ms ease; }
#mobileControls button:focus-visible { outline: 3px solid #ffd23f; outline-offset: 3px; }
#mobileControls button.active, #mobileControls button:active { transform: translateY(4px) scale(0.96); filter: brightness(1.25); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 1px 0 rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.28); }
#mobileControls .dpad { display: grid; grid-template-columns: repeat(3, clamp(58px, 16vw, 72px)); grid-template-rows: repeat(2, clamp(58px, 16vw, 72px)); gap: clamp(5px, 1.5vw, 8px); pointer-events: auto; }
#mobileControls .dpad button { width: 100%; height: 100%; border-radius: 18px; }
#mobileControls #btnUp { grid-column: 2; grid-row: 1; }
#mobileControls #btnLeft { grid-column: 1; grid-row: 2; }
#mobileControls #btnRight { grid-column: 3; grid-row: 2; }
#mobileControls #btnDown { grid-column: 2; grid-row: 2; }
#mobileControls .actions { display: flex; align-items: flex-end; gap: clamp(8px, 2vw, 14px); }
#mobileControls .actions button { border-radius: 50%; }
#mobileControls #btnJump { border-color: rgba(255,210,63,0.7); background: linear-gradient(145deg, #705d19, #30270c); }
#mobileControls #btnFire { border-color: rgba(255,96,96,0.72); background: linear-gradient(145deg, #782b32, #321316); }
#rotateHint { display: none; position: fixed; inset: 0; z-index: 120; align-items: center; justify-content: center; padding: 28px; background: rgba(5,8,14,0.96); color: #fff; font: 700 18px/1.45 sans-serif; text-align: center; }
@media (orientation: portrait) {
  body.mobile-device #rotateHint { display: flex; }
}
@media (max-width: 420px) {
  #mobileControls { padding-left: 10px; padding-right: 10px; }
  #mobileControls .actions { gap: 6px; }
}
#promoModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a2e; border: 2px solid #ffd23f; border-radius: 12px; padding: 24px; z-index: 100; color: #fff; font-family: sans-serif; text-align: center; min-width: 300px; }
#promoModal h3 { margin-bottom: 12px; color: #ffd23f; }
#promoModal input { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #555; border-radius: 6px; background: #0a0a14; color: #fff; font-size: 14px; }
#promoModal button { padding: 8px 20px; margin: 4px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
#promoModal #promoMsg { margin-top: 8px; font-size: 13px; min-height: 18px; }
#topBarControls { position: fixed; top: 12px; right: 14px; z-index: 50; display: flex; gap: 6px; }
#topBarControls button { min-width: 110px; height: 34px; background: rgba(8,15,30,0.94); border: 2px solid #38c6ff; color: #38c6ff; border-radius: 10px; padding: 0 12px; font: 700 12px/1 sans-serif; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.35); transition: transform 80ms ease, filter 80ms ease; }
#topBarControls button:hover, #topBarControls button:focus-visible { filter: brightness(1.25); transform: translateY(-1px); }
#topBarControls button:focus-visible { outline: 2px solid #ffd23f; outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="game" width="1200" height="675"></canvas>

<div id="rotateHint" role="status">მოატრიალე ტელეფონი ჰორიზონტალურად სათამაშოდ</div>

<div id="topBarControls">
  <button id="btnMuteBgm" onclick="toggleBgmMute()">🔊</button>
</div>

<div id="mobileControls">
  <div class="dpad">
    <button id="btnUp" aria-label="Move up or jump">▲</button>
    <button id="btnLeft" aria-label="Move left">◀</button>
    <button id="btnRight" aria-label="Move right">▶</button>
    <button id="btnDown" aria-label="Crouch or move down">▼</button>
  </div>
  <div class="actions">
    <button id="btnJump" aria-label="Jump">⬆</button>
    <button id="btnFire" aria-label="Fire">🔫</button>
  </div>
</div>

<div id="promoModal">
  <h3>🎟️ პრომო კოდი</h3>
  <input id="promoInput" type="text" placeholder="შეიყვანე კოდი..." />
  <div><button onclick="submitPromoCode()" style="background:#ffd23f;color:#000">გამოყენება</button> <button onclick="closePromoModal()" style="background:#333;color:#fff">დახურვა</button></div>
  <div id="promoMsg"></div>
</div>

<script>
</script>
<script src="temp_script.js"></script>
</body>
</html>
