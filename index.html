let LEVELS = buildLevels();
let level = LEVELS[0];

function skipLevel(){
  if(state.mode!=='playing' && state.mode!=='paused') return;
  sfxWin();
  toast("⏩ დონე გამოტოვებულია!", 1500);
  levelClear();
}

function toast(text, ms=1600){
  state.toastText = text;
  state.toastTimer = ms;
}

function triggerFlash(color, alpha){
  state.flashColor = color;
  state.flashAlpha = alpha;
}

function shake(amount){
  state.shake = Math.max(state.shake, amount);
}

function triggerDash(){
  if(player.dashCooldown > 0 || player.dead || player.isBitten) return;
  player.dashTimer = 220;
  player.dashCooldown = 800;
  player.invuln = 22;
  sfxJump();
  shake(6);
  spawnParticles(player.x + player.w/2, player.y + player.h/2, '#38c6ff', 18, 2);
  toast("⚡ TURBO DASH! ⚡", 700);
}

// ---------- Update Mechanics ----------
function updatePlayer(dt){
  if(player.dead) return;

  if(state.comboTimer > 0){
    state.comboTimer -= dt;
    if(state.comboTimer <= 0) state.combo = 0;
  }

  // Coin Magnet Ability
  if(state.upgrades.magnet && level && level.coins){
    level.coins.forEach(c => {
      const dx = (player.x + player.w/2) - (c.x + c.w/2);
      const dy = (player.y + player.h/2) - (c.y + c.h/2);
      const dist = Math.hypot(dx, dy);
      if(dist < 220){
        c.x += (dx / dist) * 7.5;
        c.y += (dy / dist) * 7.5;
      }
    });
  }

  // Handle Falling off world state with "ადიოს მუჩაჩოოსსსს"
  if(player.isFalling){
    player.fallTimer += dt;
    player.fallRotation += 0.14;
    player.vy = (player.vy || 3) + GRAVITY * 0.7;
    player.y += player.vy;
    player.x += player.facing * 1.5;

    // Smooth camera tracking panning down following the player into the abyss
    let targetCamY = Math.max(0, player.y - H * 0.42);
    camY += (targetCamY - camY) * 0.12;

    // Wind & debris particles rushing up during fall
    if(Math.random() < 0.65){
      particles.push({
        x: player.x + (Math.random() - 0.5) * 50,
        y: player.y + 20,
        vx: (Math.random() - 0.5) * 3,
        vy: -Math.random() * 8 - 4,
        life: 25,
        color: Math.random() < 0.5 ? '#ff3d6e' : '#ffd23f',
        size: 3 + Math.random() * 3
      });
    }

    if(player.fallTimer > 750 || player.y > GROUND_Y + 180){
      hurtPlayer("ადიოს მუჩაჩოოსსსს! 💀", "pit");
    }
    return;
  }

  if(player.fastenerTimer > 0) player.fastenerTimer -= dt;
  if(player.reverseControlsTimer > 0) player.reverseControlsTimer -= dt;

  // Handle Zombie Biting & Struggle state
  if(player.isBitten){
    player.vx = 0;
    player.biteTimer += dt;

    // Pin biting zombie to player arm or leg
    const z = player.bitingZombie;
    if(z && z.health > 0){
      z.x = player.x + (player.facing === 1 ? 22 : -28);
      z.y = player.bitePhase === 'hand' ? player.y - 4 : player.y + 18;
      z.facing = player.facing === 1 ? -1 : 1;
      z.vx = 0; z.vy = 0;
    } else {
      player.isBitten = false;
      player.bitingZombie = null;
    }

    // Blood spray particles
    if(Math.random() < 0.35){
      spawnParticles(
        player.x + player.w/2 + (player.facing * 12),
        player.y + (player.bitePhase === 'hand' ? 12 : 36),
        '#ff0033', 4, 1.2
      );
    }

    // Phase transition timers (2.2s per phase if not escaped)
    if(player.bitePhase === 'hand' && player.biteTimer > 2200){
      player.bitePhase = 'foot';
      player.biteTimer = 0;
      player.biteProgress = Math.max(0, player.biteProgress - 25);
      sfxHurt();
      sfxScare();
      shake(20);
      triggerFlash('255,0,0', 0.6);
      spawnParticles(player.x + player.w/2, player.y + 36, '#ff0033', 30, 2);
      toast("🩸 ⚠️ ზომბი გადავიდა ფეხზე! სწრაფად დააჭირე SPACE / F / K! 🦶", 2500);
      addFloatingText(player.x, player.y - 25, "🩸 ფეხის კბენა!", '#ff0033');
    } else if(player.bitePhase === 'foot' && player.biteTimer > 2200){
      player.isBitten = false;
      player.bitingZombie = null;
      hurtPlayer("🧟‍♂️ ზომბიმ გეოდინო შეიპყრო და შეჭამა! 💀", "zombie");
      return;
    }
  }

  const isFastener = player.fastenerTimer > 0;
  const isReverse = player.reverseControlsTimer > 0;

  const speed = isFastener ? 8.2 : 4.8;
  const jumpPower = isFastener ? -16.2 : -13.8;

  let leftKey = keys['ArrowLeft']||keys['KeyA'];
  let rightKey = keys['ArrowRight']||keys['KeyD'];

  if(isReverse){
    const temp = leftKey; leftKey = rightKey; rightKey = temp;
  }

  const left = leftKey;
  const right = rightKey;

  if(player.gunRecoil > 0) player.gunRecoil *= 0.8;

  // Dash controls
  if(keys['ShiftLeft']||keys['ShiftRight']||keys['KeyE']){
    if(!player.dashKeyPressed){
      player.dashKeyPressed = true;
      triggerDash();
    }
  } else {
    player.dashKeyPressed = false;
  }

  if(player.dashTimer > 0){
    player.dashTimer -= dt;
    player.vx = player.facing * 15.5;
    if(Math.random() < 0.6){
      particles.push({
        x: player.x + Math.random() * player.w,
        y: player.y + Math.random() * player.h,
        vx: -player.facing * (2 + Math.random()*2),
        vy: (Math.random() - 0.5) * 2,
        life: 16,
        color: Math.random() < 0.5 ? '#38c6ff' : '#ffd23f',
        size: 4
      });
    }
  } else if(player.slipping>0){
    player.slipping--;
    player.vx = player.facing*7.5*(player.slipping/40);
  } else {
    if(left){ player.vx = -speed; player.facing=-1; }
    else if(right){ player.vx = speed; player.facing=1; }
    else { player.vx *= (0.78 + (1 - (weather.slipperyFactor || 1)) * 0.16); }
  }

  if(player.dashCooldown > 0) player.dashCooldown -= dt;

  // Running & Fastener particles
  if(player.onGround && Math.abs(player.vx) > 1){
    if(isFastener){
      spawnParticles(player.x+player.w/2, player.y+player.h, Math.random()<0.5?'#38c6ff':'#ffd23f', 2, 0.5);
    } else if(Math.random()<0.35){
      particles.push({
        x: player.x + (player.facing===-1? player.w : 0),
        y: player.y + player.h - 4,
        vx: -player.facing * (1 + Math.random()*2),
        vy: -Math.random()*1.5,
        life: 18, color: '#a08560', size: 3
      });
    }
  }

  // Jump & Double Jump
  if(keys['Space']||keys['ArrowUp']||keys['KeyW']){
    if(player.onGround && !player.jumpKeyPressed){
      player.vy = jumpPower;
      player.onGround = false;
      player.jumpCount = 1;
      player.jumpKeyPressed = true;
      sfxJump();
      spawnParticles(player.x+player.w/2, player.y+player.h, isFastener?'#38c6ff':'#ffffff', 10);
    } else if(!player.onGround && !player.jumpKeyPressed && state.upgrades.doubleJump && player.jumpCount === 1){
      player.vy = jumpPower * 0.92;
      player.jumpCount = 2;
      player.jumpKeyPressed = true;
      sfxJump();
      spawnParticles(player.x+player.w/2, player.y+player.h, '#38c6ff', 18, 2.5);
      toast("🚀 DOUBLE JUMP!", 600);
    }
  } else {
    player.jumpKeyPressed = false;
  }

  player.vy += GRAVITY;
  if(player.vy>18) player.vy=18;

  player.x += player.vx;
  player.y += player.vy;

  if(player.x < camX+4) player.x = camX+4;

  // Platform collision & moving platforms update
  player.onGround = false;
  for(const p of level.plats){
    // Update platform movement
    if(p.vx){
      p.x += p.vx;
      if(p.x <= p.minX || p.x >= p.maxX) p.vx *= -1;
    }
    if(p.vy){
      p.y += p.vy;
      if(p.y <= p.minY || p.y >= p.maxY) p.vy *= -1;
    }

    if(overlap(player,p)){
      const prevBottom = player.y - player.vy + player.h;
      if(player.vy >= 0 && prevBottom <= p.y+4){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
        if(p.vx) player.x += p.vx; // carry player
      } else if(player.vy<0 && player.y - player.vy >= p.y+p.h-4){
        player.y = p.y+p.h;
        player.vy = 1;
      } else {
        if(player.vx>0) player.x = p.x - player.w;
        else if(player.vx<0) player.x = p.x + p.w;
        player.vx = 0;
      }
    }
  }

  // Trigger "ადიოს მუჩაჩოოსსსს" when falling off world into pit
  if(player.y > GROUND_Y + 25 && !player.isFalling && !player.onGround){
    player.isFalling = true;
    player.fallTimer = 0;
    player.fallRotation = 0;
    player.vy = 4;
    sfxFall();
    shake(20);
    toast("ადიოს მუჩაჩოოსსსს! 💀", 2200);
    addFloatingText(player.x, player.y - 30, "ადიოს მუჩაჩოოსსსს! 🗣️", '#ff3d6e');
  }

  // Fake spikes
  for(const f of level.fakespikes){
    if(overlap(player,f) && !f.hit){
      f.hit = true;
      sfxPrankGood();
      toast("დაისვენე, ეს ბალიშია 🛏️", 1400);
    }
  }

  // Real spikes
  for(const s of level.spikes){
    if(overlap(player,s) && player.invuln<=0){
      hurtPlayer("მოულოდნელი ხაფანგი! 🩸");
    }
  }

  // Bananas
  for(const b of level.bananas){
    if(overlap(player,b) && player.slipping<=0 && !b.used){
      player.slipping = 40;
      sfxSlip();
      toast("ბანანის კალთა! უუუ 🍌", 1200);
    }
  }

  // Coins
  for(const c of level.coins){
    if(!c.taken && overlap(player,c)){
      c.taken = true;
      addScore(10);
      state.coinsCollected = (state.coinsCollected || 0) + 1;
      sfxCoin();
      spawnParticles(c.x+c.w/2, c.y+c.h/2, '#38c6ff', 8);
      checkAchievements();
    }
  }

  // Bells
  for(const b of level.bells){
    if(!b.taken && overlap(player,b)){
      b.taken = true;
      addScore(50);
      state.subs = Math.min(100, state.subs+15);
      sfxBell();
      spawnParticles(b.x+b.w/2, b.y+b.h/2, '#ff3d6e', 10);
      toast("+15% გამოწერები 🔔", 1200);
    }
  }
  
  // Jumpboxes (Hit from below!)
  for(const jb of level.jumpboxes){
    if(!jb.hit && overlap(player, jb)){
      const prevTop = player.y - player.vy;
      if(player.vy < 0 && prevTop >= jb.y + jb.h - 8){
        jb.hit = true;
        jb.bounceY = -12;
        sfxBoxHit();
        shake(6);
        spawnParticles(jb.x + jb.w/2, jb.y, '#ffd23f', 12);

        if(jb.type === 'coin'){
          addScore(50);
          state.coinsCollected = (state.coinsCollected || 0) + 5;
          addFloatingText(jb.x, jb.y-20, "+50 ქულა! 💰");
          checkAchievements();
        } else if(jb.type === 'bell'){
          addScore(100);
          state.subs = Math.min(100, state.subs+20);
          sfxBell();
          addFloatingText(jb.x, jb.y-20, "+20% გამოწერა! 🔔", '#ff3d6e');
        } else if(jb.type === 'heart'){
          state.lives = Math.min(5, state.lives+1);
          sfxWin();
          addFloatingText(jb.x, jb.y-20, "+1 სიცოცხლე! ❤️", '#ff3d6e');
        } else if(jb.type === 'triple'){
          player.weaponMode = 'triple';
          sfxWin();
          toast("🔥 სამმაგი ლაზერი ჩართულია! 🔥", 2000);
        } else if(jb.type === 'shotgun'){
          player.weaponMode = 'shotgun';
          sfxWin();
          toast("💥 5-იანი შოტგანი აიღე! 💥", 2000);
        } else if(jb.type === 'minigun'){
          player.weaponMode = 'minigun';
          sfxWin();
          toast("⚡ სუპერ მინიგანი! ⚡", 2000);
        } else if(jb.type === 'plasma'){
          player.weaponMode = 'plasma';
          sfxWin();
          toast("🌌 პლაზმური ზარბაზანი! 🌌", 2000);
        } else if(jb.type === 'flamethrower'){
          player.weaponMode = 'flamethrower';
          sfxWin();
          toast("🔥 ალმოდებული ფლამეინგი აიღე! 🔥", 2000);
        } else if(jb.type === 'tank'){
          player.weaponMode = 'tank';
          sfxDemonic();
          shake(18);
          toast("💥 ომის გიგანტური ტანკი ჩაირთო! 💥", 2500);
        } else if(jb.type === 'fastener'){
          player.fastenerTimer = 8000;
          sfxWin();
          toast("⚡ FASTENER - სუპერ სიჩქარე & ხტომა! ⚡", 2200);
        } else if(jb.type === 'prank_zombie'){
          sfxScare();
          shake(14);
          spawnZombie(player.x + 120, player.y - 100);
          spawnZombie(player.x - 120, player.y - 100);
          toast("😱 ზომბების მოულოდნელი ხაფანგი! 🧟", 2000);
        } else if(jb.type === 'prank_reverse'){
          player.reverseControlsTimer = 6000;
          sfxHurt();
          shake(12);
          toast("🌀 კონტროლი ამოტრიალდა! (6 წამი)", 2200);
        } else if(jb.type === 'prank_bomb'){
          sfxDemonic();
          shake(22);
          triggerFlash('255,100,0', 0.8);
          spawnParticles(jb.x+jb.w/2, jb.y+jb.h/2, '#ff3d6e', 30, 2);
          player.vy = -12;
          player.vx = -player.facing * 10;
          toast("💥 აფეთქდა ყუთი! ფრთხილად! 💥", 2000);
        } else if(jb.type === 'prank_dance'){
          sfxWin();
          triggerFlash('255,0,200', 0.8);
          shake(14);
          toast("🕺 დისკო-ხულიგნური ტაიმი! 💃", 2500);
        } else if(jb.type === 'prank_jumpscare_giant'){
          doJumpscare('demon');
          toast("👻 საშინელი სულის გაღვიძება! 👻", 2000);
        } else if(jb.type === 'sponsor'){
          triggerSponsorPopup();
        } else if(jb.type === 'jumpscare'){
          doJumpscare('demon');
        }
      }
    }
    if(jb.bounceY){
      jb.bounceY += 1.5;
      if(jb.bounceY > 0) jb.bounceY = 0;
    }
  }

  // Bushes jumpscare
  for(const bush of level.bushes){
    const triggerZone = rect(bush.x-40, bush.y-60, bush.w+80, bush.h+60);
    if(!bush.triggered && overlap(player,triggerZone)){
      bush.triggered = true;
      doJumpscare('face');
    }
  }

  // Flag -> level clear
  if(overlap(player, level.flag)){
    levelClear();
  }

  if(player.invuln>0) player.invuln--;
  if(player.crying>0) player.crying--;
  player.animT += dt;

  camX = Math.max(0, Math.min(level.width - W, player.x - W*0.38));
  
  updateZombies(dt);
  updateBullets();
  updateParticles();
}

function hurtPlayer(msg, cause='zombie'){
  const isPit = cause === 'pit';
  if((player.invuln > 0 && !isPit) || player.dead) return;

  if(player.hasShield && !isPit){
    player.hasShield = false;
    player.invuln = 60;
    sfxBell();
    shake(12);
    triggerFlash('56,198,255', 0.8);
    toast("🛡️ ენერგოფარმა დარტყმა აირეკლა!", 2000);
    spawnParticles(player.x+player.w/2, player.y+player.h/2, '#38c6ff', 35, 3);
    return;
  }

  if(isPit){
    player.hasShield = false;
    player.isFalling = false;
  }

  state.lives--;
  player.crying = 60;
  if(cause === 'godzilla') state.lastKilledByGodzilla = true;
  sfxHurt();
  shake(18);
  triggerFlash('255,0,50', 0.65);
  toast(`${msg} (დარჩა ${state.lives} ❤️)`, 2200);

  if(state.lives<=0){
    player.dead = true;
    player.isFalling = false;
    sfxDemonic();
    const spawnY = Math.min(H - 60, Math.max(80, player.y));
    spawnParticles(player.x+player.w/2, spawnY, '#ff3d6e', 35, 2.5);
    spawnParticles(player.x+player.w/2, spawnY, '#38c6ff', 30, 2.5);
    if(state.lastKilledByGodzilla || (level && level.isGodzillaLevel)){
      triggerNukeSequence();
    } else {
      setTimeout(()=>{ state.mode='gameover'; }, 1000);
    }
  } else {
    resetPlayer(level.spawn);
    if(level.isGodzillaLevel) player.weaponMode = 'tank';
    camX = 0; camY = 0;
  }
}

function doJumpscare(type='face'){
  state.jumpscareActive = true;
  state.jumpscareTimer = 38;
  state.jumpscareType = type;
  if(type === 'demon'){
    sfxDemonic();
  } else {
    sfxScare();
  }
  shake(25);
  triggerFlash('255,0,0', 0.9);
}

function levelClear(){
  if(state.mode!=='playing') return;
  sfxWin();
  unlockAchievement('levelSurvived', '🏆 დონის გადარჩენილი!', 'შენ წარმატებით გადარჩი და დაასრულე დონე!');
  state.unlockedLevels = Math.max(state.unlockedLevels || 1, state.levelIndex + 2);
  saveData();
  state.mode = 'levelclear';
  setTimeout(()=>{
    if(state.levelIndex < LEVELS.length-1){
      state.levelIndex++;
      loadLevel(state.levelIndex);
      state.mode = 'playing';
    } else {
      state.mode = 'win';
    }
  }, 2200);
}

function loadLevel(idx){
  level = LEVELS[idx];
  level.coins.forEach(c=>c.taken=false);
  level.bells.forEach(b=>b.taken=false);
  level.bananas.forEach(b=>b.used=false);
  level.fakespikes.forEach(f=>f.hit=false);
  level.bushes.forEach(b=>b.triggered=false);
  if(level.jumpboxes) level.jumpboxes.forEach(jb=>{ jb.hit=false; jb.bounceY=0; });
  
  resetPlayer(level.spawn);
  camX=0; camY=0;
  zombies = []; bullets = []; particles = []; shellCasings = []; floatingTexts = [];
  
  if(level.zombies){
    level.zombies.forEach(z => spawnZombie(z.x, z.y, z.type));
  }

  // Godzilla level setup
  if(level.isGodzillaLevel){
    player.weaponMode = 'tank';
    state.lastKilledByGodzilla = false;
    nukeSeq.active = false;
    godzillaProjectiles = [];
    godzillaBoss = {
      active: true,
      x: 3200, y: GROUND_Y - 210, w: 190, h: 220,
      hp: 500, maxHp: 500,
      vx: 2.2, facing: -1,
      animT: 0,
      beamTimer: 0,
      isBeaming: false,
      beamDuration: 0,
      stompTimer: 0,
      fireballTimer: 0,
      isRaging: false
    };

    // Build city buildings for destruction
    cityBuildings = [];
    for(let i=0; i<30; i++){
      cityBuildings.push({
        x: 400 + i * 280,
        y: GROUND_Y - (220 + Math.sin(i*3)*80),
        w: 180 + (i%3)*30,
        h: 220 + Math.sin(i*3)*80,
        destroyed: false
      });
    }
  } else {
    godzillaBoss.active = false;
  }

  initWeather();
}

function restartLevel(){
  if(state.mode==='playing'||state.mode==='paused'||state.mode==='gameover'){
    state.lives=8; state.score=0; state.subs=0; state.levelIndex=0;
    loadLevel(0);
    state.mode='playing';
  }
}

function togglePause(){
  if(state.mode==='playing'){ state.mode='paused'; }
  else if(state.mode==='paused'){ state.mode='playing'; }
}

function startGame(){
  ac();
  state.levelIndex = 0;
  state.score = 0;
  state.lives = 8;
  state.subs = 0;
  loadLevel(0);
  state.mode = 'playing';
}

// ---------- Drawing Rendering Engine ----------
function drawBackground(hue){
  const skyTop = hue==='pink' ? '#2a0a25' : '#081224';
  const skyBot = hue==='pink' ? '#4d0c32' : '#0e2642';
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, skyTop);
  grad.addColorStop(0.5, hue==='pink' ? '#380c2e' : '#122d4f');
  grad.addColorStop(1, skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Parallax Blood Moon / Neon Cyber Orb
  ctx.save();
  ctx.fillStyle = hue==='pink' ? 'rgba(255,61,110,0.25)' : 'rgba(56,198,255,0.2)';
  ctx.beginPath();
  ctx.arc(W*0.75 - camX*0.05, 110, 70, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Parallax Hills
  for(let layer=0;layer<3;layer++){
    const alpha = 0.18 - layer*0.05;
    const speed = 0.15 + layer*0.1;
    ctx.fillStyle = hue==='pink' ? `rgba(255,61,110,${alpha})` : `rgba(56,198,255,${alpha})`;
    for(let i=-1;i<6;i++){
      const bx = (i*320 - camX*speed) % (320*6);
      ctx.beginPath();
      ctx.ellipse(bx+160, GROUND_Y+30+layer*20, 240-layer*30, 95-layer*15, 0, Math.PI, 2*Math.PI);
      ctx.fill();
    }
  }

  // Eerie Creepy Background Eyes in shadows
  ctx.fillStyle = 'rgba(255, 0, 50, 0.7)';
  for(let i=0; i<12; i++){
    const ex = (i * 380 + 100 - camX * 0.2) % (380*12);
    const ey = 140 + (i*47)%180;
    const blink = Math.sin(state.time*0.004 + i*2) > 0.3;
    if(blink && ex > -20 && ex < W+20){
      ctx.fillRect(ex, ey, 4, 3);
      ctx.fillRect(ex + 8, ey, 4, 3);
    }
  }

  // Twinkling Stars
  ctx.fillStyle='rgba(255,255,255,0.7)';
  for(let i=0;i<60;i++){
    const sx = (i*137 - camX*0.1) % W;
    const sy = (i*53)%(GROUND_Y-60);
    const twinkle = Math.sin(state.time*0.003 + i)*0.3 + 0.7;
    ctx.globalAlpha = twinkle;
    ctx.fillRect(((sx%W)+W)%W, sy+10, 2, 2);
  }
  ctx.globalAlpha = 1;
}

function drawGround(){
  for(const p of level.plats){
    const sx = p.x - camX;
    if(sx+p.w<-20 || sx>W+20) continue;

    const g = ctx.createLinearGradient(0,p.y,0,p.y+p.h);
    g.addColorStop(0,'#4fd67b');
    g.addColorStop(0.12,'#2ea24f');
    g.addColorStop(0.15,'#7b5a3a');
    g.addColorStop(1,'#422e1d');
    ctx.fillStyle=g;
    ctx.fillRect(sx,p.y,p.w,p.h);
    
    // Grass Tufts
    ctx.fillStyle='#6ee693';
    for(let i=4; i<p.w-6; i+=18){
      ctx.beginPath();
      ctx.moveTo(sx+i, p.y);
      ctx.lineTo(sx+i+4, p.y-7);
      ctx.lineTo(sx+i+8, p.y);
      ctx.fill();
    }
    
    ctx.strokeStyle='rgba(0,0,0,.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx,p.y,p.w,p.h);
  }
}

function drawJumpBox(jb){
  const sx = jb.x - camX;
  if(sx+jb.w<-20 || sx>W+20) return;
  const y = jb.y + (jb.bounceY || 0);

  if(jb.hit){
    ctx.fillStyle='#3a3f52';
    ctx.fillRect(sx, y, jb.w, jb.h);
    ctx.strokeStyle='#1e2230';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx, y, jb.w, jb.h);
  } else {
    // Pulsing Lucky Box
    const glow = Math.sin(state.time*0.008)*0.2 + 0.8;
    let bgColor = '#ffd23f';
    let icon = '?';

    if(jb.type === 'sponsor') { bgColor = '#ff3d6e'; icon = '📢'; }
    else if(jb.type === 'tank') { bgColor = '#2d4536'; icon = '🚀'; }
    else if(jb.type === 'fastener') { bgColor = '#38c6ff'; icon = '⚡'; }
    else if(jb.type === 'plasma') { bgColor = '#00ffcc'; icon = '⚛'; }
    else if(jb.type === 'flamethrower') { bgColor = '#ff5500'; icon = '🔥'; }
    else if(jb.type === 'shotgun') { bgColor = '#ff7700'; icon = '💥'; }
    else if(jb.type === 'minigun') { bgColor = '#aa33ff'; icon = '⚡'; }
    else if(jb.type === 'prank_bomb') { bgColor = '#cc0022'; icon = '💣'; }
    else if(jb.type === 'prank_reverse') { bgColor = '#9900ff'; icon = '🌀'; }
    else if(jb.type === 'prank_zombie') { bgColor = '#22aa44'; icon = '🧟'; }
    else if(jb.type === 'prank_dance') { bgColor = '#ff00aa'; icon = '🕺'; }
    else if(jb.type === 'prank_jumpscare_giant') { bgColor = '#330000'; icon = '👻'; }

    ctx.fillStyle = bgColor;
    ctx.fillRect(sx, y, jb.w, jb.h);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(icon, sx+jb.w/2, y+jb.h*0.74);

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2 * glow;
    ctx.strokeRect(sx, y, jb.w, jb.h);
  }
}

function drawSign(sign){
  const sx = sign.x - camX;
  if(sx<-150||sx>W+50) return;
  const y = GROUND_Y-70;
  ctx.fillStyle='#8a5a2a';
  ctx.fillRect(sx+18,y+20,8,50);
  ctx.fillStyle='#e8c77a';
  ctx.fillRect(sx,y,64,28);
  ctx.strokeStyle='#5c3b1a'; ctx.lineWidth=2;
  ctx.strokeRect(sx,y,64,28);
  ctx.fillStyle='#2a1a08';
  ctx.font='10px sans-serif';
  ctx.textAlign='center';
  wrapText(sign.text, sx+32, y+12, 60, 11);
}

function wrapText(text,cx,cy,maxW,lh){
  const words=text.split(' ');
  let line='', lines=[];
  for(const w of words){
    const test=line+w+' ';
    if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=w+' '; }
    else line=test;
  }
  lines.push(line);
  const startY = cy - (lines.length-1)*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l.trim(), cx, startY+i*lh));
}

function drawFakespike(f){
  const sx=f.x-camX; if(sx+f.w<0||sx>W) return;
  if(f.hit){
    ctx.fillStyle='#ffe6f0';
    ctx.beginPath();
    ctx.ellipse(sx+f.w/2, f.y+f.h/2, f.w/2, f.h*1.3, 0,0,2*Math.PI);
    ctx.fill();
    ctx.strokeStyle='#ff9fc0'; ctx.stroke();
  } else {
    ctx.fillStyle='#d8d8e0';
    const n=4;
    for(let i=0;i<n;i++){
      ctx.beginPath();
      ctx.moveTo(sx+i*(f.w/n), f.y+f.h);
      ctx.lineTo(sx+i*(f.w/n)+f.w/(2*n), f.y);
      ctx.lineTo(sx+(i+1)*(f.w/n), f.y+f.h);
      ctx.fill();
    }
  }
}

function drawSpike(s){
  const sx=s.x-camX; if(sx+s.w<0||sx>W) return;
  ctx.fillStyle='#ff3d6e';
  const n=4;
  for(let i=0;i<n;i++){
    ctx.beginPath();
    ctx.moveTo(sx+i*(s.w/n), s.y+s.h);
    ctx.lineTo(sx+i*(s.w/n)+s.w/(2*n), s.y-6);
    ctx.lineTo(sx+(i+1)*(s.w/n), s.y+s.h);
    ctx.fill();
  }
}

function drawBanana(b){
  if(b.used) return;
  const sx=b.x-camX; if(sx+b.w<0||sx>W) return;
  ctx.fillStyle='#ffd23f';
  ctx.beginPath();
  ctx.ellipse(sx+b.w/2,b.y+b.h/2, b.w/2, b.h/2, 0.5,0,2*Math.PI);
  ctx.fill();
  ctx.strokeStyle='#c99b1a'; ctx.stroke();
}

function drawCoin(c){
  if(c.taken) return;
  const sx=c.x-camX; if(sx+c.w<0||sx>W) return;
  const bob = Math.sin(state.time*0.006 + c.x)*4;
  const cx = sx + c.w/2;
  const cy = c.y + c.h/2 + bob;
  const r = c.w/2;

  ctx.save();
  // Outer golden coin border
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.arc(cx, cy, r + 2, 0, 2*Math.PI);
  ctx.fill();

  // Main Blue Character Face Coin
  ctx.fillStyle = '#3fc7ea';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, 2*Math.PI);
  ctx.fill();

  // Black Mask Across Eyes
  ctx.fillStyle = '#1a1d24';
  ctx.beginPath();
  ctx.roundRect(cx - r*0.7, cy - r*0.4, r*1.4, r*0.55, 2);
  ctx.fill();

  // White eyes
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx - r*0.35, cy - r*0.1, r*0.22, 0, 2*Math.PI);
  ctx.arc(cx + r*0.35, cy - r*0.1, r*0.22, 0, 2*Math.PI);
  ctx.fill();

  // Pupils
  ctx.fillStyle = '#111111';
  ctx.beginPath();
  ctx.arc(cx - r*0.3, cy - r*0.1, r*0.1, 0, 2*Math.PI);
  ctx.arc(cx + r*0.4, cy - r*0.1, r*0.1, 0, 2*Math.PI);
  ctx.fill();

  // Cyan Lens Glow
  ctx.fillStyle = '#38c6ff';
  ctx.beginPath();
  ctx.arc(cx - r*0.35, cy - r*0.1, r*0.14, 0, 2*Math.PI);
  ctx.arc(cx + r*0.35, cy - r*0.1, r*0.14, 0, 2*Math.PI);
  ctx.fill();

  ctx.restore();
}

function drawBell(b){
  if(b.taken) return;
  const sx=b.x-camX; if(sx+b.w<0||sx>W) return;
  const bob = Math.sin(state.time*0.005 + b.x)*4;
  ctx.font='24px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('🔔', sx+b.w/2, b.y+b.h+bob);
}

function drawBush(b){
  const sx=b.x-camX; if(sx+b.w<0||sx>W) return;
  ctx.fillStyle= b.triggered ? '#2f6a2f' : '#245a24';
  ctx.beginPath();
  ctx.arc(sx+b.w*0.3,b.y+b.h*0.6,b.w*0.35,0,2*Math.PI);
  ctx.arc(sx+b.w*0.6,b.y+b.h*0.5,b.w*0.4,0,2*Math.PI);
  ctx.arc(sx+b.w*0.85,b.y+b.h*0.65,b.w*0.3,0,2*Math.PI);
  ctx.fill();
}

function drawFlag(f){
  const sx=f.x-camX; if(sx+f.w<0||sx>W) return;
  ctx.fillStyle='#cfcfcf';
  ctx.fillRect(sx+f.w/2-2, f.y, 4, f.h);
  ctx.fillStyle='#ff3d6e';
  ctx.beginPath();
  ctx.moveTo(sx+f.w/2+2, f.y+6);
  ctx.lineTo(sx+f.w/2+46, f.y+16);
  ctx.lineTo(sx+f.w/2+2, f.y+30);
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.font='bold 10px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('FINISH', sx+f.w/2+24, f.y+19);
}

function drawZombie(z){
  const sx = z.x - camX;
  if(sx+z.w<-20 || sx>W+20) return;
  
  ctx.save();
  ctx.translate(sx+z.w/2, z.y+z.h/2);
  ctx.scale(z.facing * z.size, z.size);
  
  const wobble = Math.sin(z.animT*0.03)*3;
  
  // Zombie Body
  ctx.fillStyle = z.color;
  ctx.fillRect(-14, z.h*0.05+wobble, 28, 32);
  
  // Head
  ctx.fillStyle = z.color;
  ctx.beginPath();
  ctx.ellipse(0, -12, 16, 17, 0, 0, 2*Math.PI);
  ctx.fill();
  
  // Scary Glowing Red Eyes
  ctx.fillStyle='#ff0000';
  ctx.beginPath(); ctx.arc(-6, -14, 4, 0, 2*Math.PI); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -14, 4, 0, 2*Math.PI); ctx.fill();
  ctx.fillStyle='#ffff00';
  ctx.beginPath(); ctx.arc(-6, -14, 1.5, 0, 2*Math.PI); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -14, 1.5, 0, 2*Math.PI); ctx.fill();
  
  // Open Mouth with sharp teeth
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.ellipse(0, -2, 7, 5, 0, 0, 2*Math.PI); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.fillRect(-4,-6,2,3); ctx.fillRect(2,-6,2,3);
  
  // Arms
  ctx.fillStyle=z.color;
  ctx.fillRect(-22, z.h*0.05+wobble, 8, 22);
  ctx.fillRect(14, z.h*0.05+wobble, 8, 22);
  
  // Legs
  const legWobble = Math.sin(z.animT*0.05)*4;
  ctx.fillRect(-12, z.h*0.32+wobble+legWobble, 10, 20);
  ctx.fillRect(2, z.h*0.32+wobble-legWobble, 10, 20);
  
  // Health Bar
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(-18, -38, 36, 7);
  ctx.fillStyle='#ff3d6e';
  ctx.fillRect(-18, -38, 36*(z.health/z.maxHealth), 7);
  
  ctx.restore();
}

function drawBullet(b){
  const sx = b.x - camX;
  if(sx<0 || sx>W) return;
  ctx.fillStyle = b.color || '#ffd23f';
  ctx.beginPath();
  ctx.arc(sx, b.y, 6, 0, 2*Math.PI);
  ctx.fill();
}

function drawParticles(){
  for(const p of particles){
    const sx = p.x - camX;
    if(sx < -50 || sx > W + 50) continue;
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(sx, p.y, p.size, 0, 2*Math.PI);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for(const sc of shellCasings){
    const sx = sc.x - camX;
    ctx.save();
    ctx.translate(sx, sc.y);
    ctx.rotate(sc.rot);
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(-2, -1, 5, 2);
    ctx.restore();
  }

  for(const ft of floatingTexts){
    const sx = ft.x - camX;
    ctx.save();
    ctx.font = 'bold 18px sans-serif';
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = ft.life / 60;
    ctx.fillText(ft.text, sx, ft.y);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ---------- Dino Character Drawing ----------
function drawPlayer(){
  const sx = player.x - camX;
  const sy = player.y;

  // Render War Tank if in tank mode
  if(player.weaponMode === 'tank'){
    ctx.save();
    ctx.translate(sx + player.w/2, sy + player.h/2 + 4);
    ctx.scale(player.facing, 1);

    if(player.invuln>0 && Math.floor(player.invuln/4)%2===0){
      ctx.globalAlpha = 0.5;
    }

    const runCycle = Math.abs(player.vx) > 0.5 ? Math.sin(player.animT * 0.08) * 3 : 0;

    // Dark Tread Wheels & Caterpillar Tracks
    ctx.fillStyle = '#1c2421';
    ctx.fillRect(-42, 10, 84, 20);

    // Moving Wheels inside track
    ctx.fillStyle = '#3a4742';
    for(let wx = -32; wx <= 32; wx += 16){
      ctx.beginPath();
      ctx.arc(wx + runCycle, 20, 7, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#111';
      ctx.stroke();
    }

    // Steel Armored Body (Camo Green)
    ctx.fillStyle = '#2d4536';
    ctx.fillRect(-38, -10, 76, 22);
    ctx.fillStyle = '#1e3025';
    ctx.fillRect(-30, -18, 60, 10);

    // Red Star / CODEZERO Emblem
    ctx.fillStyle = '#ff3d6e';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('★ CODEZERO', 0, 4);

    // Turret & Big Heavy Cannon Barrel
    ctx.save();
    ctx.translate(10 - player.gunRecoil, -14);
    ctx.fillStyle = '#1e3025';
    ctx.fillRect(0, -7, 48, 14);
    ctx.fillStyle = '#111814';
    ctx.fillRect(48, -9, 9, 18); // Heavy Muzzle Brake

    // Laser sight
    ctx.strokeStyle = 'rgba(255, 61, 110, 0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(57, 0);
    ctx.lineTo(240, 0);
    ctx.stroke();
    ctx.restore();

    // Dino head poking out wearing military helmet
    ctx.fillStyle = '#3fc7ea';
    ctx.beginPath(); ctx.ellipse(-10, -22, 12, 12, 0, 0, Math.PI*2); ctx.fill();

    // Military Helmet
    ctx.fillStyle = '#223829';
    ctx.beginPath(); ctx.ellipse(-10, -28, 14, 8, 0, 0, Math.PI*2); ctx.fill();

    // Eyes & Mask
    ctx.fillStyle = '#0d2436';
    ctx.fillRect(-22, -26, 24, 6);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-14, -23, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-6, -23, 2, 0, Math.PI*2); ctx.fill();

    ctx.restore();

    // Floating Speech Bubble if falling
    if(player.isFalling){
      ctx.save();
      const bw = 200, bh = 42;
      const bx = sx + player.w/2 - bw/2;
      const by = sy - 65;

      ctx.shadowColor = '#ff3d6e';
      ctx.shadowBlur = 12;

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 10);
      else ctx.fillRect(bx, by, bw, bh);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ff3d6e';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(sx + player.w/2 - 10, by + bh);
      ctx.lineTo(sx + player.w/2, by + bh + 12);
      ctx.lineTo(sx + player.w/2 + 10, by + bh);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#ff3d6e';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#ff3d6e';
      ctx.font = 'bold 17px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ადიოს მუჩაჩოოსსსს! 🗣️', bx + bw/2, by + 27);
      ctx.restore();
    }
    return;
  }

  ctx.save();
  ctx.translate(sx+player.w/2, sy+player.h/2);

  if(player.isFalling){
    ctx.rotate(player.fallRotation);
  } else {
    ctx.scale(player.facing, 1);
  }

  const running = Math.abs(player.vx)>0.5 && player.onGround;
  const runCycle = running ? Math.sin(player.animT*0.03)*8 : 0;
  const legCycle = running ? Math.sin(player.animT*0.03)*12 : 0;

  if(player.invuln>0 && Math.floor(player.invuln/4)%2===0){
    ctx.globalAlpha = 0.4;
  }

  // Skin styling configuration
  const skin = state.equippedSkin || 'classic';
  let legsColor = '#8b5cf6';
  let bodyColor = '#ff3d6e';
  let headColor = '#3fc7ea';
  let maskColor = '#0d2436';
  let eyeColor  = '#eaffff';

  if(skin === 'gold'){
    legsColor = '#b8860b';
    bodyColor = '#ffd23f';
    headColor = '#ffe066';
    maskColor = '#222222';
    eyeColor  = '#ffffff';
  } else if(skin === 'cyber'){
    legsColor = '#7000ff';
    bodyColor = '#ff00aa';
    headColor = '#00ffcc';
    maskColor = '#0d001a';
    eyeColor  = '#00ffff';
  } else if(skin === 'zombie'){
    legsColor = '#1b4d1b';
    bodyColor = '#2e8b57';
    headColor = '#32cd32';
    maskColor = '#0a1a0a';
    eyeColor  = '#ff0000';
  } else if(skin === 'dragon'){
    legsColor = '#880000';
    bodyColor = '#cc1100';
    headColor = '#ff3300';
    maskColor = '#330000';
    eyeColor  = '#ffff00';
  } else if(skin === 'godzilla'){
    legsColor = '#0f172a';
    bodyColor = '#1e293b';
    headColor = '#334155';
    maskColor = '#020617';
    eyeColor  = '#00f0ff';
  }

  // Special Back Spines for Godzilla skin
  if(skin === 'godzilla'){
    ctx.save();
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(-16, -10); ctx.lineTo(-26, -16); ctx.lineTo(-14, -2);
    ctx.moveTo(-14, 4); ctx.lineTo(-24, 0); ctx.lineTo(-12, 12);
    ctx.fill();
    ctx.restore();
  }

  // Legs with dynamic running leg-swing
  ctx.fillStyle = legsColor;
  ctx.save();
  ctx.translate(-8, player.h*0.18 + runCycle);
  ctx.rotate(legCycle*0.05);
  ctx.fillRect(-4, 0, 8, 18);
  ctx.restore();

  ctx.save();
  ctx.translate(4, player.h*0.18 - runCycle);
  ctx.rotate(-legCycle*0.05);
  ctx.fillRect(-4, 0, 8, 18);
  ctx.restore();

  // Body (Shirt / Jacket / Armor)
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.moveTo(-15, player.h*0.18);
  ctx.lineTo(-17,-8);
  ctx.quadraticCurveTo(0,-18,17,-8);
  ctx.lineTo(15, player.h*0.18);
  ctx.closePath();
  ctx.fill();

  // Arms & High-Tech Gun Blaster
  ctx.fillStyle = bodyColor;
  ctx.save();
  ctx.translate(-14, 0);
  ctx.rotate(Math.sin(player.animT*0.03)*0.4);
  ctx.fillRect(-3,-6,7,20);
  ctx.restore();

  // Right arm holding Gun with mode-specific visuals
  ctx.save();
  ctx.translate(10 - player.gunRecoil, -2);

  const mode = player.weaponMode || 'pistol';

  if(mode === 'pistol'){
    ctx.fillStyle='#1e2230'; ctx.fillRect(4, -4, 22, 9);
    ctx.fillStyle='#38c6ff'; ctx.fillRect(8, -2, 12, 3);
    ctx.fillStyle='#ff3d6e'; ctx.fillRect(4, 3, 20, 3);
    ctx.fillStyle='#101420'; ctx.fillRect(26, -3, 6, 7);
    ctx.fillStyle='#ffd23f'; ctx.fillRect(32, -1, 3, 3);
  } else if(mode === 'triple'){
    ctx.fillStyle='#22263a'; ctx.fillRect(4, -6, 26, 13);
    ctx.fillStyle='#ff3d6e'; ctx.fillRect(6, -4, 18, 3);
    ctx.fillStyle='#38c6ff'; ctx.fillRect(6, 2, 18, 3);
    ctx.fillStyle='#ffd23f'; ctx.fillRect(30, -6, 6, 4);
    ctx.fillRect(30, -1, 6, 4); ctx.fillRect(30, 4, 6, 4);
  } else if(mode === 'shotgun'){
    ctx.fillStyle='#1a1d28'; ctx.fillRect(2, -5, 28, 11);
    ctx.fillStyle='#ff7700'; ctx.fillRect(6, -2, 16, 5);
    ctx.fillStyle='#7f8c8d'; ctx.fillRect(30, -5, 12, 4);
    ctx.fillRect(30, 1, 12, 4);
  } else if(mode === 'minigun'){
    ctx.fillStyle='#111522'; ctx.fillRect(0, -6, 28, 14);
    ctx.fillStyle='#38c6ff'; ctx.fillRect(4, -3, 18, 6);
    // Rotary barrels
    const rot = (state.time * 0.05) % 6;
    ctx.fillStyle='#8899aa';
    ctx.fillRect(28, -6 + rot, 16, 3);
    ctx.fillRect(28, -2 + rot, 16, 3);
    ctx.fillRect(28, 2 + rot, 16, 3);
  } else if(mode === 'plasma'){
    ctx.fillStyle='#0f172a'; ctx.fillRect(0, -7, 30, 15);
    ctx.fillStyle='#00ffcc'; ctx.fillRect(4, -4, 20, 8);
    // Glowing plasma ball at tip
    ctx.fillStyle='#00ffcc';
    ctx.beginPath();
    ctx.arc(36, 0, 7 + Math.sin(state.time*0.02)*2, 0, Math.PI*2);
    ctx.fill();
  } else if(mode === 'flamethrower'){
    ctx.fillStyle='#2b1704'; ctx.fillRect(0, -6, 32, 13);
    ctx.fillStyle='#ff5500'; ctx.fillRect(6, -3, 18, 6);
    // Flame tank & nozzle
    ctx.fillStyle='#ff1100'; ctx.fillRect(2, 4, 14, 8);
    ctx.fillStyle='#ffaa00'; ctx.fillRect(32, -4, 8, 9);
  }

  // Laser sight line
  ctx.strokeStyle = mode === 'plasma' ? 'rgba(0,255,204,0.5)' : 'rgba(255,61,110,0.4)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(38, 0);
  ctx.lineTo(180, 0);
  ctx.stroke();

  ctx.restore();

  // Head
  ctx.fillStyle = headColor;
  ctx.beginPath();
  ctx.ellipse(0,-22,14,15,0,0,2*Math.PI);
  ctx.fill();

  // Mask Band / Visor
  ctx.fillStyle = maskColor;
  ctx.fillRect(-14,-28,28,8);

  // Cyber Visor Glow
  if(skin === 'cyber'){
    ctx.save();
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 8;
    ctx.fillRect(-12, -26, 24, 4);
    ctx.restore();
  }

  // Dragon Horns
  if(skin === 'dragon'){
    ctx.save();
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath();
    ctx.moveTo(-8, -30); ctx.lineTo(-16, -42); ctx.lineTo(-3, -33);
    ctx.moveTo(8, -30); ctx.lineTo(16, -42); ctx.lineTo(3, -33);
    ctx.fill();
    ctx.restore();
  }

  // Golden Ninja Crown
  if(skin === 'gold'){
    ctx.save();
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath();
    ctx.moveTo(-10, -32); ctx.lineTo(-5, -42); ctx.lineTo(0, -34); ctx.lineTo(5, -42); ctx.lineTo(10, -32);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ff0055';
    ctx.beginPath(); ctx.arc(0, -36, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Eyes
  ctx.fillStyle = eyeColor;
  ctx.beginPath(); ctx.ellipse(-5,-22,3.8,3,0,0,2*Math.PI); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5,-22,3.8,3,0,0,2*Math.PI); ctx.fill();
  ctx.fillStyle='#0b0e14';
  ctx.beginPath(); ctx.arc(-4,-22,1.8,0,2*Math.PI); ctx.fill();
  ctx.beginPath(); ctx.arc(6,-22,1.8,0,2*Math.PI); ctx.fill();

  // Mouth
  ctx.fillStyle='#0b0e14';
  ctx.beginPath(); ctx.ellipse(0,-14,5,4,0,0,2*Math.PI); ctx.fill();

  ctx.restore();

  // Floating Speech Bubble for "ადიოს მუჩაჩოოსსსს"
  if(player.isFalling){
    ctx.save();
    const bw = 200, bh = 42;
    const bx = sx + player.w/2 - bw/2;
    const by = sy - 65;

    ctx.shadowColor = '#ff3d6e';
    ctx.shadowBlur = 12;

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 10);
    else ctx.fillRect(bx, by, bw, bh);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ff3d6e';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(sx + player.w/2 - 10, by + bh);
    ctx.lineTo(sx + player.w/2, by + bh + 12);
    ctx.lineTo(sx + player.w/2 + 10, by + bh);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#ff3d6e';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#ff3d6e';
    ctx.font = 'bold 17px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ადიოს მუჩაჩოოსსსს! 🗣️', bx + bw/2, by + 27);
    ctx.restore();
  }
}

function drawJumpscare(){
  if(!state.jumpscareActive) return;
  const t = state.jumpscareTimer;
  ctx.save();
  ctx.globalAlpha = Math.min(1, t/15);
  ctx.fillStyle='#ff0033';
  ctx.font='bold 160px sans-serif';
  ctx.textAlign='center';
  const icon = state.jumpscareType === 'demon' ? '👹' : '💀';
  ctx.fillText(icon, W/2, H/2+50);
  ctx.restore();
  
  state.jumpscareTimer--;
  if(state.jumpscareTimer<=0) state.jumpscareActive=false;
}

function drawCityBuildings(){
  if(!level.isGodzillaLevel) return;
  for(const b of cityBuildings){
    const sx = b.x - camX;
    if(sx + b.w < -100 || sx > W + 100) continue;

    if(b.destroyed){
      // Crumbling rubble & burning embers
      ctx.fillStyle = '#1a121c';
      ctx.fillRect(sx, b.y + b.h - 40, b.w, 40);
      ctx.fillStyle = '#2b1d2c';
      ctx.fillRect(sx + 20, b.y + b.h - 60, b.w - 40, 20);

      // Fire & smoke
      const fTime = state.time * 0.01;
      ctx.fillStyle = Math.sin(fTime + b.x) > 0 ? '#ff4400' : '#ffaa00';
      ctx.beginPath();
      ctx.arc(sx + b.w/2, b.y + b.h - 50, 22, 0, Math.PI*2);
      ctx.fill();
    } else {
      // Intact skyscraper
      ctx.fillStyle = '#0e1626';
      ctx.fillRect(sx, b.y, b.w, b.h);
      ctx.strokeStyle = '#38c6ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(sx, b.y, b.w, b.h);

      // Lit Windows grid
      ctx.fillStyle = '#ffd23f';
      for(let wx = sx + 15; wx < sx + b.w - 15; wx += 25){
        for(let wy = b.y + 15; wy < b.y + b.h - 15; wy += 25){
          if((Math.floor(wx + wy) % 3) !== 0){
            ctx.fillRect(wx, wy, 12, 12);
          }
        }
      }
    }
  }
}

function drawGodzilla(){
  if(!godzillaBoss.active) return;
  const g = godzillaBoss;
  const sx = g.x - camX;
  if(sx + g.w < -150 || sx > W + 150) return;

  ctx.save();
  ctx.translate(sx + g.w/2, g.y + g.h/2);
  ctx.scale(g.facing, 1);

  const wobble = Math.sin(g.animT * 0.008) * 6;

  // Godzilla Body (Dark Slate Green Kaiju)
  ctx.fillStyle = '#1e382b';
  ctx.beginPath();
  ctx.ellipse(0, 10 + wobble, 75, 95, 0, 0, Math.PI*2);
  ctx.fill();

  // Spikes on spine (Glowing Neon Blue)
  ctx.fillStyle = g.isBeaming ? '#00e5ff' : '#0088cc';
  for(let i = -4; i <= 4; i++){
    ctx.beginPath();
    ctx.moveTo(-75, i * 20 + wobble);
    ctx.lineTo(-105, i * 20 - 15 + wobble);
    ctx.lineTo(-65, i * 20 + 15 + wobble);
    ctx.fill();
  }

  // Godzilla Head
  ctx.fillStyle = '#1e382b';
  ctx.beginPath();
  ctx.ellipse(25, -80 + wobble, 45, 38, 0, 0, Math.PI*2);
  ctx.fill();

  // Snout & Jaw
  ctx.fillRect(35, -95 + wobble, 40, 30);

  // Fiery Eyes
  ctx.fillStyle = '#ff1100';
  ctx.beginPath(); ctx.arc(45, -92 + wobble, 7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffff00';
  ctx.beginPath(); ctx.arc(47, -92 + wobble, 3, 0, Math.PI*2); ctx.fill();

  // Mouth & Atomic Breath Glow
  if(g.isBeaming){
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath(); ctx.ellipse(55, -75 + wobble, 18, 12, 0, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(55, -75 + wobble, 12, 8, 0, 0, Math.PI*2); ctx.fill();
    // Sharp teeth
    ctx.fillStyle = '#fff';
    ctx.fillRect(50, -82 + wobble, 3, 5);
    ctx.fillRect(58, -82 + wobble, 3, 5);
  }

  // Arms & Legs
  ctx.fillStyle = '#182e23';
  ctx.fillRect(15, -20 + wobble, 35, 18);
  ctx.fillRect(-35, 65 + wobble, 45, 45);
  ctx.fillRect(10, 65 + wobble, 45, 45);

  ctx.restore();

  // Atomic Beam Effect
  if(g.isBeaming){
    const beamStartX = g.facing === -1 ? sx - 10 : sx + g.w + 10;
    const beamY = g.y + 45;

    ctx.save();
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 25;
    ctx.fillRect(beamStartX - (g.facing === -1 ? 1200 : 0), beamY - 20, 1200, 40);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(beamStartX - (g.facing === -1 ? 1200 : 0), beamY - 8, 1200, 16);
    ctx.restore();
  }

  // Godzilla Boss Health Bar Header
  const barW = 420, barH = 18;
  const bx = W/2 - barW/2, by = 48;
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(bx - 12, by - 26, barW + 24, barH + 36);
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx - 12, by - 26, barW + 24, barH + 36);

  ctx.fillStyle = '#ff3d6e';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🦖 GODZILLA - CITY DESTROYER 🦖', W/2, by - 8);

  ctx.fillStyle = '#222';
  ctx.fillRect(bx, by, barW, barH);
  ctx.fillStyle = '#00f0ff';
  ctx.fillRect(bx, by, barW * Math.max(0, g.hp / g.maxHp), barH);
  ctx.strokeStyle = '#fff';
  ctx.strokeRect(bx, by, barW, barH);
}

function triggerNukeSequence(){
  if(nukeSeq.active) return;
  nukeSeq.active = true;
  nukeSeq.timer = 0;
  nukeSeq.missileY = H + 120;
  nukeSeq.missileX = W / 2;
  nukeSeq.exploded = false;
  nukeSeq.flash = 0;
  sfxDemonic();
  shake(40);
  triggerFlash('255, 100, 0', 0.9);
  toast("☢️ 🚨 ატომური რაკეტის გაშვება დეტექტირებულია! 🚨 ☢️", 3000);
}

function updateNukeSequence(dt){
  if(!nukeSeq.active) return;
  nukeSeq.timer += dt;

  if(!nukeSeq.exploded){
    nukeSeq.missileY -= 14;
    shake(16);
    spawnParticles(nukeSeq.missileX, nukeSeq.missileY + 65, '#ff4400', 8, 2.5);
    spawnParticles(nukeSeq.missileX, nukeSeq.missileY + 80, '#444444', 10, 2);

function drawGodzillaProjectiles(){
  for(const p of godzillaProjectiles){
    const sx = p.x - camX;
    if(sx < -100 || sx > W + 100) continue;

    ctx.save();
    if(p.type === 'fireball'){
      ctx.fillStyle = p.color || '#ff2200';
      ctx.beginPath();
      ctx.arc(sx, p.y, p.size, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#ffff00';
      ctx.beginPath();
      ctx.arc(sx, p.y, p.size * 0.5, 0, Math.PI*2);
      ctx.fill();
    } else if(p.type === 'shockwave'){
      ctx.fillStyle = p.color || '#00f0ff';
      ctx.beginPath();
      ctx.ellipse(sx + p.w/2, p.y + p.h/2, p.w/2, p.h/2, 0, 0, Math.PI*2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawNukeSequence(){
  if(!nukeSeq.active) return;

  if(!nukeSeq.exploded){
    const mx = nukeSeq.missileX;
    const my = nukeSeq.missileY;

    ctx.save();
    // Missile body
    ctx.fillStyle = '#a0aab2';
    ctx.fillRect(mx - 15, my - 50, 30, 80);
    // Warhead nose cone
    ctx.fillStyle = '#ff2200';
    ctx.beginPath();
    ctx.moveTo(mx - 15, my - 50);
    ctx.lineTo(mx, my - 85);
    ctx.lineTo(mx + 15, my - 50);
    ctx.fill();

    // Nuclear symbol on body ☢️
    ctx.fillStyle = '#111';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('☢️', mx, my - 10);

    // Rocket fins
    ctx.fillStyle = '#ff2200';
    ctx.beginPath(); ctx.moveTo(mx - 15, my + 10); ctx.lineTo(mx - 28, my + 35); ctx.lineTo(mx - 15, my + 30); ctx.fill();
    ctx.beginPath(); ctx.moveTo(mx + 15, my + 10); ctx.lineTo(mx + 28, my + 35); ctx.lineTo(mx + 15, my + 30); ctx.fill();

    // Fire plume thrust
    ctx.fillStyle = '#ff6600';
    ctx.beginPath();
    ctx.moveTo(mx - 12, my + 30);
    ctx.lineTo(mx, my + 95 + Math.random()*20);
    ctx.lineTo(mx + 12, my + 30);
    ctx.fill();
    ctx.restore();
  } else {
    // Nuclear Mushroom Cloud
    const mx = nukeSeq.missileX;
    const my = H * 0.22;

    ctx.save();
    // Mushroom Stem
    ctx.fillStyle = 'rgba(255, 100, 0, 0.85)';
    ctx.beginPath();
    ctx.moveTo(mx - 30, H);
    ctx.lineTo(mx - 15, my);
    ctx.lineTo(mx + 15, my);
    ctx.lineTo(mx + 30, H);
    ctx.fill();

    // Massive Glowing Cap
    const capRad = 180 + Math.sin(state.time * 0.01) * 20;
    const grad = ctx.createRadialGradient(mx, my, 20, mx, my, capRad);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.3, '#ffcc00');
    grad.addColorStop(0.7, '#ff3300');
    grad.addColorStop(1, 'rgba(100, 0, 0, 0.9)');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(mx, my, capRad, 0, Math.PI*2);
    ctx.fill();

    // Shockwave Ring
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.ellipse(mx, my + 40, capRad * 1.5, capRad * 0.4, 0, 0, Math.PI*2);
    ctx.stroke();

    ctx.restore();
  }
}

function drawShop(){
  drawBackground('pink');
  ctx.fillStyle = 'rgba(6, 10, 22, 0.88)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  // Title Header
  ctx.save();
  ctx.font = '900 30px sans-serif';
  ctx.shadowColor = '#ffd23f';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#ffd23f';
  ctx.fillText('🛍️ აღჭურვილობის, სკინებისა და იარაღების მაღაზია (SHOP)', W/2, 38);
  ctx.restore();

  // Coins Balance Badge
  ctx.fillStyle = '#38c6ff';
  ctx.font = 'bold 17px sans-serif';
  ctx.fillText(`💰 შენი ბალანსი: ${state.coinsCollected} მონეტა`, W/2, 66);

  // Tabs (Upgrades, Skins, Weapons)
  const shopTabs = [
    { id: 'upgrades', label: '⚡ უნარები' },
    { id: 'skins', label: '👕 სკინები' },
    { id: 'weapons', label: '🔫 იარაღები' }
  ];

  const tabY = 82, tabW = 210, tabH = 38;
  const tabStartX = W/2 - (3 * tabW + 2 * 16)/2;

  shopTabs.forEach((tab, idx) => {
    const tx = tabStartX + idx * (tabW + 16);
    const isActive = (state.shopTab || 'upgrades') === tab.id;

    ctx.save();
    ctx.fillStyle = isActive ? '#ffd23f' : 'rgba(20, 30, 50, 0.85)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(tx, tabY, tabW, tabH, 8);
    else ctx.fillRect(tx, tabY, tabW, tabH);
    ctx.fill();

    ctx.strokeStyle = isActive ? '#ffffff' : '#38c6ff';
    ctx.lineWidth = isActive ? 2.5 : 1.5;
    ctx.stroke();

    ctx.font = 'bold 15px sans-serif';
    ctx.fillStyle = isActive ? '#000000' : '#ffffff';
    ctx.fillText(tab.label, tx + tabW/2, tabY + 24);
    ctx.restore();
  });

  // Determine current items list
  let currentItems = shopUpgrades;
  if(state.shopTab === 'skins') currentItems = shopSkins;
  if(state.shopTab === 'weapons') currentItems = shopWeapons;

  // Render Cards (2 rows of 3)
  const cols = 3;
  const cardW = 270, cardH = 145;
  const startX = W/2 - (cols * cardW + (cols-1)*20)/2;
  const startY = 135;

  currentItems.forEach((item, idx) => {
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const cx = startX + col * (cardW + 20);
    const cy = startY + row * (cardH + 14);

    let isBought = false;
    let isEquipped = false;

    if(state.shopTab === 'upgrades'){
      isBought = state.upgrades[item.id];
    } else if(state.shopTab === 'skins'){
      isBought = (state.unlockedSkins || []).includes(item.id);
      isEquipped = state.equippedSkin === item.id;
    } else if(state.shopTab === 'weapons'){
      isBought = (state.unlockedWeapons || []).includes(item.id);
      isEquipped = state.equippedWeapon === item.id;
    }

    const canAfford = state.coinsCollected >= item.cost;

    ctx.save();
    ctx.fillStyle = isEquipped ? 'rgba(25, 65, 45, 0.94)' : (isBought ? 'rgba(25, 45, 35, 0.92)' : 'rgba(18, 24, 40, 0.92)');
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(cx, cy, cardW, cardH, 10);
    else ctx.fillRect(cx, cy, cardW, cardH);
    ctx.fill();

    ctx.strokeStyle = isEquipped ? '#3fe07d' : (isBought ? '#38c6ff' : (canAfford ? '#ffd23f' : '#ff3d6e'));
    ctx.lineWidth = isEquipped ? 3 : 2;
    ctx.stroke();

    // Card Title
    ctx.textAlign = 'left';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillStyle = isEquipped ? '#3fe07d' : (isBought ? '#38c6ff' : '#ffffff');
    ctx.fillText(`${item.icon} ${item.title}`, cx + 12, cy + 26);

    // Desc
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#aaaaaa';
    ctx.fillText(item.desc, cx + 12, cy + 50);

    // Bottom Action Area
    ctx.font = 'bold 14px sans-serif';
    if(isEquipped){
      ctx.fillStyle = '#3fe07d';
      ctx.fillText('✅ არჩეულია (EQUIPPED)', cx + 12, cy + 105);
    } else if(isBought){
      ctx.fillStyle = '#38c6ff';
      ctx.fillText('✅ იყიდება (UNLOCKED)', cx + 12, cy + 105);

      // Equip Button Box for skins & weapons
      if(state.shopTab === 'skins' || state.shopTab === 'weapons'){
        const btnW = 100, btnH = 32;
        const bx = cx + cardW - btnW - 12, by = cy + cardH - btnH - 10;
        ctx.fillStyle = '#38c6ff';
        ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(bx, by, btnW, btnH, 6);
        else ctx.fillRect(bx, by, btnW, btnH);
        ctx.fill();

        ctx.textAlign = 'center';
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('🎯 არჩევა', bx + btnW/2, by + 21);
      }
    } else {
      ctx.fillStyle = '#ffd23f';
      ctx.fillText(`🪙 ფასი: ${item.cost}`, cx + 12, cy + 85);

      // Buy Button Box
      const btnW = 110, btnH = 34;
      const bx = cx + cardW - btnW - 12, by = cy + cardH - btnH - 10;
      ctx.fillStyle = canAfford ? '#38c6ff' : '#444444';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(bx, by, btnW, btnH, 6);
      else ctx.fillRect(bx, by, btnW, btnH);
      ctx.fill();

      ctx.textAlign = 'center';
      ctx.fillStyle = canAfford ? '#000000' : '#888888';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('🛒 ყიდვა', bx + btnW/2, by + 22);
    }
    ctx.restore();
  });

  // Bottom Buttons: Promo Code & Back
  ctx.save();
  const bw = 260, bh = 42;
  const gap = 20;

  // Promo Code Button (Left)
  const pbx = W/2 - bw - gap/2, pby = H - 52;
  ctx.fillStyle = 'rgba(255, 210, 63, 0.18)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(pbx, pby, bw, bh, 10);
  else ctx.fillRect(pbx, pby, bw, bh);
  ctx.fill();
  ctx.strokeStyle = '#ffd23f';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#ffd23f';
  ctx.fillText('🎟️ პრომოკოდი (PROMO CODE)', pbx + bw/2, pby + 27);

  // Back Button (Right)
  const bbx = W/2 + gap/2, bby = H - 52;
  ctx.fillStyle = '#ff3d6e';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bbx, bby, bw, bh, 10);
  else ctx.fillRect(bbx, bby, bw, bh);
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#ffffff';
  const isReturningToGame = state.returnMode === 'playing' || state.returnMode === 'paused';
  const backLabel = isReturningToGame ? '⬅️ თამაშში დაბრუნება' : '⬅️ მენიუში დაბრუნება';
  ctx.fillText(backLabel, bbx + bw/2, bby + 27);
  ctx.restore();
}

function handleShopClick(mx, my){
  const bw = 260, bh = 42;
  const gap = 20;

  // Check Promo Code Button
  const pbx = W/2 - bw - gap/2, pby = H - 52;
  if(mx >= pbx && mx <= pbx + bw && my >= pby && my <= pby + bh){
    sfxBell();
    openPromoModal();
    return;
  }

  // Check Back Button
  const bbx = W/2 + gap/2, bby = H - 52;
  if(mx >= bbx && mx <= bbx + bw && my >= bby && my <= bby + bh){
    sfxBell();
    if(state.returnMode === 'playing' || state.returnMode === 'paused'){
      state.mode = 'playing';
      if(state.upgrades.shield) player.hasShield = true;
      if(state.upgrades.maxHp && state.lives < 10) state.lives = Math.max(state.lives, 10);
      if(state.equippedWeapon) player.weaponMode = state.equippedWeapon;
      else if(state.upgrades.shotgun && player.weaponMode === 'pistol') player.weaponMode = 'shotgun';
    } else {
      state.mode = state.returnMode || 'menu';
    }
    return;
  }

  // Check Tab Clicks
  const tabY = 82, tabW = 210, tabH = 38;
  const tabStartX = W/2 - (3 * tabW + 2 * 16)/2;
  const shopTabs = ['upgrades', 'skins', 'weapons'];

  for(let i = 0; i < 3; i++){
    const tx = tabStartX + i * (tabW + 16);
    if(mx >= tx && mx <= tx + tabW && my >= tabY && my <= tabY + tabH){
      state.shopTab = shopTabs[i];
      sfxBell();
      return;
    }
  }

  // Check Item Card Clicks
  const cols = 3;
  const cardW = 270, cardH = 145;
  const startX = W/2 - (cols * cardW + (cols-1)*20)/2;
  const startY = 135;

  let currentItems = shopUpgrades;
  if(state.shopTab === 'skins') currentItems = shopSkins;
  if(state.shopTab === 'weapons') currentItems = shopWeapons;

  currentItems.forEach((item, idx) => {
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const cx = startX + col * (cardW + 20);
    const cy = startY + row * (cardH + 14);

    if(mx >= cx && mx <= cx + cardW && my >= cy && my <= cy + cardH){
      if(state.shopTab === 'upgrades'){
        if(!state.upgrades[item.id]){
          if(state.coinsCollected >= item.cost){
            state.coinsCollected -= item.cost;
            state.upgrades[item.id] = true;
            saveData();
            sfxCoin();
            sfxWin();
            triggerFlash('56,198,255', 0.6);
            toast(`✅ ${item.title} წარმატებით შეიძინე!`, 2200);
          } else {
            sfxHurt();
            toast(`❌ არ გყოფნის მონეტები! (საჭიროა ${item.cost})`, 1800);
          }
        }
      } else if(state.shopTab === 'skins'){
        const isBought = (state.unlockedSkins || []).includes(item.id);
        if(isBought){
          state.equippedSkin = item.id;
          saveData();
          sfxCoin();
          toast(`👕 სკინი არჩეულია: ${item.title}`, 1800);
        } else {
          if(state.coinsCollected >= item.cost){
            state.coinsCollected -= item.cost;
            if(!state.unlockedSkins) state.unlockedSkins = ['classic'];
            state.unlockedSkins.push(item.id);
            state.equippedSkin = item.id;
            saveData();
            sfxCoin();
            sfxWin();
            triggerFlash('56,198,255', 0.6);
            toast(`🎉 სკინი შეიძინე & აირჩიე: ${item.title}`, 2200);
          } else {
            sfxHurt();
            toast(`❌ არ გყოფნის მონეტები! (საჭიროა ${item.cost})`, 1800);
          }
        }
      } else if(state.shopTab === 'weapons'){
        const isBought = (state.unlockedWeapons || []).includes(item.id);
        if(isBought){
          state.equippedWeapon = item.id;
          player.weaponMode = item.id;
          saveData();
          sfxCoin();
          toast(`🔫 იარაღი არჩეულია: ${item.title}`, 1800);
        } else {
          if(state.coinsCollected >= item.cost){
            state.coinsCollected -= item.cost;
            if(!state.unlockedWeapons) state.unlockedWeapons = ['pistol'];
            state.unlockedWeapons.push(item.id);
            state.equippedWeapon = item.id;
            player.weaponMode = item.id;
            saveData();
            sfxCoin();
            sfxWin();
            triggerFlash('56,198,255', 0.6);
            toast(`🎉 იარაღი შეიძინე & აირჩიე: ${item.title}`, 2200);
          } else {
            sfxHurt();
            toast(`❌ არ გყოფნის მონეტები! (საჭიროა ${item.cost})`, 1800);
          }
        }
      }
    }
  });
}

function drawLevelSelect(){
  drawBackground('pink');
  ctx.fillStyle = 'rgba(6, 10, 22, 0.90)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  // Title Header
  ctx.save();
  ctx.font = '900 28px sans-serif';
  ctx.shadowColor = '#38c6ff';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#38c6ff';
  ctx.fillText('🗺️ დონეების არჩევა (LEVEL SELECT)', W/2, 38);
  ctx.restore();

  // Grid of levels (7 columns x N rows)
  const cols = 7;
  const cardW = 118, cardH = 115;
  const gapX = 10, gapY = 10;
  const totalW = cols * cardW + (cols - 1) * gapX;
  const startX = (W - totalW) / 2;
  const startY = 55;

  for(let idx = 0; idx < LEVELS.length; idx++){
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const cx = startX + col * (cardW + gapX);
    const cy = startY + row * (cardH + gapY);

    const isUnlocked = (idx + 1) <= (state.unlockedLevels || 1);
    const lvl = LEVELS[idx];
    const isGodzilla = lvl && (lvl.isGodzillaLevel || idx === 20);

    ctx.save();
    ctx.fillStyle = isUnlocked ? (isGodzilla ? 'rgba(50, 20, 30, 0.95)' : 'rgba(20, 32, 54, 0.92)') : 'rgba(10, 12, 18, 0.7)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(cx, cy, cardW, cardH, 8);
    else ctx.fillRect(cx, cy, cardW, cardH);
    ctx.fill();

    ctx.strokeStyle = isUnlocked ? (idx === state.levelIndex ? '#ffd23f' : (isGodzilla ? '#ff3d6e' : '#38c6ff')) : '#444444';
    ctx.lineWidth = idx === state.levelIndex ? 3 : 1.5;
    ctx.stroke();

    ctx.textAlign = 'center';

    // Episode Badge
    ctx.font = 'bold 14px sans-serif';
    ctx.fillStyle = isGodzilla ? '#ff3d6e' : (isUnlocked ? '#ffd23f' : '#666666');
    ctx.fillText(`EP. ${idx + 1}` + (isGodzilla ? ' 🦖' : ''), cx + cardW/2, cy + 24);

    // Level Name
    ctx.font = 'bold 11px sans-serif';
    ctx.fillStyle = isUnlocked ? '#ffffff' : '#555555';
    let shortName = lvl ? (lvl.name.split('—')[1] || lvl.name) : `Level ${idx+1}`;
    shortName = shortName.trim();
    if(shortName.length > 13) shortName = shortName.slice(0, 12) + '…';
    ctx.fillText(shortName, cx + cardW/2, cy + 52);

    // Play/Locked Status
    ctx.font = 'bold 12px sans-serif';
    if(isUnlocked){
      ctx.fillStyle = isGodzilla ? '#ff3d6e' : '#3fe07d';
      ctx.fillText('▶ PLAY', cx + cardW/2, cy + 88);
    } else {
      ctx.fillStyle = '#ff3d6e';
      ctx.fillText('🔒 LOCKED', cx + cardW/2, cy + 88);
    }
    ctx.restore();
  }

  // Back Button
  ctx.save();
  const bw = 280, bh = 42;
  const bx = W/2 - bw/2, by = H - 50;
  ctx.fillStyle = '#ff3d6e';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 10);
  else ctx.fillRect(bx, by, bw, bh);
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#ffffff';
  const isReturningToGame = state.returnMode === 'playing' || state.returnMode === 'paused';
  const backLabel = isReturningToGame ? '⬅️ თამაშში დაბრუნება (RETURN TO GAME)' : '⬅️ მენიუში დაბრუნება';
  ctx.fillText(backLabel, W/2, by + 26);
  ctx.restore();
}

    return;
  }

  const cols = 7;
  const cardW = 118, cardH = 115;
  const gapX = 10, gapY = 10;
  const totalW = cols * cardW + (cols - 1) * gapX;
  const startX = (W - totalW) / 2;
  const startY = 55;

  for(let idx = 0; idx < LEVELS.length; idx++){
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const cx = startX + col * (cardW + gapX);
    const cy = startY + row * (cardH + gapY);

    if(mx >= cx && mx <= cx + cardW && my >= cy && my <= cy + cardH){
      if((idx + 1) <= (state.unlockedLevels || 1)){
        sfxCoin();
        state.levelIndex = idx;
        loadLevel(idx);
        state.mode = 'playing';
        state.returnMode = 'playing';
        toast(`▶ ეპიზოდი ${idx + 1} დაიწყო!`, 1800);
      } else {
        sfxHurt();
        toast("🔒 ეს დონე ჯერ დაბლოკილია!", 1500);
      }
    }
  }
}

function handleMenuClick(mx, my){
  // Start Button
  const btnW = 460, btnH = 48;
  const bx = W/2 - btnW/2, by = H/2 + 45;
  if(mx >= bx && mx <= bx + btnW && my >= by && my <= by + btnH){
    startGame();
    return;
  }

  // Sub buttons: Shop & Levels
  const subW = 220, subH = 42;
  const sbx1 = W/2 - subW - 10, sby = H/2 + 108;
  const sbx2 = W/2 + 10;

  if(mx >= sbx1 && mx <= sbx1 + subW && my >= sby && my <= sby + subH){
    openShop();
    return;
  } else if(mx >= sbx2 && mx <= sbx2 + subW && my >= sby && my <= sby + subH){
    openLevelSelect();
    return;
  }

  // Promo Code Button
  const promoW = 340, promoH = 38;
  const pbx = W/2 - promoW/2, pby = H/2 + 160;
  if(mx >= pbx && mx <= pbx + promoW && my >= pby && my <= pby + promoH){
    sfxBell();
    openPromoModal();
    return;
  }
}

function openShop(){
  loadSavedData();
  if(state.mode !== 'shop' && state.mode !== 'levelselect'){
    state.returnMode = state.mode;
  }
  state.mode = 'shop';
}

function openLevelSelect(){
  if(state.mode !== 'shop' && state.mode !== 'levelselect'){
    state.returnMode = state.mode;
  }
  state.mode = 'levelselect';
}

function openPromoModal(){
  const modal = document.getElementById('promoModal');
  if(modal){
    modal.style.display = 'flex';
    const input = document.getElementById('promoInput');
    if(input){
      input.value = '';
      setTimeout(() => input.focus(), 100);
    }
  } else {
    enterPromoCodePrompt();
  }
}

function closePromoModal(){
  const modal = document.getElementById('promoModal');
  if(modal) modal.style.display = 'none';
}

function submitPromoCode(){
  const input = document.getElementById('promoInput');
  const raw = input ? input.value : '';
  const code = raw.trim().toUpperCase();

  if(code === 'DINOMAGARIA'){
    state.coinsCollected = Math.max((state.coinsCollected || 0) + 999999, 999999);
    saveData();
    sfxWin();
    triggerFlash('255,210,63', 0.8);
    toast('🎉 პრომოკოდი წარმატებით გააქტიურდა! მიიღე 999,999 მონეტა!', 3500);
    closePromoModal();
  } else if(code === ''){
    toast('⚠️ შეიყვანეთ პრომოკოდი!', 1500);
  } else {
    sfxHurt();
    toast('❌ არასწორი პრომოკოდი!', 2000);
  }
}

function fillQuickPromoCode(code){
  const input = document.getElementById('promoInput');
  if(input) input.value = code;
  submitPromoCode();
}

function enterPromoCodePrompt(){
  const res = prompt("შეიყვანეთ პრომოკოდი (ENTER PROMO CODE):");
  if(res !== null){
    const code = res.trim().toUpperCase();
    if(code === 'DINOMAGARIA'){
      state.coinsCollected = Math.max((state.coinsCollected || 0) + 999999, 999999);
      saveData();
      sfxWin();
      triggerFlash('255,210,63', 0.8);
      toast('🎉 პრომოკოდი წარმატებით გააქტიურდა! მიიღე 999,999 მონეტა!', 3500);
    } else if(code.length > 0) {
      sfxHurt();
      toast('❌ არასწორი პრომოკოდი!', 2000);
    }
  }
}

function drawPauseOverlay(){
  ctx.fillStyle='rgba(0,0,0,.75)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#fff';
  ctx.font='bold 44px sans-serif';
  ctx.fillText('შეჩერებულია ⏸️', W/2, H/2 - 20);
  
  ctx.font='bold 20px sans-serif';
  ctx.fillStyle='#ffd23f';
  ctx.fillText('დააჭირე P / შეეხე გასაგრძელებლად', W/2, H/2 + 30);
}

function drawGameOver(){
  drawBackground('pink');
  ctx.fillStyle='rgba(0,0,0,.78)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';

  if(state.lastKilledByGodzilla || (level && level.isGodzillaLevel)){
    // Godzilla Victory Screen
    ctx.fillStyle = '#ff3d6e';
    ctx.font = 'bold 36px sans-serif';
    ctx.fillText('🦖 გოდზილას აპოკალიფსური გამარჯვება! 🏙️', W/2, 90);

    // Render Godzilla icon in center background
    ctx.font = '120px sans-serif';
    ctx.fillText('🦖', W/2 - 140, H/2 - 20);

    // Dark Ominous Speech Cloud from Godzilla
    const cloudX = W/2 + 20, cloudY = H/2 - 120, cloudW = 420, cloudH = 100;
    ctx.fillStyle = '#120517';
    ctx.fillRect(cloudX, cloudY, cloudW, cloudH);
    ctx.strokeStyle = '#ff3d6e';
    ctx.lineWidth = 4;
    ctx.strokeRect(cloudX, cloudY, cloudW, cloudH);

    // Cloud pointer tail
    ctx.beginPath();
    ctx.moveTo(cloudX - 22, cloudY + 50);
    ctx.lineTo(cloudX, cloudY + 32);
    ctx.lineTo(cloudX, cloudY + 68);
    ctx.fillStyle = '#120517';
    ctx.fill();

    // Exact requested quote in cloud
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px Georgia, serif';
    ctx.fillText('"შენი დროც დადგა', cloudX + cloudW/2, cloudY + 40);
    ctx.fillStyle = '#ffd23f';
    ctx.fillText('ნიღაბი უნდა მოიხსნა"', cloudX + cloudW/2, cloudY + 74);

    ctx.fillStyle = '#ff3d6e';
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText('გაცული ხარ ხულიგაში! 💀', W/2, H/2 + 105);

    ctx.fillStyle = '#fff';
    ctx.font = '22px sans-serif';
    ctx.fillText('ქულა: ' + state.score, W/2, H/2 + 142);

    ctx.font = 'bold 20px sans-serif';
    const blink = Math.floor(state.time/400)%2===0;
    if(blink) ctx.fillText('დააჭირე SPACE თავიდან საცდელად 🔄', W/2, H/2 + 182);
  } else {
    ctx.fillStyle='#ff3d6e';
    ctx.font='bold 44px sans-serif';
    ctx.fillText('💀 8-ვე სიცოცხლე ამოიწურა! 💀', W/2, H/2 - 40);
    ctx.fillStyle='#fff';
    ctx.font='22px sans-serif';
    ctx.fillText('საბოლოო ქულა: ' + state.score, W/2, H/2 + 5);
    ctx.font='bold 20px sans-serif';
    const blink = Math.floor(state.time/400)%2===0;
    if(blink) ctx.fillText('დააჭირე SPACE / შეეხე თამაშის თავიდან დასაწყებად (Level 1) 🔄', W/2, H/2 + 55);
  }
}

function drawLevelClear(){
  ctx.fillStyle='rgba(0,0,0,.5)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ffd23f';
  ctx.font='bold 44px sans-serif';
  ctx.fillText('დონე გავლილია! 🎉', W/2, H/2-10);
  ctx.fillStyle='#fff';
  ctx.font='20px sans-serif';
  ctx.fillText('მზად იყავი შემდეგი გიჟური დონისთვის!', W/2, H/2+30);
}

function drawWin(){
  drawBackground('pink');
  for(let i=0;i<70;i++){
    const cx = (i*47 + state.time*0.2) % W;
    const cy = (i*83 + state.time*0.4) % H;
    ctx.fillStyle = i%3===0?'#ffd23f': i%3===1?'#ff3d6e':'#38c6ff';
    ctx.fillRect(cx,cy,6,9);
  }
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#38c6ff';
  ctx.font='bold 48px sans-serif';
  ctx.fillText('ყველა დონე დაძლეულია! 🏆', W/2, H/2-60);
  ctx.fillStyle='#fff';
  ctx.font='22px sans-serif';
  ctx.fillText('საბოლოო ქულა: '+state.score, W/2, H/2-15);
  ctx.fillText('გამოწერების მეტრი: '+Math.floor(state.subs)+'%', W/2, H/2+20);
  ctx.font='bold 18px sans-serif';
  const blink = Math.floor(state.time/400)%2===0;
  if(blink) ctx.fillText('დააჭირე SPACE თამაშის თავიდან საწყებად', W/2, H/2+65);
}

// ---------- Main Game Loop ----------
let lastTime = performance.now();
function loop(now){
  const dt = Math.min(33, now-lastTime);
  lastTime = now;
  state.time += dt;

  updateBgmTrack();

  const mobileCtrl = document.getElementById('mobileControls');
  if(mobileCtrl){
    const isMobileDevice = window.innerWidth <= 860 || ('ontouchstart' in window);
    mobileCtrl.style.display = (state.mode === 'playing' && isMobileDevice) ? 'flex' : 'none';
  }

  ctx.save();
  if(state.shake>0){
    const sx = (Math.random()-0.5)*state.shake;
    const sy = (Math.random()-0.5)*state.shake;
    ctx.translate(sx,sy);
    state.shake *= 0.86;
    if(state.shake<0.5) state.shake=0;
  }

  if(state.mode==='loading'){
    drawLoading();
  } else if(state.mode==='menu'){
    drawMenu();
  } else if(state.mode==='shop'){
    drawShop();
  } else if(state.mode==='levelselect'){
    drawLevelSelect();
  } else {
    drawBackground(level.bgHue);
    drawWeatherWorld();

    ctx.save();
    ctx.translate(0, -camY);

    drawCityBuildings();
    drawGround();
    level.signs.forEach(drawSign);
    level.fakespikes.forEach(drawFakespike);
    level.spikes.forEach(drawSpike);
    level.bananas.forEach(drawBanana);
    level.coins.forEach(drawCoin);
    level.bells.forEach(drawBell);
    level.bushes.forEach(drawBush);
    if(level.jumpboxes) level.jumpboxes.forEach(drawJumpBox);
    drawFlag(level.flag);
    drawGodzilla();
    drawGodzillaProjectiles();
    zombies.forEach(drawZombie);
    bullets.forEach(drawBullet);
    drawPlayer();
    drawParticles();

    ctx.restore();

    drawWeatherOverlay();
    drawNukeSequence();
    drawJumpscare();
    drawSponsorPopup();
    drawHUD();

    if(state.mode==='playing'){
      updatePlayer(dt);
      updateGodzilla(dt);
      updateNukeSequence(dt);
      updateWeather(dt);
    } else if(state.mode==='paused'){
      drawPauseOverlay();
    } else if(state.mode==='gameover'){
      drawGameOver();
    } else if(state.mode==='levelclear'){
      drawLevelClear();
    } else if(state.mode==='win'){
      drawWin();
    }
  }

  if(state.flashAlpha>0){
    ctx.fillStyle=`rgba(${state.flashColor},${state.flashAlpha})`;
    ctx.fillRect(0,0,W,H);
    state.flashAlpha *= 0.86;
    if(state.flashAlpha<0.02) state.flashAlpha=0;
  }

  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
