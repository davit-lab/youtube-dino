<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>გეოდინო: ხულიგანური პარკური & Horror Edition</title>
<style>
  :root{
    --ink:#0b0e14;
    --panel:#141826;
    --blue:#38c6ff;
    --blue-dark:#1a6fa8;
    --pink:#ff3d6e;
    --pink-dark:#c21f4a;
    --yellow:#ffd23f;
    --cream:#f4ecd8;
    --green:#3fe07d;
  }
  *{box-sizing:border-box; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background: radial-gradient(ellipse at 50% 0%, #1c2438 0%, #06080d 80%);
    font-family: 'Trebuchet MS', 'BPG Nino Mtavruli', 'Segoe UI', sans-serif;
    color: var(--cream);
  }
  #wrap{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  canvas{
    background:#080b10;
    image-rendering: pixelated;
    box-shadow: 0 0 0 4px var(--blue-dark), 0 0 50px rgba(56,198,255,.4), 0 0 100px rgba(255,61,110,.2);
    border-radius: 8px;
    max-width: 98vw;
    max-height: 94vh;
  }
  #hint{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    font-size:12px; opacity:.75; letter-spacing:.5px; text-align:center;
    pointer-events:none; text-shadow:0 1px 3px #000;
  }
  #topBarControls{
    position:absolute; top:12px; right:18px;
    display:flex; gap:10px; z-index:10;
  }
  .btn-ui{
    background:rgba(20,24,38,0.85); border:1.5px solid var(--blue);
    color:var(--cream); padding:6px 14px; border-radius:6px;
    font-size:13px; font-weight:bold; cursor:pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    transition: all 0.2s ease;
  }
  .btn-ui:hover{
    background:var(--blue); color:#000; transform:scale(1.05);
  }
  .btn-ui.skip{
    border-color:var(--yellow); color:var(--yellow);
  }
  .btn-ui.skip:hover{
    background:var(--yellow); color:#000;
  }

  /* Promo Modal Overlay Styles */
  #promoModal {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 380px; max-width: 92vw;
    background: rgba(10, 16, 30, 0.96);
    border: 3px solid var(--yellow);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 0 35px rgba(255, 210, 63, 0.6), 0 10px 50px rgba(0,0,0,0.95);
    color: #fff;
    text-align: center;
    z-index: 250;
    display: none;
    flex-direction: column;
    gap: 14px;
    font-family: sans-serif;
    backdrop-filter: blur(8px);
  }
  #promoModal h2 {
    margin: 0; font-size: 22px; color: var(--yellow); text-shadow: 0 0 12px rgba(255, 210, 63, 0.7);
  }
  #promoInput {
    width: 100%; padding: 12px; font-size: 18px; font-weight: bold; text-align: center;
    border-radius: 10px; border: 2.5px solid var(--blue); background: #070c18; color: #fff;
    outline: none; box-sizing: border-box; text-transform: uppercase; letter-spacing: 1.5px;
  }
  #promoInput:focus {
    border-color: var(--yellow); box-shadow: 0 0 14px rgba(255, 210, 63, 0.6);
  }
  .promo-btn-group {
    display: flex; gap: 10px; justify-content: center; margin-top: 4px;
  }
  .btn-promo-submit {
    flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px;
    border: none; background: var(--yellow); color: #000; cursor: pointer;
    box-shadow: 0 4px 14px rgba(255, 210, 63, 0.5); transition: transform 0.1s;
  }
  .btn-promo-submit:active { transform: scale(0.95); }
  .btn-promo-close {
    padding: 12px 18px; font-size: 15px; font-weight: bold; border-radius: 8px;
    border: 2px solid #555; background: rgba(255,255,255,0.05); color: #ccc; cursor: pointer;
  }
  .btn-promo-close:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .promo-quick-btn {
    background: rgba(56, 198, 255, 0.15); border: 1.5px dashed var(--blue); color: var(--blue);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer;
    transition: all 0.15s ease;
  }
  .promo-quick-btn:hover { background: var(--blue); color: #000; }
  #mobileControls{
    position:absolute; bottom:18px; left:0; right:0;
    display:none; justify-content:space-between; align-items:flex-end;
    padding:0 22px; pointer-events:none;
    z-index:100;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  #mobileControls .ctrl-btn{
    pointer-events:auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:66px; height:66px; border-radius:50%;
    border:2.5px solid var(--blue); background:rgba(12, 16, 28, 0.9);
    color:var(--cream); font-size:22px; font-weight:bold;
    box-shadow: 0 4px 14px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,255,255,0.2);
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s ease, background-color 0.08s ease, box-shadow 0.08s ease;
  }
  #mobileControls .ctrl-btn:active,
  #mobileControls .ctrl-btn.active{
    transform: scale(0.92);
    background: rgba(56, 198, 255, 0.35);
    box-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 16px rgba(56, 198, 255, 0.6);
  }
  #mobileControls .left{
    display:flex; gap:12px; align-items:center;
  }
  #mobileControls .right{
    display:flex; gap:16px; align-items:flex-end;
  }
  /* Stagger Jump and Shoot to prevent accidental misclicks */
  #mobileControls #btnJump {
    width: 74px; height: 74px;
    border-color: var(--pink); color: #fff;
    background: rgba(255, 61, 110, 0.28);
    transform: translateY(-10px);
  }
  #mobileControls #btnJump:active,
  #mobileControls #btnJump.active {
    background: var(--pink); color: #fff;
    transform: translateY(-10px) scale(0.92);
    box-shadow: 0 0 22px rgba(255, 61, 110, 0.9);
  }
  #mobileControls #btnShoot {
    width: 68px; height: 68px;
    border-color: var(--yellow); color: var(--yellow);
    background: rgba(255, 210, 63, 0.22);
  }
  #mobileControls #btnShoot:active,
  #mobileControls #btnShoot.active {
    background: var(--yellow); color: #000;
    transform: scale(0.92);
    box-shadow: 0 0 22px rgba(255, 210, 63, 0.9);
  }
  .btn-icon {
    font-size: 22px;
    line-height: 1;
  }
  .btn-subtext {
    font-size: 9px;
    letter-spacing: 0.5px;
    margin-top: 1px;
    font-weight: 800;
    text-transform: uppercase;
    opacity: 0.9;
  }
  @media (max-width:860px){
    #mobileControls{display:flex;}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="topBarControls">
    <button class="btn-ui" onclick="openLevelSelect()" title="დონეების არჩევა">🗺️ Levels</button>
    <button class="btn-ui" onclick="openShop()" title="მაღაზია">🛍️ Shop</button>
    <button class="btn-ui" onclick="openPromoModal()" title="პრომოკოდის შეყვანა" style="border-color:var(--yellow); color:var(--yellow);">🎟️ Promo</button>
    <button class="btn-ui" id="btnMuteBgm" onclick="toggleBgmMute()" title="მუსიკის ჩართვა/გამორთვა">🎵 Music: ON</button>
    <button class="btn-ui" onclick="togglePause()" title="პაუზა (P)">⏸️ Pause (P)</button>
  </div>

  <canvas id="game" width="960" height="540"></canvas>

  <div id="promoModal">
    <div style="font-size: 32px; margin-bottom: -4px;">🎟️</div>
    <h2>პრომოკოდის შეყვანა</h2>
    <p style="margin: 0; font-size: 13px; color: #a0aec0; line-height: 1.4;">
      შეიყვანეთ საიდუმლო პრომოკოდი მონეტების მისაღებად!
    </p>
    <input id="promoInput" type="text" placeholder="შეიყვანეთ კოდი..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter') submitPromoCode()" />
    <div class="promo-btn-group">
      <button class="btn-promo-submit" onclick="submitPromoCode()">🚀 გააქტიურება</button>
      <button class="btn-promo-close" onclick="closePromoModal()">✖ დახურვა</button>
    </div>
  </div>
  
  <div id="mobileControls">
    <div class="left">
      <button id="btnLeft" class="ctrl-btn" aria-label="გადაადგილება მარცხნივ"><span class="btn-icon">◀</span></button>
      <button id="btnRight" class="ctrl-btn" aria-label="გადაადგილება მარჯვნივ"><span class="btn-icon">▶</span></button>
    </div>
    <div class="right">
      <button id="btnDash" class="ctrl-btn" aria-label="დეში" style="border-color:var(--blue); background:rgba(56,198,255,0.22);"><span class="btn-icon">⚡</span><span class="btn-subtext">DASH</span></button>
      <button id="btnShoot" class="ctrl-btn" aria-label="სროლა"><span class="btn-icon">🔫</span><span class="btn-subtext">FIRE</span></button>
      <button id="btnJump" class="ctrl-btn" aria-label="ხტომა"><span class="btn-icon">⤴</span><span class="btn-subtext">JUMP</span></button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- Audio System (Synthesized Retro/Horror SFX) ----------
let actx;
function ac(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } return actx; }

function beep(freq, dur, type='square', vol=0.05, delay=0, freqEnd=null){
  try{
    const a = ac();
    const t0 = a.currentTime + delay;
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(freqEnd !== null){
      osc.frequency.exponentialRampToValueAtTime(Math.max(10, freqEnd), t0 + dur);
    }
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(a.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }catch(e){}
}

function sfxJump(){ beep(420,0.12,'square',0.06,0,780); }
function sfxCoin(){ beep(880,0.08,'square',0.06,0,1320); }
function sfxBell(){ beep(660,0.1,'triangle',0.07); beep(990,0.15,'triangle',0.06,0.08); }
function sfxHurt(){ beep(220,0.25,'sawtooth',0.09,0,40); }
function sfxPrankGood(){ beep(300,0.06,'square',0.05); beep(200,0.06,'square',0.05,0.06); beep(500,0.12,'square',0.06,0.12); }
function sfxScare(){ 
  beep(140, 0.45, 'sawtooth', 0.15, 0, 40); 
  beep(80, 0.6, 'square', 0.12, 0.05, 30);
}
function sfxDemonic(){
  beep(90, 0.8, 'sawtooth', 0.18, 0, 30);
  beep(120, 0.7, 'square', 0.15, 0.08, 40);
  beep(60, 0.9, 'triangle', 0.2, 0.15, 20);
}
function sfxCodeZero(){
  [523, 659, 784, 1046, 1318].forEach((f,i)=>beep(f,0.12,'sine',0.08,i*0.06));
}
function sfxWin(){ [523,659,784,1046,1318,1568].forEach((f,i)=>beep(f,0.18,'triangle',0.07,i*0.1)); }
function sfxAchievement(){
  [600, 750, 900, 1150, 1400].forEach((f,i)=>beep(f,0.15,'triangle',0.08,i*0.07));
}
function sfxSlip(){ beep(450,0.35,'sine',0.06,0,120); }
function sfxShoot(){ 
  beep(320,0.05,'square',0.09,0,80); 
  beep(120,0.1,'sawtooth',0.08,0.02,30); 
}
function sfxZombieHit(){ beep(240,0.12,'sawtooth',0.08,0,80); }
function sfxFall(){ beep(600, 1.2, 'sawtooth', 0.08, 0, 40); }
function sfxBoxHit(){ beep(300,0.1,'square',0.08,0,600); }

// ---------- Background Music System (Procedural Web Audio Engine) ----------
let bgmMuted = false;
let bgmCurrentTrack = null; // 'menu' | 'action' | 'horror' | 'godzilla'
let bgmStep = 0;
let bgmMasterGain = null;
let bgmInterval = null;

function getBgmMasterGain(){
  const a = ac();
  if(!bgmMasterGain){
    bgmMasterGain = a.createGain();
    bgmMasterGain.gain.setValueAtTime(bgmMuted ? 0 : 0.22, a.currentTime);
    bgmMasterGain.connect(a.destination);
  }
  return bgmMasterGain;
}

function toggleBgmMute(){
  ac();
  if(actx && actx.state === 'suspended') actx.resume();
  bgmMuted = !bgmMuted;
  const a = ac();
  const g = getBgmMasterGain();
  g.gain.setValueAtTime(bgmMuted ? 0 : 0.22, a.currentTime);
  const btn = document.getElementById('btnMuteBgm');
  if(btn){
    btn.innerHTML = bgmMuted ? '🔇 Music: OFF' : '🎵 Music: ON';
    btn.style.borderColor = bgmMuted ? '#ff3d6e' : '#38c6ff';
  }
}

function startBgmEngine(){
  if(!bgmInterval){
    bgmInterval = setInterval(stepBgmSequence, 125);
  }
}

function playBgmNote(freq, dur, type='square', vol=0.08, attack=0.01, decay=0.1, detune=0, filterFreq=null){
  if(bgmMuted) return;
  try{
    const a = ac();
    if(a.state === 'suspended') return;
    const gMaster = getBgmMasterGain();
    const t0 = a.currentTime;
    const osc = a.createOscillator();
    const gain = a.createGain();
    
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(detune !== 0) osc.detune.setValueAtTime(detune, t0);

    const actualVol = (state && state.mode === 'paused') ? vol * 0.35 : vol;

    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(actualVol, t0 + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);

    if(filterFreq){
      const filter = a.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(filterFreq, t0);
      osc.connect(filter);
      filter.connect(gain);
    } else {
      osc.connect(gain);
    }

    gain.connect(gMaster);
    osc.start(t0);
    osc.stop(t0 + attack + decay + 0.05);
  } catch(e){}
}

function playBgmDrums(type='kick', vol=0.1){
  if(bgmMuted) return;
  try{
    const a = ac();
    if(a.state === 'suspended') return;
    const gMaster = getBgmMasterGain();
    const t0 = a.currentTime;
    const actualVol = (state && state.mode === 'paused') ? vol * 0.35 : vol;
    
    if(type === 'kick'){
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.frequency.setValueAtTime(160, t0);
      osc.frequency.exponentialRampToValueAtTime(30, t0 + 0.15);
      gain.gain.setValueAtTime(actualVol, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
      osc.connect(gain); gain.connect(gMaster);
      osc.start(t0); osc.stop(t0 + 0.16);
    } else if(type === 'godzilla_stomp'){
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, t0);
      osc.frequency.exponentialRampToValueAtTime(22, t0 + 0.35);
      
      const filter = a.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(350, t0);
      
      gain.gain.setValueAtTime(actualVol * 1.5, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.38);
      
      osc.connect(filter); filter.connect(gain); gain.connect(gMaster);
      osc.start(t0); osc.stop(t0 + 0.4);
    } else if(type === 'hihat'){
      const bufferSize = Math.floor(a.sampleRate * 0.04);
      const buffer = a.createBuffer(1, bufferSize, a.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const whiteNoise = a.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = a.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 5000;

      const gain = a.createGain();
      gain.gain.setValueAtTime(actualVol * 0.4, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.04);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(gMaster);
      whiteNoise.start(t0);
    }
  }catch(e){}
}

function stepBgmSequence(){
  if(bgmMuted || !bgmCurrentTrack) return;

  const s = bgmStep % 32;

  if(bgmCurrentTrack === 'menu'){
    // Menu Chiptune Theme
    const bassNotes = [130.81, 130.81, 164.81, 164.81, 174.61, 174.61, 196.00, 196.00];
    if(s % 4 === 0){
      playBgmNote(bassNotes[Math.floor(s/4) % bassNotes.length], 0.2, 'triangle', 0.1, 0.01, 0.18);
    }
    const arpNotes = [261.63, 329.63, 392.00, 523.25, 659.25, 523.25, 392.00, 329.63];
    if(s % 2 === 0){
      playBgmNote(arpNotes[(s/2)%arpNotes.length], 0.1, 'sine', 0.05, 0.01, 0.08);
    }
    if(s % 8 === 4) playBgmDrums('hihat', 0.06);

  } else if(bgmCurrentTrack === 'action'){
    // Energetic 8-Bit Platformer Action BGM
    const bassScale = [130.81, 130.81, 196.00, 130.81, 174.61, 174.61, 220.00, 196.00];
    if(s % 2 === 0){
      playBgmNote(bassScale[Math.floor(s/2) % bassScale.length], 0.12, 'square', 0.08, 0.005, 0.1);
    }
    const leadScale = [261.63, 329.63, 392.00, 466.16, 523.25, 466.16, 392.00, 329.63];
    if(s % 3 === 0){
      playBgmNote(leadScale[Math.floor(s/3) % leadScale.length], 0.1, 'triangle', 0.06, 0.01, 0.09);
    }
    if(s % 4 === 0) playBgmDrums('kick', 0.08);
    if(s % 2 === 1) playBgmDrums('hihat', 0.05);

  } else if(bgmCurrentTrack === 'horror'){
    // Eerie Ghostly Ambient Horror Track
    if(s === 0 || s === 16){
      playBgmNote(43.65, 0.8, 'sawtooth', 0.12, 0.08, 0.7, -12, 250); // Low F1 rumble
      playBgmDrums('kick', 0.12);
    }
    if(s === 8 || s === 24){
      playBgmNote(41.20, 0.8, 'sawtooth', 0.12, 0.08, 0.7, 12, 220); // Low E1 rumble
    }
    // Random eerie bell chime
    if(s === 4 || s === 12 || s === 20 || s === 28){
      const chimes = [739.99, 880.00, 1046.50, 1244.51, 1479.98];
      const bellFreq = chimes[Math.floor(s/4) % chimes.length];
      playBgmNote(bellFreq, 0.35, 'sine', 0.05, 0.01, 0.32);
    }

  } else if(bgmCurrentTrack === 'godzilla'){
    // Godzilla Apocalyptic Horror Boss Track
    if(s % 8 === 0){
      playBgmDrums('godzilla_stomp', 0.22);
      playBgmNote(32.70, 0.6, 'sawtooth', 0.18, 0.02, 0.5, 0, 180); // Low C1
      // Dissonant tritone brass hit
      playBgmNote(65.41, 0.4, 'sawtooth', 0.14, 0.01, 0.35, -15, 350); // C2
      playBgmNote(92.50, 0.4, 'sawtooth', 0.14, 0.01, 0.35, 15, 350);  // F#2
    }
    if(s % 2 === 0){
      // Fast pulsing menace bass
      const menaceNotes = [65.41, 65.41, 69.30, 65.41, 92.50, 87.31, 65.41, 69.30];
      playBgmNote(menaceNotes[Math.floor(s/2) % menaceNotes.length], 0.08, 'square', 0.1, 0.005, 0.07);
    }
    if(s === 4 || s === 12 || s === 20 || s === 28){
      // High laser/alarm siren sweep
      playBgmNote(987.77, 0.15, 'sawtooth', 0.06, 0.01, 0.12);
    }
    if(s % 4 === 2){
      playBgmDrums('hihat', 0.07);
    }
  }

  bgmStep++;
}

function updateBgmTrack(){
  startBgmEngine();
  if(actx && actx.state === 'suspended'){
    actx.resume();
  }

  let targetTrack = 'menu';

  if(!state || state.mode === 'menu'){
    targetTrack = 'menu';
  } else if(state.mode === 'playing' || state.mode === 'paused'){
    if(level && (level.isGodzillaLevel || (godzillaBoss && godzillaBoss.active))){
      targetTrack = 'godzilla';
    } else if(level && (level.name.includes('ჯამპსქეირ') || level.name.includes('დინოზავრ') || level.name.includes('საიდუმლო') || state.levelIndex === 17 || level.bgHue === 'pink')){
      targetTrack = 'horror';
    } else {
      targetTrack = 'action';
    }
  } else if(state.mode === 'gameover'){
    targetTrack = 'horror';
  } else if(state.mode === 'win'){
    targetTrack = 'menu';
  }

  if(targetTrack !== bgmCurrentTrack){
    bgmCurrentTrack = targetTrack;
    bgmStep = 0;
  }
}

// ---------- Input Listener ----------
const keys = {};
window.addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(player.isBitten && ['Space','ArrowUp','KeyW','KeyK','KeyF','KeyJ','KeyE','KeyA','KeyD'].includes(e.code)){
    boostBiteEscape();
  }
  if(e.code==='KeyP') togglePause();
  if(e.code==='KeyR') restartLevel();

function bindHold(id, downFn, upFn, options = {}){
  const el = document.getElementById(id);
  if(!el) return;

  let activeInterval = null;
  let isDown = false;

  const onDown = (ev) => {
    if(ev && ev.cancelable) ev.preventDefault();
    if(ev) ev.stopPropagation();
    if(isDown) return;
    isDown = true;
    el.classList.add('active');

    downFn();

    if(options.autoRepeat){
      if(activeInterval) clearInterval(activeInterval);
      activeInterval = setInterval(() => {
        if(isDown) downFn();
      }, options.repeatInterval || 160);
    }
  };

  const onUp = (ev) => {
    if(ev && ev.cancelable) ev.preventDefault();
    if(ev) ev.stopPropagation();
    if(!isDown) return;
    isDown = false;
    el.classList.remove('active');

    if(activeInterval){
      clearInterval(activeInterval);
      activeInterval = null;
    }

    if(upFn) upFn();
  };

  el.addEventListener('touchstart', onDown, { passive: false });
  el.addEventListener('touchend', onUp, { passive: false });
  el.addEventListener('touchcancel', onUp, { passive: false });

  el.addEventListener('mousedown', (e) => {
    if(e.button === 0) onDown(e);
  });
  el.addEventListener('mouseup', onUp);
  el.addEventListener('mouseleave', onUp);
}

function handleCanvasPointer(e){
  const rect = canvas.getBoundingClientRect();
  const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
  const clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
  const mx = (clientX - rect.left) * (W / rect.width);
  const my = (clientY - rect.top) * (H / rect.height);

  if(sponsorPopup.active){
    const bw = 160, bh = 36;
    const bx = sponsorPopup.x + sponsorPopup.w/2 - bw/2;
    const by = sponsorPopup.y + sponsorPopup.h - 50;
    if(mx >= bx && mx <= bx+bw && my >= by && my <= by+bh){
      closeSponsorPopup();
    }
    return;
  }

  if(state.mode === 'shop'){
    handleShopClick(mx, my);
  } else if(state.mode === 'levelselect'){
    handleLevelSelectClick(mx, my);
  } else if(state.mode === 'menu'){
    handleMenuClick(mx, my);
  } else if(state.mode === 'gameover' || state.mode === 'win'){
    startGame();
  }
}

let weather = {

  fogClouds: [],

function initWeather(){
  const types = ['clear', 'rain', 'fog', 'thunderstorm'];
  if(level && level.isGodzillaLevel){
    weather.type = Math.random() < 0.5 ? 'thunderstorm' : 'fog';
  } else {
    weather.type = types[Math.floor(Math.random() * types.length)];
  }

  weather.timer = 0;
  weather.nextChange = 15000 + Math.random() * 12000;
  weather.thunderTimer = 0;

  weather.drops = [];
  for(let i = 0; i < 180; i++){
    weather.drops.push({
      x: Math.random() * (W + 300) - 150,
      y: Math.random() * H,
      speed: 12 + Math.random() * 9,
      len: 14 + Math.random() * 12,
      alpha: 0.35 + Math.random() * 0.45
    });
  }

  weather.fogClouds = [];
  for(let i = 0; i < 12; i++){
    weather.fogClouds.push({
      x: Math.random() * 4000,
      y: 40 + Math.random() * (H - 120),
      r: 160 + Math.random() * 140,
      vx: (0.3 + Math.random() * 0.5) * (Math.random() < 0.5 ? 1 : -1),
      alpha: 0.25 + Math.random() * 0.25
    });
  }

  applyWeatherType(weather.type, true);
}

function applyWeatherType(newType, isInitial=false){
  weather.type = newType;
  if(newType === 'clear'){
    weather.targetFogAlpha = 0;
    weather.slipperyFactor = 1.0;
    if(!isInitial) toast("🌙 ⚠️ ამინდი: ცა გაწმენდილია!", 2500);
  } else if(newType === 'rain'){
    weather.targetFogAlpha = 0.22;
    weather.slipperyFactor = 0.88;
    if(!isInitial){
      sfxScare();
      toast("🌧️ ⚠️ ამინდი: წვიმა დაიწყო! [RAIN]", 2500);
    }
  } else if(newType === 'thunderstorm'){
    weather.targetFogAlpha = 0.45;
    weather.slipperyFactor = 0.78;
    sfxDemonic();
    shake(16);
    triggerFlash('255,255,255', 0.8);
    if(!isInitial) toast("⛈️ ⚠️ ამინდი: საშინელი შტორმი! [THUNDERSTORM - SLIPPERY GROUND]", 2800);
  } else if(newType === 'fog'){
    weather.targetFogAlpha = 0.75;
    weather.slipperyFactor = 1.0;
    sfxScare();
    shake(12);
    if(!isInitial) toast("🌫️ ⚠️ ამინდი: სქელი ჰორორ ნისლი! [DENSE FOG]", 2800);
  }
}

function updateWeather(dt){
  weather.timer += dt;

  if(weather.timer > weather.nextChange){
    weather.timer = 0;
    weather.nextChange = 16000 + Math.random() * 14000;
    const types = ['clear', 'rain', 'fog', 'thunderstorm'].filter(t => t !== weather.type);
    const nextType = types[Math.floor(Math.random() * types.length)];
    applyWeatherType(nextType);
  }

  weather.curFogAlpha += (weather.targetFogAlpha - weather.curFogAlpha) * 0.03;

  if(weather.type === 'rain' || weather.type === 'thunderstorm'){
    for(const d of weather.drops){
      d.y += d.speed;
      d.x += 2.2;
      if(d.y > H){
        d.y = -20;
        d.x = Math.random() * (W + 300) - 150;
      }
      if(Math.random() < 0.08){
        const groundY = GROUND_Y;
        if(Math.abs((d.y) - groundY) < 15){
          spawnParticles(d.x, groundY, '#38c6ff', 1, 0.4);
        }
      }
    }
  }

  for(const cloud of weather.fogClouds){
    cloud.x += cloud.vx;
    if(cloud.x < -300) cloud.x = 4000;
    if(cloud.x > 4000) cloud.x = -300;
  }

  if(weather.type === 'thunderstorm'){
    weather.thunderTimer += dt;
    if(weather.thunderTimer > 4000 + Math.random() * 4000){
      weather.thunderTimer = 0;
      sfxDemonic();
      shake(22);
      triggerFlash('255,255,255', 0.9);
      spawnParticles(player.x + (Math.random()-0.5)*400, 30, '#ffffff', 20, 2);
    }
  }
}

function drawWeatherWorld(){
  if(weather.curFogAlpha > 0.05){
    ctx.save();
    for(const cloud of weather.fogClouds){
      const cx = cloud.x - camX * 0.4;
      if(cx < -300 || cx > W + 300) continue;
      const grad = ctx.createRadialGradient(cx, cloud.y, 10, cx, cloud.y, cloud.r);
      grad.addColorStop(0, `rgba(180, 210, 240, ${cloud.alpha * weather.curFogAlpha * 0.8})`);
      grad.addColorStop(0.6, `rgba(100, 130, 160, ${cloud.alpha * weather.curFogAlpha * 0.4})`);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cloud.y, cloud.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  if((weather.type === 'rain' || weather.type === 'thunderstorm') && weather.drops){
    ctx.save();
    ctx.strokeStyle = weather.type === 'thunderstorm' ? 'rgba(200, 235, 255, 0.65)' : 'rgba(120, 200, 255, 0.45)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for(const d of weather.drops){
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - 4, d.y + d.len);
    }
    ctx.stroke();
    ctx.restore();
  }
}

function drawWeatherOverlay(){
  if(weather.curFogAlpha > 0.15){
    ctx.save();
    const px = player.x - camX + player.w/2;
    const py = player.y + player.h/2;
    const maxAlpha = Math.min(0.82, weather.curFogAlpha * 0.9);
    
    const spotlightRad = 190;
    const grad = ctx.createRadialGradient(px, py, 25, px, py, spotlightRad);
    grad.addColorStop(0, 'rgba(255, 240, 200, 0.05)');
    grad.addColorStop(0.4, `rgba(10, 15, 25, ${maxAlpha * 0.4})`);
    grad.addColorStop(1, `rgba(5, 8, 16, ${maxAlpha})`);

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    const beamAngle = player.facing === 1 ? 0 : Math.PI;
    const beamGrad = ctx.createRadialGradient(px, py, 10, px + player.facing * 160, py, 220);
    beamGrad.addColorStop(0, 'rgba(255, 235, 180, 0.18)');
    beamGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = beamGrad;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.arc(px, py, 260, beamAngle - 0.4, beamAngle + 0.4);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }
}

function drawWeatherHUD(){

  } else {
    // Standard zombie
    health = 3; speed = 1.6; color = '#4a8b4a'; size = 1;
  }
  
  zombies.push({
    x: x, y: y, w: 38 * size, h: 56 * size,
    vx: 0, vy: 0,
    health: health, maxHealth: health,
    animT: Math.random()*100,
    facing: 1, speed: speed, color: color, size: size,
    isBoss
  });
}

function boostBiteEscape(){
  if(!player.isBitten || player.dead) return;
  player.biteProgress += 20; // ~5 keypresses to fill 100%
  shake(10);
  sfxZombieHit();
  spawnParticles(player.x + player.w/2, player.y + 20, '#ffffff', 8, 1.2);
  spawnParticles(player.x + player.w/2, player.y + 20, '#ff3d6e', 12, 1.5);
  addFloatingText(player.x + (Math.random()-0.5)*20, player.y - 20, "🥊 " + Math.min(100, Math.floor(player.biteProgress)) + "%", '#ffd23f');

  if(player.biteProgress >= 100){
    player.isBitten = false;
    player.invuln = 70; // 1.2s safety invulnerability
    sfxWin();
    shake(25);
    triggerFlash('255, 215, 0', 0.7);

    if(player.bitingZombie){
      const z = player.bitingZombie;
      z.health -= 6;
      z.vx = player.facing * 16;
      z.vy = -10;
      spawnParticles(z.x + z.w/2, z.y + z.h/2, '#ff0033', 40, 2.5);
    }
    player.bitingZombie = null;
    toast("🦵 გეოდინომ თავი დაიხსნა და ზომბი მოიგერია! 💥", 2500);
  }
}

function shoot(){
  if(state.mode!=='playing' || player.dead || player.isFalling || sponsorPopup.active) return;
  if(player.isBitten){
    boostBiteEscape();
    return;
  }
  const gunX = player.x + player.w/2 + player.facing * 24;
  const gunY = player.y + player.h/2 - 2;

  const mode = player.weaponMode || 'pistol';

  if(mode === 'pistol'){
    player.gunRecoil = 8;
    bullets.push({
      x: gunX, y: gunY,
      vx: player.facing * 15, vy: (Math.random()-0.5)*0.4,
      life: 55, color: '#ffd23f', size: 6, damage: 1
    });
    sfxShoot();
    shake(3);
    spawnParticles(gunX, gunY, '#ffd23f', 5);
    spawnShellCasing(gunX, gunY, player.facing);
  } else if(mode === 'triple'){
    player.gunRecoil = 10;
    bullets.push({ x: gunX, y: gunY, vx: player.facing * 14, vy: 0, life: 55, color: '#ffd23f', size: 6, damage: 1 });
    bullets.push({ x: gunX, y: gunY, vx: player.facing * 13, vy: -2.5, life: 55, color: '#ff3d6e', size: 6, damage: 1 });
    bullets.push({ x: gunX, y: gunY, vx: player.facing * 13, vy: 2.5, life: 55, color: '#38c6ff', size: 6, damage: 1 });
    sfxShoot();
    shake(5);
    spawnParticles(gunX, gunY, '#ff3d6e', 8);
    spawnShellCasing(gunX, gunY, player.facing);
  } else if(mode === 'shotgun'){
    player.gunRecoil = 16;
    for(let angle = -3; angle <= 3; angle += 1.5){
      bullets.push({
        x: gunX, y: gunY,
        vx: player.facing * (12 + Math.random()*3), vy: angle * 1.2,
        life: 38, color: '#ff7700', size: 7, damage: 2
      });
    }
    sfxShoot();
    shake(12);
    spawnParticles(gunX, gunY, '#ff7700', 14, 1.4);
    spawnParticles(gunX, gunY, '#888888', 8, 1);
    for(let i=0; i<3; i++) spawnShellCasing(gunX, gunY, player.facing);
  } else if(mode === 'minigun'){
    player.gunRecoil = 6;
    bullets.push({
      x: gunX, y: gunY + (Math.random()-0.5)*6,
      vx: player.facing * 18, vy: (Math.random()-0.5)*1.2,
      life: 50, color: '#38c6ff', size: 5, damage: 1
    });
    sfxShoot();
    shake(3);
    spawnParticles(gunX, gunY, '#38c6ff', 4);
    spawnShellCasing(gunX, gunY, player.facing);
  } else if(mode === 'plasma'){
    player.gunRecoil = 18;
    bullets.push({
      x: gunX, y: gunY,
      vx: player.facing * 10, vy: 0,
      life: 70, color: '#00ffcc', size: 14, damage: 5, isPlasma: true
    });
    sfxDemonic();
    shake(14);
    spawnParticles(gunX, gunY, '#00ffcc', 20, 1.8);
  } else if(mode === 'flamethrower'){
    player.gunRecoil = 5;
    for(let i=0; i<3; i++){
      bullets.push({
        x: gunX, y: gunY + (Math.random()-0.5)*8,
        vx: player.facing * (11 + Math.random()*5), vy: (Math.random()-0.5)*2,
        life: 28, color: Math.random()<0.5?'#ff5500':'#ffcc00', size: 8, damage: 1, isFlame: true
      });
    }
    sfxShoot();
    shake(3);
    spawnParticles(gunX, gunY, '#ff5500', 6, 1.2);
  } else if(mode === 'tank'){
    player.gunRecoil = 22;
    bullets.push({
      x: gunX, y: gunY - 8,
      vx: player.facing * 22, vy: -1.2,
      life: 80, color: '#ffaa00', size: 12, damage: 8, isTankShell: true
    });
    sfxDemonic();
    shake(20);
    spawnParticles(gunX, gunY, '#ffaa00', 25, 2);
    spawnParticles(gunX, gunY, '#555555', 15, 1.2);
    for(let i=0; i<4; i++) spawnShellCasing(gunX, gunY, player.facing);
  }
}

function updateBullets(){
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life--;
    
    // Trail particles for plasma orb, flamethrower and tank shell
    if(b.isPlasma && Math.random() < 0.6){
      spawnParticles(b.x, b.y, '#00ffcc', 3, 0.5);
    }
    if(b.isFlame && Math.random() < 0.6){
      spawnParticles(b.x, b.y, '#ffaa00', 2, 0.4);
    }
    if(b.isTankShell && Math.random() < 0.8){
      spawnParticles(b.x, b.y, '#ff6600', 3, 0.6);
      spawnParticles(b.x, b.y, '#333333', 2, 0.4);
    }

    let hit = false;

    // Collision with Godzilla
    if(godzillaBoss.active){
      const gBox = { x: godzillaBoss.x, y: godzillaBoss.y, w: godzillaBoss.w, h: godzillaBoss.h };
      const bulletBox = { x: b.x - b.size, y: b.y - b.size, w: b.size*2, h: b.size*2 };
      if(overlap(bulletBox, gBox)){
        godzillaBoss.hp -= (b.damage || 1);
        spawnParticles(b.x, b.y, b.color || '#ff0055', b.isTankShell ? 35 : 12);
        sfxZombieHit();
        shake(b.isTankShell ? 20 : 6);
        addFloatingText(godzillaBoss.x + 60, godzillaBoss.y - 20, "-" + (b.damage||1) + " HP! 💥", '#ff3d6e');
        
        if(b.isTankShell){
          sfxDemonic();
          spawnParticles(b.x, b.y, '#ff4400', 30, 2.5);
        }
        hit = true;
      }
    }

    if(!hit){
      for(const z of zombies){
        const bulletBox = { x: b.x - b.size, y: b.y - b.size, w: b.size*2, h: b.size*2 };
        if(overlap(bulletBox, z)){
          z.health -= (b.damage || 1);
          spawnParticles(b.x, b.y, b.color || '#ffd23f', b.isPlasma ? 25 : 10);
          sfxZombieHit();
          
          if(b.isPlasma || b.isTankShell){
            shake(14);
            sfxFall();
            // Area explosion damage to nearby zombies
            for(const otherZ of zombies){
              const dx = otherZ.x - b.x, dy = otherZ.y - b.y;
              if(Math.sqrt(dx*dx + dy*dy) < 160){
                otherZ.health -= 4;
              }
            }
          }
          hit = true;
          break;
        }
      }
    }
    
    if(hit || b.life <= 0){
      bullets.splice(i, 1);
    }
  }
}

function updateZombies(dt){
  for(let i = zombies.length - 1; i >= 0; i--){
    const z = zombies[i];
    z.animT += dt;
    
    let onPlatform = false;
    let platformBelow = null;
    
    for(const p of level.plats){
      if(overlap(z, p)){
        const prevBottom = z.y - (z.vy || 0) + z.h;
        if((z.vy || 0) >= 0 && prevBottom <= p.y + 4){
          z.y = p.y - z.h;
          z.vy = 0;
          onPlatform = true;
          platformBelow = p;
        }
      }
    }
    
    const dx = player.x - z.x;
    const dy = player.y - z.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if(onPlatform && dist < 650 && dist > 20){
      const moveDir = dx > 0 ? 1 : -1;
      const nextX = z.x + moveDir * 24;
      let wouldFall = true;
      
      if(platformBelow){
        if(nextX >= platformBelow.x - 10 && nextX + z.w <= platformBelow.x + platformBelow.w + 10){
          wouldFall = false;
        }
      }
      
      if(!wouldFall || z.isBoss){
        z.vx = (dx / dist) * z.speed;
        z.facing = dx > 0 ? 1 : -1;
      } else {
        z.vx *= 0.8;
      }
    } else {
      z.vx *= 0.88;
    }
    
    z.x += z.vx;
    z.vy = (z.vy || 0) + GRAVITY;
    if(z.vy > 18) z.vy = 18;
    z.y += z.vy;
    
    if(z.y > H + 300){
      zombies.splice(i, 1);
      continue;
    }
    
    if(overlap(player, z) && player.invuln <= 0 && !player.dead && !player.isFalling){
      const isStepping = player.vy > 0 && (player.y + player.h - player.vy) <= (z.y + 16);
      if(isStepping){
        // Stepping / landing on zombie head bounces player off WITHOUT killing the zombie!
        player.vy = -11;
        player.onGround = false;
        sfxJump();
        shake(8);
        spawnParticles(player.x + player.w/2, z.y, '#38c6ff', 10, 1.2);
        spawnParticles(z.x + z.w/2, z.y, '#55aa33', 10, 1.5);
        addFloatingText(z.x, z.y - 15, "👟 ბაუნსი! (Zombie alive!)", '#ffd23f');
      } else if(!player.isBitten){
        player.isBitten = true;
        player.bitePhase = 'hand';
        player.biteProgress = 0;
        player.biteTimer = 0;
        player.bitingZombie = z;
        sfxHurt();
        sfxScare();
        shake(18);
        triggerFlash('255,0,0', 0.5);
        spawnParticles(player.x + player.w/2, player.y + 15, '#ff0033', 25, 1.8);
        toast("⚠️ 🧟‍♂️ ზომბი დაგეცა! დააჭირე SPACE / F / K-ს სწრაფად გასათავისუფლებლად!", 2500);
      }
    }
    
    if(z.health <= 0){
      spawnParticles(z.x + z.w/2, z.y + z.h/2, z.color, 20, 1.5);
      spawnParticles(z.x + z.w/2, z.y + z.h/2, '#ff0033', 15, 2);
      shake(10);
      zombies.splice(i, 1);
      const points = z.maxHealth * 25;
      state.score += points;
      sfxZombieHit();
      addFloatingText(z.x, z.y - 10, "+" + points + " 💀", '#ff3d6e');
      toast(z.isBoss ? "🔥 გიგანტური ბოსი განადგურდა! +" + points : "ზომბი განადგურდა! +" + points, 1000);
    }
  }
}

function updateGodzilla(dt){
  if(!godzillaBoss.active) return;
  const g = godzillaBoss;
  g.animT += dt;

  // Rage Mode Trigger when HP drops below 250
  if(g.hp <= 250 && !g.isRaging){
    g.isRaging = true;
    g.vx = 3.2;
    shake(30);
    sfxDemonic();
    triggerFlash('255,0,0', 0.8);
    toast("🔥 ⚠️ გოდზილა განრისხდა! RAGE MODE ACTIVATED! ⚠️ 🔥", 2500);
  }

  // Godzilla marches down the city street chasing the tank
  g.x += g.vx * g.facing;
  if(g.x < 1200) { g.facing = 1; }
  if(g.x > level.width - 1500) { g.facing = -1; }

  // Stomp screen shake & Shockwave Attack
  g.stompTimer += dt;
  const stompInterval = g.isRaging ? 800 : 1200;
  if(g.stompTimer > stompInterval){
    g.stompTimer = 0;
    shake(g.isRaging ? 20 : 15);
    sfxDemonic();
    spawnParticles(g.x + g.w/2, g.y + g.h, '#ff3d6e', 22, 1.8);

    // Launch ground shockwave toward player
    godzillaProjectiles.push({
      type: 'shockwave',
      x: g.x + (g.facing === -1 ? -20 : g.w + 20),
      y: GROUND_Y - 26,
      vx: g.facing * (g.isRaging ? 9 : 7),
      vy: 0,
      w: 36, h: 26,
      life: 180,
      color: '#00f0ff'
    });
  }

  // Radioactive Fireball Volley Attack
  g.fireballTimer += dt;
  const fireballInterval = g.isRaging ? 1800 : 2800;
  if(g.fireballTimer > fireballInterval){
    g.fireballTimer = 0;
    sfxDemonic();
    shake(12);
    // Launch 3 radioactive fireballs towards player
    for(let i = 0; i < 3; i++){
      const dx = (player.x - g.x);
      const dir = dx > 0 ? 1 : -1;
      godzillaProjectiles.push({
        type: 'fireball',
        x: g.x + g.w/2,
        y: g.y + 40,
        vx: dir * (5 + i*1.5) + (Math.random()*2 - 1),
        vy: -5 - i*1.2,
        size: 16 + i*2,
        life: 200,
        color: '#ff2200'
      });
    }
  }

  // Atomic Beam attack
  g.beamTimer += dt;
  const beamInterval = g.isRaging ? 2200 : 3600;
  if(g.beamTimer > beamInterval){
    g.beamTimer = 0;
    g.isBeaming = true;
    g.beamDuration = g.isRaging ? 1400 : 1100;
    sfxDemonic();
    shake(28);
    triggerFlash('0,180,255', 0.8);
    toast("⚡ ⚠️ გოდზილას ატომური ლაზერი! ⚠️ ⚡", 1500);
  }

  if(g.isBeaming){
    g.beamDuration -= dt;
    if(g.beamDuration <= 0) g.isBeaming = false;

    // Beam hitbox against player
    const beamBox = {
      x: g.facing === -1 ? g.x - 1400 : g.x + g.w,
      y: g.y + 45,
      w: 1400,
      h: 65
    };
    if(overlap(player, beamBox) && player.invuln <= 0 && !player.dead){
      hurtPlayer("💥 გოდზილას ატომურმა ლაზერმა დაგწვა! 💥", "godzilla");
    }
  }

  // Update Godzilla's extra projectiles (fireballs & shockwaves)
  for(let i = godzillaProjectiles.length - 1; i >= 0; i--){
    const p = godzillaProjectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    if(p.type === 'fireball'){
      p.vy += 0.18; // gravity on fireball arc
      if(p.y >= GROUND_Y - 20) p.vy = -p.vy * 0.4;
      spawnParticles(p.x, p.y, '#ff4400', 2, 0.5);
    } else if(p.type === 'shockwave'){
      spawnParticles(p.x, p.y + p.h/2, '#00e5ff', 3, 0.4);
    }

    // Check hit on player
    const pBox = p.type === 'shockwave' ? 
      { x: p.x, y: p.y, w: p.w, h: p.h } : 
      { x: p.x - p.size, y: p.y - p.size, w: p.size*2, h: p.size*2 };

    if(overlap(player, pBox) && player.invuln <= 0 && !player.dead){
      hurtPlayer(p.type==='shockwave' ? "⚡ გოდზილას დარტყმითმა ტალღამ გადაგატრიალა! ⚡" : "🔥 გოდზილას რადიოაქტიურმა ცეცხლმა დაგაზიანა! 🔥", "godzilla");
      godzillaProjectiles.splice(i, 1);
      continue;
    }

    if(p.life <= 0){
      godzillaProjectiles.splice(i, 1);
    }
  }

  // Stomp / Body collision with player
  if(overlap(player, g) && player.invuln <= 0 && !player.dead){
    hurtPlayer("🦖 გოდზილამ გაგჭყლიტა! 🦖", "godzilla");
  }

  // Destroy city buildings in path
  for(const b of cityBuildings){
    if(!b.destroyed && (g.x + g.w > b.x && g.x < b.x + b.w)){
      b.destroyed = true;
      shake(24);
      sfxDemonic();
      spawnParticles(b.x + b.w/2, b.y + b.h/2, '#ff4400', 35, 2);
      spawnParticles(b.x + b.w/2, b.y + b.h/2, '#777777', 30, 1.5);
      addFloatingText(b.x + 30, b.y - 20, "🏢 შენობა დაინგრა! 💥", '#ffaa00');
    }
  }

  // Defeat condition
  if(g.hp <= 0){
    g.active = false;
    godzillaProjectiles = [];
    shake(40);
    triggerFlash('255,215,0', 1.0);
    sfxWin();
    spawnParticles(g.x + g.w/2, g.y + g.h/2, '#ffd23f', 80, 4);
    spawnParticles(g.x + g.w/2, g.y + g.h/2, '#ff3d6e', 80, 4);
    toast("🏆 გოდზილა დამარცხდა! შენ გადაარჩინე ქალაქი! 🏆", 3500);
    state.score += 10000;
    setTimeout(() => {
      levelClear();
    }, 2500);
  }
}

function updateParticles(){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.25;
    p.life--;
    p.size *= 0.96;
    if(p.life <= 0 || p.size < 0.4){
      particles.splice(i, 1);
    }
  }

  for(let i = shellCasings.length - 1; i >= 0; i--){
    const sc = shellCasings[i];
    sc.x += sc.vx; sc.y += sc.vy;
    sc.vy += 0.4;
    sc.rot += sc.vRot;
    sc.life--;
    if(sc.life <= 0) shellCasings.splice(i, 1);
  }

  for(let i = floatingTexts.length - 1; i >= 0; i--){
    const ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.life--;
    if(ft.life <= 0) floatingTexts.splice(i, 1);
  }
}
