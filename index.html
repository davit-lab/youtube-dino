<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>გეოდინო: ხულიგანური პარკური & Horror Edition</title>
<style>
  :root{
    --ink:#0b0e14;
    --panel:#141826;
    --blue:#38c6ff;
    --blue-dark:#1a6fa8;
    --pink:#ff3d6e;
    --pink-dark:#c21f4a;
    --yellow:#ffd23f;
    --cream:#f4ecd8;
    --green:#3fe07d;
  }
  *{box-sizing:border-box; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background: radial-gradient(ellipse at 50% 0%, #1c2438 0%, #06080d 80%);
    font-family: 'Trebuchet MS', 'BPG Nino Mtavruli', 'Segoe UI', sans-serif;
    color: var(--cream);
  }
  #wrap{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  canvas{
    background:#080b10;
    image-rendering: pixelated;
    border: 3px solid var(--blue-dark);
    border-radius: 8px;
    max-width: 98vw;
    max-height: 94vh;
  }
  #hint{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    font-size:12px; opacity:.75; letter-spacing:.5px; text-align:center;
    pointer-events:none; text-shadow:0 1px 3px #000;
  }
  #topBarControls{
    position:absolute; top:12px; right:18px;
    display:flex; gap:10px; z-index:10;
  }
  .btn-ui{
    background:rgba(20,24,38,0.85); border:1.5px solid var(--blue);
    color:var(--cream); padding:6px 14px; border-radius:6px;
    font-size:13px; font-weight:bold; cursor:pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    transition: all 0.2s ease;
  }
  .btn-ui:hover{
    background:var(--blue); color:#000; transform:scale(1.05);
  }
  .btn-ui.skip{
    border-color:var(--yellow); color:var(--yellow);
  }
  .btn-ui.skip:hover{
    background:var(--yellow); color:#000;
  }

  /* Promo Modal Overlay Styles */
  #promoModal {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 380px; max-width: 92vw;
    background: rgba(10, 16, 30, 0.96);
    border: 3px solid var(--yellow);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 0 35px rgba(255, 210, 63, 0.6), 0 10px 50px rgba(0,0,0,0.95);
    color: #fff;
    text-align: center;
    z-index: 250;
    display: none;
    flex-direction: column;
    gap: 14px;
    font-family: sans-serif;
    backdrop-filter: blur(8px);
  }
  #promoModal h2 {
    margin: 0; font-size: 22px; color: var(--yellow); text-shadow: 0 0 12px rgba(255, 210, 63, 0.7);
  }
  #promoInput {
    width: 100%; padding: 12px; font-size: 18px; font-weight: bold; text-align: center;
    border-radius: 10px; border: 2.5px solid var(--blue); background: #070c18; color: #fff;
    outline: none; box-sizing: border-box; text-transform: uppercase; letter-spacing: 1.5px;
  }
  #promoInput:focus {
    border-color: var(--yellow); box-shadow: 0 0 14px rgba(255, 210, 63, 0.6);
  }
  .promo-btn-group {
    display: flex; gap: 10px; justify-content: center; margin-top: 4px;
  }
  .btn-promo-submit {
    flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px;
    border: none; background: var(--yellow); color: #000; cursor: pointer;
    box-shadow: 0 4px 14px rgba(255, 210, 63, 0.5); transition: transform 0.1s;
  }
  .btn-promo-submit:active { transform: scale(0.95); }
  .btn-promo-close {
    padding: 12px 18px; font-size: 15px; font-weight: bold; border-radius: 8px;
    border: 2px solid #555; background: rgba(255,255,255,0.05); color: #ccc; cursor: pointer;
  }
  .btn-promo-close:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .promo-quick-btn {
    background: rgba(56, 198, 255, 0.15); border: 1.5px dashed var(--blue); color: var(--blue);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer;
    transition: all 0.15s ease;
  }
  .promo-quick-btn:hover { background: var(--blue); color: #000; }
  #mobileControls{
    position:absolute; bottom:18px; left:0; right:0;
    display:none; justify-content:space-between; align-items:flex-end;
    padding:0 22px; pointer-events:none;
    z-index:100;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  #mobileControls .ctrl-btn{
    pointer-events:auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:66px; height:66px; border-radius:50%;
    border:2.5px solid var(--blue); background:rgba(12, 16, 28, 0.9);
    color:var(--cream); font-size:22px; font-weight:bold;
    box-shadow: 0 4px 14px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,255,255,0.2);
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s ease, background-color 0.08s ease, box-shadow 0.08s ease;
  }
  #mobileControls .ctrl-btn:active,
  #mobileControls .ctrl-btn.active{
    transform: scale(0.92);
    background: rgba(56, 198, 255, 0.35);
    box-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 16px rgba(56, 198, 255, 0.6);
  }
  #mobileControls .left{
    display:flex; gap:12px; align-items:center;
  }
  #mobileControls .right{
    display:flex; gap:16px; align-items:flex-end;
  }
  /* Stagger Jump and Shoot to prevent accidental misclicks */
  #mobileControls #btnJump {
    width: 74px; height: 74px;
    border-color: var(--pink); color: #fff;
    background: rgba(255, 61, 110, 0.28);
    transform: translateY(-10px);
  }
  #mobileControls #btnJump:active,
  #mobileControls #btnJump.active {
    background: var(--pink); color: #fff;
    transform: translateY(-10px) scale(0.92);
    box-shadow: 0 0 22px rgba(255, 61, 110, 0.9);
  }
  #mobileControls #btnShoot {
    width: 68px; height: 68px;
    border-color: var(--yellow); color: var(--yellow);
    background: rgba(255, 210, 63, 0.22);
  }
  #mobileControls #btnShoot:active,
  #mobileControls #btnShoot.active {
    background: var(--yellow); color: #000;
    transform: scale(0.92);
    box-shadow: 0 0 22px rgba(255, 210, 63, 0.9);
  }
  .btn-icon {
    font-size: 22px;
    line-height: 1;
  }
  .btn-subtext {
    font-size: 9px;
    letter-spacing: 0.5px;
    margin-top: 1px;
    font-weight: 800;
    text-transform: uppercase;
    opacity: 0.9;
  }
  @media (max-width:860px){
    #mobileControls{display:flex;}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="topBarControls">
    <button class="btn-ui" onclick="openLevelSelect()" title="დონეების არჩევა">🗺️ Levels</button>
    <button class="btn-ui" onclick="openShop()" title="მაღაზია">🛍️ Shop</button>
    <button class="btn-ui" onclick="openPromoModal()" title="პრომოკოდის შეყვანა" style="border-color:var(--yellow); color:var(--yellow);">🎟️ Promo</button>
    <button class="btn-ui" id="btnMuteBgm" onclick="toggleBgmMute()" title="მუსიკის ჩართვა/გამორთვა">🎵 Music: ON</button>
    <button class="btn-ui" onclick="togglePause()" title="პაუზა (P)">⏸️ Pause (P)</button>
  </div>

  <canvas id="game" width="960" height="540"></canvas>

  <div id="promoModal">
    <div style="font-size: 32px; margin-bottom: -4px;">🎟️</div>
    <h2>პრომოკოდის შეყვანა</h2>
    <p style="margin: 0; font-size: 13px; color: #a0aec0; line-height: 1.4;">
      შეიყვანეთ საიდუმლო პრომოკოდი მონეტების მისაღებად!
    </p>
    <input id="promoInput" type="text" placeholder="შეიყვანეთ კოდი..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter') submitPromoCode()" />
    <div class="promo-btn-group">
      <button class="btn-promo-submit" onclick="submitPromoCode()">🚀 გააქტ���ურება</button>
      <button class="btn-promo-close" onclick="closePromoModal()">✖ დახურვა</button>
    </div>
  </div>
  
  <div id="mobileControls">
    <div class="left">
      <button id="btnLeft" class="ctrl-btn" aria-label="გადაადგილება მარცხნივ"><span class="btn-icon">◀</span></button>
      <button id="btnRight" class="ctrl-btn" aria-label="გადაადგილება მარჯვნივ"><span class="btn-icon">▶</span></button>
    </div>
    <div class="right">
      <button id="btnDash" class="ctrl-btn" aria-label="დეში" style="border-color:var(--blue); background:rgba(56,198,255,0.22);"><span class="btn-icon">⚡</span><span class="btn-subtext">DASH</span></button>
      <button id="btnShoot" class="ctrl-btn" aria-label="სროლა"><span class="btn-icon">🔫</span><span class="btn-subtext">FIRE</span></button>
      <button id="btnJump" class="ctrl-btn" aria-label="ხტომა"><span class="btn-icon">⤴</span><span class="btn-subtext">JUMP</span></button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- Audio System (Synthesized Retro/Horror SFX) ----------
let actx;
function ac(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } return actx; }

function beep(freq, dur, type='square', vol=0.05, delay=0, freqEnd=null){
  try{
    const a = ac();
    const t0 = a.currentTime + delay;
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(freqEnd !== null){
      osc.frequency.exponentialRampToValueAtTime(Math.max(10, freqEnd), t0 + dur);
    }
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(a.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }catch(e){}
}

function sfxJump(){ beep(420,0.12,'square',0.06,0,780); }
function sfxCoin(){ beep(880,0.08,'square',0.06,0,1320); }
function sfxBell(){ beep(660,0.1,'triangle',0.07); beep(990,0.15,'triangle',0.06,0.08); }
function sfxHurt(){ beep(220,0.25,'sawtooth',0.09,0,40); }
function sfxPrankGood(){ beep(300,0.06,'square',0.05); beep(200,0.06,'square',0.05,0.06); beep(500,0.12,'square',0.06,0.12); }
function sfxScare(){ 
  beep(140, 0.45, 'sawtooth', 0.15, 0, 40); 
  beep(80, 0.6, 'square', 0.12, 0.05, 30);
}
function sfxDemonic(){
  beep(90, 0.8, 'sawtooth', 0.18, 0, 30);
  beep(120, 0.7, 'square', 0.15, 0.08, 40);
  beep(60, 0.9, 'triangle', 0.2, 0.15, 20);
}
function sfxCodeZero(){
  [523, 659, 784, 1046, 1318].forEach((f,i)=>beep(f,0.12,'sine',0.08,i*0.06));
}
function sfxWin(){ [523,659,784,1046,1318,1568].forEach((f,i)=>beep(f,0.18,'triangle',0.07,i*0.1)); }
function sfxAchievement(){
  [600, 750, 900, 1150, 1400].forEach((f,i)=>beep(f,0.15,'triangle',0.08,i*0.07));
}
function sfxSlip(){ beep(450,0.35,'sine',0.06,0,120); }
function sfxShoot(){ 
  beep(320,0.05,'square',0.09,0,80); 
  beep(120,0.1,'sawtooth',0.08,0.02,30); 
}
function sfxZombieHit(){ beep(240,0.12,'sawtooth',0.08,0,80); }
function sfxFall(){ beep(600, 1.2, 'sawtooth', 0.08, 0, 40); }
function sfxBoxHit(){ beep(300,0.1,'square',0.08,0,600); }

// ---------- Background Music System (Procedural Web Audio Engine) ----------
let bgmMuted = false;
let bgmCurrentTrack = null; // 'menu' | 'action' | 'horror' | 'godzilla'
let bgmStep = 0;
let bgmMasterGain = null;
let bgmInterval = null;

function getBgmMasterGain(){
  const a = ac();
  if(!bgmMasterGain){
    bgmMasterGain = a.createGain();
    bgmMasterGain.gain.setValueAtTime(bgmMuted ? 0 : 0.22, a.currentTime);
    bgmMasterGain.connect(a.destination);
  }
  return bgmMasterGain;
}

function toggleBgmMute(){
  ac();
  if(actx && actx.state === 'suspended') actx.resume();
  bgmMuted = !bgmMuted;
  const a = ac();
  const g = getBgmMasterGain();
  g.gain.setValueAtTime(bgmMuted ? 0 : 0.22, a.currentTime);
  const btn = document.getElementById('btnMuteBgm');
  if(btn){
    btn.innerHTML = bgmMuted ? '🔇 Music: OFF' : '🎵 Music: ON';
    btn.style.borderColor = bgmMuted ? '#ff3d6e' : '#38c6ff';
  }
}

function startBgmEngine(){
  if(!bgmInterval){
    bgmInterval = setInterval(stepBgmSequence, 125);
  }
}

function playBgmNote(freq, dur, type='square', vol=0.08, attack=0.01, decay=0.1, detune=0, filterFreq=null){
  if(bgmMuted) return;
  try{
    const a = ac();
    if(a.state === 'suspended') return;
    const gMaster = getBgmMasterGain();
    const t0 = a.currentTime;
    const osc = a.createOscillator();
    const gain = a.createGain();
    
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(detune !== 0) osc.detune.setValueAtTime(detune, t0);

    const actualVol = (state && state.mode === 'paused') ? vol * 0.35 : vol;

    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(actualVol, t0 + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);

    if(filterFreq){
      const filter = a.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(filterFreq, t0);
      osc.connect(filter);
      filter.connect(gain);
    } else {
      osc.connect(gain);
    }

    gain.connect(gMaster);
    osc.start(t0);
    osc.stop(t0 + attack + decay + 0.05);
  } catch(e){}
}

function playBgmDrums(type='kick', vol=0.1){
  if(bgmMuted) return;
  try{
    const a = ac();
    if(a.state === 'suspended') return;
    const gMaster = getBgmMasterGain();
    const t0 = a.currentTime;
    const actualVol = (state && state.mode === 'paused') ? vol * 0.35 : vol;
    
    if(type === 'kick'){
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.frequency.setValueAtTime(160, t0);
      osc.frequency.exponentialRampToValueAtTime(30, t0 + 0.15);
      gain.gain.setValueAtTime(actualVol, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
      osc.connect(gain); gain.connect(gMaster);
      osc.start(t0); osc.stop(t0 + 0.16);
    } else if(type === 'godzilla_stomp'){
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, t0);
      osc.frequency.exponentialRampToValueAtTime(22, t0 + 0.35);
      
      const filter = a.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(350, t0);
      
      gain.gain.setValueAtTime(actualVol * 1.5, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.38);
      
      osc.connect(filter); filter.connect(gain); gain.connect(gMaster);
      osc.start(t0); osc.stop(t0 + 0.4);
    } else if(type === 'hihat'){
      const bufferSize = Math.floor(a.sampleRate * 0.04);
      const buffer = a.createBuffer(1, bufferSize, a.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const whiteNoise = a.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = a.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 5000;

      const gain = a.createGain();
      gain.gain.setValueAtTime(actualVol * 0.4, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.04);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(gMaster);
      whiteNoise.start(t0);
    }
  }catch(e){}
}

function stepBgmSequence(){
  if(bgmMuted || !bgmCurrentTrack) return;

  const s = bgmStep % 32;

  if(bgmCurrentTrack === 'menu'){
    // Menu Chiptune Theme
    const bassNotes = [130.81, 130.81, 164.81, 164.81, 174.61, 174.61, 196.00, 196.00];
    if(s % 4 === 0){
      playBgmNote(bassNotes[Math.floor(s/4) % bassNotes.length], 0.2, 'triangle', 0.1, 0.01, 0.18);
    }
    const arpNotes = [261.63, 329.63, 392.00, 523.25, 659.25, 523.25, 392.00, 329.63];
    if(s % 2 === 0){
      playBgmNote(arpNotes[(s/2)%arpNotes.length], 0.1, 'sine', 0.05, 0.01, 0.08);
    }
    if(s % 8 === 4) playBgmDrums('hihat', 0.06);

  } else if(bgmCurrentTrack === 'action'){
    // Energetic 8-Bit Platformer Action BGM
    const bassScale = [130.81, 130.81, 196.00, 130.81, 174.61, 174.61, 220.00, 196.00];
    if(s % 2 === 0){
      playBgmNote(bassScale[Math.floor(s/2) % bassScale.length], 0.12, 'square', 0.08, 0.005, 0.1);
    }
    const leadScale = [261.63, 329.63, 392.00, 466.16, 523.25, 466.16, 392.00, 329.63];
    if(s % 3 === 0){
      playBgmNote(leadScale[Math.floor(s/3) % leadScale.length], 0.1, 'triangle', 0.06, 0.01, 0.09);
    }
    if(s % 4 === 0) playBgmDrums('kick', 0.08);
    if(s % 2 === 1) playBgmDrums('hihat', 0.05);

  } else if(bgmCurrentTrack === 'horror'){
    // Eerie Ghostly Ambient Horror Track
    if(s === 0 || s === 16){
      playBgmNote(43.65, 0.8, 'sawtooth', 0.12, 0.08, 0.7, -12, 250); // Low F1 rumble
      playBgmDrums('kick', 0.12);
    }
    if(s === 8 || s === 24){
      playBgmNote(41.20, 0.8, 'sawtooth', 0.12, 0.08, 0.7, 12, 220); // Low E1 rumble
    }
    // Random eerie bell chime
    if(s === 4 || s === 12 || s === 20 || s === 28){
      const chimes = [739.99, 880.00, 1046.50, 1244.51, 1479.98];
      const bellFreq = chimes[Math.floor(s/4) % chimes.length];
      playBgmNote(bellFreq, 0.35, 'sine', 0.05, 0.01, 0.32);
    }

  } else if(bgmCurrentTrack === 'godzilla'){
    // Godzilla Apocalyptic Horror Boss Track
    if(s % 8 === 0){
      playBgmDrums('godzilla_stomp', 0.22);
      playBgmNote(32.70, 0.6, 'sawtooth', 0.18, 0.02, 0.5, 0, 180); // Low C1
      // Dissonant tritone brass hit
      playBgmNote(65.41, 0.4, 'sawtooth', 0.14, 0.01, 0.35, -15, 350); // C2
      playBgmNote(92.50, 0.4, 'sawtooth', 0.14, 0.01, 0.35, 15, 350);  // F#2
    }
    if(s % 2 === 0){
      // Fast pulsing menace bass
      const menaceNotes = [65.41, 65.41, 69.30, 65.41, 92.50, 87.31, 65.41, 69.30];
      playBgmNote(menaceNotes[Math.floor(s/2) % menaceNotes.length], 0.08, 'square', 0.1, 0.005, 0.07);
    }
    if(s === 4 || s === 12 || s === 20 || s === 28){
      // High laser/alarm siren sweep
      playBgmNote(987.77, 0.15, 'sawtooth', 0.06, 0.01, 0.12);
    }
    if(s % 4 === 2){
      playBgmDrums('hihat', 0.07);
    }
  }

  bgmStep++;
}

function updateBgmTrack(){
  startBgmEngine();
  if(actx && actx.state === 'suspended'){
    actx.resume();
  }

  let targetTrack = 'menu';

  if(!state || state.mode === 'menu'){
    targetTrack = 'menu';
  } else if(state.mode === 'playing' || state.mode === 'paused'){
    if(level && (level.isGodzillaLevel || (godzillaBoss && godzillaBoss.active))){
      targetTrack = 'godzilla';
    } else if(level && (level.name.includes('ჯამპსქეირ') || level.name.includes('დინოზავრ') || level.name.includes('საიდუმლო') || state.levelIndex === 17 || level.bgHue === 'pink')){
      targetTrack = 'horror';
    } else {
      targetTrack = 'action';
    }
  } else if(state.mode === 'gameover'){
    targetTrack = 'horror';
  } else if(state.mode === 'win'){
    targetTrack = 'menu';
  }

  if(targetTrack !== bgmCurrentTrack){
    bgmCurrentTrack = targetTrack;
    bgmStep = 0;
  }
}

// ---------- Input Listener ----------
const keys = {};
window.addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(player.isBitten && ['Space','ArrowUp','KeyW','KeyK','KeyF','KeyJ','KeyE','KeyA','KeyD'].includes(e.code)){
    boostBiteEscape();
  }
  if(e.code==='KeyP') togglePause();
  if(e.code==='KeyR') restartLevel();
  if(e.code==='KeyK'||e.code==='KeyF') shoot();
  if(e.code==='Escape' && sponsorPopup.active){ closeSponsorPopup(); }

function bindHold(id, downFn, upFn, options = {}){
  const el = document.getElementById(id);
  if(!el) return;

  let activeInterval = null;
  let isDown = false;

  const onDown = (ev) => {
    if(ev && ev.cancelable) ev.preventDefault();
    if(ev) ev.stopPropagation();
    if(isDown) return;
    isDown = true;
    el.classList.add('active');

    downFn();

    if(options.autoRepeat){
      if(activeInterval) clearInterval(activeInterval);
      activeInterval = setInterval(() => {
        if(isDown) downFn();
      }, options.repeatInterval || 160);
    }
  };

  const onUp = (ev) => {
    if(ev && ev.cancelable) ev.preventDefault();
    if(ev) ev.stopPropagation();
    if(!isDown) return;
    isDown = false;
    el.classList.remove('active');

    if(activeInterval){
      clearInterval(activeInterval);
      activeInterval = null;
    }

    if(upFn) upFn();
  };

  el.addEventListener('touchstart', onDown, { passive: false });
  el.addEventListener('touchend', onUp, { passive: false });
  el.addEventListener('touchcancel', onUp, { passive: false });

  el.addEventListener('mousedown', (e) => {
    if(e.button === 0) onDown(e);
  });
  el.addEventListener('mouseup', onUp);
  el.addEventListener('mouseleave', onUp);
}

function handleCanvasPointer(e){
  const rect = canvas.getBoundingClientRect();
  const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
  const clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
  const mx = (clientX - rect.left) * (W / rect.width);
  const my = (clientY - rect.top) * (H / rect.height);

  if(sponsorPopup.active){
    const bw = 160, bh = 36;
    const bx = sponsorPopup.x + sponsorPopup.w/2 - bw/2;
    const by = sponsorPopup.y + sponsorPopup.h - 50;
    if(mx >= bx && mx <= bx+bw && my >= by && my <= by+bh){
      closeSponsorPopup();
    }
    return;
  }

  if(state.mode === 'shop'){
    handleShopClick(mx, my);
  } else if(state.mode === 'levelselect'){
    handleLevelSelectClick(mx, my);
  } else if(state.mode === 'menu'){
    handleMenuClick(mx, my);
  } else if(state.mode === 'gameover' || state.mode === 'win'){
    startGame();
  }
}

function initWeather(){
  const types = ['clear', 'rain', 'fog', 'thunderstorm'];
  if(level && level.isGodzillaLevel){
    weather.type = Math.random() < 0.5 ? 'thunderstorm' : 'fog';
  } else {
    weather.type = types[Math.floor(Math.random() * types.length)];
  }

  weather.timer = 0;
  weather.nextChange = 15000 + Math.random() * 12000;
  weather.thunderTimer = 0;

  weather.drops = [];
  for(let i = 0; i < 180; i++){
    weather.drops.push({
      x: Math.random() * (W + 300) - 150,
      y: Math.random() * H,
      speed: 12 + Math.random() * 9,
      len: 14 + Math.random() * 12,
      alpha: 0.35 + Math.random() * 0.45
    });
  }

  weather.fogClouds = [];
  for(let i = 0; i < 12; i++){
    weather.fogClouds.push({
      x: Math.random() * 4000,
      y: 40 + Math.random() * (H - 120),
      r: 160 + Math.random() * 140,
      vx: (0.3 + Math.random() * 0.5) * (Math.random() < 0.5 ? 1 : -1),
      alpha: 0.25 + Math.random() * 0.25
    });
  }

  applyWeatherType(weather.type, true);
}

function applyWeatherType(newType, isInitial=false){
  weather.type = newType;
  if(newType === 'clear'){
    weather.targetFogAlpha = 0;
    weather.slipperyFactor = 1.0;
    if(!isInitial) toast("🌙 ⚠️ ამინდი: ცა გაწმენდილია!", 2500);
  } else if(newType === 'rain'){
    weather.targetFogAlpha = 0.22;
    weather.slipperyFactor = 0.88;
    if(!isInitial){
      sfxScare();
      toast("🌧️ ⚠️ ამინდი: წვიმა დაიწყო! [RAIN]", 2500);
    }
  } else if(newType === 'thunderstorm'){
    weather.targetFogAlpha = 0.45;
    weather.slipperyFactor = 0.78;
    sfxDemonic();
    shake(16);
    triggerFlash('255,255,255', 0.8);
    if(!isInitial) toast("⛈️ ⚠️ ამინდი: საშინელი შტორმი! [THUNDERSTORM - SLIPPERY GROUND]", 2800);
  } else if(newType === 'fog'){
    weather.targetFogAlpha = 0.75;
    weather.slipperyFactor = 1.0;
    sfxScare();
    shake(12);
    if(!isInitial) toast("🌫️ ⚠️ ამინდი: სქელი ჰორორ ნისლი! [DENSE FOG]", 2800);
  }
}

function updateWeather(dt){
  weather.timer += dt;

  if(weather.timer > weather.nextChange){
    weather.timer = 0;
    weather.nextChange = 16000 + Math.random() * 14000;
    const types = ['clear', 'rain', 'fog', 'thunderstorm'].filter(t => t !== weather.type);
    const nextType = types[Math.floor(Math.random() * types.length)];
    applyWeatherType(nextType);
  }

  weather.curFogAlpha += (weather.targetFogAlpha - weather.curFogAlpha) * 0.03;

  if(weather.type === 'rain' || weather.type === 'thunderstorm'){
    for(const d of weather.drops){
      d.y += d.speed;
      d.x += 2.2;
      if(d.y > H){
        d.y = -20;
        d.x = Math.random() * (W + 300) - 150;
      }
      if(Math.random() < 0.08){
        const groundY = GROUND_Y;
        if(Math.abs((d.y) - groundY) < 15){
          spawnParticles(d.x, groundY, '#38c6ff', 1, 0.4);
        }
      }
    }
  }

  for(const cloud of weather.fogClouds){
    cloud.x += cloud.vx;
    if(cloud.x < -300) cloud.x = 4000;
    if(cloud.x > 4000) cloud.x = -300;
  }

  if(weather.type === 'thunderstorm'){
    weather.thunderTimer += dt;
    if(weather.thunderTimer > 4000 + Math.random() * 4000){
      weather.thunderTimer = 0;
      sfxDemonic();
      shake(22);
      triggerFlash('255,255,255', 0.9);
      spawnParticles(player.x + (Math.random()-0.5)*400, 30, '#ffffff', 20, 2);
    }
  }
}

function drawWeatherWorld(){
  if(weather.curFogAlpha > 0.05){
    ctx.save();
    for(const cloud of weather.fogClouds){
      const cx = cloud.x - camX * 0.4;
      if(cx < -300 || cx > W + 300) continue;
      const grad = ctx.createRadialGradient(cx, cloud.y, 10, cx, cloud.y, cloud.r);
      grad.addColorStop(0, `rgba(180, 210, 240, ${cloud.alpha * weather.curFogAlpha * 0.8})`);
      grad.addColorStop(0.6, `rgba(100, 130, 160, ${cloud.alpha * weather.curFogAlpha * 0.4})`);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cloud.y, cloud.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  if((weather.type === 'rain' || weather.type === 'thunderstorm') && weather.drops){
    ctx.save();
    ctx.strokeStyle = weather.type === 'thunderstorm' ? 'rgba(200, 235, 255, 0.65)' : 'rgba(120, 200, 255, 0.45)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for(const d of weather.drops){
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - 4, d.y + d.len);
    }
    ctx.stroke();
    ctx.restore();
  }
}

function drawWeatherOverlay(){
  if(weather.curFogAlpha > 0.15){
    ctx.save();
    const px = player.x - camX + player.w/2;
    const py = player.y + player.h/2;
    const maxAlpha = Math.min(0.82, weather.curFogAlpha * 0.9);
    
    const spotlightRad = 190;
    const grad = ctx.createRadialGradient(px, py, 25, px, py, spotlightRad);
    grad.addColorStop(0, 'rgba(255, 240, 200, 0.05)');
    grad.addColorStop(0.4, `rgba(10, 15, 25, ${maxAlpha * 0.4})`);
    grad.addColorStop(1, `rgba(5, 8, 16, ${maxAlpha})`);

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    const beamAngle = player.facing === 1 ? 0 : Math.PI;
    const beamGrad = ctx.createRadialGradient(px, py, 10, px + player.facing * 160, py, 220);
    beamGrad.addColorStop(0, 'rgba(255, 235, 180, 0.18)');
    beamGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = beamGrad;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.arc(px, py, 260, beamAngle - 0.4, beamAngle + 0.4);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }
}

  // Level progression difficulty
  const levelDifficulty = Math.min(state.levelIndex || 0, 30);
  const difficultyScale = 1 + (levelDifficulty * 0.08); // 8% increase per level
  
  const spdMult = (level && level.zombieSpeedMult) ? level.zombieSpeedMult : 1;
  const hpMult = (level && level.zombieHpMult) ? level.zombieHpMult : 1;
  
  if(type === 'boss' || (typeof type === 'number' && type > 0.85)){
    // Boss Zombie - gets stronger with levels
    health = Math.round((5 + levelDifficulty * 0.5) * hpMult * difficultyScale);
    speed = 1.1 * spdMult * (1 + levelDifficulty * 0.04);
    color = '#6b2020';
    size = 1.4;
    isBoss = true;
  } else if(typeof type === 'number' && type < 0.35){
    // Fast runner zombie - gets faster with levels
    health = Math.round((1 + levelDifficulty * 0.15) * hpMult);
    speed = (2.2 + levelDifficulty * 0.15) * spdMult;
    color = '#2a6a4a';
    size = 0.8;
  } else {
    // Standard zombie - gets tougher with levels
    health = Math.round((2 + levelDifficulty * 0.3) * hpMult * difficultyScale);
    speed = (1.3 + levelDifficulty * 0.08) * spdMult;
    color = '#3a7a3a';
    size = 1;
  }
  
  zombies.push({
    x: x, y: y, w: 38 * size, h: 56 * size,
    vx: 0, vy: 0,
    health: health, maxHealth: health,
    animT: Math.random()*100,
    facing: 1, speed: speed, color: color, size: size,
    isBoss
  });
}

function boostBiteEscape(){
  if(!player.isBitten || player.dead) return;
  player.biteProgress += 20; // ~5 keypresses to fill 100%
  shake(10);
  sfxZombieHit();
  spawnParticles(player.x + player.w/2, player.y + 20, '#ffffff', 8, 1.2);
  spawnParticles(player.x + player.w/2, player.y + 20, '#ff3d6e', 12, 1.5);
  addFloatingText(player.x + (Math.random()-0.5)*20, player.y - 20, "🥊 " + Math.min(100, Math.floor(player.biteProgress)) + "%", '#ffd23f');

  if(player.biteProgress >= 100){
    player.isBitten = false;
    player.invuln = 70; // 1.2s safety invulnerability
    sfxWin();
    shake(25);
    triggerFlash('255, 215, 0', 0.7);

    if(player.bitingZombie){
      const z = player.bitingZombie;
      z.health -= 6;
      z.vx = player.facing * 16;
      z.vy = -10;
      spawnParticles(z.x + z.w/2, z.y + z.h/2, '#ff0033', 40, 2.5);
    }
    player.bitingZombie = null;
    toast("🦵 გეოდინომ თავი დაიხსნა და ზომბი მოიგერია! 💥", 2500);
  }
}

function shoot(){

    boostBiteEscape();
    return;
  }
  const gunX = player.x + player.w/2 + player.facing * 24;
  const gunY = player.y + player.h/2 - 2;

  const mode = player.weaponMode || 'pistol';

  if(mode === 'pistol'){
    player.gunRecoil = 8;
    bullets.push({
      x: gunX, y: gunY,
      vx: player.facing * 15, vy: (Math.random()-0.5)*0.4,
      life: 55, color: '#ffd23f', size: 6, damage: 1
    });
    sfxShoot();
    shake(3);
    spawnParticles(gunX, gunY, '#ffd23f', 5);
    spawnShellCasing(gunX, gunY, player.facing);
  } else if(mode === 'triple'){
    player.gunRecoil = 10;
    bullets.push({ x: gunX, y: gunY, vx: player.facing * 14, vy: 0, life: 55, color: '#ffd23f', size: 6, damage: 1 });
    bullets.push({ x: gunX, y: gunY, vx: player.facing * 13, vy: -2.5, life: 55, color: '#ff3d6e', size: 6, damage: 1 });
    bullets.push({ x: gunX, y: gunY, vx: player.facing * 13, vy: 2.5, life: 55, color: '#38c6ff', size: 6, damage: 1 });
    sfxShoot();
    shake(5);
    spawnParticles(gunX, gunY, '#ff3d6e', 8);
    spawnShellCasing(gunX, gunY, player.facing);
  } else if(mode === 'shotgun'){
    player.gunRecoil = 16;
    for(let angle = -3; angle <= 3; angle += 1.5){
      bullets.push({
        x: gunX, y: gunY,
        vx: player.facing * (12 + Math.random()*3), vy: angle * 1.2,
        life: 38, color: '#ff7700', size: 7, damage: 2
      });
    }
    sfxShoot();
    shake(12);
    spawnParticles(gunX, gunY, '#ff7700', 14, 1.4);
    spawnParticles(gunX, gunY, '#888888', 8, 1);
    for(let i=0; i<3; i++) spawnShellCasing(gunX, gunY, player.facing);
  } else if(mode === 'minigun'){
    player.gunRecoil = 6;
    bullets.push({
      x: gunX, y: gunY + (Math.random()-0.5)*6,
      vx: player.facing * 18, vy: (Math.random()-0.5)*1.2,
      life: 50, color: '#38c6ff', size: 5, damage: 1
    });
    sfxShoot();
    shake(3);
    spawnParticles(gunX, gunY, '#38c6ff', 4);
    spawnShellCasing(gunX, gunY, player.facing);
  } else if(mode === 'plasma'){
    player.gunRecoil = 18;
    bullets.push({
      x: gunX, y: gunY,
      vx: player.facing * 10, vy: 0,
      life: 70, color: '#00ffcc', size: 14, damage: 5, isPlasma: true
    });
    sfxDemonic();
    shake(14);
    spawnParticles(gunX, gunY, '#00ffcc', 20, 1.8);
  } else if(mode === 'flamethrower'){
    player.gunRecoil = 5;
    for(let i=0; i<3; i++){
      bullets.push({
        x: gunX, y: gunY + (Math.random()-0.5)*8,
        vx: player.facing * (11 + Math.random()*5), vy: (Math.random()-0.5)*2,
        life: 28, color: Math.random()<0.5?'#ff5500':'#ffcc00', size: 8, damage: 1, isFlame: true
      });
    }
    sfxShoot();
    shake(3);
    spawnParticles(gunX, gunY, '#ff5500', 6, 1.2);
  } else if(mode === 'tank'){

    bullets.push({
      x: gunX, y: gunY - 8,

    });

    shake(20);
    spawnParticles(gunX, gunY, '#ffaa00', 25, 2);

function updateBullets(){
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life--;
    
    // Trail particles for plasma orb, flamethrower and tank shell
    if(b.isPlasma && Math.random() < 0.6){
      spawnParticles(b.x, b.y, '#00ffcc', 3, 0.5);
    }
    if(b.isFlame && Math.random() < 0.6){
      spawnParticles(b.x, b.y, '#ffaa00', 2, 0.4);
    }
    if(b.isTankShell && Math.random() < 0.8){
      spawnParticles(b.x, b.y, '#ff6600', 3, 0.6);
      spawnParticles(b.x, b.y, '#333333', 2, 0.4);
    }

    let hit = false;

    // Collision with Godzilla
    if(godzillaBoss.active){
      const gBox = { x: godzillaBoss.x, y: godzillaBoss.y, w: godzillaBoss.w, h: godzillaBoss.h };
      const bulletBox = { x: b.x - b.size, y: b.y - b.size, w: b.size*2, h: b.size*2 };
      if(overlap(bulletBox, gBox)){
        godzillaBoss.hp -= (b.damage || 1);
        spawnParticles(b.x, b.y, b.color || '#ff0055', b.isTankShell ? 35 : 12);
        sfxZombieHit();
        shake(b.isTankShell ? 20 : 6);
        addFloatingText(godzillaBoss.x + 60, godzillaBoss.y - 20, "-" + (b.damage||1) + " HP! 💥", '#ff3d6e');
        
        if(b.isTankShell){
          sfxDemonic();
          spawnParticles(b.x, b.y, '#ff4400', 30, 2.5);
        }
        hit = true;
      }
    }

    if(!hit){
      for(const z of zombies){
        const bulletBox = { x: b.x - b.size, y: b.y - b.size, w: b.size*2, h: b.size*2 };
        if(overlap(bulletBox, z)){
          z.health -= (b.damage || 1);
          spawnParticles(b.x, b.y, b.color || '#ffd23f', b.isPlasma ? 25 : 10);
          sfxZombieHit();
          
          if(b.isPlasma || b.isTankShell){
            shake(14);
            sfxFall();
            // Area explosion damage to nearby zombies
            for(const otherZ of zombies){
              const dx = otherZ.x - b.x, dy = otherZ.y - b.y;
              if(Math.sqrt(dx*dx + dy*dy) < 160){
                otherZ.health -= 4;
              }
            }
          }
          hit = true;
          break;
        }
      }
    }

    if(!hit && level && level.jumpboxes){
      for(const jb of level.jumpboxes){
        if(!jb.hit){
          const bulletBox = { x: b.x - b.size, y: b.y - b.size, w: b.size*2, h: b.size*2 };
          if(overlap(bulletBox, jb)){
            activateJumpbox(jb);
            hit = true;
            break;
          }
        }
      }
    }
    
    if(hit || b.life <= 0){
      bullets.splice(i, 1);
    }
  }
}

function updateZombies(dt){
  for(let i = zombies.length - 1; i >= 0; i--){
    const z = zombies[i];
    z.animT += dt;
    
    let onPlatform = false;
    let platformBelow = null;
    
    for(const p of level.plats){
      if(overlap(z, p)){
        const prevBottom = z.y - (z.vy || 0) + z.h;
        if((z.vy || 0) >= 0 && prevBottom <= p.y + 4){
          z.y = p.y - z.h;
          z.vy = 0;
          onPlatform = true;
          platformBelow = p;
        }
      }
    }
    
    const dx = player.x - z.x;
    const dy = player.y - z.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if(onPlatform && dist < 650 && dist > 20){
      const moveDir = dx > 0 ? 1 : -1;
      const nextX = z.x + moveDir * 24;
      let wouldFall = true;
      
      if(platformBelow){
        if(nextX >= platformBelow.x - 10 && nextX + z.w <= platformBelow.x + platformBelow.w + 10){
          wouldFall = false;
        }
      }
      
      if(!wouldFall || z.isBoss){
        z.vx = (dx / dist) * z.speed;
        z.facing = dx > 0 ? 1 : -1;
      } else {
        z.vx *= 0.8;
      }
    } else {
      z.vx *= 0.88;
    }
    
    z.x += z.vx;
    z.vy = (z.vy || 0) + GRAVITY;
    if(z.vy > 18) z.vy = 18;
    z.y += z.vy;
    
    if(z.y > H + 300){
      zombies.splice(i, 1);
      continue;
    }
    
    if(overlap(player, z) && player.invuln <= 0 && !player.dead && !player.isFalling){
      const isStepping = player.vy > 0 && (player.y + player.h - player.vy) <= (z.y + 16);
      if(isStepping){
        // Stepping / landing on zombie head bounces player off WITHOUT killing the zombie!
        player.vy = -11;
        player.onGround = false;
        sfxJump();
        shake(8);
        spawnParticles(player.x + player.w/2, z.y, '#38c6ff', 10, 1.2);
        spawnParticles(z.x + z.w/2, z.y, '#55aa33', 10, 1.5);
        addFloatingText(z.x, z.y - 15, "👟 ბაუნსი! (Zombie alive!)", '#ffd23f');
      } else if(!player.isBitten){
        player.isBitten = true;
        player.bitePhase = 'hand';
        player.biteProgress = 0;
        player.biteTimer = 0;
        player.bitingZombie = z;
        sfxHurt();
        sfxScare();
        shake(18);
        triggerFlash('255,0,0', 0.5);
        spawnParticles(player.x + player.w/2, player.y + 15, '#ff0033', 25, 1.8);
        toast("⚠️ 🧟‍♂️ ზომბი დაგეცა! დააჭირე SPACE / F / K-ს სწრაფად გასათავისუფლებლად!", 2500);
      }
    }
    
    if(z.health <= 0){
      spawnParticles(z.x + z.w/2, z.y + z.h/2, z.color, 20, 1.5);
      spawnParticles(z.x + z.w/2, z.y + z.h/2, '#ff0033', 15, 2);
      shake(10);
      zombies.splice(i, 1);
      const points = z.maxHealth * 25;
      state.score += points;
      sfxZombieHit();
      addFloatingText(z.x, z.y - 10, "+" + points + " 💀", '#ff3d6e');
      toast(z.isBoss ? "🔥 გიგანტური ბოსი განადგურდა! +" + points : "ზომბი განადგურდა! +" + points, 1000);
    }
  }
}

function updateGodzilla(dt){
  if(!godzillaBoss.active) return;
  const g = godzillaBoss;
  g.animT += dt;

  // Rage Mode Trigger when HP drops below 250
  if(g.hp <= 250 && !g.isRaging){
    g.isRaging = true;
    g.vx = 3.2;
    shake(30);
    sfxDemonic();
    triggerFlash('255,0,0', 0.8);
    toast("🔥 ⚠️ გოდზილა განრისხდა! RAGE MODE ACTIVATED! ⚠️ 🔥", 2500);
  }

  // Godzilla marches down the city street chasing the tank
  g.x += g.vx * g.facing;
  if(g.x < 1200) { g.facing = 1; }
  if(g.x > level.width - 1500) { g.facing = -1; }

  // Stomp screen shake & Shockwave Attack
  g.stompTimer += dt;
  const stompInterval = g.isRaging ? 800 : 1200;
  if(g.stompTimer > stompInterval){
    g.stompTimer = 0;
    shake(g.isRaging ? 20 : 15);
    sfxDemonic();
    spawnParticles(g.x + g.w/2, g.y + g.h, '#ff3d6e', 22, 1.8);

    // Launch ground shockwave toward player
    godzillaProjectiles.push({
      type: 'shockwave',
      x: g.x + (g.facing === -1 ? -20 : g.w + 20),
      y: GROUND_Y - 26,
      vx: g.facing * (g.isRaging ? 9 : 7),
      vy: 0,
      w: 36, h: 26,
      life: 180,
      color: '#00f0ff'
    });
  }

  // Radioactive Fireball Volley Attack
  g.fireballTimer += dt;
  const fireballInterval = g.isRaging ? 1800 : 2800;
  if(g.fireballTimer > fireballInterval){
    g.fireballTimer = 0;
    sfxDemonic();
    shake(12);
    // Launch 3 radioactive fireballs towards player
    for(let i = 0; i < 3; i++){
      const dx = (player.x - g.x);
      const dir = dx > 0 ? 1 : -1;
      godzillaProjectiles.push({
        type: 'fireball',
        x: g.x + g.w/2,
        y: g.y + 40,
        vx: dir * (5 + i*1.5) + (Math.random()*2 - 1),
        vy: -5 - i*1.2,
        size: 16 + i*2,
        life: 200,
        color: '#ff2200'
      });
    }
  }

  // Atomic Beam attack
  g.beamTimer += dt;
  const beamInterval = g.isRaging ? 2200 : 3600;
  if(g.beamTimer > beamInterval){
    g.beamTimer = 0;
    g.isBeaming = true;
    g.beamDuration = g.isRaging ? 1400 : 1100;
    sfxDemonic();
    shake(28);
    triggerFlash('0,180,255', 0.8);
    toast("⚡ ⚠️ გოდზილას ატომური ლაზერი! ⚠️ ⚡", 1500);
  }

  if(g.isBeaming){
    g.beamDuration -= dt;
    if(g.beamDuration <= 0) g.isBeaming = false;

    // Beam hitbox against player
    const beamBox = {
      x: g.facing === -1 ? g.x - 1400 : g.x + g.w,
      y: g.y + 45,
      w: 1400,
      h: 65
    };
    if(overlap(player, beamBox) && player.invuln <= 0 && !player.dead){
      hurtPlayer("💥 გოდზილას ატომურმა ლაზერმა დაგწვა! 💥", "godzilla");
    }
  }

  // Update Godzilla's extra projectiles (fireballs & shockwaves)
  for(let i = godzillaProjectiles.length - 1; i >= 0; i--){
    const p = godzillaProjectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    if(p.type === 'fireball'){
      p.vy += 0.18; // gravity on fireball arc
      if(p.y >= GROUND_Y - 20) p.vy = -p.vy * 0.4;
      spawnParticles(p.x, p.y, '#ff4400', 2, 0.5);
    } else if(p.type === 'shockwave'){
      spawnParticles(p.x, p.y + p.h/2, '#00e5ff', 3, 0.4);
    }

    // Check hit on player
    const pBox = p.type === 'shockwave' ? 
      { x: p.x, y: p.y, w: p.w, h: p.h } : 
      { x: p.x - p.size, y: p.y - p.size, w: p.size*2, h: p.size*2 };

    if(overlap(player, pBox) && player.invuln <= 0 && !player.dead){
      hurtPlayer(p.type==='shockwave' ? "⚡ გოდზილას დარტყმითმა ტალღამ გადაგატრიალა! ⚡" : "🔥 გოდზილას რადიოაქტიურმა ცეცხლმა დაგაზიანა! 🔥", "godzilla");
      godzillaProjectiles.splice(i, 1);
      continue;
    }

    if(p.life <= 0){
      godzillaProjectiles.splice(i, 1);
    }
  }

  // Stomp / Body collision with player
  if(overlap(player, g) && player.invuln <= 0 && !player.dead){
    hurtPlayer("🦖 გოდზილამ გაგჭყლიტა! 🦖", "godzilla");
  }

  // Destroy city buildings in path
  for(const b of cityBuildings){
    if(!b.destroyed && (g.x + g.w > b.x && g.x < b.x + b.w)){
      b.destroyed = true;
      shake(24);
      sfxDemonic();
      spawnParticles(b.x + b.w/2, b.y + b.h/2, '#ff4400', 35, 2);
      spawnParticles(b.x + b.w/2, b.y + b.h/2, '#777777', 30, 1.5);
      addFloatingText(b.x + 30, b.y - 20, "🏢 შენობა დაინგრა! 💥", '#ffaa00');
    }
  }

  // Defeat condition
  if(g.hp <= 0){
    g.active = false;
    godzillaProjectiles = [];
    shake(40);
    triggerFlash('255,215,0', 1.0);
    sfxWin();
    spawnParticles(g.x + g.w/2, g.y + g.h/2, '#ffd23f', 80, 4);
    spawnParticles(g.x + g.w/2, g.y + g.h/2, '#ff3d6e', 80, 4);
    toast("🏆 გოდზილა დამარცხდა! შენ გადაარჩინე ქალაქი! 🏆", 3500);
    state.score += 10000;
    setTimeout(() => {
      levelClear();
    }, 2500);
  }
}

function updateParticles(timeScale = 1){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * timeScale;
    p.y += p.vy * timeScale;
    p.vy += 0.25 * timeScale;
    p.life -= timeScale;
    p.size *= Math.pow(0.96, timeScale);
    if(p.life <= 0 || p.size < 0.4){
      particles.splice(i, 1);
    }
  }

  for(let i = shellCasings.length - 1; i >= 0; i--){
    const sc = shellCasings[i];
    sc.x += sc.vx * timeScale; sc.y += sc.vy * timeScale;
    sc.vy += 0.4 * timeScale;
    sc.rot += sc.vRot * timeScale;
    sc.life -= timeScale;
    if(sc.life <= 0) shellCasings.splice(i, 1);
  }

  for(let i = floatingTexts.length - 1; i >= 0; i--){
    const ft = floatingTexts[i];
    ft.y += ft.vy * timeScale;
    ft.life -= timeScale;
    if(ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

let LEVELS = buildLevels();
let level = LEVELS[0];

function skipLevel(){
  if(state.mode!=='playing' && state.mode!=='paused') return;
  sfxWin();
  toast("⏩ დონე გამოტოვებულია!", 1500);
  levelClear();
}

function toast(text, ms=1600){
  state.toastText = text;
  state.toastTimer = ms;
}

function triggerFlash(color, alpha){
  state.flashColor = color;
  state.flashAlpha = alpha;
}

function shake(amount){
  state.shake = Math.max(state.shake, amount);
}

function triggerDash(){
  if(player.dashCooldown > 0 || player.dead || player.isBitten) return;
  player.dashTimer = 220;
  player.dashCooldown = 800;
  player.invuln = 22;
  sfxJump();
  shake(6);
  spawnParticles(player.x + player.w/2, player.y + player.h/2, '#38c6ff', 18, 2);
  toast("⚡ TURBO DASH! ⚡", 700);
}

// ---------- Update Mechanics ----------
function updatePlayer(dt){
  if(player.dead) return;

  if(state.comboTimer > 0){
    state.comboTimer -= dt;
    if(state.comboTimer <= 0) state.combo = 0;
  }

  // Coin Magnet Ability
  if(state.upgrades.magnet && level && level.coins){
    level.coins.forEach(c => {
      const dx = (player.x + player.w/2) - (c.x + c.w/2);
      const dy = (player.y + player.h/2) - (c.y + c.h/2);
      const dist = Math.hypot(dx, dy);
      if(dist < 220){
        c.x += (dx / dist) * 7.5;
        c.y += (dy / dist) * 7.5;
      }
    });
  }

  // Handle Falling off world state with "ადიოს მუჩაჩოოსსსს"
  if(player.isFalling){
    player.fallTimer += dt;
    player.fallRotation += 0.14;
    player.vy = (player.vy || 3) + GRAVITY * 0.7;
    player.y += player.vy;
    player.x += player.facing * 1.5;

    // Smooth camera tracking panning down following the player into the abyss
    let targetCamY = Math.max(0, player.y - H * 0.42);
    camY += (targetCamY - camY) * 0.12;

    // Wind & debris particles rushing up during fall
    if(Math.random() < 0.65){
      particles.push({
        x: player.x + (Math.random() - 0.5) * 50,
        y: player.y + 20,
        vx: (Math.random() - 0.5) * 3,
        vy: -Math.random() * 8 - 4,
        life: 25,
        color: Math.random() < 0.5 ? '#ff3d6e' : '#ffd23f',
        size: 3 + Math.random() * 3
      });
    }

    if(player.fallTimer > 750 || player.y > GROUND_Y + 180){
      hurtPlayer("ადიოს მუჩაჩოოსსსს! 💀", "pit");
    }
    return;
  }

  if(player.fastenerTimer > 0) player.fastenerTimer -= dt;
  if(player.reverseControlsTimer > 0) player.reverseControlsTimer -= dt;

  // Handle Zombie Biting & Struggle state
  if(player.isBitten){
    player.vx = 0;
    player.biteTimer += dt;

    // Pin biting zombie to player arm or leg
    const z = player.bitingZombie;
    if(z && z.health > 0){
      z.x = player.x + (player.facing === 1 ? 22 : -28);
      z.y = player.bitePhase === 'hand' ? player.y - 4 : player.y + 18;
      z.facing = player.facing === 1 ? -1 : 1;
      z.vx = 0; z.vy = 0;
    } else {
      player.isBitten = false;
      player.bitingZombie = null;
    }

    // Blood spray particles
    if(Math.random() < 0.35){
      spawnParticles(
        player.x + player.w/2 + (player.facing * 12),
        player.y + (player.bitePhase === 'hand' ? 12 : 36),
        '#ff0033', 4, 1.2
      );
    }

    // Phase transition timers (2.2s per phase if not escaped)
    if(player.bitePhase === 'hand' && player.biteTimer > 2200){
      player.bitePhase = 'foot';
      player.biteTimer = 0;
      player.biteProgress = Math.max(0, player.biteProgress - 25);
      sfxHurt();
      sfxScare();
      shake(20);
      triggerFlash('255,0,0', 0.6);
      spawnParticles(player.x + player.w/2, player.y + 36, '#ff0033', 30, 2);
      toast("🩸 ⚠️ ზომბი გადავიდა ფეხზე! სწრაფად დააჭირე SPACE / F / K! 🦶", 2500);
      addFloatingText(player.x, player.y - 25, "🩸 ფეხის კბენა!", '#ff0033');
    } else if(player.bitePhase === 'foot' && player.biteTimer > 2200){
      player.isBitten = false;
      player.bitingZombie = null;
      hurtPlayer("🧟‍♂️ ზომბიმ გეოდინო შეიპყრო და შეჭამა! 💀", "zombie");
      return;
    }
  }

  const isFastener = player.fastenerTimer > 0;
  const isReverse = player.reverseControlsTimer > 0;

  const speed = isFastener ? 8.2 : 4.8;
  const jumpPower = isFastener ? -16.2 : -13.8;

  let leftKey = keys['ArrowLeft']||keys['KeyA'];
  let rightKey = keys['ArrowRight']||keys['KeyD'];

  if(isReverse){
    const temp = leftKey; leftKey = rightKey; rightKey = temp;
  }

  const left = leftKey;
  const right = rightKey;

  if(player.gunRecoil > 0) player.gunRecoil *= 0.8;

  // Dash controls
  if(keys['ShiftLeft']||keys['ShiftRight']||keys['KeyE']){
    if(!player.dashKeyPressed){
      player.dashKeyPressed = true;
      triggerDash();
    }
  } else {
    player.dashKeyPressed = false;
  }

  if(player.dashTimer > 0){
    player.dashTimer -= dt;
    player.vx = player.facing * 15.5;
    if(Math.random() < 0.6){
      particles.push({
        x: player.x + Math.random() * player.w,
        y: player.y + Math.random() * player.h,
        vx: -player.facing * (2 + Math.random()*2),
        vy: (Math.random() - 0.5) * 2,
        life: 16,
        color: Math.random() < 0.5 ? '#38c6ff' : '#ffd23f',
        size: 4
      });
    }
  } else if(player.slipping>0){
    player.slipping--;
    player.vx = player.facing*7.5*(player.slipping/40);
  } else {
    if(left){ player.vx = -speed; player.facing=-1; }
    else if(right){ player.vx = speed; player.facing=1; }
    else { player.vx *= (0.78 + (1 - (weather.slipperyFactor || 1)) * 0.16); }
  }

  if(player.dashCooldown > 0) player.dashCooldown -= dt;

  // Running & Fastener particles
  if(player.onGround && Math.abs(player.vx) > 1){
    if(isFastener){
      spawnParticles(player.x+player.w/2, player.y+player.h, Math.random()<0.5?'#38c6ff':'#ffd23f', 2, 0.5);
    } else if(Math.random()<0.35){
      particles.push({
        x: player.x + (player.facing===-1? player.w : 0),
        y: player.y + player.h - 4,
        vx: -player.facing * (1 + Math.random()*2),
        vy: -Math.random()*1.5,
        life: 18, color: '#a08560', size: 3
      });
    }
  }

  // Jump & Double Jump
  if(keys['Space']||keys['ArrowUp']||keys['KeyW']){
    if(player.onGround && !player.jumpKeyPressed){
      player.vy = jumpPower;
      player.onGround = false;
      player.jumpCount = 1;
      player.jumpKeyPressed = true;
      sfxJump();
      spawnParticles(player.x+player.w/2, player.y+player.h, isFastener?'#38c6ff':'#ffffff', 10);
    } else if(!player.onGround && !player.jumpKeyPressed && state.upgrades.doubleJump && player.jumpCount === 1){
      player.vy = jumpPower * 0.92;
      player.jumpCount = 2;
      player.jumpKeyPressed = true;
      sfxJump();
      spawnParticles(player.x+player.w/2, player.y+player.h, '#38c6ff', 18, 2.5);
      toast("🚀 DOUBLE JUMP!", 600);
    }
  } else {
    player.jumpKeyPressed = false;
  }

  player.vy += GRAVITY;
  if(player.vy>18) player.vy=18;

  player.x += player.vx;
  player.y += player.vy;

  if(player.x < camX+4) player.x = camX+4;

  // Platform collision & moving platforms update
  const wasOnGround = player.onGround;
  player.onGround = false;
  for(const p of level.plats){
    // Update platform movement
    if(p.vx){
      p.x += p.vx;
      if(p.x <= p.minX || p.x >= p.maxX) p.vx *= -1;
    }
    if(p.vy){
      p.y += p.vy;
      if(p.y <= p.minY || p.y >= p.maxY) p.vy *= -1;
    }

    if(overlap(player,p)){
      const prevBottom = player.y - player.vy + player.h;
      if(player.vy >= 0 && prevBottom <= p.y+4){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
        if(p.vx) player.x += p.vx; // carry player
      } else if(player.vy<0 && player.y - player.vy >= p.y+p.h-4){
        player.y = p.y+p.h;
        player.vy = 1;
      } else {
        if(player.vx>0) player.x = p.x - player.w;
        else if(player.vx<0) player.x = p.x + p.w;
        player.vx = 0;
      }
    }
  }

  // Dust cloud landing effect when player hits ground after falling
  if(!wasOnGround && player.onGround){
    spawnParticles(player.x + player.w/2, player.y + player.h, '#d4b483', 18, 1.6);
    spawnParticles(player.x + player.w/2, player.y + player.h, '#ffffff', 10, 1.2);
    spawnParticles(player.x + player.w/2, player.y + player.h, '#a08560', 12, 1.4);
  }

  // Trigger "ადიოს მუჩაჩოოსსსს" when falling off world into pit
  if(player.y > GROUND_Y + 25 && !player.isFalling && !player.onGround){
    player.isFalling = true;
    player.fallTimer = 0;
    player.fallRotation = 0;
    player.vy = 4;
    sfxFall();
    shake(20);
    toast("ადიოს მუჩაჩოოსსსს! 💀", 2200);
    addFloatingText(player.x, player.y - 30, "ადიოს მუჩაჩოოსსსს! 🗣️", '#ff3d6e');
  }

  // Fake spikes
  for(const f of level.fakespikes){
    if(overlap(player,f) && !f.hit){
      f.hit = true;
      sfxPrankGood();
      toast("დაისვენე, ეს ბალიშია 🛏️", 1400);
    }
  }

  // Real spikes
  for(const s of level.spikes){
    if(overlap(player,s) && player.invuln<=0){
      hurtPlayer("მოულოდნელი ხაფანგი! 🩸");
    }
  }

  // Lava hazards
  if(level.lavas){
    for(const l of level.lavas){
      if(overlap(player, l) && player.invuln <= 0){
        spawnParticles(player.x+player.w/2, player.y+player.h, '#ff5500', 16, 2.5);
        spawnParticles(player.x+player.w/2, player.y+player.h, '#ffd23f', 12, 2.0);
        hurtPlayer("ცხელ ლავაში ჩავარდი! 🌋🔥");
      }
    }
  }

  // Water hazards / deep crosses
  if(level.waters){
    for(const w of level.waters){
      if(overlap(player, w) && player.invuln <= 0){
        spawnParticles(player.x+player.w/2, w.y+10, '#38c6ff', 16, 2.2);
        spawnParticles(player.x+player.w/2, w.y+10, '#ffffff', 10, 1.8);
        hurtPlayer("წყლის გადაკვეთაში ჩაიძირე! 🌊💀");
      }
    }
  }

  // Bananas
  for(const b of level.bananas){
    if(overlap(player,b) && player.slipping<=0 && !b.used){
      player.slipping = 40;
      sfxSlip();
      toast("ბანანის კალთა! უუუ 🍌", 1200);
    }
  }

  // Coins
  for(const c of level.coins){
    if(!c.taken && overlap(player,c)){
      c.taken = true;
      addScore(10);
      state.coinsCollected = (state.coinsCollected || 0) + 1;
      sfxCoin();
      spawnParticles(c.x+c.w/2, c.y+c.h/2, '#38c6ff', 8);
      checkAchievements();
    }
  }

  // Bells
  for(const b of level.bells){
    if(!b.taken && overlap(player,b)){
      b.taken = true;
      addScore(50);
      state.subs = Math.min(100, state.subs+15);
      sfxBell();
      spawnParticles(b.x+b.w/2, b.y+b.h/2, '#ff3d6e', 10);
      toast("+15% Subscribe 🔔", 1200);
    }
  }
}

function activateJumpbox(jb){
  if(jb.hit) return;
  jb.hit = true;
  jb.bounceY = -12;
  sfxBoxHit();
  shake(6);
  spawnParticles(jb.x + jb.w/2, jb.y + jb.h/2, '#ffd23f', 16, 2.5);

  if(jb.type === 'coin'){
    addScore(50);
    state.coinsCollected = (state.coinsCollected || 0) + 5;
    addFloatingText(jb.x, jb.y-20, "+50 ქულა! 💰");
    checkAchievements();
  } else if(jb.type === 'bell'){
    addScore(100);
    state.subs = Math.min(100, state.subs+20);
    sfxBell();
    addFloatingText(jb.x, jb.y-20, "+20% გამოწერა! 🔔", '#ff3d6e');

    state.lives = Math.min(8, state.lives+1);

    sfxDemonic();
    shake(18);
    toast("💥 მძლავრი ომის ტანკი აჩართა! 💥", 2500);
  } else if(jb.type === 'fastener'){

  } else if(jb.type === 'prank_zombie'){
    sfxScare();
    shake(14);
    spawnZombie(player.x + 120, player.y - 100);
    spawnZombie(player.x - 120, player.y - 100);
    toast("😱 ზომბების მოულოდნელი ხაფანგი! 🧟", 2000);
  } else if(jb.type === 'prank_reverse'){
    player.reverseControlsTimer = 6000;
    sfxHurt();
    shake(12);
    toast("🌀 კონტროლი ამოტრიალდა! (6 წამი)", 2200);
  } else if(jb.type === 'prank_bomb'){
    sfxDemonic();
    shake(22);
    triggerFlash('255,100,0', 0.8);
    spawnParticles(jb.x+jb.w/2, jb.y+jb.h/2, '#ff3d6e', 30, 2);
    player.vy = -12;
    player.vx = -player.facing * 10;
    toast("💥 აფეთქდა ყუთი! ფრთხილად! 💥", 2000);
  } else if(jb.type === 'prank_dance'){
    sfxWin();
    triggerFlash('255,0,200', 0.8);
    shake(14);
    toast("🕺 დისკო-ხულიგნური ტაიმი! 💃", 2500);
  } else if(jb.type === 'prank_jumpscare_giant'){
    doJumpscare('demon');
    toast("👻 საშინელი სულის გაღვიძება! 👻", 2000);
  } else if(jb.type === 'sponsor'){
    triggerSponsorPopup();
  } else if(jb.type === 'jumpscare'){
    doJumpscare('demon');
  }
}

  // Jumpboxes / Lucky Drops (Hit from below, kick from above, or sides!)
  for(const jb of level.jumpboxes){
    if(!jb.hit && overlap(player, jb)){
      const comesFromAbove = player.vy >= 0 && (player.y + player.h - player.vy) <= (jb.y + 16);
      activateJumpbox(jb);

      if(comesFromAbove){
        // Kicked/landed on top of lucky drop from above -> bounce player up high!
        player.vy = -12.5;
        player.onGround = true;
      } else {
        // Hit from below -> push player down slightly
        player.vy = Math.max(player.vy, 2);
      }
    }
    if(jb.bounceY){
      jb.bounceY += 1.5;
      if(jb.bounceY > 0) jb.bounceY = 0;
    }
  }

  // Bushes jumpscare
  for(const bush of level.bushes){
    const triggerZone = rect(bush.x-40, bush.y-60, bush.w+80, bush.h+60);
    if(!bush.triggered && overlap(player,triggerZone)){
      bush.triggered = true;
      doJumpscare('face');
    }
  }

  // Flag -> level clear
  if(overlap(player, level.flag)){
    levelClear();
  }

  if(player.invuln>0) player.invuln--;
  if(player.crying>0) player.crying--;
  player.animT += dt;

  camX = Math.max(0, Math.min(level.width - W, player.x - W*0.38));
  
  updateZombies(dt);
  updateBullets();
  updateParticles();
}

function hurtPlayer(msg, cause='zombie'){
  const isPit = cause === 'pit';
  if((player.invuln > 0 && !isPit) || player.dead) return;

  if(player.hasShield && !isPit){
    player.hasShield = false;
    player.invuln = 60;
    sfxBell();
    shake(12);
    triggerFlash('56,198,255', 0.8);
    toast("🛡️ ენერგოფარმა დარტყმა აირეკლა!", 2000);
    spawnParticles(player.x+player.w/2, player.y+player.h/2, '#38c6ff', 35, 3);
    return;
  }

  if(isPit){
    player.hasShield = false;
    player.isFalling = false;
  }

  state.lives--;
  player.crying = 60;
  if(cause === 'godzilla') state.lastKilledByGodzilla = true;
  sfxHurt();
  shake(18);
  triggerFlash('255,0,50', 0.65);
  toast(`${msg} (დარჩა ${state.lives} ❤️)`, 2200);

  if(state.lives<=0){
    player.dead = true;
    player.isFalling = false;
    sfxDemonic();
    sfxScare();
    const spawnY = Math.min(H - 60, Math.max(80, player.y + player.h/2));
    const deathX = player.x + player.w/2;

    spawnParticles(deathX, spawnY, '#ff3d6e', 50, 3.2);
    spawnParticles(deathX, spawnY, '#ffd23f', 40, 2.8);
    spawnParticles(deathX, spawnY, '#ffffff', 30, 2.0);

    state.deathCam = {
      active: true,
      timer: 2400,
      maxTimer: 2400,
      deathX: deathX,
      deathY: spawnY,
      causeMsg: msg || "კრიტიკული დამარცხება! 💀",
      zoom: 1
    };

    shake(30);
    triggerFlash('255,0,0', 0.85);

    if(state.lastKilledByGodzilla || (level && level.isGodzillaLevel)){
      triggerNukeSequence();
    }
  } else {
    resetPlayer(level.spawn);
    if(level.isGodzillaLevel) player.weaponMode = 'tank';
    camX = 0; camY = 0;
  }
}

function doJumpscare(type='face'){
  state.jumpscareActive = true;
  state.jumpscareTimer = 38;
  state.jumpscareType = type;
  if(type === 'demon'){
    sfxDemonic();
  } else {
    sfxScare();
  }
  shake(25);
  triggerFlash('255,0,0', 0.9);
}

function levelClear(){
  if(state.mode!=='playing') return;
  sfxWin();
  unlockAchievement('levelSurvived', '🏆 დონის გადარჩენილი!', 'შენ წარმატებით გადარჩი და დაასრულე დონე!');
  state.unlockedLevels = Math.max(state.unlockedLevels || 1, state.levelIndex + 2);
  saveData();
  state.mode = 'levelclear';
  setTimeout(()=>{
    if(state.levelIndex < LEVELS.length-1){
      state.levelIndex++;
      loadLevel(state.levelIndex);
      state.mode = 'playing';
    } else {
      state.mode = 'win';
    }
  }, 2200);
}

function loadLevel(idx){
  if(state.deathCam) state.deathCam.active = false;
  level = LEVELS[idx];
  level.coins.forEach(c=>c.taken=false);
  level.bells.forEach(b=>b.taken=false);
  level.bananas.forEach(b=>b.used=false);
  level.fakespikes.forEach(f=>f.hit=false);
  level.bushes.forEach(b=>b.triggered=false);
  if(level.jumpboxes) level.jumpboxes.forEach(jb=>{ jb.hit=false; jb.bounceY=0; });
  
  resetPlayer(level.spawn);
  camX=0; camY=0;
  zombies = []; bullets = []; particles = []; shellCasings = []; floatingTexts = [];
  
  if(level.zombies){
    level.zombies.forEach(z => spawnZombie(z.x, z.y, z.type));
  }

  // Godzilla level setup
  if(level.isGodzillaLevel){
    player.weaponMode = 'tank';
    state.lastKilledByGodzilla = false;
    nukeSeq.active = false;
    godzillaProjectiles = [];
    godzillaBoss = {
      active: true,
      x: 3200, y: GROUND_Y - 210, w: 190, h: 220,
      hp: 500, maxHp: 500,
      vx: 2.2, facing: -1,
      animT: 0,
      beamTimer: 0,
      isBeaming: false,
      beamDuration: 0,
      stompTimer: 0,
      fireballTimer: 0,
      isRaging: false
    };

    // Build city buildings for destruction
    cityBuildings = [];
    for(let i=0; i<30; i++){
      cityBuildings.push({
        x: 400 + i * 280,
        y: GROUND_Y - (220 + Math.sin(i*3)*80),
        w: 180 + (i%3)*30,
        h: 220 + Math.sin(i*3)*80,
        destroyed: false
      });
    }
  } else {
    godzillaBoss.active = false;
  }

  initWeather();

  if (level.diffRating && level.gimmickTitle) {
    toast(`🎮 ${level.name} [${level.diffRating} ${level.diffStars}] — ${level.gimmickTitle}!`, 3500);
  } else {
    toast(`🎮 ${level.name}`, 2200);
  }
}

function restartLevel(){
  if(state.mode==='playing'||state.mode==='paused'||state.mode==='gameover'){
    state.lives=8; state.score=0; state.subs=0; state.levelIndex=0;
    loadLevel(0);
    state.mode='playing';
  }
}

function togglePause(){
  if(state.mode==='playing'){ state.mode='paused'; }
  else if(state.mode==='paused'){ state.mode='playing'; }
}

function startGame(){
  ac();
  state.levelIndex = 0;
  state.score = 0;
  state.lives = 8;
  state.subs = 0;
  loadLevel(0);
  state.mode = 'playing';
}

// ---------- Drawing Rendering Engine ----------
function drawBackground(theme){
  if(!theme || theme === 'pink' || theme === 'blue'){
    if(level && level.theme) theme = level.theme;
    else theme = 'dusk_suburbs';
  }

  switch(theme){
    case 'dusk_suburbs': {
      // 1. Sunset Suburbs
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#1c0a2a');
      g.addColorStop(0.35, '#5c1d47');
      g.addColorStop(0.7, '#d94f38');
      g.addColorStop(1, '#f39c12');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      // Giant Setting Sun
      ctx.save();
      const sunX = W * 0.72 - (camX * 0.03) % W;
      const sunGrad = ctx.createRadialGradient(sunX, 160, 20, sunX, 160, 110);
      sunGrad.addColorStop(0, '#ffffff');
      sunGrad.addColorStop(0.4, '#ffd23f');
      sunGrad.addColorStop(1, 'rgba(243, 156, 18, 0)');
      ctx.fillStyle = sunGrad;
      ctx.beginPath(); ctx.arc(sunX, 160, 110, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      // Suburb Hills Parallax
      for(let layer=0; layer<3; layer++){
        const speed = 0.08 + layer*0.08;
        const color = layer===0 ? 'rgba(74, 21, 56, 0.45)' : layer===1 ? 'rgba(110, 35, 60, 0.55)' : 'rgba(145, 45, 55, 0.65)';
        ctx.fillStyle = color;
        for(let i=-1; i<6; i++){
          const bx = (i*360 - camX*speed) % (360*6);
          ctx.beginPath();
          ctx.ellipse(bx+180, GROUND_Y+40+layer*15, 260-layer*25, 110-layer*20, 0, Math.PI, Math.PI*2);
          ctx.fill();
        }
      }
      break;
    }

    case 'cyberpunk_alley': {
      // 2. Neon Cyberpunk Alleyway
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#040612');
      g.addColorStop(0.5, '#0d1733');
      g.addColorStop(1, '#1e0a38');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      // Neon Ringed Cyber Orb
      ctx.save();
      const orbX = W * 0.8 - (camX * 0.04) % W;
      ctx.fillStyle = 'rgba(0, 240, 255, 0.22)';
      ctx.beginPath(); ctx.arc(orbX, 110, 65, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#38c6ff'; ctx.lineWidth = 3; ctx.stroke();
      ctx.strokeStyle = '#ff00aa'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(orbX, 110, 95, 22, -0.2, 0, Math.PI*2); ctx.stroke();
      ctx.restore();

      // Cyber Skyscrapers
      for(let i=-1; i<12; i++){
        const bx = (i*220 - camX*0.15) % (220*12);
        const bh = 180 + ((i*37)%140);
        ctx.fillStyle = '#0a0d1a';
        ctx.fillRect(bx, GROUND_Y-bh, 140, bh+100);
        ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 1;
        ctx.strokeRect(bx, GROUND_Y-bh, 140, bh+100);

        ctx.fillStyle = (i%2===0) ? 'rgba(56, 198, 255, 0.5)' : 'rgba(255, 0, 170, 0.5)';
        for(let wx = bx+15; wx < bx+120; wx += 22){
          for(let wy = GROUND_Y-bh+20; wy < GROUND_Y-20; wy += 35){
            if((wx+wy+i)%3===0) ctx.fillRect(wx, wy, 10, 16);
          }
        }

        if(i%3===0){
          ctx.fillStyle = 'rgba(255, 0, 170, 0.85)';
          ctx.font = '900 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('CYBER 2077', bx + 70, GROUND_Y - bh + 18);
        }
      }
      break;
    }

    case 'horror_ruins': {
      // 3. CodeZero Horror Library Ruins
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#0a0105');
      g.addColorStop(0.5, '#2e0416');
      g.addColorStop(1, '#520829');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      // Blood Red Moon
      ctx.save();
      const moonX = W * 0.7 - (camX * 0.03) % W;
      ctx.fillStyle = '#dc2626';
      ctx.shadowColor = '#dc2626'; ctx.shadowBlur = 35;
      ctx.beginPath(); ctx.arc(moonX, 100, 60, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      // Gothic Pillars & Red Eyes
      for(let i=-1; i<10; i++){
        const px = (i*280 - camX*0.18) % (280*10);
        ctx.fillStyle = '#18030e';
        ctx.fillRect(px, GROUND_Y-220, 45, 240);
        ctx.fillRect(px-10, GROUND_Y-230, 65, 15);
        ctx.fillRect(px-10, GROUND_Y-10, 65, 15);

        const blink = Math.sin(state.time*0.005 + i) > 0.1;
        if(blink){
          ctx.fillStyle = '#ff0033';
          ctx.fillRect(px + 12, GROUND_Y - 140, 5, 4);
          ctx.fillRect(px + 24, GROUND_Y - 140, 5, 4);
        }
      }
      break;
    }

    case 'desert_canyon': {
      // 4. Golden Desert Canyon
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#2b0d02');
      g.addColorStop(0.35, '#803303');
      g.addColorStop(0.7, '#d97706');
      g.addColorStop(1, '#fbbf24');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      // Blazing Sun
      ctx.save();
      const bSunX = W * 0.5 - (camX * 0.02) % W;
      ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 40;
      ctx.beginPath(); ctx.arc(bSunX, 120, 55, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      // Red Rock Canyons
      for(let layer=0; layer<3; layer++){
        const speed = 0.07 + layer*0.07;
        ctx.fillStyle = layer===0 ? 'rgba(120, 40, 10, 0.4)' : layer===1 ? 'rgba(160, 55, 15, 0.55)' : 'rgba(200, 75, 20, 0.7)';
        for(let i=-1; i<7; i++){
          const cx = (i*320 - camX*speed) % (320*7);
          ctx.beginPath();
          ctx.moveTo(cx, GROUND_Y+50);
          ctx.lineTo(cx+60, GROUND_Y-90-layer*30);
          ctx.lineTo(cx+180, GROUND_Y-120-layer*20);
          ctx.lineTo(cx+260, GROUND_Y-70-layer*30);
          ctx.lineTo(cx+320, GROUND_Y+50);
          ctx.closePath();
          ctx.fill();
        }
      }
      break;
    }

    case 'volcanic_inferno':
    case 'infernal_volcano': {
      // 5 & 11. Infernal Volcanic Boss Arena
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#1a0000');
      g.addColorStop(0.5, '#4d0000');
      g.addColorStop(1, '#800505');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      // Erupting Volcanoes
      for(let i=-1; i<5; i++){
        const vx = (i*450 - camX*0.1) % (450*5);
        ctx.fillStyle = '#220303';
        ctx.beginPath();
        ctx.moveTo(vx, GROUND_Y+50);
        ctx.lineTo(vx+140, GROUND_Y-180);
        ctx.lineTo(vx+190, GROUND_Y-180);
        ctx.lineTo(vx+330, GROUND_Y+50);
        ctx.fill();

        ctx.fillStyle = Math.sin(state.time*0.01 + i) > 0 ? '#ff3d6e' : '#f59e0b';
        ctx.beginPath();
        ctx.arc(vx+165, GROUND_Y-180, 25, 0, Math.PI*2);
        ctx.fill();
      }

      // Floating Lava Sparks
      ctx.fillStyle = '#ffaa00';
      for(let i=0; i<35; i++){
        const px = (i*137 + state.time*0.15) % W;
        const py = (GROUND_Y - (i*43 + state.time*0.2) % (GROUND_Y - 20));
        ctx.fillRect(px, py, 3, 3);
      }
      break;
    }

    case 'nuclear_lab': {
      // 6. Nuclear Power Plant / Laser Matrix
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#02120a');
      g.addColorStop(0.5, '#082c1b');
      g.addColorStop(1, '#0f4a2d');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      // Cooling Towers
      for(let i=-1; i<6; i++){
        const tx = (i*350 - camX*0.12) % (350*6);
        ctx.fillStyle = '#061e13';
        ctx.beginPath();
        ctx.moveTo(tx, GROUND_Y+50);
        ctx.lineTo(tx+40, GROUND_Y-160);
        ctx.lineTo(tx+160, GROUND_Y-160);
        ctx.lineTo(tx+200, GROUND_Y+50);
        ctx.fill();

        ctx.fillStyle = 'rgba(34, 197, 94, 0.25)';
        ctx.beginPath();
        ctx.arc(tx+100, GROUND_Y-190, 45 + Math.sin(state.time*0.005 + i)*10, 0, Math.PI*2);
        ctx.fill();
      }
      break;
    }

    case 'frozen_tundra': {
      // 7. Frozen Tundra & Aurora Borealis
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#03101e');
      g.addColorStop(0.5, '#0a2542');
      g.addColorStop(1, '#133d6b');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      // Aurora Borealis
      ctx.save();
      const waveT = state.time * 0.002;
      ctx.fillStyle = 'rgba(0, 240, 255, 0.18)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      for(let x=0; x<=W; x+=40){
        ctx.lineTo(x, 70 + Math.sin(x*0.01 + waveT)*35);
      }
      ctx.lineTo(W, 0);
      ctx.fill();

      ctx.fillStyle = 'rgba(168, 85, 247, 0.15)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      for(let x=0; x<=W; x+=40){
        ctx.lineTo(x, 110 + Math.cos(x*0.012 - waveT)*40);
      }
      ctx.lineTo(W, 0);
      ctx.fill();
      ctx.restore();

      // Ice Mountains
      for(let i=-1; i<7; i++){
        const ix = (i*300 - camX*0.1) % (300*7);
        ctx.fillStyle = '#062038';
        ctx.beginPath();
        ctx.moveTo(ix, GROUND_Y+50);
        ctx.lineTo(ix+120, GROUND_Y-150);
        ctx.lineTo(ix+240, GROUND_Y+50);
        ctx.fill();

        ctx.fillStyle = '#e0f2fe';
        ctx.beginPath();
        ctx.moveTo(ix+80, GROUND_Y-100);
        ctx.lineTo(ix+120, GROUND_Y-150);
        ctx.lineTo(ix+160, GROUND_Y-100);
        ctx.fill();
      }

      // Snow
      ctx.fillStyle = '#ffffff';
      for(let i=0; i<40; i++){
        const sx = (i*97 + state.time*0.1) % W;
        const sy = (i*61 + state.time*0.15) % H;
        ctx.beginPath(); ctx.arc(sx, sy, 1.8, 0, Math.PI*2); ctx.fill();
      }
      break;
    }

    case 'cosmic_void': {
      // 8. Cosmic Deep Space Void
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#020108');
      g.addColorStop(0.5, '#0e0624');
      g.addColorStop(1, '#1e0a40');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      // Ringed Cosmic Planet
      ctx.save();
      const px = W * 0.75 - (camX * 0.02) % W;
      ctx.fillStyle = '#a855f7';
      ctx.beginPath(); ctx.arc(px, 110, 60, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.ellipse(px, 110, 100, 20, -0.3, 0, Math.PI*2); ctx.stroke();
      ctx.restore();

      // Twinkling Starlight
      ctx.fillStyle = '#ffffff';
      for(let i=0; i<60; i++){
        const sx = (i*137 - camX*0.05) % W;
        const sy = (i*53) % H;
        const tw = Math.sin(state.time*0.005 + i)*0.4 + 0.6;
        ctx.globalAlpha = tw;
        ctx.fillRect(((sx%W)+W)%W, sy, 2, 2);
      }
      ctx.globalAlpha = 1;
      break;
    }

    case 'doomsday_city':
    case 'godzilla_ruins': {
      // 9 & 20. Doomsday City / Godzilla Ruins
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#0a0208');
      g.addColorStop(0.5, '#1f0515');
      g.addColorStop(1, '#380a26');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      // Searchlight beams
      ctx.save();
      const beamAngle = Math.sin(state.time * 0.0015) * 0.4;
      ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
      ctx.beginPath();
      ctx.moveTo(W * 0.3, H);
      ctx.lineTo(W * 0.3 - 150 + Math.tan(beamAngle)*300, 0);
      ctx.lineTo(W * 0.3 + 150 + Math.tan(beamAngle)*300, 0);
      ctx.fill();
      ctx.restore();
      break;
    }

    case 'glitch_cyberverse': {
      // 10. Matrix Digital Glitch
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = 'rgba(34, 197, 94, 0.6)';
      ctx.font = 'bold 12px monospace';
      for(let i=0; i<40; i++){
        const mx = (i * 32) % W;
        const my = (i * 83 + state.time * 0.25) % H;
        ctx.fillText(i % 2 === 0 ? '10110' : '01001', mx, my);
      }
      break;
    }

    case 'toxic_sewers': {
      // 12. Toxic Sewers
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#021812');
      g.addColorStop(0.5, '#063326');
      g.addColorStop(1, '#0a4d39');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      for(let i=-1; i<6; i++){
        const px = (i*300 - camX*0.1) % (300*6);
        ctx.fillStyle = '#022118';
        ctx.fillRect(px, GROUND_Y - 200, 70, 220);
        ctx.fillStyle = '#10b981';
        ctx.fillRect(px + 20, GROUND_Y - 80, 30, 100);
      }
      break;
    }

    case 'prehistoric_jungle': {
      // 13. Prehistoric Dinosaur Jungle
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#031c0e');
      g.addColorStop(0.5, '#0d4726');
      g.addColorStop(1, '#18733e');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      ctx.save();
      const aMoonX = W * 0.8 - (camX * 0.03) % W;
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.arc(aMoonX, 90, 50, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      for(let i=-1; i<8; i++){
        const tx = (i*260 - camX*0.12) % (260*8);
        ctx.fillStyle = '#022d17';
        ctx.beginPath();
        ctx.arc(tx + 80, GROUND_Y - 120, 90, 0, Math.PI*2);
        ctx.fill();
        ctx.fillRect(tx + 60, GROUND_Y - 120, 40, 180);
      }
      break;
    }

    case 'gothic_cemetery': {
      // 14. Gothic Graveyard
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#090514');
      g.addColorStop(0.5, '#180b2d');
      g.addColorStop(1, '#2d124d');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      ctx.fillStyle = '#fef08a';
      ctx.beginPath(); ctx.arc(W * 0.7, 100, 55, 0, Math.PI*2); ctx.fill();

      for(let i=-1; i<12; i++){
        const gx = (i*180 - camX*0.15) % (180*12);
        ctx.fillStyle = '#110a21';
        ctx.fillRect(gx, GROUND_Y - 45, 24, 45);
        ctx.beginPath(); ctx.arc(gx + 12, GROUND_Y - 45, 12, Math.PI, 2*Math.PI); ctx.fill();
      }
      break;
    }

    case 'neon_synthwave': {

      g.addColorStop(0.5, '#500057');
      g.addColorStop(1, '#8c005f');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      ctx.save();
      const sX = W * 0.5 - (camX * 0.02) % W;

      sunG.addColorStop(0, '#ff00aa');
      sunG.addColorStop(1, '#ffcc00');
      ctx.fillStyle = sunG;
      ctx.beginPath(); ctx.arc(sX, 130, 70, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = '#500057';
      for(let y = 110; y <= 190; y += 12){
        ctx.fillRect(sX - 75, y, 150, 4);
      }
      ctx.restore();
      break;
    }

    case 'alien_hive': {
      // 16. Alien Hive Mothership
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#100224');
      g.addColorStop(0.5, '#230545');
      g.addColorStop(1, '#3b086e');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      for(let i=-1; i<8; i++){

        ctx.beginPath(); ctx.ellipse(ax, GROUND_Y - 110, 35, 60, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ec4899';
        ctx.beginPath(); ctx.ellipse(ax, GROUND_Y - 110, 15, 30, 0, 0, Math.PI*2); ctx.fill();

    }

    case 'haunted_mansion': {

      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#120320');
      g.addColorStop(0.5, '#250740');
      g.addColorStop(1, '#400d66');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      for(let i=-1; i<6; i++){

        ctx.fillRect(wx, GROUND_Y - 210, 50, 110);
        ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2;

    case 'industrial_foundry': {

      g.addColorStop(0.5, '#3b1404');
      g.addColorStop(1, '#662205');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      for(let i=-1; i<5; i++){
        const fx = (i*380 - camX*0.15) % (380*5);
        ctx.fillStyle = '#271005';
        ctx.fillRect(fx, GROUND_Y - 240, 30, 260);
        ctx.fillRect(fx - 40, GROUND_Y - 240, 120, 20);
      }
      break;
    }

    case 'sky_temple': {
      // 19. Heavenly Sky Temple
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#0c192c');
      g.addColorStop(0.5, '#1a365d');
      g.addColorStop(1, '#2b5288');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      ctx.fillStyle = 'rgba(251, 191, 36, 0.25)';
      for(let i=-1; i<8; i++){
        const cx = (i*260 - camX*0.1) % (260*8);
        ctx.beginPath(); ctx.arc(cx, GROUND_Y - 40, 70, 0, Math.PI*2); ctx.fill();

      g.addColorStop(0.5, '#130036');

      sGrad.addColorStop(0.7, '#f43f5e');
      sGrad.addColorStop(1, 'rgba(38, 0, 92, 0)');

      ctx.beginPath(); ctx.arc(scX, 130, 120, 0, Math.PI*2); ctx.fill();
